<!DOCTYPE html>
<!-- The book's popup cards («картки»), cut from the user's design (Downloads\mail-1a.png: the post) into sliced pieces,
     rendered at 2× by tools/card_art.ps1 into assets/book/card_<part>.png:
       frame   128×128  the dark wooden frame (slice 32)
       paper   256×256  the parchment inside it with its double line (slice 48)
       plaque  160×56   the title's plaque on the frame's top edge (slice 22)
       close   64×64    the round gold close button (the cross is drawn by the game)
       gold    160×52   the main button: a gold pill (slice 26)
       seal    56×56    the red wax disc on the main button (its rune is drawn by the game)
       ribbon  20×56    a bookmark ribbon, white (tinted by the game)
     Sizes are in UI units; the pictures are twice that. -->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="out"></div>
<script>
const part = new URLSearchParams(location.search).get('part') || 'frame';
const noise = (id, f, a, r, g, b) => `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${f}" numOctaves="3" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${b}  0 0 0 ${a} 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>`;
const parts = {
  frame: () => { const W = 128, H = 128; return `<svg width="${W}" height="${H}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33231a"/><stop offset=".5" stop-color="#2a1b10"/><stop offset="1" stop-color="#22160c"/></linearGradient>
    ${noise('n', 0.9, 0.18, 0.05, 0.03, 0.01)}</defs>
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="16" fill="#120a05"/>
    <rect x="2.5" y="2.5" width="${W - 5}" height="${H - 5}" rx="15" fill="url(#g)" stroke="#5a4830" stroke-width="2.4"/>
    <rect x="2.5" y="2.5" width="${W - 5}" height="${H - 5}" rx="15" filter="url(#n)"/>
    <rect x="7" y="7" width="${W - 14}" height="${H - 14}" rx="11" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/></svg>`; },
  paper: () => { const W = 256, H = 256; return `<svg width="${W}" height="${H}"><defs>
    <radialGradient id="g" cx="50%" cy="42%" r="68%"><stop offset="0" stop-color="#f6e9c8"/><stop offset=".55" stop-color="#ecdcb6"/><stop offset=".85" stop-color="#dcc699"/><stop offset="1" stop-color="#c6ad7c"/></radialGradient>
    ${noise('n', 0.8, 0.07, 0.4, 0.3, 0.15)}</defs>
    <rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="url(#g)"/>
    <rect x="0" y="0" width="${W}" height="${H}" rx="14" filter="url(#n)"/>
    <rect x="11" y="11" width="${W - 22}" height="${H - 22}" rx="9" fill="none" stroke="#a88e62" stroke-width="1.6"/>
    <rect x="17" y="17" width="${W - 34}" height="${H - 34}" rx="6" fill="none" stroke="#b49c70" stroke-opacity=".8" stroke-width="1.1"/></svg>`; },
  plaque: () => { const W = 160, H = 56; return `<svg width="${W}" height="${H}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1f12"/><stop offset="1" stop-color="#22160c"/></linearGradient>
    <filter id="s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".6"/></filter></defs>
    <rect x="5" y="4" width="${W - 10}" height="${H - 12}" rx="4" fill="url(#g)" stroke="#5d4a2e" stroke-width="2.4" filter="url(#s)"/>
    <rect x="10" y="9" width="${W - 20}" height="${H - 22}" rx="2" fill="none" stroke="#a98a52" stroke-opacity=".7" stroke-width="1.2"/></svg>`; },
  close: () => { const W = 64, H = 64; return `<svg width="${W}" height="${H}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd08c"/><stop offset="1" stop-color="#9f7a3e"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".6"/></filter></defs>
    <circle cx="32" cy="32" r="28" fill="url(#g)" filter="url(#s)"/>
    <circle cx="32" cy="32" r="23" fill="#2a1b10" stroke="#5a4020" stroke-width="1.4"/>
    <circle cx="32" cy="32" r="27.4" fill="none" stroke="#3a2610" stroke-opacity=".7" stroke-width="1"/></svg>`; },
  gold: () => { const W = 160, H = 52; return `<svg width="${W}" height="${H}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd18e"/><stop offset=".55" stop-color="#d6b468"/><stop offset="1" stop-color="#bf9a52"/></linearGradient>
    <filter id="s" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".55"/></filter></defs>
    <rect x="3" y="3" width="${W - 6}" height="${H - 8}" rx="${(H - 8) / 2}" fill="url(#g)" stroke="#4a3418" stroke-width="2" filter="url(#s)"/>
    <rect x="6" y="5.5" width="${W - 12}" height="${(H - 8) / 2 - 2}" rx="${(H - 8) / 4}" fill="#fff6d8" fill-opacity=".22"/></svg>`; },
  seal: () => { const W = 56, H = 56; let s = 17; const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const pts = []; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r = 24 + (rnd() - 0.5) * 2.4; pts.push((28 + Math.cos(a) * r).toFixed(1) + ',' + (28 + Math.sin(a) * r).toFixed(1)); }
    return `<svg width="${W}" height="${H}"><defs>
    <radialGradient id="g" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#d4554b"/><stop offset=".5" stop-color="#a8302a"/><stop offset="1" stop-color="#6e1814"/></radialGradient></defs>
    <polygon points="${pts.join(' ')}" fill="url(#g)" stroke="#5a120e" stroke-width="1"/>
    <circle cx="28" cy="28" r="17" fill="none" stroke="#6e1814" stroke-opacity=".7" stroke-width="1.6"/>
    <circle cx="28.8" cy="28.8" r="17" fill="none" stroke="#e07a70" stroke-opacity=".35" stroke-width="1"/></svg>`; },
  ribbon: () => `<svg width="20" height="56"><path d="M0,0 L20,0 L20,56 L10,47 L0,56 Z" fill="#fff"/><path d="M2,0 L2,52" stroke="#000" stroke-opacity=".12" stroke-width="2"/></svg>`,
};
document.getElementById('out').innerHTML = parts[part]();
</script>
</body>
</html>
