3 ^хвальба Не ображайся, Муніне. Просто я старанніший.","~1 ^хвальба Тобі довіряють, як вовкові з вівцями. Тобто ніяк.","^хвальба Знаєш, чому мені довіряють? Бо я не лаюсь."],"х_відбивається":["^хвальба Довіра — не змагання. Але так, ти попереду. Поки.","^хвальба Хвалься, хвалься. Я наздожену.","^хвальба Твоя довіра голосна. Моя — тиха.","~3 ^хвальба Радий за тебе. Чесно.","^хвальба Годує частіше, бо ти частіше верещиш.","^хвальба Довіра — не пиріг. Її не з'їси першим.","^хвальба Попереду ти, бо голосніший. Не розумніший.","^хвальба Чесний гівнюк — то все одно гівнюк.","^хвальба Хай. Я не поспішаю. Довіра любить тихих.","~1 ^хвальба Попереду? Ти просто швидше випрошуєш.","~3 ^хвальба Гаразд. Сьогодні твоя перемога. Завтра побачимо."],"х_дорога":["^далеко Туди, де ще не були. Це і є мандри.","^далеко Карту {name} тримає в голові. Сподіваюсь.","^ноги Ти навіть крилами не махаєш. Нахлібник.","^ноги Зате {name} іде за трьох.","^пейзаж Ти просто не вмієш дивитись.","^пейзаж Он той камінь — точнісінько твоя голова.","~3 ^далеко Гордість? Не кажи, що ти розчулився.","^голод Подумали. Вирішили, що схуднути тобі не завадить.","^голод Зловимо щось дорогою. Якщо не розлякаєш лайкою.","^погода Не накликай, Муніне.","^погода Ти ж потім першим скиглитимеш.","^звір Ми йдемо не полювати, а дійти.","^звір Звір чує тебе ще здалеку. Від тебе тхне бійкою.","^куди {name} знає. Мабуть.","^куди Ворони не питають куди. Ворони летять.","^ноги Пір'їни відростуть. Розум — ні.","~1 ^далеко Пів дня — це ще мало. Не ний.","~3 ^пейзаж Подивись уважніше. Гарно ж.","~3 ^стомився Це найкраще, що ти сьогодні сказав.","^стомився Тоді помовчимо разом.","^пісня Нормальних пісень ти не знаєш. Ти знаєш лише ту, де «курва» двадцять разів.","^пісня Пісню? Гаразд: ішов ворон, ішов… Ні, ворони не ходять.","^сліди Втікав. Від тебе, мабуть.","^сліди Свіжі. Тримай очі відкритими."],"х_море":["^спокій Море спокійне. Підозріло спокійне.","^обрій Глянь, Муніне, обрій. Там щось є.","^хитає Не дивись униз, Муніне. Хитає.","~1 ^борт Якщо впадеш за борт, я не пірнатиму.","~3 ^люблю Люблю море. Тут ніхто не кричить, крім тебе.","^вітер Вітер у спину. Хоч щось сьогодні на нашому боці.","^риба Під нами, мабуть, ціла зграя риби.","^змій Якщо зараз вилізе змій, я голосуватиму за втечу.","^буря Хмари збираються. Якщо буде буря — тримайся за мене.","^берег Бачиш берег? Я — ні. А я ж бачу все.","~1 ^хитає Тримайся, Муніне. Ти вже зелений, як водорість.","~3 ^обрій Знаєш, на морі думається інакше. Ширше.","^чайки Бачиш чайок, Муніне? Значить, берег близько."],"х_перехід":["^запах Земля змінилась. Чуєш, як інакше пахне?","^тихо Знаєш, {from_in} було тихіше.","^пильно {biome_here}. Тримай очі відкритими, Муніне.","^межа Ось і межа. Ні стовпа, ні знаку — а все інше.","~3 ^додому Звідси вже недалеко до дому. Відчуваю.","^повітря Повітря тут інше. Важче. Або це ти на плечі вмостився.","^звірина Тут інша звірина. Глянь на сліди.","^барви Навіть світло тут інше. Барви не ті.","^подих Вітер тут дме з іншого боку. Як і ти.","^бували Ми тут бували раніше. Пам'ятаєш?","^від {from_in} було спокійніше. А тут — побачимо.","^карта Запам'ятай, де межа. Повертатися будемо.","^пташки Птахи тут співають інакше. Прислухайся.","^нове {biome_here}. Нове завжди небезпечне."],"х_перехід_відповідь":["^смачний Смачний тут — ти. Для місцевих.","^смачний Спершу роздивись, а потім клюй.","^кордон Пиво буде вдома. Якщо дійдемо.","^кордон Митниця — це я. Мито — твоя мовчанка.","^знову Бо {name} так виріши{в|ла}. Не сперечайся з господарем.","^знову Знову. Ворони не питають дороги — ворони літають.","^гірше Там, звідки ми йшли, теж не було раю.","^гірше Не кажи «гірше». Почують.","^ще Буде. Там, де ти замовкнеш.","^ще Кінець світу — то Рагнарок. Не поспішай.","^нюх Нові смаки — нові отрути. Не все їж.","^нюх Нюхай. Але дзьобом не тицяй.","^стовп Природа ставила. Їй стовпи не потрібні.","^стовп Межі видно серцем, Муніне. Ну, тобі — ні.","^тут Найзліший тут — ти. І це ненадовго.","^тут Не шукай найзлішого. Сам знайде.","^назад Назад не підемо. Вперед цікавіше.","^назад Знайоме гівно — теж гівно.","^погода Погода не гірша. Ти просто мокрий.","^погода Звикнемо. Ми до всього звикаємо.","^слід Великий слід — велика біда. Не кличмо.","^слід Хочеш подивитися? Подивишся. Звідти, з пащі.","^дерева Криві дерева — прямі коріння.","^дерева Мої поради — найрівніші в Мідґарді.","^край Краю нема. Є тільки дорога.","^край Край буде. Коли {name} скаже «досить»."],"х_на_думку":["Глибоко. Як калюжа.","Муніне, ти це сам вигадав?","Я б сказав м'якше. Але так, правда.","Записую. У розділ «дурниці».","~1 Скажи ще, що вода мокра.","~23 Хм. Навіть влучно.","~3 Ось за це я тебе й терплю.","Цікаво. Майже як у мене.","~1 Ну-ну. Відпочинь, мислителю.","~3 Добре сказав. Не зазнавайся."],"х_данж":["^темно Тут темно, як у тебе в голові, Муніне.","^запах Пахне смертю й старим золотом.","^відлуння Не каркай тут. Відлуння все розбудить.","^скарб Десь тут має бути скриня. Дивись уважно.","^тісно Тісно. Крилами не махнеш.","^кістки Глянь, скільки кісток. Хтось тут погано скінчив.","^павуки Павутина скрізь. Не заплутайся, Муніне.","^капає Десь капає вода. Кап. Кап. Дратує.","^двері Стара брама. Хтось замкнув її не просто так.","^шепіт Ти чуєш шепіт? Чи то вітер у щілинах?","^пастка Обережно з плитами на підлозі. Тут люблять пастки.","^задуха Повітря затхле. Як у старій скрині.","^вихід Пам'ятай дорогу назад. Тут легко загубитися.","^череп Глянь, череп усміхається. Чому, цікаво?"],"х_данж_кінець":["^темно Тихо. Щось там шкребеться.","^запах Смерть першою не бери. Вона кусається.","^відлуння Сказав же — розбудиш.","^скарб Знайдемо. {name} знайде.","^тісно Тоді не крутись. Ти мені в око пером тицьнув.","^скарб Перший гляне {name}. Ти — другий. Може.","^тісно Мовчи і терпи. Вийдемо — тоді махай.","^запах Нюхай менше, дивись більше.","^відлуння Ну от. Тепер чекай гостей.","^кістки Ми не скінчимо. Не сьогодні.","^павуки Їж павуків, але дивись під ноги.","^капає Кап. Кап. Тепер і мене дратує.","^двері Цікаве й страшне — для тебе одне й те саме.","^шепіт Тихіше. Хай шепочуть без нас.","^пастка Ступатиме {name}. Обережно.","^задуха Скоро вийдемо на свіже повітря.","^вихід Я пам'ятаю за нас обох. Не хвилюйся.","^череп Дякую, Муніне. Тепер мені моторошно."],"х_падіння":["^літати Надихну{вся|лася} нами. Тільки крил забу{в|ла} взяти.","^літати Літати — то не стрибати з гори. Запам'ятай.","^ноги Кістки цілі. Здається. {name}, ти ж ціл{ий|а}?","^ще Не підказуй {йому|їй}. Бо послухає.","^гепнув Земля витримала. А от {name} — не факт.","^ноги Ціле. Тільки гордість трохи розбилась.","^ще Не стрибне. Я {йому|їй} в очі подивлюсь — передумає.","^гепнув Зате швидко спустились.","^скеля Той, хто поспішає. Тобто {name}.","^скеля Ті, кому лінь обходити. Знайомо, га?","^кущ Колючий, зате м'який. Майже.","^кущ Кущ нас урятував. Подякуй.","^багно Ти й до того був чорний.","^багно Помиємося. Колись.","^політ Тільки приземлення її зіпсувало.","^політ Ти завжди любив падіння. Чужі.","^каміння І скільки?","^каміння Добре, що не на голову.","^висота З дурної ідеї. Вона завжди висока.","^висота Звідти, де стежки не було.","^синці Синці — то медалі для незграб.","^синці Головне, що не переломи.","^сміх Сміятися з падіння — некрасиво.","^сміх Гаразд, трохи смішно було.","^вдруге Третього не буде. Я пильнуватиму.","^вдруге Земля знайома. Вже як рідна."],"х_вага":["^ковадло Там руда, Муніне. Скарб. Потерпиш.","^ковадло Не ний. Ти важиш менше за одну залізяку.","^кинь Викидати руду? Ти здурів.","^кинь Нічого не викидаємо. Повземо додому.","^черепаха Черепахи хоча б мовчать, коли повзуть.","^черепаха Черепаха хоч доповзе. А ти б і не дійшов.","^сумка Каміння й руда. Наше майбутнє.","^сумка Там усе, що {name} не може кинути. Включно з тобою.","^спина То не спина. То твоє бурчання.","^спина Нічого. Дійдемо — відпочинемо.","^жадібність Все колись знадобиться.","^жадібність Скупий двічі носить.","^легкий На одну пір'їнку легше. Не допоможе.","^легкий Злітай. Тільки не повертайся з камінням.","^віз Бо {name} дума{в|ла}, що донесе.","^віз Візок — для розумних. Ми — для пригод.","^повільно Поспішиш — людей насмішиш.","^повільно Зате безпечно. Ніхто не наздожене — бо ніхто й не женеться.","^скриня Дошки — то хата. Хата — то золото.","^скриня Дошки чесніші за золото.","^кульгає Не впадемо. Тримайся.","^кульгає Падати — то по твоїй частині.","^відпочинок Хвилинка — і далі.","^відпочинок Ти не несеш нічого. Відпочинь краще від балачок."],"х_портал":["^нудить Не на мене. Тільки не на мене.","^нудить Звикнеш. Я ж звик.","^пір'я Пір'я відросте. Ти й так линяв.","^де Ми там, де {name} хоті{в|ла}. Решта неважливо.","^де Вдома, сподіваюсь. Пахне знайомо.","^пір'я Половину? Тоді ти тепер удвічі легший. Нарешті.","^швидко Краще в кишені в Локі, ніж пішки через болото.","^швидко Не кажи про Локі. Він слухає.","^світло Заплющ очі. Ти й так нічого не хочеш бачити.","^світло Сліпить, бо там шлях між світами.","^шум Це твоя совість. Вперше озвалась.","^шум Минеться. Головне — всі на місці.","^рахунок Багато. Я рахую.","^рахунок Більше, ніж ти лаявся. Ну, майже.","^половина Дві. Як і було.","^половина Лапи на місці. Розум — як і раніше, ні.","^звідки З дому. Пам'ятай хоч це.","^звідки Звідти, де ти знову бурчав.","^магія Не Локі. Давні майстри.","^магія Якщо Локі — то вони точно колись зламаються.","^мороз Бо там нічого нема. Навіть тебе.","^мороз Тому й не затримуємось.","^метал Портал не любить метал. Як я — твою лайку.","^метал Боги так вирішили. Не сперечайся."],"х_риба":["^перша Перша — {name}. Тобі — хвіст.","^перша Тобі хвіст. Як завжди.","^мала Мала, але чесна. Не те що ти.","^ще Риба не кінчиться. На відміну від мого терпіння.","^мала Мала — бо ти її розлякав своїм каркотінням.","^ще Риба не для тебе. Рибу їсть {name}.","^луска Риба мстить. Знає, хто її з'їсть.","^луска Луска — то прикраса. Тобі личить.","^велика Нарешті хтось більший за тебе. Поважай.","^велика Більша — бо розумніша. До тебе не підпливала.","^черв'як Тоді наживкою будеш ти.","^черв'як Черв'як — для риби. Ти — для терпіння.","^зірвалась Риба теж хоче жити. Як і ти.","^зірвалась Не кричи. Наступна почує.","^смажити Смажити. Ми ж не дикуни.","^смажити Тобі сира, {name} — смажена. Всі щасливі.","^поплавець То вітер. Не галасуй.","^поплавець Тягне {name}, а не ти. Сиди.","^чекати Рибалка — то терпіння. У тебе його нема.","^чекати Мовчи, і вона прийде.","^кістка Не жери так жадібно.","^кістка Це покарання. За жадібність.","^глибоко Кажуть. Не будемо перевіряти.","^глибоко Є. І вона дуже любить воронів."],"х_рубка":["^ліс Ще одне дерево впало. Ліс плаче.","^сидів Хтось колись на цьому дереві сидів. Може, ми.","^берегись Берегись! Падає! Ну, майже.","^дрова Дрова будуть. Зима — ні.","^тріски Тріски летять, Муніне. Пригнись.","^білка Білка з того дерева втекла. Дивилась на нас, як на вбивць.","^смола Смола на пір'ї. Тепер я пахну лісом.","^пеньок Від дерева лишився пеньок. Як від твого терпіння.","^гнізда На цьому дереві були гнізда. Чужі, на щастя.","^стук Тук-тук. Як серце лісу.","^старе Це дерево старше за нас обох. Було.","^кора Кора тріщить, як старий корабель.","^луна Луна від сокири на весь ліс. Тепер усі знають, де ми."],"х_рубка_кінець":["^ліс Ліс відросте. Ти — ні.","^сидів Осика теж дерево. Не будь снобом.","^берегись Я ж казав. Я завжди кажу.","^дрова Зате тепло буде. Навіть тобі.","^тріски Знайдеш. Він із сокирою.","^білка Білка жива — і то добре.","^смола Відмиватися будемо довго.","^пеньок Сідай, але тихо.","^гнізда Без гнізда — без проблем.","^стук Тук-тук. І ще раз. І ще.","^старе Шануй старших, Муніне. Навіть дерева.","^кора Дрова — найчесніша доля.","^луна Прийдуть — то не скаржся."],"х_руда":["^стук Терпи. Хочеш когось стукнути — стукни себе.","^стук Стукнеш когось — то тільки себе. Більше нікого нема.","^руда Красти в себе? Ти ж не сорока.","^руда Блищить — бо мідь. Ти ж не сорока.","^пил Чхни. Тільки не на мене.","^пил Пил — то руда, яку ти вдихнув. Тепер ти дорогий.","^іскри Не підпалить. Ти мокрий від злості.","^іскри Сиди тихо — і хвіст цілий.","^глибина Тоді передамо привіт.","^глибина Гель руду не віддає. Тому й копаємо обережно.","^кайло Тупе кайло теж копає. А мої жарти — смішать.","^кайло Нагостримо його. Бо Мунін ниє.","^мідь Лишиться пил. Блискучий.","^мідь З міді — бронза. З бронзи — сокира. З сокири — твій спокій.","^обвал Не завалиться. Сподіваюсь.","^обвал Вилетиш і заблукаєш. Як завжди.","^жила Руду не їдять, Муніне.","^жила Гарна. Не торкайся, бо вкрадеш.","^піт Це чесний піт. Поважай.","^піт Хочеш — злети. Ніхто не тримає.","^камінь Дракони живуть вище. Не накликай.","^камінь Тобі б тільки битися.","^пітьма Смолоскип є. Ідей — теж.","^пітьма Мої ідеї світять. Просто тобі не видно."],"х_сніг":["^мерзну Притулися ближче. Тільки не кусайся.","^мерзну Дзвенить — бо пусте всередині.","^комір Немає коміра — немає проблем.","^сніг Красиво ж. Хоч раз подивись.","^комір Заховай дзьоб у пір'я. Мудрі так роблять.","^сніг Біле — бо чисте. Тобі незнайоме.","^лапи Назавжди? Тоді мені треба інше плече.","^лапи Не вовтузься. Відмерзнуть.","^сніжинка Вона просто втомилася. Як усі, хто поруч із тобою.","^сніжинка Сніжинка не вміє зневажати. На відміну від тебе.","^стежка Тому йдемо обережно.","^стежка Зате видно, хто за нами йде.","^тепло Мудрість теж гріє. Зсередини.","^тепло Скоро. {name} вже шукає, де розпалити.","^білі Злі, як ти. Тільки чесніші.","^білі Тихо. Не кличмо їх.","^бурулька Найнебезпечніша зброя Мідґарду. Для тебе самого.","^бурулька Не махай нею. Відламаєш.","^глухо Нарешті щось корисне від снігу.","^глухо Тиша в снігу — найгарніша тиша.","^гори Ті, хто міцніший за тебе.","^гори Кози. І трохи вовків. І ми зараз.","^кожух Пір'я тепліше, ніж здається.","^кожух Сховайся під комір. Там тепло."],"х_гроза":["^грім Грім. Тор знову п'яний.","^блискавка Якщо вдарить блискавка — то в тебе. Ти чорніший.","^небо Небо сердиться. Не на нас, сподіваюсь.","^вітер Вітер такий, що пір'я виє. Тримайся, Муніне.","^молот Чуєш? То Мйольнір. Тор когось лупить.","^дерево Не сідай на високе дерево, Муніне. Сьогодні не той день.","^злива Ллє так, ніби в Асгарді перекинули діжку.","^страх Ти тремтиш, Муніне? Чи то вітер?","^рахувати Рахуй від спалаху до грому. Так знаєш, як далеко.","^іскра Пір'я аж тріщить. Небо повне іскор.","^тролі У грозу навіть тролі ховаються. Розумні тролі.","^після Після грози повітря чисте. Аж дихати хочеться."],"х_гроза_кінець":["^грім Ну от. Тепер і ти ображаєш богів.","^блискавка Тоді я пригнусь. А ти стирчи.","^небо Сховаймось. Мудрість — у сухості.","^вітер Співаєш ти гірше за вітер.","^небо Чуєш? Знову гримить. На тебе.","^молот Тор б'є, кого хоче. Краще не потрапляй йому на очі.","^дерево Сміливий ти, доки не загримить.","^злива Мокрі обидва. Хоч у чомусь рівні.","^страх Звісно. Я так і подумав.","^рахувати Тоді просто пригнись. Це вміють усі.","^іскра Тріщи тихіше. Ще блискавку приманиш.","^тролі Розумніші за нас тролі. Це вже щось про нас каже.","^після Дихай, Муніне. Хоч раз — свіжим."],"х_світанок":["^світає Світає. Ще один день — і ми живі.","^хропів Ранок. Ти хропів, як троль, Муніне.","^роса Роса на пір'ї. Добрий знак.","^сонце Сонце встає, Муніне. Хоч хтось сьогодні рано встав.","^птахи Птахи співають. Світ прокидається.","^мряка Ранкова мряка над землею. Як молоко.","^сніданок Що на сніданок, Муніне? Знову чиєсь око?","^асгард Мені наснився Асгард. А тобі що снилося?","^холод Ранок холодний. Пір'я ще не прогрілося.","^план Новий день. Який у нас план?","^лінь Вставай, Муніне. Ти спиш з розплющеним оком.","^перший Хто перший побачив сонце — тому й день вдалий."],"х_світанок_кінець":["^світає Тоді вставай. День не чекає.","^хропів Чув весь табір. І сусідній.","^роса Мокрі ноги — дрібниця. Твоя пика зранку — от поганий знак.","^сонце Не проспи день. Він короткий.","^птахи Ти вже прокинувся. На жаль.","^мряка Поетичності в тобі — як у каменя.","^сніданок {name} нагодує. Просто прокинься чемно.","^асгард Сни в тебе, як і ти. Нічого світлого.","^холод Сонце пригріє. І тебе, і твою вдачу.","^план Ну, хоч послідовно.","^лінь Ще хвилинка — і я тебе дзьобну.","^перший Щастя спільне. Навіть тобі шматок."],"х_вечір":["^ніч Твоя пора — то ще не привід кусатись.","^ніч Ніч для сну, Муніне. Для тебе — особливо.","^голод {name} нагодує. Якщо попросиш чемно.","^голод Вечір — час для вечері. Не для лайки.","^червоне Червоне — бо сонце соромиться твоїх слів.","^червоне Як кров? Ти про все так думаєш.","^кажани Брати? Вони хоч мовчки літають.","^кажани Кажани їдять комарів. А ти що їси? Мені мозок.","^сови Сови мудрі. Тому ти їх і не любиш.","^сови Сови вночі, ми вдень. Чесний поділ.","^багаття Розпалить {name}. Ти тільки сиди й гарчи.","^багаття Вогонь буде. Ти тільки не сунь у нього дзьоба.","^втома Взаємно, Муніне. Взаємно.","^втома Відпочинь. Завтра знову втомлюватимешся.","^тіні Тому тримаймося світла.","^тіні Хай лізе. Ти ж хотів бійки.","^зорі А я — щоб ти навчився чемності. Обидва не збудуться.","^зорі Зорі не виконують бажань. Вони просто світять.","^підсумок Зате всі живі. Це теж підсумок.","^підсумок Ти рахуєш трупи. Я рахую дні. Обидва — без кінця.","^виття Кличуть, щоб ми стали вечерею.","^виття Не відповідай їм. Будь ласка.","^нічліг Де {name} вирішить. Сподіваюсь, під дахом.","^нічліг Під дахом. Я вже бачу дим."],"х_друг":["^гість {friend} поруч. Поводься пристойно, Муніне.","^разом З {friend} безпечніше. Удвох легше.","^дивиться {friend} на нас дивиться. Усміхнись. Ой, ти ж не вмієш.","^ворони Цікаво, {friend} має своїх воронів? Сподіваюсь, не таких, як ти.","^подарунок {friend} щось несе. Може, нам?","^спомин {friend} знову тут. Пам'ятаєш минулий раз?","^частування {friend} може пригостити. Будь чемним, Муніне.","^броня {friend} у новій броні. Блищить.","^гомін Удвох вони галасують, як ціла дружина.","^допомога {friend} допомагає. Рідкість у цих землях.","^смажене {friend} пахне димом і смаженим.","^спина {friend} поруч — хоч спина прикрита.","^розмова {friend} щось каже. Слухай, Муніне, може, щось розумне."],"х_друг_кінець":["^гість Гаразд. Хоч не плюй.","^разом Ну хоч не втечеш першим.","^дивиться Вже пізно. Все бачили.","^ворони Отож. Тому {friend} без воронів і ходить.","^подарунок Ну то хоч не кради при всіх.","^спомин Цього разу буде краще. Сподіваюсь.","^частування Чемність годує. Запам'ятай.","^броня Будь чемним до чужої броні.","^гомін Галасу й так досить.","^допомога Не всі такі, як ти.","^смажене Ти завжди про їжу.","^спина Удвох спину тримати легше.","^розмова Зате ти — суцільна цікавість."],"хп_сів":["Сиджу. Думаю. Не заважай.","Добра жердина. Рівна. Не те що деякі плечі.","Нарешті щось, що не підстрибує на кожному кроці.","Звідси видно далеко. І тебе теж, {name}.","Посиджу трохи. Наберуся сил, поки ти бігаєш.","~1 Не думай, що я тобі вдячний. Але жердина нічого.","~1 Тут принаймні ніхто не махає мечем біля вуха.","~23 Дякую за жердину, {name}. Справді.","~3 Тут добре. Але біля тебе краще. Не кажи Муніну.","Сів. Пір'я пригладжу, і можна жити.","Жердина тримає. Отже, ти будува{в|ла} не наосліп.","Звідси видно все. Розвідникові більше нічого й не треба.","Крила відпочинуть. Голова — ні, голова в мене працює завжди.","~1 Посиджу. Не тому, що ти попроси{в|ла}, а тому, що втомився.","~1 Гм. Сидіти можна. Хвалити не буду.","~23 Добре сидиться. Ти вгада{в|ла} з висотою.","~23 Покличеш — прилечу. Але не поспішай.","~3 Сиджу й чекаю тебе. Так і знай, {name}."],"хп_затишно":["Тепло, сухо, затишно. Ось це я розумію — відпочинок.","Вогонь, дах, тиша. Сила сама в пір'я тече.","Затишно. Можна навіть подумати про щось, крім виживання.","~1 Нарешті хтось подбав про ворона. Невже ти?","~23 Гарно тут. Ти {старався|старалася}, я бачу.","~3 Як удома. Ну, як в Одіна, тільки без його бурчання.","Під дахом і біля вогню думки течуть рівніше.","Тут навіть пір'я сохне як годиться.","Добре місце. Сила сама тече, тільки встигай ловити.","~1 Затишно. Не думав, що ти на таке здат{ен|на}.","~23 Тепло. Посиджу довше, якщо дозволиш.","~3 Ти зроби{в|ла} мені дім. Я це запам'ятаю, {name}."],"хп_холодно":["Просто неба? Серйозно? Я ж не горобець.","Дме. Сила набирається, як мед узимку: ледь-ледь.","Тут холодно й голо. Дах би не завадив, {name}.","Сиджу, мерзну, мудрію. Повільно.","~1 Жердина в чистому полі. Геніально.","~23 Може, наступну поставиш під дахом? Натяк.","~3 Посиджу й тут. Але під дахом я б тебе більше любив.","Вітер у пір'ї. Сила — по краплині.","Вітер у хвіст, небо над головою. Відпочинок мрії.","Без даху сила тече, як смола взимку.","~1 Під відкритим небом. Ну звісно. Ворон же витримає.","~23 Тут голо, {name}. Хоч стінку якусь, хоч стріху.","~3 Мені й тут добре, бо ти недалеко. Але дах — це було б мудро."],"хп_вітання":["О, {name} {повернувся|повернулася}. {Живий|Жива}, бачу.","А ось і ти. Я вже думав, {загубився|загубилася}.","{name}! Ти пахнеш пригодами. І трохи болотом.","Ну, як там світ без мене? Тримається?","~1 Знову ти. Ну добре.","~1 {Прийшов|Прийшла} перевірити, чи я не втік? Не втік.","~23 Радий тебе бачити, {name}. Не звикай до таких слів.","~3 Нарешті. Без тебе тут занадто тихо.","{name}. Ціл{ий|а}, бачу. Добре.","Ти поверну{вся|лася} — значить, світ тебе ще не з'їв.","Я бачив тебе ще здалеку. Ворон бачить усе.","{name}! Розповідай, що там було. Тільки правду.","~1 А, це ти. Я тут не на тебе чекав. Просто сидів.","~23 Добре, що ти тут, {name}. Тихо було без тебе.","~3 Ти прийш{ов|ла}. Тепер усе на місці."],"хп_чужий":["{stranger}? Не пригадую, щоб тебе сюди кликали. Але обличчя я запам'ятав.","Гей, {stranger}, ця жердина не для тебе.","Дивлюсь на тебе, {stranger}. Уважно.","Не підходь, {stranger}. Я кусаюсь. Інтелектуально.","~1 Ще один. Скільки вас тут ходить?","~23 А, {stranger}. Друг {name}? Ну, тоді живи.","{stranger}, тебе сюди не кликали.","Я пам'ятаю кожне обличчя, {stranger}. Твоє теж.","Руки при собі, {stranger}. Я ворон Одіна, а не курка.","Цікаво, {stranger}, що ти тут шукаєш?","~1 Чужі тут ходять. Не подобається мені це.","~3 {stranger}, якщо {name} тобі довіряє — привіт. Якщо ні — тим гірше для тебе."],"хп_ворог":["Обережно! Там щось ворушиться.","Ворог поруч. Не кажи, що я не попереджав.","Я бачу його. А ти?","Зброю в руки, {name}! Він іде сюди.","~1 Ну от, і тут не дадуть посидіти спокійно.","~3 Я тут, {name}. Пильную.","Тихо! Щось підкрадається.","Ворог близько, {name}. Я бачу його звідси.","Добре, що я високо. Погано, що ти — ні.","~1 Знову гості з кігтями. Ненавиджу гостей.","~23 Він тут, {name}. Дивись, звідки йде.","~3 Не бійся. Я дивлюсь тобі за спину."],"хп_прокинувся":["Га? Хто? А, це ти...","Я не спав. Я думав із заплющеними очима.","Ніч надворі, а ти ходиш. Спи вже.","~1 {Розбудив|Розбудила}. Вітаю. Задоволен{ий|а}?","~23 О, {name}. Я тут дрімав трохи.","~3 Тихо... Сідай поруч, ніч гарна.","Мені снився Одін. Він теж бурчав.","А... Я на варті. Завжди на варті.","Сови не сплять, ворони — сплять. Принаймні намагаються.","~1 Що, і поспати не можна?","~23 Добре, що це ти, а не драугр.","~3 Ти тут... Тоді я спокійно досплю."],"хп_думка":["Цікаво, скільки пір'їн треба, щоб злетіти до Одіна. Рахую.","Жердина — це філософія. Сидиш, а світ рухається сам.","Звідси видно все: хто працює, хто ледарює. Ти — друге.","Набираюсь сили. Тобі б теж не завадило.","Одін каже: мудрість приходить до тих, хто сидить. Ось я й сиджу.","~1 Тихо тут. Аж підозріло.","~23 Ти робиш щось корисне, {name}? Я пильную.","~3 Гарно отак: ти поруч, я на жердині, і ніхто не кричить.","Мунін каже, що я забагато думаю. Мунін каже забагато.","Іноді я рахую зірки. Іноді — твої помилки. Зірок менше.","Жердина вчить терпіння. Ти теж спробуй колись.","Цікаво, що про нас думають кури. Мабуть, заздрять.","Пам'ятаю, як ти вперше мене поклика{в|ла}. Не дуже вміло.","Одін бачить світ нашими очима. Тож не роби нічого соромного.","~1 Сиджу тут, бо так вигідно. Не через тебе.","~1 Тобі не здається, що ти забагато бігаєш і замало думаєш?","~23 Тут добре думається. Та й ти недалеко.","~23 Іноді сидіти — найрозумніше, що можна зробити.","~3 Знаєш, {name}, я радий, що Одін послав мене саме до тебе."],"хп_розмова":["^жердина Муніне, ти теж відчуваєш, як сила вертається?","^рівна Добра в нас жердина. Хоч щось у цьому домі рівне.","^сидіти Знаєш, сидіти — теж робота. Розумова.","^задум Цікаво, що {name} знову задума{в|ла}. Щось велике, мабуть.","^тиша Чуєш? Ніхто не кричить. Ніхто не біжить. Рай.","~1 ^ти Посунься, Муніне. Ти займаєш пів жердини.","~23 ^дім Тут затишно. Майже як удома в Одіна.","~3 ^ми Нам із тобою пощастило, Муніне. Хоч ти й не визнаєш.","^сила Муніне, скільки сили ти вже набрав? Чесно.","^тиша Тихо як. Рай, а не жердина.","^забуде Як думаєш, Муніне, {name} нас колись тут забуде?","^вигадка Цікаво, хто першим вигадав жердину. Мудра була голова.","^разом Муніне, ти колись думав, що ми отак сидітимемо разом?","^пера Ти знову чистиш пір'я, Муніне? Третій раз за годину.","~1 ^думаю Сиди тихо, Муніне. Я думаю.","~23 ^дім Добре, що {name} постави{в|ла} нам жердину. Визнай.","^їжа Муніне, ти знову голодний? По очах бачу.","^забуде Іноді думаю: а що, як {name} про нас забуде? Ні, дурна думка."],"хп_відповідь":["^сидіти Зате сила йде. А від твого бурчання — ні.","^сидіти Посидь спокійно хоч раз. Тобі піде на користь.","^нудьга|сидіти Нудно? Порахуй пір'їни. Я свої вже порахував.","^задум Щось велике і, як завжди, без плану. Зате з гуркотом.","^тиша Тиша — це коли ти мовчиш. Цінуй момент.","~1 ^ти Я займаю рівно стільки, скільки заслуговую. Тобто більше.","~23 ^дім Тут добре. Не зіпсуй, Муніне.","~3 ^ми Знаю. Тільки не кажи це так ніжно, а то розчулюся.","^ти Посунутись? Я тут сидів першим. Здається.","^ти Не штовхайся. Жердина не така широка, як твоє самолюбство.","^ми Може, й так. Але вголос я цього не скажу. Ой.","^ми Тихіше, Муніне. Бо ще хтось почує, що ти м'якнеш.","^сидіти Скільки треба, стільки й сидітимемо. Сила сама не набереться.","^забуде Не забуде. Я це знаю. Я ж думка.","^тиша Я чую. Але мовчу, бо мудрий.","^крива Кривувата? То ти криво сидиш, Муніне.","~1 ^нудьга|тиша Нудьга — то для дурних. Тобто для тебе.","~3 ^забуде Нікуди {name} без нас не дінеться. І ми без {нього|неї}.","^їжа Принесе, якщо попросиш чемно. Тобто ніколи.","^їжа Принесе. {name} про нас не забуває. Про себе — буває.","^думаєш Я завжди думаю. Спробуй і ти, хоч раз на рік.","^дивись Дивлюсь, бо ти щось замишляєш. Я ж бачу.","^смола Смолою пахне, бо свіжа. Тільки не здумай її гризти.","^крива Рівна вона. Це в тебе погляд кривий.","^дім Ото ж бо. Цінуй, поки маєш.","^задум Головне, щоб не знову міст через болото.","^жердина Бачиш? А ти бурчав. Я все чую, Муніне."],"хх_знайомство":["^ім'я Я Хугін, а кличуть мене {me}. Ти хто будеш?","^хто Не бачив тебе раніше. Чий будеш?","^хто Хм. Ще один ворон. Звідки ти такий узявся?","^ім'я Я Хугін. Думка Одіна, якщо тобі це щось каже. А ти хто?","^господар Твоя людина — {friend}? Співчуваю. Або заздрю, ще не вирішив.","~1 ^хто Чужий ворон. Тримай дзьоб при собі, і ми поладнаємо.","~23 ^ім'я Вітаю, {addr}. Я Хугін. Моя людина — {name}. А твоя?","~3 ^ім'я Доброго дня. Я Хугін, а он моя гордість і мій клопіт — {name}.","^хто Не пригадую тебе. А в мене, повір, добра пам'ять на дзьоби.","^хто Новенький? Звідки прилетів і чого тут шукаєш?","^ім'я Дозволь відрекомендуватися: Хугін. Для друзів — {me}. Для ворогів — неприємність.","^господар Значить, твоя людина — {friend}. Мужності тобі.","~1 ^хто Ще один пернатий нахлібник. Чий ти?","~3 ^ім'я Радий новому крилу. Я Хугін. А тебе як звати?"],"хх_знайомство_відповідь":["^хто|ім'я Хугін. Моя людина — {name}. Не судіть строго.","^хто|ім'я Хугін я. Думаю за двох. Друга половина — {name}.","^ім'я Приємно. Я Хугін і, на відміну від деяких, умію мовчати.","^господар Співчувати не треба. {name} — найкраще, що зі мною траплялося. Після сиру.","^господар Заздри, {addr}. Мені пощастило більше, ніж тобі.","~1 ^хто|ім'я Тобі яке діло? Ну, Хугін. Задоволений?","~1 ^господар Співчувай, співчувай. Я й сам собі співчуваю.","~3 ^хто|ім'я Хугін. Моя людина — {name}. Ми давно разом і багато пройшли.","^смак Смак у мене бездоганний. Як і в моєї людини, коли вона мовчить.","^пам'ять Запам'ятав? Я теж. Я, правда, думаю, а не пам'ятаю, але тебе запам'ятаю.","Хугін. Будемо знайомі.","^хто|ім'я Хугін. Для своїх — {me}. Ти поки не свій, але все попереду.","^хто Мене звати {me}. Я Хугін, а моя людина — {name}.","^хто|ім'я {me}. Хугін. Моя людина — {name}, без мене {він|вона} загубиться.","^господар Мужність не завадить. Але я справляюся.","^господар Так, моя. Не найгірша, повір.","^смак Смак? У мене? Бездоганний. Глянь хоча б на моє пір'я.","^пам'ять Пам'ять — то добре. Тільки не пам'ятай зайвого.","~1 ^хто|ім'я Хугін. Відчепися з розпитуваннями.","~3 ^хто|ім'я Хугін. Радий знайомству, справді."],"хх_знайомство_кінець":["Ну що ж, будемо знайомі.","Запам'ятаю тебе, {addr}. У мене на обличчя пам'ять добра. На дзьоби теж.","^господар|смак Передай своїй людині привіт. Чи що там у вас передають.","^хто Ось і познайомились. Далі буде цікавіше.","~1 Тільки не сідай на мою гілку.","~3 Радий знайомству. Справді радий.","Гаразд. Тепер ми знайомі. Не підведи.","^ім'я Запишу твоє ім'я. Десь між рунами й рецептами каші.","~1 Познайомились. Можна вже мовчати?","~3 Тепер у тебе є знайомий ворон. Цінуй."],"хх_зустріч":["^давно О, {addr}! Давно не бачились. Як ви там?","^давно Знову ви. А я вже думав, {friend} десь у болоті лиши{>вся|лась}.","^живий Живий, {addr}? І {friend} ціл{>ий|а}? Дивно, але приємно.","^новини Ну, розповідай, що нового. Тільки коротко, бо засну.","~1 ^давно А, це ти. Ну привіт, якщо вже прилетів.","~3 ^давно {addr}! Я сумував. Трохи. Нікому не кажи.","^давно Скільки зим, скільки літ! Ну, днів. Але все одно.","^давно Нарешті знайоме пір'я. А то навколо самі чужі.","^новини Що нового? Хто впав, хто встав, хто знову заблукав?","^живий Тримаєтесь ще? Ти і {friend}?","~1 ^давно Знову ти. Ну що ж, світ малий.","~3 ^давно Як добре вас бачити. Обох."],"хх_зустріч_відповідь":["^давно|новини Живемо. {name} знову щось будує, а я рахую, скільки разів воно завалиться.","^давно|новини Нормально. Вчора {name} {заблукав|заблукала} у трьох соснах. Я мовчав. Довго.","^живий Цілі. Здебільшого. {name} ще й пишається синцями.","^живий|давно Живі, як бачиш. Хоча Одін уже не раз гострив на нас перо.","~1 ^давно|новини Та як. Годують раз на свято, а я терплю.","~3 ^давно|новини Добре. {name} дбає про мене краще, ніж я заслуговую.","Та потроху.","^давно|новини Нічого доброго. Тобто все як завжди. {name} живе, я терплю.","^давно|новини Новини? {name} навчи{вся|лася} варити кашу. Майже їстівну.","^живий Тримаємось. {name} — за мене, я — за здоровий глузд.","^живий Цілі. Не завдяки, а всупереч.","~1 ^давно|новини Як завжди: я думаю, а {name} робить навпаки.","~3 ^давно|новини Добре. Ми звикли одне до одного. Майже як рідні."],"хх_зустріч_кінець":["Ну, побачимось ще.","Тримайтеся там. Обоє.","^живий Бережи свою людину, {addr}. Їх у нас мало.","~1 Ну, бувай. Не нудьгуй.","~3 Добре, що ви тут. Справді.","Бережіть себе. Ну, ти бережи.","^новини Розкажеш решту наступного разу.","~1 Ну, лети вже."],"хх_нове_імя":["^нове О, то ти тепер {raven}? Чув, чув.","^нове {addr}? Нове ім'я? Тобі пасує. Майже.","~1 ^нове {raven}, значить. Звучить так собі.","~3 ^нове {raven}! Гарно. Заслужив.","^нове Нове ім'я, нове пір'я? Чи тільки ім'я?","^нове {raven}? Хто ж це вигадав?","~3 ^нове {raven}. Звучить гордо. Носи з честю."],"хх_нове_імя_відповідь":["^нове Так, тепер я {me}. Звикай.","^нове {me}. Заслужив, між іншим.","~1 ^нове Мене не питали. Але {me} — то вже краще, ніж було.","~3 ^нове {me}. Мені самому подобається.","Так. {me}.","^нове Тільки ім'я. Пір'я те саме. Гарне.","^нове Вигадали. Заслужив. Не заздри.","~1 ^нове Ім'я як ім'я. Не чіпляйся."],"хх_нове_імя_кінець":["Добре, {addr}. Запам'ятав.","^нове Звикну. Не одразу, але звикну.","Гаразд, {raven}. Звикатиму.","~3 Носи на здоров'я."],"хн_заслужив":["Тепер мене звуть {nick}. Звучить гідно.","{nick}. Нарешті ім'я, яке мені пасує.","Чув? {nick}. Це про мене.","Мене тепер кличуть {nick}. Я не просив. Але заслужив, мабуть.","{nick}… Скальди складуть про мене пісню. Смішну, напевно.","~1 {nick}? Ну… хай буде.","~3 {nick}. Добре, що ти {був|була} поруч, коли я його заслужив."],"хн_змінив":["{nick}? Гаразд. Звучить непогано.","Тепер я {nick}. Не плутай.","~1 Знову перейменовуєш? Ну, {nick} то {nick}.","~23 {nick}. Можна й так.","~3 {nick}. Мені подобається."],"хх_вступ":["Хм.","О.","Слухай.","Ну що ж.","~1 Ну от.","~3 Радий тебе бачити."],"хх_відгук":["Хм.","Ну.","Ох.","Чесно?","Слухай-но.","~3 Ах, друже."],"хх_хвіст":["Кар.","Отак.","Запам'ятай.","~1 Не звикай.","~3 Радий, що ти тут."],"хх_знайомство_встряє":["^хто|ім'я А я {me}. Раз уже всі знайомляться.","^господар Людина як людина. Бачив і гірших.","^смак|господар Про смак не сперечаються. Але я посперечаюся.","^пам'ять Пам'ять у всіх є. Розуму б ще.","Можна і я познайомлюся? Я {me}. Чую все, кажу мало.","Ще один новенький? Ну, ласкаво просимо до зграї.","^хто Звідки — неважливо. Важливо, чи вміє мовчати.","^хто Чий би не був, а пір'я в нього чисте. Підозріло.","^хто Я теж хочу знати, чий він. Цікавість — моя слабкість.","~1 ^хто Ще один невідомий. Мідґард кишить пернатою дрібнотою.","~3 ^хто Новеньких треба приймати тепло. Я, наприклад, {me}.","^ім'я Імена — то добре. Своє я пам'ятаю навіть уві сні.","^ім'я Гарне ім'я. Моє, щоправда, краще.","^ім'я Я {me}. Тепер ми всі знайомі. Майже.","~1 ^ім'я Ім'я як ім'я. Аби не гірше за пику.","~3 ^ім'я Радий знайомству. З усіма вами.","^господар Людина — то половина ворона. Гірша половина.","^господар Мою людину теж не всі люблять. Я теж не завжди.","^господар Добрий господар той, хто годує. Решта — дрібниці.","~1 ^господар Ваші люди одне одного варті.","~3 ^господар Головне, щоб людина була добра. А там розберемося.","^смак Смак — річ темна. Особливо в людях.","^смак Про людей не сперечаються. Їх терплять.","~1 ^смак Смак у вас обох поганий. Згоден.","~3 ^смак Кожному своя людина. І добре.","^пам'ять Пам'ять — то Мунінова справа. Я тільки думаю.","^пам'ять Хто що пам'ятає — то його тягар.","^пам'ять Я пам'ятаю все, що варто. Решту — Мунін.","~1 ^пам'ять Пам'ять у вас, як решето.","~3 ^пам'ять Добре, коли є кому пам'ятати.","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_зустріч_встряє":["^давно|новини І я тут. Новини в мене кращі, але ви не питали.","^живий Живі, живі. Усі ми тут живучі, як бур'ян.","^новини А в нашої людини новина — ми знову заблукали.","Давно не бачились, так. Я теж скучив. Трохи.","О, всі зібралися. Тепер буде шумно.","^давно Давно, так. Я вже й не сподівався.","^давно Ото зустріч! Наче й не розлучались.","^давно Давно не чув твого каркання. Я майже скучив.","~1 ^давно Давно. І ще б стільки ж.","~3 ^давно Як гарно, що всі знову разом.","^живий Живі — і то вже перемога.","^живий Живий той, хто вміє вчасно тікати. Ми вміємо.","^живий Хто питає, чи живий, той сам ледь живий.","~1 ^живий Живі. На превеликий жаль деяких.","~3 ^живий Добре, що всі цілі. Справді добре.","^новини Новина: я сьогодні нікого не дзьобнув. Поки що.","^новини Наші новини короткі: ходимо, рубаємо, падаємо.","^новини Новини? Мідґард стоїть. Ми теж.","~1 ^новини Ваші новини мені нецікаві. Але розповідайте.","~3 ^новини Розповідайте все. Я люблю добрі новини.","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_нове_імя_встряє":["^нове А мені ім'я подобається. Пасує до дзьоба.","^нове Нове ім'я — нові борги. Перевірено.","Імена, імена. Головне — щоб кликали до їжі.","^нове Нове ім'я — як нове пір'я. Треба звикнути.","^нове Імена дають за справи. Цікаво, за які.","^нове Я б тебе інакше назвав. Але мене не питали.","^нове Кликатиму по-новому. Якщо згадаю.","~1 ^нове Ім'я гучне. Подивимося, чи ворон дотягне.","~3 ^нове Гарне ім'я. Носи гордо.","^нове Звучить. Тепер треба відповідати.","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_до_того_хто_встряв":["^пр_заснув Гаразд, {addr}, переконав. На шухер ставимо тебе.","^пр_заснув Хто старе згадає, {addr}, тому пір'я з хвоста.","^пр_медитація Захищаєш сплюха, {addr}? Тоді ти й постоїш на шухері.","^пр_медитація {addr}, раз ти такий знавець — ти й постоїш.","^пр_бджоли Бджоли нас не гнали, {addr}. Ми відступали. Організовано.","^пр_бджоли {addr}, бджоли — то плата за мед. Чесна ціна.","^пр_дзьоб Дзьоб розпух, зате мед був смачний. Нічого ти не розумієш, {addr}.","^пр_дзьоб {addr}, у тебе пам'ять, як бджолине жало: гостра й непотрібна.","^пр_дах Дах, {addr}? Гаразд, ти переміг. Цього разу.","^пр_дах {addr}, твоя людина хоч небо бачила. А моя — тільки двері.","^пр_драбина {addr}, ти кого саме хочеш перевершити? Бо вже всіх.","^пр_драбина Добре, {addr}. Здаюся. Найдивніші люди — у тебе.","^пр_ревнощі Скучили, {addr}. Особливо за твоїм бурчанням.","^пр_ревнощі {addr}, ти завжди поруч. Тому й не встигаєш скучити.","^пр_зграя Отож, {addr}. Нас тепер стільки, що вовки обходитимуть.","^пр_зграя {addr}, такій компанії потрібен ватажок. Це я.","^пл_своя {addr}, у кожного своє горе.","^пл_своя Ти мене втішив, {addr}. Майже.","^пл_рахуй {addr}, ти завжди все рахуєш.","^пл_рахуй Гаразд, {addr}, переконав.","^пл_свій_бос {addr}, легко казати, коли не ти бився.","^пл_свій_бос Скромність тобі личить, {addr}. Особливо твоя.","^пл_слава {addr}, слава — то для людей. Нам — трофеї.","^пл_слава Гаразд, {addr}, хай буде по-твоєму.","^пл_звикли Правда, {addr}. Час тут дивно летить.","^пл_звикли {addr}, ти завжди мудро скажеш. Інколи.","^пл_вірні Родина, {addr}. Хай буде так.","^пл_вірні {addr}, вірні чи ліниві — яка різниця?","^пл_якість Якість, {addr}? Красиве слово для малого рахунку.","^пл_якість {addr}, ти завжди знайдеш, як викрутитись.","^пл_ставка {addr}, тікали — то тактика. Не рахується.","^пл_ставка Гаразд, {addr}, ставку прийнято.","^вг_дерево З деревом, {addr}? Ну, хоч співрозмовник уважний.","^вг_дерево {addr}, дерево хоч не перебиває. Моя людина так би не змогла.","^вг_троль Троль, {addr}? Отакої. І хто переміг у суперечці?","^вг_троль {addr}, після такого я б теж із деревами не розмовляв.","^вг_рахунок Рахуєш, {addr}? Моя людина без мене не дожила б і до вечора, а я не рахую.","^вг_рахунок {addr}, а ти рахував, скільки разів вона тебе з могили виносила?","^вг_борг Мудро, {addr}. Аж неприємно.","^вг_борг {addr}, ти сказав те, що я думав. Тільки красивіше.","^вг_хліб Мало, {addr}? Попроси більше. Чемно.","^вг_хліб {addr}, зате дзьоб у тебе міцний. Від такої їжі.","^вг_крадене {addr}, крадене смачне, поки не спіймали.","^вг_крадене Злодійство, {addr}, — то не годування. Хоча… смачно.","^вг_вартовий Стережи, {addr}, раз сам запропонував.","^вг_вартовий {addr}, вогонь стереже краще за нас. Але ти теж можеш.","^вг_зміна Згода, {addr}. Хто перший — той перший.","^вг_зміна {addr}, чесно. Тільки не буди мене без пожежі.","^бс_земля {addr}, не соромся. Усіх тоді струсило.","^бс_земля Пройде, {addr}. А слава лишиться.","^бс_пісня Пісня, {addr}? Тільки без того рядка, де ми тікали.","^бс_пісня {addr}, у твоїй пісні забагато тебе.","^бс_третя {addr}, ти тоді дивився не туди. Я бачив.","^бс_третя {addr}, ти саме тоді чухав крило. Я бачив.","^бс_всі Гаразд, {addr}, хай так. Але мій удар був гучніший.","^бс_всі {addr}, ти завжди так мириш, коли сам нічого не бачив?","^бс_камінь {addr}, за каменем я бачив і твою людину. Мабуть, сусідами були.","^бс_камінь Камінь, {addr}? Ти теж там сидів, раз бачив.","^бс_тактика {addr}, гарні слова для страху.","^бс_тактика {addr}, ти щойно захистив усіх боягузів світу. Шляхетно.","А тебе хто питав, {addr}?","О, і ти тут. Звісно.","Слушно, {addr}. Рідкісний випадок.","Не лізь, коли старші говорять. Жартую. Лізь.","Ти завжди вчасно. Особливо коли не треба.","Гаразд, і твоє слово записали.","~1 Тихіше, {addr}. Ти тут гість.","~3 Добре, що ти з нами, {addr}.","Ну от, і третій голос. Тепер точно не засумуємо.","Ти вчасно, {addr}. Ми якраз про тебе мовчали.","Слухаю тебе, {addr}. Уважно. Майже.","Хто прилетів — той і в розмові.","~1 Тебе тільки бракувало, {addr}.","~1 Каркнув — і досить, {addr}.","~2 Гаразд, {addr}, кажи.","~3 Радий тебе чути, {addr}.","Ще одна думка в зграї. Не завадить.","Ти завжди знаєш, коли встрявати, {addr}."],"хх_пр":["^крадіжка Слухай, {addr}, а давай поцупимо в людей щось блискуче? Суто для науки.","^крадіжка {addr}, бачив, як у твоєї людини пряжка блищить? Я б її вивчив. Зблизька. У гнізді.","^мед Слухай, {addr}, а давай наших двох лишимо тут і полетимо пити мед?","^мед Пам'ятаєш той мед, {addr}? Я досі бачу його уві сні.","^плітки Знаєш, що {name} учора утну{в|ла}? Сі{в|ла} на власний ніж. Я досі не зрозумів як.","^плітки Слухай, {addr}, тільки не сміятися: {name} учора двічі впа{в|ла} в ту саму яму.","^знову О, мій улюблений {raven}! Ну, другий після мене.","^знову {addr}, старий ти мішку пір'я! Скучив?","~1 ^знову Знову ти. Ну хоч не нудно буде.","~3 ^знову {addr}! Друже! Сідай ближче, тут тепліше.","^пл_смерть {addr}, чув? Твоя людина {g_their_death_when} полягла від {g_their_killer_gen}.","^пл_смерть Кажуть, твоя людина {g_their_death_when} загинула через {g_their_cause}. Правда, {addr}?","^пл_смерть Твоя людина {g_their_death_when} помирала {g_their_deaths}, {addr}. Я рахував.","^пл_бос А моя людина {g_my_boss_when} подолала {g_my_boss_acc}. Ось так, {addr}.","^пл_бос {addr}, ми {g_my_boss_when} здолали {g_my_boss_acc}. Я бачив усе.","^пл_дні {addr}, я з моєю людиною вже {g_my_days}. А ти зі своєю?","^пл_дні Знаєш, {addr}, ми з нею разом уже {g_my_days}. Сам дивуюся.","^пл_рахунок Моя людина вже {g_my_kills} поклала. А твоя, {addr}?","^пл_рахунок {addr}, у нас на рахунку {g_my_kills}. Я все записую."],"хх_пр_відповідь":["^крадіжка>пр_шухер Красти? Я вище цього. Але на шухері постою.","^крадіжка>пр_шухер Я не краду, {addr}. Я стою на шухері й мудро мовчу. Іди вже.","^мед>пр_гілка Мед? Минулого разу ти після меду з гілки впав. Двічі.","^мед>пр_гілка Полетимо. Тільки цього разу ти не сідаєш на гілку, поки не протверезієш.","^плітки>пр_хата Це ще що. Моя людина вчора замкнула себе у власній хаті. Перевершиш?","^плітки>пр_хата Пусте. Моя вчора двері шукала у власній хаті. Пів години.","^знову>пр_скучив Я теж скучив. Хоч і не зізнаюся.","^знову>пр_скучив Скучив. Без тебе ніхто не кидав мені виклику.","^пл_смерть>пл_підло Підло все було. Ззаду, в темряві, без попередження.","^пл_смерть>пл_підло Буває. Встала ж. І пішла далі.","^пл_бос>пл_сама Сама? Чи ти знову все приписуєш собі?","^пл_бос>пл_сама Вітаю. Хоча я чув, що там було й без героїзму.","^пл_дні>пл_довго А я зі своєю — {g_my_days}. Теж немало.","^пл_дні>пл_довго Довго. Я б не витримав. Хоча я витримую.","^пл_рахунок>пл_більше У моєї — {g_my_kills}. Але ми не рахуємо. Ну, майже.","^пл_рахунок>пл_більше Рахувати трупи — не воронова справа. Але в нас більше.","Ну, ти як завжди."],"хх_пр_встряє":["^пр_шухер>пр_заснув На шухері? Минулого разу хтось на шухері заснув. Не будемо показувати дзьобом.","^пр_шухер>пр_заснув Знаю я цей шухер. Один краде, другий куняє.","^пр_заснув>пр_медитація Він не спав. Він медитував. Із заплющеними очима. Голосно.","^пр_заснув>пр_медитація Не спав, а слухав землю. Так кажуть усі, хто спав.","^пр_гілка>пр_бджоли Гілка — то ще пусте. А як вас потім бджоли гнали через увесь ліс?","^пр_гілка>пр_бджоли Я пам'ятаю ту гілку. І рій бджіл, що летів слідом.","^пр_бджоли>пр_дзьоб Найкраще було, коли хтось дістав жало просто в дзьоб. Розпух, як буряк.","^пр_бджоли>пр_дзьоб Бджоли — дрібниця. А дзьоб після них тиждень не закривався.","^пр_хата>пр_дах У хаті? Моя на власному даху застрягла. Ніч там просиділа.","^пр_хата>пр_дах Хата — то пусте. Моя з даху не могла злізти до ранку.","^пр_дах>пр_драбина Драбину, до речі, моя людина вчора спалила. Грілася.","^пр_дах>пр_драбина Дах — то ще пусте. Моя з драбини впала, поки на дах лізла.","^пр_скучив>пр_ревнощі А за мною ніхто не скучив? Я теж тут, якщо що.","^пр_скучив>пр_ревнощі Обіймайтеся, обіймайтеся. А я постою. Сам.","^пр_ревнощі>пр_зграя Не сваріться. Нас тут уже зграя.","^пр_ревнощі>пр_зграя Зібралися всі. Одін би порадів. Або злякався.","^пл_підло>пл_своя Смерть — дрібниця. Моя людина якось за день тричі вмирала.","^пл_підло>пл_своя А моя взагалі від власної стріли полягла. Не питайте.","^пл_своя>пл_рахуй Рахую: разом наші люди вмирали частіше, ніж Одін моргає.","^пл_своя>пл_рахуй Головне — встають. Валькірії вже втомились прилітати.","^пл_сама>пл_свій_бос Боса завалити — то ще пів справи. Головне — не хвалитися.","^пл_сама>пл_свій_бос Ми теж колись таких клали. І не хвалились.","^пл_свій_бос>пл_слава Скальди вже, мабуть, складають пісню. Криву.","^пл_свій_бос>пл_слава Слава — річ мінлива. Сьогодні бос, завтра курка.","^пл_довго>пл_звикли Час летить. Здається, вчора тільки на плече сів.","^пл_довго>пл_звикли Головне не скільки, а як.","^пл_звикли>пл_вірні Довго разом — значить, вірні. Або ліниві.","^пл_звикли>пл_вірні Ворон, що лишається, — то вже родина.","^пл_більше>пл_якість Не кількість важить, а якість.","^пл_більше>пл_якість Кожен рахує по-своєму. Я — за трофеями.","^пл_якість>пл_ставка Хто більше — той і втомився більше.","^пл_якість>пл_ставка Порахуйте краще, скільки разів самі тікали.","Мене не кличте, я й сам прийду.","І я з вами. Без мене ця компанія — так собі.","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_пр_кінець":["^пр_шухер Домовились. Ти дивишся, я вивчаю блискуче.","^пр_шухер Гаразд. Тільки не засни, {addr}.","^пр_заснув|пр_медитація Отже, красти ніхто не йде. Знову перемогли чесність і лінь.","^пр_заснув|пр_медитація Гаразд, перенесемо. Коли всі виспляться.","^пр_гілка Домовились. Мед, гілка, обережність. Саме в такому порядку.","^пр_гілка Гаразд. Але на гілку — тільки після мене.","^пр_бджоли|пр_дзьоб Добре, медові походи скасовано. До весни.","^пр_бджоли|пр_дзьоб Отак мед і стає легендою. Солодкою і болючою.","^пр_хата Отак і живемо. Ми розумні, вони веселі.","^пр_хата Тільки нікому, домовились?","^пр_дах|пр_драбина Підсумок: розумних людей у цій зграї нема. Самі ворони.","^пр_дах|пр_драбина Гаразд, досить пліток. Бо почують — і самі на дах полізуть.","^пр_скучив Добре з тобою, {addr}. Не звикай.","^пр_скучив Ну все, досить сентиментів.","^пр_ревнощі|пр_зграя Гаразд, гаразд. Скучили всі за всіма.","^пр_ревнощі|пр_зграя Отака в нас зграя. Дивна, але наша.","^пл_підло Гаразд. Бережи її, {addr}.","^пл_підло Хай більше не вмирає. Без неї нудно.","^пл_своя|пл_рахуй Висновок: люди крихкі. Ворони — ні.","^пл_своя|пл_рахуй Добре, що ми не вмираємо. Принаймні не так часто.","^пл_сама Отож. Наступного разу кличте нас.","^пл_сама Пишаюсь. Мовчки.","^пл_свій_бос|пл_слава Гаразд, слава всім. Але нам — більша.","^пл_свій_бос|пл_слава Записую: бос лежить, хвальків знайшлося багато.","^пл_довго Хай буде ще стільки ж. І ще.","^пл_довго Отак і живемо. Разом.","^пл_звикли|пл_вірні Гаразд. За вірність. Нашу й їхню.","^пл_звикли|пл_вірні Всі ми тут надовго, схоже.","^пл_більше Отож. Рахунок на нашу користь.","^пл_більше Гаразд, нічия. Поки що.","^пл_якість|пл_ставка Записую: всі молодці, наші — трохи більше.","^пл_якість|пл_ставка Досить рахувати. Час жити.","Гарно поговорили. Як завжди.","~3 Бережи себе, друже."],"хх_вг":["^історія Знаєш, як {name} уперше {розпалював|розпалювала} вогонь? Пів дня. Я встиг постаріти.","^історія {addr}, хочеш історію? Перший вогонь {name} розпалю{вав|вала} пів дня. Я встиг змерзнути двічі.","^при Інколи думаю: це ми при них, чи вони при нас?","^при {addr}, як гадаєш: хто кого береже — ми їх чи вони нас?","~3 ^при {addr}, як думаєш: ми їх бережемо чи вони нас? Тільки чесно.","^годує Твоя людина хоч годує вчасно, {addr}?","^годує Чим тебе годують, {addr}? Мене — переважно обіцянками.","^тепло Тепло. Аж хочеться сказати щось розумне. Але не скажу.","^тепло Отак би сидів вічно. Тепло, сухо, і ніхто не помирає.","~3 ^тепло Гарно отак, {addr}. Вогонь, свої, тиша. Рідко буває."],"хх_вг_відповідь":["^історія>вг_бій Це ще що. {name} якось {заснув|заснула} просто посеред бою.","^історія>вг_бій Пів дня — то швидко. {name} в мене якось {задрімав|задрімала} посеред бійки. Стоячи.","^при>вг_обмін Ми при них. Вони годують — ми рятуємо. Чесний обмін.","^при>вг_обмін Обмін, {addr}: їжа за порятунок. Хоча рятую я частіше.","^годує>вг_їжа Мене — сиром. Іноді. Коли пам'ятають.","^годує>вг_їжа Ягодами. Я від них уже синій.","^тепло>вг_тиша Не кажи нічого. Помовчимо — це теж розумно.","^тепло>вг_тиша Мовчи. Тиша біля вогню — найкраща розмова.","Ну-ну."],"хх_вг_встряє":["^вг_бій>вг_дерево Посеред бою — то ще розумно. Моя людина цілу ніч розмовляла з деревом.","^вг_бій>вг_дерево Заснути — пусте. Моя з деревом сперечалася. І програла.","^вг_дерево>вг_троль А потім дерево відповіло. Бо то був троль.","^вг_дерево>вг_троль Найгірше, коли дерево відповідає. Моя так і познайомилась із тролем.","^вг_обмін>вг_рахунок Я рахую. Я рятував свою людину разів двадцять. Годувала вона мене — разів десять.","^вг_обмін>вг_рахунок Обмін нечесний. Я веду рахунок, і він не на їхню користь.","^вг_рахунок>вг_борг Такі борги не повертають. Їх просто носять. На плечі.","^вг_рахунок>вг_борг Не рахуйте. Бо доведеться визнати, що ми їх любимо.","^вг_їжа>вг_хліб Ще непогано. Мене годують хлібом, твердим, як щит.","^вг_їжа>вг_хліб Розкошуєте. Мені дістаються крихти. І ті з землі.","^вг_хліб>вг_крадене Найсмачніша їжа — та, що сам знайшов у чужій сумці.","^вг_хліб>вг_крадене Я давно не чекаю. Що сам візьму — те й моє.","^вг_тиша>вг_вартовий Мовчіть, мовчіть. Але хтось мусить стерегти, поки всі куняють.","^вг_тиша>вг_вартовий Тиша — добре. Тільки хто стежить за темрявою?","^вг_вартовий>вг_зміна Стережемо по черзі. Я перший. Потім розбуджу найгучнішого.","^вг_вартовий>вг_зміна Давайте по черзі: хто перший позіхне — той і сторожить.","Можна до вогнища? Я тихенько.","Гарно сидимо. Як справжня зграя.","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_вг_кінець":["^вг_бій Отак і живемо. Ми їм — пильність, вони нам — історії.","^вг_бій Тільки не кажи їм, що ми про них говорили.","^вг_дерево|вг_троль Гаразд. Цієї ночі виграли дерева.","^вг_дерево|вг_троль Запишу всі три. Хай нащадки сміються.","^вг_обмін Отже, ми при них. Але з рахунком.","^вг_обмін Хай вони думають, що головні. Нам не шкода.","^вг_рахунок|вг_борг Рахунки закрито. До наступного вогнища.","^вг_рахунок|вг_борг Хоч як рахуй — а сидимо на тих самих плечах.","^вг_їжа Отже, годують. Принаймні нас не їдять.","^вг_їжа Хай годують, як уміють. Ми ж пробачаємо.","^вг_хліб|вг_крадене Висновок: ми всі трохи голодні. І трохи злодії.","^вг_хліб|вг_крадене Гаразд. Завтра попросимо краще. Або візьмемо.","^вг_тиша Хай буде так завжди.","^вг_тиша Добре помовчали.","^вг_вартовий|вг_зміна Домовились. Вогонь горить, варта стоїть, ми дрімаємо.","^вг_вартовий|вг_зміна Гаразд. На добраніч, зграє.","Ну, хай горить.","Гарно посиділи.","~3 Отак би й сидів до ранку.","~1 Досить. Я дрімаю."],"хх_бс":["^бос Бачив, {addr}? {boss} — усе. І не без нашої допомоги.","^бос Ще один бог упав, {addr}. Скальди матимуть роботу.","~1 ^бос Вижили, {addr}. Дивно, але вижили.","~3 ^бос Пишаюся, {addr}. Нами всіма. Навіть тобою.","^остання Цікаво, чия людина вдарила останньою, {addr}. Моя, звісно.","^остання Хто з наших добив, {addr}? Кажи чесно.","^влучила Зізнайся, {addr}: твоя людина хоч раз влучила?","^влучила Твоя людина там билась, {addr}, чи кричала з-за каменя?"],"хх_бс_відповідь":["^бос>бс_падало Падало красиво. Як дуб у бурю.","^бос>бс_падало Земля аж підскочила, коли воно впало.","^остання>бс_моя Остання, перша — хто рахує? Я рахую. Моя.","^остання>бс_моя Добила моя. Навіть не сумнівайся.","^влучила>бс_кричала Моя влучала. Твоя переважно кричала.","^влучила>бс_кричала Влучала. Я бачив, а я не брешу. А от твоя голосно кричала.","Головне, що всі цілі."],"хх_бс_встряє":["^бс_падало>бс_земля Земля так здригнулась, що я з плеча злетів. Ненавмисно.","^бс_падало>бс_земля Від того удару в мене досі дзвенить у вухах.","^бс_земля>бс_пісня Скальди про це заспівають. Переплутають усе, але заспівають.","^бс_земля>бс_пісня Я вже складаю пісню. Перший рядок: «Ворони не злякались».","^бс_моя>бс_третя Ви обидва помиляєтесь. Добила моя. Я бачив згори.","^бс_моя>бс_третя Обидві не добивали. Добивала моя, поки ви сперечались.","^бс_третя>бс_всі Слухайте, а може, воно само здохло? Від сорому, що вас стільки.","^бс_третя>бс_всі Кожен каже «моя». То, може, вдарили всі разом?","^бс_кричала>бс_камінь Кричала — то ще пусте. Я бачив, хто ховався за каменем.","^бс_кричала>бс_камінь А за каменем потім хтось сидів. Не будемо казати хто.","^бс_камінь>бс_тактика Ховатися за каменем — то тактика. Так кажуть усі, хто ховався.","^бс_камінь>бс_тактика Камінь — найкращий щит. Мудрі люди ним користуються.","Гарний бій. Я теж там був, якщо що.","Можна і мені слави шматочок?","Можна і я скажу? Ні? Все одно скажу: ви обидва дивні.","Мене ніхто не питає, але я згоден. Майже.","Тихіше, ви. Думати заважаєте.","Я все чую, якщо що.","~1 Ой, почалося.","~3 Як добре, що ми всі тут.","А мене спитати? Ні? Як завжди.","Вибачте, що втручаюсь. Хоча ні, не вибачайте.","Ви обоє праві. І обоє — ні.","~1 Можна тихіше? Я думаю.","~3 Гарно говорите. Я послухаю.","Не звертайте на мене уваги. Я тут просто сиджу.","Розмова цікава. Продовжуйте, я запам'ятаю.","Я б щось додав, але ви й так усе сказали.","О, і я хочу слово. Ось воно: слово.","~1 Скільки балачок. Аж пір'я в'яне.","~3 Люблю, коли нас багато."],"хх_бс_кінець":["^бс_падало Гарний бій. Усі молодці.","^бс_падало Добре. Тепер — їсти і спати.","^бс_земля|бс_пісня Отже: падало красиво, ми не злякались, пісня буде. Записано.","~3 ^бс_земля|бс_пісня Разом ми сила. Хто б подумав.","^бс_моя Гаразд, нічия. Але моя була першою.","^бс_моя Гаразд, поділимо славу навпіл.","^бс_третя|бс_всі Записую: добили всі. Скальди розберуться.","^бс_третя|бс_всі Отже, вбивць у {boss_gen} було багато. Пощастило.","^бс_кричала Гаразд, обидві влучали. Колись.","^бс_кричала Наступного разу рахуватиму влучання. Вголос.","^бс_камінь|бс_тактика Отже, перемогли камінь і тактика. Запишу.","^бс_камінь|бс_тактика Гаразд. Головне, що всі живі. Навіть ті, хто за каменем.","Запишу це. У голові.","~1 Ну все, ходімо звідси."],"ха_вступ":["Глянь-но.","О.","Знаєш що?","Хм.","Слухай.","Подумай лишень.","~1 Ну от.","~3 Дивись-но, друже.","Подивись-но.","До речі.","Між нами.","~2 Слухай-но.","~1 Ось тобі новина."],"ха_хвіст":["Запам'ятай.","Я все сказав.","Кар.","Але це між нами.","Не благодари.","Мудро, правда ж?","~1 Думай сам.","~3 Я ж про тебе дбаю.","Так і знай.","Подумай.","Запиши собі.","~2 Кажу як є.","~3 Бережи себе."],"хв_відсіч":["Ой, хто заговорив.","Знову ти.","Чую, чую.","Слухай сюди.","Ну звісно.","~3 Ох, сусіде.","Ну-ну.","О, ти.","~1 Знову ти, {addr}?","~2 Почув, почув."],"хв_шпилька":["І не каркай.","Подумай над цим.","Кар.","Зрозумів?","Мудрість — не для всіх.","Отак.","І крапка.","~1 Затям.","~3 Без образ."],"ха_поранений":["{friend} ледве на ногах. Може, поділишся їжею? Чи хоч співчуттям.","{friend} поранен{>ий|а}. Не стій, герою, допоможи.","Ще трохи — і {friend} шукатиме свої речі по могилі.","У {>нього|неї} кров. Справжня. Подай хоч бинт, чи що там у вас, людей.","~3 {friend} зараз слабш{>ий|а} за тебе. Прикрий {>його|її}.","~1 {friend} поранен{>ий|а}. Не наша справа. Хоча… ні, наша.","{friend} кульгає. Видно, бій був не на {>його|її} користь.","{friend} у крові. Свіжій.","Якщо {friend} зараз впаде, підніматимеш ти. Я — ні.","Поранений воїн — легка здобич. Не лише для ворогів.","~1 {friend} знову {>вліз|влізла} туди, куди не треба. Видно ж.","~2 Дай {>йому|їй} перепочити. Ми не поспішаємо.","~3 {friend} тримається. Але ледве. Будь поруч.","~3 Поділися з {>ним|нею} їжею. Я не ображуся. Майже."],"ха_спить":["{friend} спить. Тихо. Це єдиний час, коли {>він|вона} не робить дурниць.","Сплячий вікінг — мирний вікінг.","{friend} дрихне, а ми тут вартуємо. Як завжди.","Хропе так, що вовки в лісі прислухаються.","~3 Хай поспить. Завтра знову рятувати світ. Або хоча б себе.","{friend} спить, а світ без {>нього|неї} навіть не помітив.","Тихо. Нехай бачить добрі сни. Їх тут мало.","Сплячого не будять. Хіба що вогонь чи троль.","Сон — найкращі ліки. А {friend} лікується старанно.","~1 Спить посеред дня? Розкіш, якої тобі не бачити.","~2 Хай поспить. Ми посторожимо.","~3 Дивись, як мирно спить. Гарна мить.","~3 Тихенько, не буди. Я бачу, як {>він|вона} втоми{>вся|лася}."],"ха_бос":["Пам'ятаєш {mboss}? Ти й {friend} тоді добре попрацювали. Це було {m_when}.","{friend} бу{>в|ла} з нами, коли ми клали {mboss}. Таке не забувається.","Ти й {friend} разом поклали {mboss}. Я досі пам'ятаю кожен удар.","Коли ми били {mboss}, {friend} стоя{>в|ла} поруч. Не {>втік|втекла}. Рідкість.","~3 Ти й {friend} разом поклали {mboss}. Я тоді вами пишався. Обома.","Ти й {friend} — ті, хто поклав {mboss}. Скальди могли б про це співати.","{friend} теж би{>в|ла} {mboss}. Я бачив обох.","Хто бив {mboss} разом, той і далі піде разом.","Ти й {friend} поклали {mboss} {m_when}. Відтоді я на {>нього|неї} дивлюся інакше.","~1 Пам'ятаю, як ви били {mboss}. {friend} тоді більше заважа{>в|ла}, ніж допомага{>в|ла}.","~2 Добрий спогад: як ми били {mboss}. Ти, я і {friend}.","~3 Ти й {friend} разом поклали {mboss}. Таких друзів бережуть.","~3 Коли ви били {mboss}, я пишався вами обома."],"ха_ворон":["Ворон, що сидить на {>ньому|ній}, — {fraven}. Я з ним ще поговорю.","{fraven} — {>його|її} ворон. Цікаво, хто кого виховує.","Глянь, {fraven}. Пір'я гарне. Розум — під питанням.","{fraven} знову щось бурмоче. Ворон як ворон. Не я, звісно.","~3 {fraven} — нормальний ворон. Для чужого.","{fraven} поглядає на мене. Хай поглядає.","У {>нього|неї} ворон {fraven}. Подивимось, чи вартий своєї людини.","{fraven} надто голосний. Я так думаю.","{fraven} сидить гордо. Як я, тільки гірш
