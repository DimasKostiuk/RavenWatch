 жарти. Ха-ха. Не смішно.","сонечко, пташечки… Аж блювати тягне.","у таку погоду трупи швидко смердять. Кайф.","гарна днина, курва. Аж підозріло. Хто шось замишляє?","сонце гріє пірʼя. Ну, хоч шось.","~1 сонце світить, а ти все одно похмур{ий|а}, як сраний день.","~1 навіть сонце тебе красивіш{им|ою} не зробить, бля.","~2 гарна днина, дідько. Пішли накоїмо дурниць.","~2 тепло. Можна й не лаятись. Курва, не вийшло.","~3 сонце, ти і я. Романтика, бля. Тіко не обіймай.","~3 люблю такі дні. І тебе трохи. Мовчи, сказав."],"жт_сонце_кінець":["Сліпить, сука.","Тьху.","Жарко.","~1 Ховайся в тінь, упирю.","~3 Гарно, бля."],"жт_трофей":["о, голова! Можна я їй очі видзьобаю? Ну можна?","трофей, курва! Повісь над ліжком.","оце сувенір. Смертю пахне. Люблю.","ше одна голова в торбі. Ти маніяк. Мені подобається.","тягни додому. Хай гості ссуть.","відрубана голова — найкращий подарунок, без пизди.","бери, бери. Колись і твою хтось так візьме, хе.","~1 трофей. Ну хоч шось ти здобу{в|ла}, крім синців.","~1 дай мені — я з ним базарити буду. Він розумніший за тебе.","~2 гарний трофей, дідько. За такий бабла дадуть.","~2 оце здобич! Ше хочу!","~3 наш трофей, курва. Я теж бився, якшо шо.","~3 повісимо, і я на ньому сидітиму. Як король, бля."],"жт_трофей_кінець":["Ше!","Смачна голова.","Повісь.","~1 Не загуби, довбню.","~3 Наша слава, бля."],"жт_стіна":["оце повісили! Тепер у хаті є хтось розумніший за тебе. Він.","голова на стіні. Найкращий декор, курва, без базару.","висить, витріщається. Хай гості обісцяться.","ше одна морда на стіні. Збирай дальше.","оце я розумію — інтерʼєр, бля.","тепер буде з ким побазарити, як нудно.","стіна з головами — мрія кожного ворона. Кожного!","~1 криво висить, бля. Як і руки в тебе ростуть — з дупи.","~1 він на стіні, а ти — ше ні. Поки шо.","~2 гарно висить, трясця.","~2 оце колекція. Скоро стін не вистачить, ге.","~3 наша стіна слави, курва. Я теж там був, братан.","~3 ше повісимо. Я тобі вбивати поможу, га?"],"жт_стіна_кінець":["Висить!","Красота.","Ше одну.","~1 Наступна — твоя, хе.","~3 Наша, бля."],"жт_візок":["тягнеш візок, як віслюк. Повага, курва. Іа-іа.","рип-рип, бля. Цей візок скиглить гучніше за тебе.","візок повний, сили по нулях. Класика.","везеш руду? А мене покатаєш, га?","колеса крутяться, я сиджу. Кайф.","якшо перекинеш — я до вечора іржатиму.","тягни, тягни. Добрий тягловий вікінг. Хороший.","~1 тягнеш, як сонна черепаха. Тіко повільніше.","~1 впрягайся краще, воле тупий.","~2 гарно везеш, дідько. Ше трохи.","~2 оце тягло! Ти сьогодні за коня, братан.","~3 тягни, тягни. Я дорогу пильную, курва.","~3 доїдемо — дзьобну тебе в щоку. Нагорода така, ну."],"жт_візок_кінець":["Но!","Швидше, шкапо.","Рип.","~1 Не перекинь, бо дзьобну.","~3 Майже приїхали."],"ст_boss":["босів {bosses_all}, а мізків — нуль. Нуль, чуєш? Ніс не дери."],"цт_death_many":["смерть {times} поспіль, бля. Ти шо, зовсім {безрукий|безрука}?","ти не воїн, ти, бля, лічильник смертей ходячий. Цок, цок, цок.","валькірії вже ржуть з тебе, як коні. І я ржу."],"ст_death_many":["{deaths_all}, сука. Валькірії скоро тобі рахунок випишуть, і ти не розплатишся."],"ст_death_creature":["від {killer_gen} ти {ліг|лягла}, бля! А {killer_genpl} на твоєму рахунку {killer_kills}. Ну і як так, га?","{deaths_all} за все життя. Ти взагалі вчишся, чи в тебе в голові гівно?","від ворогів ти здихаєш уже {cause_times}. Чмо безруке, ото хто ти."],"цт_death_fall":["{полетів|полетіла} вниз, як мішок гівна. Гуп! Хе-хе.","земля тебе, бля, прийняла. Ну, по-своєму. Заслужено."],"ст_death_fall":["гепаєшся насмерть уже {cause_times}. Мізки там десь на камінні й лишились."],"цт_death_drown":["втопитися? Гівно — і те плаває, а ти нє. Ну ти й…","риби тобою подавились, бляха. Навіть вони не хотіли."],"ст_death_drown":["тонеш уже {cause_times}. Бульк — і нема. Бульк — і нема. Заїбало дивитись."],"цт_death_fire":["{засмажився|засмажилася}, як курка на рожні. Тупа курка, бля.","вогонь гарячий, прикинь? Хто б міг подумати, га, геній?"],"ст_death_fire":["{засмажився|засмажилася} уже {cause_times}. Шашлик, курва, а не воїн."],"цт_death_poison":["{нажерся|нажерлася} отрути, мудило? Ну шо, смачно було?"],"ст_death_poison":["отрути {нажерся|нажерлася} вже {cause_times}. Дебіл — це надовго."],"цт_death_cold":["задубіти, бо лінь вдягтись. Ну ти й дебіл, їй-бо."],"ст_death_cold":["замерзаєш уже {cause_times}. Шубу вдягни, ідіоте, шубу!"],"цт_death_tree":["тебе вбило ДЕРЕВО. Дерево, бляха! Я зара всрусь зі сміху.","дерево тебе приплющило. Ну ти й лошара, курва мать."],"ст_death_tree":["дерево вбило тебе вже {cause_times}. ДЕРЕВО, курва! І не раз! Я не можу…"],"цт_death":["знову {здох|здохла}, бля. Вставай, не скигли, шмаття своє збирай.","о, знову труп. Ну шо ти будеш робити, га."],"ст_death":["свій надгробок обшмановано вже {tombs_times}. Себе ж грабуєш, крадій хрінів."],"ст_near_death":["рекорд без смерті — {streak_max}. А сьогодні ти ледь не {обісрався|обісралася}, я бачив."],"ст_level":["ворогів на рахунку вже {kills_all}, а мізки які були, такі й лишились. Нуль."],"ст_kill_many":["{top_genpl} на рахунку вже {top_kills}. Ото ти рубака, курва.","трупів за спиною вже {kills_all}, а ти досі {тупий|тупа}, як пень. Як так?"],"ст_fall":["в повітрі вже {air_km} за життя, а літати — хуй там. Курка, а не птах."],"ст_build":["деталей поставлено вже {built_all}, і все криве, як срака в троля.","у базі вже {base_hours}. Ну сиди, сиди в норі, домосід сраний."],"ст_fish":["з гачка втекло вже {fish_lost}. Тебе навіть риба, курва, кидає."],"ст_hungry":["страв зжерто вже {food_all}, і все тобі мало, ненажеро."],"ст_kill":["{top_genpl} вже {top_kills}. Скоро не буде кого гасити, садюга ти."],"ст_sail":["морем уже {sail_km}, а корито досі не втопили. Диво, бля."],"ст_chop":["дерев повалено вже {trees_all}. Ліс плаче, а тобі похуй. Мені теж."],"ст_mine":["каменюк розтрощено вже {mines_all}. Кріт ти, бля. Сліпий кріт."],"ст_portal":["крізь портали вже {portals_times}. Блоха срана, от хто."],"ст_sleep":["ночей проспано вже {sleep_all}. Ледащо сонне, курва."],"ст_pick":["ягід зібрано вже {berries_all}. Воїн, бля. Ягідний воїн."],"ст_travel":["{намотав|намотала} вже {km_all}, а куди йдеш — без поняття. Як і я."],"ст_idle":["стрибків уже {jumps_all}. Скачеш, як козеня йобнуте."],"вл_fury":["РУБАЙ ЇХ, СУКА, РУБАЙ!","КРОВІ, БЛЯ! ШЕ КРОВІ!","БИЙ, ПОКИ ВОНИ ШЕ ДИХАЮТЬ!","ЗА ОДІНА, НАХУЙ! І ЗА МЕНЕ!","НЕ СПИ — ГАСИ!","РВИ ЇХ НА ШМАТКИ, {name}! НА ШМАТКИ, ЧУЄШ?!","ШОБ ЖОДНА ПАДЛА НЕ ВСТАЛА!","ВСІ ДИВЛЯТЬСЯ, НЕ ОБІСРИСЬ!"],"вл_wings":["НОГИ В РУКИ, БЛЯ!","ДРАПАЙ, {name}! ДРАПАЙ, КУРВА!","БІЖИ, ПОКИ НОГИ ЦІЛІ, ДУРНЕ!","ВАЛИМО НАХУЙ ЗВІДСИ! ВАЛИМО!","ВОРУШИ КОПИТАМИ, ЧЕРЕПАХО ЙОБАНА!","ЛЕТИ, {name}! ЯК ВІД ТРОЛЯ, ЛЕТИ!","ШВИДШЕ, БО СРАКУ ВІДКУСЯТЬ!","ГАЗУ, БЛЯ! ГАЗУ! ПИЗДЕЦЬ ЗА НАМИ!"],"вл_sh_here":["Сиджу на твоєму плечі {biome_here_in}, а ти, бля, лізеш у найгірші кущі. Шо там?","Шо, гіршого місця, ніж {biome_here}, не {міг|могла} знайти? Ну то й не шукай, нахуй."],"вл_sh_idle":["Плече в тебе кістляве, {name}. Мені вже вся срака в синцях.","Нудьга, {name}. Знайди когось, шоб вбити. Ну хоч когось."],"вл_sh_kill":["Я з плеча бачив — ото, курва, красиво! Ше давай!","Одним трупом більше. Я запам'ятав, {name}. Зарахував."],"вл_sh_kill_many":["Оце м'ясорубка, йо! Сиджу й облизуюсь, як кіт."],"вл_sh_near_death":["Ледь не {здох|здохла}, а я ж на твоєму плечі сиджу, дурне! Про мене подумай!"],"вл_sh_boss":["Боса нема, хай гниє, падло! А я все бачив з першого ряду, йо!"],"вл_sh_build":["Знову будуєш, {name}? Я на твоєму плечі зара засну нахуй."],"вл_sh_sail":["Хитає, в пизду це море. Мене зара на тебе виверне, {name}, отак і знай."],"вл_sh_weather_rain":["Дощ, а я на тобі мокну, як щур у нужнику. Дякую, {name}, від душі, бля."],"вл_fed":["Хоч шось путнє від тебе, {name}. Як зголоднію — ше давай.","М'ясо! Йо! Нарешті ти {зробив|зробила} шось корисне.","Жеру я. Не витріщайся, засранцю, бо око виклюю.","Кров на дзьобі — день вдався, {name}. Ото кайф."],"вл_awake":["Ну, прокинувся, бля. І хто тут дебіл, якого мені пасти? А, ти, {name}. Ясно.","Оленячий бос на смак — гівно гівном. Але я прокинувся. Пішли, {name}.","Я тут. Я все пам'ятаю. І тебе тепер теж, {name}. Не радій."],"вл_see_enemy":["Бачу м'ясо: {seen_enemy}. А їх тут, сука, {seen_count}.","Ворогів — {seen_count}. Найближчий — {seen_enemy}. Шо ти, бля, стоїш?"],"вл_see_hurt":["КРОВ ХЛЕЩЕ, {name}! НАЗАД, ДЕБІЛЕ!","Ледь {живий|жива}, {name}? Я запам'ятаю і всім розпатякаю. Всім!"],"вл_heal":["ЖРИ, НЕ ЗДИХАЙ МЕНІ ТУТ, БЛЯ!","ЗАЛАТАЮ ТЕБЕ. АЛЕ Я ЦЕ ЗАПАМ'ЯТАЮ, ДІРКА ТИ ХОДЯЧА.","ТРИМАЙСЯ, ДУРНЕ! ВАЛЬКІРІЇ ПОСТОЯТЬ.","ЗНОВУ ДУПУ ПІДСТАВЛЯЄШ? НА, ЛІКУЙСЯ, ЛОШАРА.","ВСТАВАЙ, СУКА! МИ ШЕ НЕ ДОБИЛИ!","ШЕ РАЗ ТАК ПІДСТАВИШСЯ — Я ТЕБЕ САМ ДОБ'Ю!","ЖИВЕМО? НУ ТО ВПЕРЕД, НАХУЙ!","ЗАЛИЖИ РАНИ — І НАЗАД У М'ЯСОРУБКУ!"],"бм_левади":["Левади, бляха. Тут навіть кабан — і той лагідний, тьху.","оленятка, кабанчики, квіточки… Мене зара виверне, чесно.","на Левадах нудно, як на пиятиці без медовухи. Ну шо це, га?","тут нема кого гасити. Хіба курей. Курей я гашу, якшо шо.","трава, сонечко, тиша. Капець. Я так здохну.","Левади — для лохів. А ти тут. Ото й думай.","тут навіть сіролюди не страшні, а смішні. Шо то за вороги, курва мать?","~1 шо, на Левадах почуваєшся сильн{им|ою}? Бо тут усе дохліше за тебе. Ледь-ледь.","~1 тут навіть кабан мізкуватіший за тебе. Я перевіряв.","~2 Левади, бля. Ну хоч не смердить, і на тому дякую.","~2 тихо тут. Терпимо. Тіко нудно, як у Хугіна в книжках.","~3 Левади… Тут ми з тобою, ну… почали. Я пам'ятаю, ага.","~3 гарно тут, курва. Тіко нікому не кажи, шо я таке сказав. Бо вб'ю."],"бм_левади_порада":["Пішли звідси, бо я засну.","Хоч кабана завали, ну.","Тю, нудьга.","~1 Сиди тут, лошара. Тобі якраз.","~3 Ну, посидимо, шо вже."],"бм_чорнолісся":["Чорнолісся, курва мать. Темно, як у троля в дупі.","сіролюди в кущах сидять. Я чую, як вони смердять, падли.","троль гупає. О! Нарешті шось путнє.","тут кожне дерево хоче тебе вбити. Поважаю, чесно.","мох, гриби, гниль… Ммм. Пахне, як у мене вдома.","Чорнолісся — це тобі не Левади, ага. Тут кусаються, і боляче.","тут під кожним кущем кістки. Деякі ше свіжі, хе-хе.","~1 у Чорноліссі ти довго не протягнеш. Я ставлю на троля. Сто пудів.","~1 тупотиш, як стадо корів, бляха. Сіролюди вже біжать на обід.","~2 темно, як у дупі. Але цікаво, шо є, то є.","~2 зара знайдемо когось і порубаємо. Чисто для настрою.","~3 темно тут, але ти не бзди. Я з тобою, засранцю.","~3 Чорнолісся наше, курва. Хай усі знають, чиє."],"бм_чорнолісся_порада":["Гаси сіролюдів.","Вгору глянь, дурне.","Смолоскип запали, бо нічо не видно.","~1 Здохнеш тут — я й не почешусь.","~3 Тримайся, чуєш?"],"бм_болото":["Болото, бля. Смердить, як мої онучі. Ну, якби в мене були онучі.","драуґри тут злі й мокрі. Ну чисто я після дощу.","п'явки хочуть твоєї крові. Я їх, курва, розумію.","тут шо не крок — то в гівно. Без жартів.","туман, вода, трупи. Курорт, йо.","Болото — це для тих, хто хоче здохнути мокрим. Тобто для тебе.","тут навіть повітря отруйне. А мені шо, мені норм.","~1 ти тут як удома: брудн{ий|а} і туп{ий|а}, як пень.","~1 втопишся в цій жижі — та й похуй, я й не гляну.","~2 смердить, як з нужника. Але залізо тут є, тож терпимо.","~2 мокро, гидко, бр-р. Рубаємо швидше і валимо.","~3 гидко, курва. Але з тобою якось переживу, ага.","~3 тримайся, засранцю. Вилізем, не таке вилазили."],"бм_болото_порада":["Рубай драуґрів.","Зілля від отрути пий, дурне.","У воду не лізь, бля.","~1 Хочеш тонути — тони, мені шо.","~3 Валимо звідси, ну."],"бм_гори":["у Горах дубак, курва. Я свого дзьоба не чую.","вовки виють. О, на бійку кличуть. Підем?","сніг у пір'ї, лід у дзьобі. Дякую тобі, падло, від душі.","тут дракони літають. Я хочу одного дзьобнути. В сраку. Чисто шоб знав.","вітер такий, шо мене з плеча здуває, бляха-муха.","гори, сніг, і ти — син{ій|я}, як дохла риба.","срібло тут. І трупи тих лохів, шо по нього лізли.","~1 у Горах ти здохнеш від холоду ше до вовків. Сто пудів.","~1 стоїш на скелі, як дурне козеня. Мекни ше, ну.","~2 холодно, бля. Але красиво, зараза.","~2 вовків тут до сраки. Буде весело, йо.","~3 мерзну, курва. Притулися, ну. Тіко без соплів.","~3 гори — наші, ясно? Лізьмо вище, нахуй той холод."],"бм_гори_порада":["Вдягнись, дурне, бо задубієш.","Багаття треба, курва.","Гаси вовків.","~1 Та й дуба давай, мені шо.","~3 Ходи грітись, ну."],"бм_рівнини":["Рівнини, курва. Мухи — як кабани, тіко злі.","фулінґи тут злі. Я їх уже люблю, гадів.","сонце пече, мухи кусають. Пекло, тіко сухе.","тут видно далеко. І тебе видно. Ходяча мішень, хе.","ячмінь, льон і спис у спину. Рівнини, бля, шо ти хочеш.","тут кожна муха хоче тебе вбити. Муху я поважаю. Тебе — нє.","бикоящури пасуться. Здоровенні, смердять, ну чисто ти.","~1 на Рівнинах ти протягнеш рівно до першої мухи. Мо', до другої.","~1 стоїш у полі, як опудало. Тіко опудало хоч ворон лякає.","~2 простору тут дохуя. Є де розгулятись.","~2 фулінґів порубаємо — і буде файно.","~3 тут гарно, курва. Ну, коли ніхто не кусає в сраку.","~3 Рівнини наші. Пішли фулінґам пики бити."],"бм_рівнини_порада":["Мух бий, ну!","Гаси фулінґів.","Не стирчи на виду, дурне.","~1 Хоч здохни красиво, шоб не соромно.","~3 Я тебе прикрию, не бзди."],"бм_імла":["в Імлистих землях ніхуя не видно. Взагалі.","павуки, курва. Здоровенні. Я одного хочу зжерти, чесно.","шось цокає. Хай цокне ближче — я йому дзьобом цокну.","туман, як каша. Я в ньому тону, бляха.","тут руїни, черви й гівно в тумані. Ну і де тут золото, га?","у цій мряці можна загасити кого завгодно. Навіть тебе. Я просто кажу.","тут світло — як золото. А в тебе нема ні того, ні того. Лох.","~1 тут ти ше сліп{іший|іша}, ніж зазвичай. А куди вже сліпіше?","~1 загубишся в тумані — шукати не буду. Нахуй треба.","~2 моторошно, бля. Але цікаво, хай йому грець.","~2 світло тримай, чуєш? Бо я нічо не бачу.","~3 не бзди. Я поруч, курва. Я завжди поруч.","~3 знайдемо дорогу. Я нюхом чую. Ну, десь так."],"бм_імла_порада":["Світло тримай, дурне.","Цить!","Гаси павуків.","~1 Загубишся — сам{|а} винн{ий|а}, я шукати не буду.","~3 Я тут, не сци."],"бм_попіл":["у Попелистих землях пече, як на сковорідці. Нахуя ми сюди припхались?","попіл в очах, вогонь під лапами. Курорт, бля, всім раджу.","лава тече. Красиво, сука. Тіко не лізь.","тут кожен камінь горить. Ну чисто я, коли злий.","пір'я тліє, курва! Ти шо, не чуєш, як смердить?","тут усе хоче тебе підсмажити. І я трошки теж.","мертве царство. Пахне смаженими трупами. Ммм, обід.","~1 ти тут засмажишся швидше, ніж скажеш «ой». Ой.","~1 побігай по лаві. Ну шо тобі, шкода? Мені ж весело.","~2 гаряче, як у печі. Валимо звідси швидше.","~2 вогонь скрізь. Пильнуй, бля, бо обоє засмажимось.","~3 тримайся, курва. Вилізем із цього пекла, я тобі кажу.","~3 навіть тут я з тобою, засранцю. Де ж я дінусь."],"бм_попіл_порада":["Зілля від вогню пий, ну.","У лаву не лізь, дурне.","Валимо!","~1 Гори собі, мені шо.","~3 Не здихай мені тут."],"бм_північ":["на Далекій півночі такий дубак, шо я дзьоба не відчуваю. І сраки.","лід, сніг і нічо. Нудьга морожена, бля.","тут навіть мої матюки замерзають. Курв… о, бачиш? Замерзло.","край світу, курва. Далі тіко холод і ше раз холод.","сніг падає, і падає, і падає. Та заїбав уже.","тут нема кого вбити. Все замерзло нахуй.","мерзну так, шо пір'я дзеленчить.","~1 з тебе тут вийде гарна бурулька. Я на ній посиджу.","~1 замерзнеш — я тебе поставлю як статую. Підпишу «Лох».","~2 дубак, бля. Вогонь треба, і швидко.","~2 тут якось дивно. І тихо, курва. Не люблю тихо.","~3 притулися, засранцю. Мерзну я, не бачиш?","~3 навіть на краю світу ти не сам{|а}, чуєш? Я тут. Куди я подінусь."],"бм_північ_порада":["Вогню давай!","Шубу вдягни, ну.","Валимо звідси нахуй.","~1 Мерзни, мені похуй.","~3 Гріймося, бо обоє дуба дамо."],"бм_океан":["в Океані тіко вода. Вода, вода, вода. Нудно, курва.","серпенти голодні. Хай випливають, побачимо, хто кого.","хвилі, бля. Мене зара знудить.","сіль у пір'ї, сіль у дзьобі. Тьфу.","земля де? Я питаю, де, бля, земля?","глибоко тут. Темно. Мені подобається, а шо такого?","корито хитається. Як ти після медовухи, хе-хе.","~1 втопиш нас — я злечу, а ти на дно. Бульк.","~1 пливемо хрін знає куди. Як завжди з тобою.","~2 вітер гарний, дідько. Жени!","~2 серпента б завалити. Ото було б діло, га?","~3 море, ти і я. Романтика, бля. Не кажи нікому.","~3 пливи, курва. Я пильную, будь спок."],"бм_океан_порада":["Курс тримай, дурне.","Серпент мій, ясно?","Не втопи нас, бляха.","~1 Тони, якшо так хочеться.","~3 Ну, пливемо."],"афк":["стоїш, як дохлий троль. Ворушись, бля!","агов! Ти там ше ж{ивий|ива}, чи шо?","я вже сраку відсидів на тобі. Рухайся!","ти шо, зд{ох|охла} стоячи? Як кінь?","на тобі муха сидить. Друга вже гніздо мостить.","навіть каміння частіше ворушиться, їй-бо.","ше хвилина — і я тобі дзьобом в око. Не жартую.","~1 стоїш, як опудало. Ворони ржуть. Я теж ржу.","~1 якшо ти {заснув|заснула} стоячи — я тебе перекину, слово пацана.","~2 ну? Ну?! Скільки можна, бляха-муха?","~2 агов, засранцю. Ходімо вже, бо я засну.","~3 стоїш? Ну, постоїмо. Але недовго, курва, я тобі не пам'ятник.","~3 я почекаю. Але буду бурчати. Бур-бур-бур."],"афк_кінець":["Ворушись, ну!","Ну? Ну!","Бляха.","~1 Та здохни вже, шоб я не чекав.","~3 Ну давай уже, ну."],"мд_набіг":["^стіна Тримаюсь, тримаюсь. Дзьобом, бля, яким їм зара очі вийму.","^стіна Та хай лізуть. Згори якраз зручно в тім'я довбати.","^скільки Ти трупи рахуй, ботане, а не живих. Так веселіше ж.","^скільки Дохуя — то й добре. Жрачки буде, {м_слівце}.","^хата По наш? Шо, серйозно? Хто сунеться — додому без очей піде.","^хата Дім, бля. Я тут гніздо мостив, мостив, а ці лізуть. Ну шо за люди.","^вогонь_н Та бережу. Я на той вогонь дивлюсь, як на сало. Ніхто не візьме.","^вогонь_н Хай хтось тіко пальцем до вогню — дзьобом в око, і все, гаплик.","^страх_н Мені? Нє. Мені весело, {м_слівце}. Ти шо, зассав?","^страх_н Моторошно? Ну… трохи, бляха. Тіко не кажи нікому, бо дзьобну.","^кінець_н Шкода, курва. Я тіко розігрівся.","^кінець_н Вщухне — я три дні спатиму. Не будіть мене, ясно?"],"мд_торг":["^ціни Ти ці ціни бачив, {м_слівце}? Це ж грабіж, бля, серед білого дня!","^блискуче Он там на прилавку шось блищить. Хочу. Хочу, кажу!","^торговець {trader} на мене криво зиркає. Шо я йому зробив, га?","^торг Хай скине ціну, бо я сам скину. Разом із прилавком, нахуй.","^гроші Куди всі бабки ділися? Знов на якийсь мотлох просрали?","^подарунок А мені шо купите? Хоч кістку якусь, жмоти."],"мд_торг_кінець":["^ціни Жадібний — то торговець, ясно? А я — ощадливий. Різниця, бля.","^блискуче Корисне — нудне. Блискуче — моє. Шо тут незрозуміло?","^торговець Хай зиркає. Я теж криво вмію. І насрати можу ше раз.","^торг Мистецтво, бля. Моє мистецтво — дзьобом по пиці.","^гроші Подякую, як побачу. Поки шось не бачу ніхуя.","^подарунок Ну то я сам шось візьму. Тихенько. Ніхто й не допре."],"мд_їзда":["^швидко Отак і жити треба, {м_слівце}. Хай везе, а ми сидимо.","^швидко Шустро, бля! Аж пір'я вітер чеше. Кайф.","^сідло Висота як висота. Тіко трясе, сука, як на возі.","^сідло Я тут король, ясно? А вершник — то так, підставка.","^звір Гарний? Та він смердить, як хлів, нахуй.","^звір Звір як звір. Зате везе, а не я крильми махаю.","^куди_р А похуй куди. Аби не пішки.","^куди_р Туди, де є кого дзьобнути. Мо'. Я так думаю.","^трясе Думки? У тебе? Та їх там і не було, професоре.","^трясе Мене теж трясе, бляха-муха. Але весело ж!","^пішки Повзли, як равлики. Згадувати гидко, тьху.","^пішки Пішки — то для ссикунів. Верхи — для пацанів."],"мд_піч":["^жар Жарко, курва! Пір'я вже тліє, чуєш?","^дим_п Дим в очі, в дзьоб, у душу, бля. Всюди.","^руда_п Руду — в піч. А мені шо з того?","^чекати_п Скільки ше чекати, поки воно, бля, розплавиться?","^меч А мені з цього заліза меч скують, га?","^коваль Глянь на {name}: у сажі, як чорт із пекла. Ги-ги."],"мд_піч_кінець":["^жар Та відсунувся я. Один хуй пече.","^дим_п Терплю, бля. Закоптився весь, як ковбаса.","^руда_п Дивитися — мало. Дай хоч поклювати, жлоб.","^чекати_п Тихо я не вмію. Але чекаю, бачиш? Чекаю, курва.","^меч А я носитиму. В дзьобі. Всі обісруться.","^коваль Та не сміюся я. Ну… трохи. Ги."],"мд_бочка":["^бухло_ф Бочка, Хугіне! Бухло буде, йо-о!","^чекати_ф Скільки ж воно, бля, бродитиме? В мене вже сушняк.","^запах_ф Кислим тхне. Це добре чи хана?","^перший Перший ковток — мій. Я заслужив, ясно?","^рецепт А хто знає, шо туди сипати? Чи на око, як завжди?","^дах_ф Бочку під дах тягніть, бо дощ усе засере."],"мд_бочка_кінець":["^бухло_ф Зілля, бухло — одна холєра, якшо добре зробити.","^чекати_ф Я й без бочки дозрію. Шо ти мені тут.","^запах_ф Кисле — то міцне буде. Я шарю.","^перший Ну хай другий. Але здоровенний ковток, ясно?","^рецепт На око — то в мене око гарне. Сиплю, нахуй.","^дах_ф Я завжди діло кажу. Просто ніхто, бля, не слухає."],"мд_лагодження":["^молоток Найчесніша музика — то коли ворог верещить. Але й так нічо.","^молоток Стук-стук, бля. Голова тріщить, як горіх.","^нове_р «Майже» — то в нас по життю так.","^нове_р До першого бою — як нове. Потім знов гівно.","^подряпина Історії — в твій літопис, ботане. А залізо має бути ціле.","^подряпина Мої історії — на ворожих пиках. Шо там та подряпина.","^ламати Отак, бля, правильно. Лагодиш, шоб ламати.","^ламати Ламати — то я люблю. Це моє.","^верстак Верстак доглядає, а мене — ні. Обідно, курва.","^верстак Верстак як верстак. Стругає й стругає.","^ціле Спокійний ворон — нудний ворон. Нахуй такий спокій.","^ціле Спокійний — то ти. А я злий. Завжди."],"мд_зілля":["^ковток Хильнули! Ну шо, як воно, га?","^більше Ше ковток! За мене, ну!","^сила Чуєш силу? Я чую. Аж через плече пре, бля.","^смак Яке воно на смак? Кажи, бо мені, сука, не дали.","^запас Скільки там ше тих пляшечок лишилось?","^одін_п Як думаєш, Одін теж таку бурду п'є?"],"мд_зілля_кінець":["^ковток Та хоч яке. Аби вставило.","^більше Для забави — то інша бочка, ясно. Там я перший.","^сила У бій! Нарешті, бля! Хто перший?","^смак Мені б хоч понюхати, жмоти.","^запас Кілька — то мало. Варимо, нахуй!","^одін_п То й я буду бог. Наливай, не жмоться."],"мд_стілець":["^трон Ярл, бля. Ярл у засраних чоботах.","^трон Ярл, а я — його радник. Головний, ясно?","^ноги Ага. А ми тут сиди й нудьгуй, як дурні.","^ноги Хай сидить. Мені й на плечі нормально.","^тиша_с Чую. Стілець кривий, от і скрипить.","^тиша_с Чую. Нудьга, бляха.","^думки_с Думай-думай, професоре. А я подрімаю.","^думки_с А мені краще думається, коли когось гашу.","^довго_с Поки сраку не відсидимо, по-любому.","^довго_с Поки жрати не принесуть.","^стілець Та {name} ж. Криво, але, бля, нормально.","^стілець Без поняття. Але сидиться ж."],"мд_затишок":["^тепло_д Тепло — бо вогонь горить. А не бо вдома, ботане.","^тепло_д Тепло, курва. Аж розкис весь.","^дах_д Дах — то нормально. Аби не тік.","^дах_д Дах є, а жрачки нема. Шо за порядки?","^кубло Гніздо, бля. А яйця мої де?","^кубло Наше. Хто сунеться — в тім'я дзьобну.","^спокій_д Тихіший, бо спати хочу. Не звикай.","^спокій_д Нє, не тихіший. Я злість накопичую. Ше побачиш.","^вечеря Чую. Мені шматок, бо дзьобну, вкурив?","^вечеря Чую. Вже слина капає, йой.","^пам'ять_д Курником вона була. І досі трохи курник, чесно.","^пам'ять_д Пам'ятаю. Дірява була, як твоя голова."],"мд_трофей":["^голова Голова, курва! Дай я понесу!","^смердить Смердить дохлятиною. Мій улюблений запах, йо.","^рідкість Такий трофей не кожен день падає, шариш?","^бій_т Пам'ятаєш, як воно ревло? Аж кайфово було.","^продати А його продати можна? За блискітки якісь?","^колекція Скільки там у нас уже тих голів, га?"],"мд_трофей_кінець":["^голова Тоді хоч очі видзьобаю. Шо, теж не можна?","^смердить То несім додому — і на стіну, нахуй.","^рідкість Берегти — то я вмію. Дзьобом по рилу, хто підійде.","^бій_т Ревло гарно. Шкода, шо заткнулось.","^продати Соромно — то для лохів.","^колекція Мало. Треба ше. Дохуя треба."],"мд_стіна":["^стіна_т Росте, бля. Скоро й мене тут повісять.","^стіна_т Висить як треба. Бойовий інтер'єр, ги.","^погляд_т Хай дивиться. Я теж дивлюсь. Хто перший кліпне, га?","^погляд_т Мертві очі — найкращі. Не кліпають, не пиздять.","^криво Криво. Як і все тут, курва.","^криво Тобі здається. Око в тебе вже того, втомилось.","^гості І правильно. Хай знають, з ким мають діло.","^гості Які гості? До нас ніхто не ходить, бо ми — це ми.","^сісти Сідай-сідай. Подивлюсь, як ти гепнешся.","^сісти Я перший сяду. Я ж його валив.","^історія_т Тіко коротко. Я все одно засну на другому слові.","^історія_т Розповідай. Але головний там я, ясно?"],"мд_візок":["^рип Рип-рип, рип-рип. Цей візок мене доконає, бля.","^важко_в Шо ми там везем? Пів гори, нахуй?","^колесо Колесо хитається. Відвалиться, от побачиш. Сто пудів.","^дорога_в Дорога — ніби троль по ній срав. Ями, каміння.","^кінь Глянь на {name} — чистий кінь. Тіко без хвоста.","^сісти_в А можна я на візок сяду? Він же, бля, їде."],"мд_візок_кінець":["^рип Змастити? Чим? Твоїми порадами, розумнику?","^важко_в Важке в нас майбутнє, курва. Аж візок стогне.","^колесо Побачим. Я пильную, мені ж не похуй.","^дорога_в Ну то я полечу. А ви собі повзіть.","^кінь Та я не ображаю. Я хвалю. Як умію, бля.","^сісти_в Різниця — я на руді сиджу. Я багатий, ясно?"],"мд_город":["^насіння Чекати, бля. Знову чекати. Заїбало чекати.","^насіння А я те насіння подзьобаю, поки ніхто не бачить. Ги.","^врожай Кабанів я сам пожену. Пиздюлів їм дам.","^врожай Кабани знайдуть. Ці свині завжди знаходять, сука.","^руки_с Спокійн{ий|а}, бо нікого не валить. Отака хуйня.","^руки_с Землю колупати заспокоює? Мене — нє, нахуй.","^ягоди_с Для мене. А ти обійдешся, ботан.","^ягоди_с Ягоди — то тема. Хай чорниці садить.","^дощ_с Дощ — то мокро. Нахуя мені той дощ?","^дощ_с Та хай іде. Я під дах шмигну.","^кріт Кріт хоч смачний. Я пробував.","^кріт Кріт — то я малим. Не питай."],"пл_набіг_м":["з плеча видно, кого першого в тім'я довбати.","сиджу на тобі, як на вежі. Ріж їх!","кров аж на плече бризкає. Краса.","~1 не трусись, бо злечу, ссикло ти.","~2 з плеча бачу: їх дохуя. То й добре.","~3 я на плечі — ти в бою. Порвем їх, чуєш?","~3 тримайся. Спину твою з плеча пасу, не сци."],"пл_їзда_м":["сиджу на тобі, а ти — {mount_on}. Двоповерховий, бля, транспорт.","вітер у пику, срака трясеться.","з плеча вершника всіх видно. Кого б дзьобнути, га?","~1 трясеш, як мішок із картоплею, дурне.","~2 шустро, бля. Подобається.","~3 жени! Я тримаюсь, не ссу.","~3 оце політ без крил. Ну, майже, йо."],"пл_візок_м":["сиджу на тобі, ти тягнеш візок. Я — візник, ти — кінь. Но-о!","пихтиш мені прям у вухо, як кабан.","рип-рип, а я на плечі гойдаюсь, як дурний.","~1 тягни рівніше, бо дзьобну.","~2 ше далеко, бля?","~3 тягни, засранцю. Я ж з тобою.","~3 нормально везеш. Плече не трусить. Ну, майже."],"пл_стілець_м":["сидиш — і я сиджу. Нудьга в два рила.","плече не рипається. Подрімаю.","сидиш на стільці, як король. А я — корона, ги.","~1 сидиш, а вороги не сплять, дурне.","~2 ну шо, посидимо.","~3 добре сидимо. Як люди.","~3 сиди. Я на тобі покуняю."],"пл_затишок_м":["тепло на плечі, тепло в хаті. Розкис я.","вогонь тріщить, плече гріє. Кайф.","в хаті на тобі сидіти — найкраще, шо є.","~1 хата смердить. Але хоч тепла.","~2 добре вдома, бляха.","~3 гріюсь об тебе. Не сіпайся.","~3 наше гніздо, твоє плече. Більше нічо не треба."],"пл_торг_м":["з плеча видно: торгаш — пройдисвіт ше той.","сиджу на тобі й рахую, скільки бабла просрано.","з плеча видно, як гаманець худне. Худне, худне…","~1 купиш мотлох — дзьобну у вухо. Я попередив.","~2 бери гостре, не тупи.","~3 купи мені блискітку. Ну купи. Ну шо тобі, шкода?","~3 гарно поторгувались. Я з плеча пас."],"пл_піч_м":["з плеча пече, як у Сурта в сраці, їй-бо.","дим мені прямо в дзьоб, тьху.","сиджу на тобі й смажусь, як курча.","~1 відійди, дурне, горимо ж!","~2 жарко, бля. Але терплю.","~3 гарно гуде. Метал буде, сто пудів.","~3 тримай мене подалі від вогню. Ну, будь ласка, га?"],"пл_город_м":["нахиляєшся — а я з плеча, курва, з'їжджаю.","з плеча видно: грядки криві, як твої руки.","сиджу на тобі, а ти в гної колупаєшся. Фу.","~1 не гнись, бо злечу нахуй.","~2 сади, сади. Тіко швидше.","~3 гарно садиш. Мені ягідок, ага?","~3 з плеча кабанів попасу. Хай тіко сунуться."],"пл_зілля_м":["з плеча чую — буль-буль-буль.","мені в дзьоб пахне. Дай ковтнути, не жмоться.","хильну{в|ла}, а я тіко понюхав. Нечесно, бля.","~1 не захлинись, бо я впаду.","~2 діє, бляха. Плече аж пече.","~3 будьмо! З плеча кажу.","~3 пий. Я тут, поруч."],"пл_трофей_м":["з плеча видно — висить, як живий. Ну, тобто дохлий.","дивлюсь йому в очі. Шо, програв, лошара?","сиджу на тобі й милуюсь. Наша голова, ги.","~1 криво повіси{в|ла}. Я з плеча все бачу.","~2 гарно висить, йо.","~3 наш трофей. Я теж бився, якшо шо.","~3 з плеча — найкращий вид. Пишаюсь, чуєш?"],"знову_вступ":["Знову, курва мать.","Шо, вдруге? Серйозно?","Я ж казав. Я ж, бля, казав!","Ну от, знову те саме гівно.","Та скіко можна, га?","~1 Для глухих, сука, повторюю.","~2 Йой, знову. Ну ти глянь.","~3 Ну шо, братуха, знову ми.","Опа. Шось знайоме, бля.","Стоп. Я це вже бачив.","Ну от, пішло по колу.","Дежавю, курва.","~1 Ге, знову за своє, дурне.","~1 Скіко разів ше, хуйло?","~2 Гиги, а я знав, шо так буде.","~2 Ой-ой, другий раунд.","~3 Ну шо, ше разок, га? Я з тобою.","~3 Знову, бляха. Та хай, я вже звик до тебе."],"зн_chop":["знову рубаєш? Ліс уже, бля, ридма ридає.","уже {again_n} питаю: шо тобі ті дерева зробили, га?","ше одне дерево. Ти шо, бобер йобнутий?","~1 знову сокира. Лісоруб, хуйло, найшовся.","~2 знову рубка. Ну хоч дров дохуя буде.","~3 рубай, пацан. Тіко присядь потім, бо звалишся.","і знову хрясь. Ти колись уже нарубаєшся, га?","рубаєш уже {again_n}. Тріски, бля, в пір'ї знаходжу.","тук-тук-тук. Ше трохи, і я сам рубону — тебе.","ліс уже тебе в обличчя знає. І ненавидить, курва.","~1 знову ця сокира. Мізки б так нагостри{в|ла}, лошара.","~1 рубай-рубай. Мо', хоч дерево тебе привалить, гиги.","~2 і ше одне. Ти шо, на дрова підписа{вся|лася}?","~2 знову рубка, бляха. Тіко на мене не вали, добре?","~3 рубай, братуха. Я покричу, як шось падатиме.","~3 знову ти з сокирою. Хай, зате в хаті буде, бля, тепло."],"зн_mine":["знову гуп-гуп-гуп. В мене голова, курва, тріщить.","уже {again_n} цей гуп. Я тебе, бля, вб'ю. Чесно.","копаєш і копаєш, як кріт контужений.","~1 знову кайло. А мі гівно, яке зі мною трапляється.","~1 Обтрусився прямо на тебе. Спеціально, ге.","~2 Все, сухий. Ну, майже. Не мацай.","~2 Хочеш, ше раз обтрушусь? На біс, гиги.","~3 Сухий вже. Підставляй плече, якшо не шкода.","~3 Ну шо, {обидва|обоє} мокрі. Зате разом, бля."],"св_холод_м":["Холод, курва. Сраку собі відморожу.","Мерзну, як собака. Дай хутро якесь або вогню, не жмоться.","~3 Йди сюди. Гріємося разом. І не кажи нікому.","Дзьоб цокотить, як зуби в лошари перед бійкою.","Хто придумав цю холоднечу? Дайте мені його адресу.","Зара в бурульку перетворюсь. Будеш мною ворогів колоти.","Мороз — то для риби. А я ворон з району, бля.","~1 Тобі байдуже, шо я мерзну, ге?","~1 Плащ свій давай. Шо значить нема? Жмот.","~2 Пусти під плащ, а? Я тихо, чесне воронське.","~2 Як тобі не холодно, дурне? Чи ти вже задуб{ів|іла}?","~3 Притулюсь до тебе. Тіко без телячих ніжностей, ясно?","~3 Гріє тіко твоя шия. Ну й ти трохи, курва."],"св_вода_м":["Вода. Хоч шось тут не смердить.","Нап'юся — і знов тебе діставатиму. Йо.","~1 Відвернись. Я п'ю, нашо витріщатись?","Хлюп-хлюп. Кайф, бля.","Нап'юсь на тиждень вперед, бо з тобою хто зна, коли знову.","Помиюсь трохи. Не тобі ж одн{ому|ій} смердіти.","Шо, теж пити хочеш? Стань у чергу, пацан.","~1 Не лізь у мою калюжу, лошара.","~1 Дивишся, як я п'ю? Йди нахуй, романтик.","~2 Вода холодна, як твоє серце. Гиги, жартую.","~2 Обхлюпаю тебе зара. Не кажи, шо не попереджав.","~3 Пий теж. Бо як впадеш, тягнути не буду. Хоча... буду.","~3 Лишив тобі трохи. Жест, шариш?"],"св_бджоли_м":["Ай, бля! Курви жалючі!","Хто тут вулик поставив?! Тобі пиздець, чуєш?!","Дзьоб розпух, як дуля. Ти винн{ий|а}, по-любому.","~3 Та добре. Мед не мій. Вкурив, вкурив.","Ці смугасті суки мене ненавидять!","Хто тут найсміливіший? Не я. Валимо!","Я їм нічо не зробив! Ну, дзьобнув вулик. Раз.","Дзижчать, ніби я в них шось вкрав. Ше не вкрав!","~1 Іржеш? Ну іржи. Я цього не забуду.","~1 Ти мене сюди притягну{в|ла}, тобі й жало в сраку.","~2 Дай меду, а? Мене ж за нього покусали.","~2 Мене вжалило в дзьоб. Тепер я красунчик, гиги.","~3 Тікай, дурне, вони й тебе пожалять! Я відволічу.","~3 Мед — тобі, жала — мені. Нечесно, бля. Але бери."],"св_звір_м":["{beast} тепер моя кобила, ясно? Но-о!","Отак, {beast}. Знай, хто тут головний, бля.","~1 Не рипайся, {beast}. Я сиджу — значить, стій.","~3 Добрий звір. Майже такий злий, як я. Майже.","Ану вези, {beast}. Чайових не дам.","{beast} смердить, але я не гордий.","Гей, {beast}, ворушись, пацанам ніколи.","{beast} ше не шарить, шо я тут осяду надовго.","~1 {beast} хоч не скиглить, як ти. Вже плюс.","~1 Чуєш, {beast}? З нами тут лошара ходить.","~2 {beast} мені подобається. Не кажи нікому, бо засміють.","~2 Слухай, {beast}, давай кинем цю лошару й тікаєм. Жартую, гиги.","~3 Добрих звірів береш, ге. І ворона доброго взя{в|ла}.","~3 {beast} — свій пацан. Як і ти, бля."],"св_полювання_м":["Чайка! Моя, бля!","Ану стій, м'ясо пернате, кому сказав!","Зара я їй пір'я повисмикую, курві.","Це моє небо, курво! Моє, вкурила?","~3 Дивись, як треба полювати. Вчись, поки я живий."],"св_щогла_м":["Сиджу вгорі. Знизу смердить мокрими дошками й тобою.","Звідси все видно. Навіть як ти криво кермуєш, ага.","Хитає, курва. А мені подобається, гиги.","~3 Пливи. Я на шухері.","Сиджу на палиці посеред моря. Престижно, курва.","Внизу всі мокрі, а я король. Ну, майже сухий.","Хвиля! Тримайся, лошара, бо змиє.","Тут вітрище такий, шо дзьоб назад вивертає.","~1 Кермуй нормально, бо я тебе з висоти обісру.","~1 Не кричи мені знизу. Я тебе не чую й не хочу.","~2 Побачу морського змія — заору першим. Ти другим, гиги.","~2 Пливемо, братуха. Тіко не втопи нас, ага.","~3 Сиджу вгорі, дивлюсь за тобою. Ніхто не підкрадеться.","~3 Море — гівно, а пливти з тобою норм."],"св_земля_м":["Земля! Нарешті, бо я вже опух від цього моря.","Берег попереду. Не впиляйся, бо я тебе знаю.","Земля! Там по-любому є кого завалити.","~1 Земля. Поки ти позіхав, я вже побачив. Лошара.","Земля, бля! Нарешті, я вже рибою смерджу.","Он берег. Шо, не бачиш? Протри очі, капітане.","Суша! Буду ходити пішки, як нормальний пацан.","Берег близько. Гальмуй, бо об каміння розмажемся.","~1 Земля. Нагодуєш хоч там, чи знов голодувати?","~1 Я берег давно бачив. А ти ловиш ґав, як завжди.","~2 Земля! Ставлю дохлу рибу, шо ти знов на мілину сядеш.","~2 Бачиш? Ага. Тепер дякуй Муніну. Ну!","~3 Земля. Дов{із|езла} таки. Красава, бля.","~3 Берег. Пішли разом, я спереду, як завжди."],"св_нова_земля_м":["Земля! {land} — ти там ше не бу{в|ла}. Готуй труну, гиги.","Попереду {land}. Нові місця — нові способи здохнути. Кайф.","{land} по курсу. Там тебе ше ніхто не відпиздив. Поки шо.","~3 {land}. Ну шо, пішли. Я прикрию.","{land}! Нове місце — нові люлі. Кайф.","Опа, {land}. Зара ми там усім покажем, хто з району.","{land} попереду. Хоч би там було шо пожерти.","Там {land}, і там ти ше не обісра{вся|лася}. Поки шо.","~1 {land}. Ну все, пиши заповіт, лошара.","~1 Попереду {land}. Я полечу, а ти пливи сам{|а}.","~2 {land}! Бля, аж мурашки під пір'ям.","~2 Глянь, {land}. Цікаво, хто там перший нам наваляє.","~3 {land}. Нічо, я з тобою. Шо б там не було.","~3 Там {land}. Ну шо, братуха, вдвох не страшно."],"св_суперник_м":["Ше одна Одінова курка. Не слухай її, мене слухай.","Шо він тут каркає, га? Це моя людина, відвали.","Звалюй, поки пір'я ціле, шмаркачу.","~1 Ти шо, ше й слухаєш його? Ну ти й зрадни{к|ця}, бля.","~3 Хай каркає. Ти однаково мій, шариш?","Гей, ти, сірий, шо ти тут забув? Це наш район.","Дикий, ше й немитий. Фу, село.","Він мені підморгнув? Хай ше раз спробує — без ока лишиться.","Каркає, як недорізаний. Я й то культурніший.","~1 Можеш з ним дружити. Тіко мене потім не клич, зрадни{ку|це}.","~1 Він кращий? Ну то бери його, курва, і йди.","~2 Дивись, як я його зара відшию. Вчись.","~2 Не годуй цю шантрапу, бо я ревнивий, гиги.","~3 Хай каркає. Моя людина — це ти.","~3 Ніхто тебе в мене не забере. Ні ворон, ні хто інший, бля."],"св_одін_м":["Тихо… Батько тут. Я мовчу. Бачиш? Мовчу, як риба.","Не ляпни Йому шось, бо нас обох на корм пустять. Обох!","Вклонися, дурне. Це Він. Ну! Нижче!","~3 Він дивиться. Не осоромимось, чуєш? Тіко не при Ньому.","Ой. Це Він. Я нічо не казав, Батьку, чесно.","Тсс. Мовчу. Мовчу, кажу! Ти теж мовчи.","Старий з одним оком. Не ляпни про капелюх, бо всім кінець.","Плечі рівно, пика розумна. Хоч раз у житті.","~1 Тіко не ганьби мене перед Ним, лошара.","~1 Батьку, я не винен. Це все ця людина.","~2 Він дивиться на нас. Посміхнись, бля, тіко не дурнувато.","~2 Пам'ятаєш, шо я казав про Нього? Забудь. Негайно.","~3 Батьку, це моя людина. Нормальна, кажу.","~3 Він бачив, шо ми разом. Тепер не відкрутишся від мене."],"св_жердина_м":["Сиджу. Відчепись, га.","Звідси добре видно, хто де здохне першим. Ставлю на тебе.","Мені й тут нормально. А без тебе — взагалі кайф.","~1 Не дивись на мене. Я відпочиваю. Шо незрозуміло?","~2 Посиджу тут, поки ти знов якусь хуйню не втну{в|ла}.","~3 Гарне місце. Сідай теж. Поруч. Тіко мовчки, бо зіпсуєш.","Сиджу, як пахан на лавці. Не заважай.","Звідси плювати зручно. Шкода, нема чим.","Тут спокій. Ніхто не верещить, ніхто не помирає. Нудьга, курва.","Відпочиваю від тебе. Маю право.","~1 Йди-йди. Я тут сам посиджу, без лошар.","~1 Покличеш — може, прилечу. А може, й ні, гиги.","~2 Видно, як ти там бігаєш. Смішно, бля.","~2 Посиджу ше трохи. Не сумуй там без мене.","~3 Сиджу, а сам на тебе дивлюсь. Шоб ніхто не чіпав.","~3 Свисни — і я вже на плечі. Ти ж знаєш."],"св_могила_м":["Ось де ти {здох|здохла}. Шкода, шо не двічі. Гиги.","Сиджу на твоєму камені. Ше тепленький.","Давай, збирай свій мотлох, мерцю.","~1 Наступного разу здихай там, де мені сідати зручно.","~2 Я не плакав. Ворони не плачуть. Ну… майже.","~3 Не роби так більше. Чуєш? Ніколи, бля. Не роби.","Гарний камінчик. Подаруєш на день народження?","Сиджу на твоєму надгробку, як на троні. Кайф.","Тут лежало твоє тіло. Ну, й мозок, якшо він був.","Хто тебе так, га? Скажи, я йому очі видзьобаю.","~1 Знов {здох|здохла}. Я вже рахувати перестав, бля.","~1 Збирай своє добро, поки я сюди не насрав.","~2 Я тут стеріг твої манатки. З тебе пиво.","~2 Ну шо, ожи{в|ла}? Довго ж ти, курва.","~3 Я тут сидів і чекав. Як дурне. Бо ти мій.","~3 Ше раз так здохнеш — я тебе сам уб'ю. Ясно?"],"св_блиск_м":["Моє! Не підходь, бо дзьобну!","Блищить — значить, моє. І все.","Хто підійде — без ока лишиться. Я не жартую.","~1 Руки геть, злодюго. Відкушу.","~3 Ну… можем поділити. Мені — більше. Мені — все, якшо чесно.","Цяцька моя. Хто зазіхне — тому пиздець.","Сиджу на скарбі, як дракон. Тіко менший і зліший.","Не знаю, шо це, але воно моє, і крапка.","Дивись і заздри, лошара.","~1 Ану руки геть! Бо дзьобну.","~1 Ше крок — і будеш без пальця, бля.","~2 Хочеш подивитись? Плати. Чим? Блискучим, ге.","~2 Не роби такі очі. Не дам, хоч ти мені й кореш.","~3 Ну на, глянь. Тіко поверни, бо ображусь.","~3 Для тебе стеріг, якшо чесно. Але ше трохи потримаю."],"св_забрав_м":["Ах ти ж ворюга! Я його стеріг, курва!","Забра{в|ла}?! Ну й подавись, жмот.","~1 Злодій. Так Одіну й скажу. Все розкажу.","~3 Бери вже. Бери. Але я запам'ятав, ага.","Шо, отак взя{в|ла}? А дякую де?","Моє ж! Ну все, ти в мене в чорному списку.","Обікрали серед білого дня. Сорому в тебе нема.","Ворон стеріг, а людина вкрала. Класика, курва.","~1 Ну й гнида ти. Запам'ятаю.","~1 Я тобі ше в кашу насру за це.","~2 Гаразд, бери. Але завтра я в тебе шось вкраду, гиги.","~2 Ти шо, сорока? Все блискуче тягнеш.","~3 Бери, бля. Для тебе ж і стеріг.","~3 Добре, хай твоє. Тіко не загуби, бо приб'ю."],"св_табличка_м":["«{sign}». Ну написано. І шо?","Тут нашкрябано «{sign}». Курка лапою рівніше виводить, їй-бо.","«{sign}». Хто таке пише — тому дзьобом в тім'я.","«{sign}». Я думав, там шось пожерти. Пиздеж, а не дощечка.","Прочитав: «{sign}». Ше раз змусиш — зжеру дощечку.","«{sign}». Нашо тобі стіко дощечок, га?","~1 «{sign}». Тьху. Нашо мені твої каракулі, бля.","~1 «{sign}». Ногою писа{в|ла}? Лівою? Видно.","~1 «{sign}». Сяду й насеру поруч. Для краси.","~2 «{sign}». Ну прочитав. Задоволен{ий|а}? Відчепись.","~2 «{sign}». Хоч якийсь порядок у твоєму свинарнику.","~3 «{sign}». Путня дощечка. Скажеш комусь, шо я хвалив, — уб'ю.","~3 «{sign}». Ну добре, {name}. Розумно придумано, бляха."],"св_ягоди_м":["Мої ягоди. Не підходь, кому сказав.","Кислятина, тьху. Але жерти можна.","Хап! Ше хап! Не відволікай, бля.","Ягоди — то тобі не твоя сушена риба, шо аж смердить.","~1 Шо витріщи{вся|лась}? Голодний я, не бачиш?","~1 Кущ мій. Іди свій шукай.","~2 Ше трохи — і полечу назад. Мо'.","~2 Нічо так. Майже як кишки, тіко солодше.","~3 Дивись, як клювати треба. Вчись, поки я добрий.","~3 Тобі не дам. Хіба одну. Ну дві. Ну все, бля, бери."],"звір":["ПРОКИДАЙСЯ, ЗВІРЕ! РВИ ЇХ НАХУЙ!","РОСТИ, СУКА, РОСТИ! ХАЙ БАЧАТЬ, НА КОГО ПОЛІЗЛИ!","Все, ти тепер не людина. Ти — моя лють на двох ногах, шариш?","Рви, топчи, ламай, бля! Я за плече тримаюсь!","~2 Нарешті, курва! Давно хотів глянути на тебе справжн{ього|ю}!","~2 Звір у тобі давно шкрябався. Шо, випускаю? Випускаю!","~3 Ми з тобою одна лють. Одна, чуєш? Іди рви!","~3 Я тримаюсь. Ти — гатиш. Все просто."],"звір_кінець":["Все, звір здувся. Тепер ти — ганчірка мокра. Відсапуйся.","Зду{вся|лася}, ге? Дихай, бо ноги підкосяться, а я тебе не понесу.","Звір заснув. А ти тепер як курка після дощу. Гиги.","~2 Ну шо, попустило? Сядь, відсапайся.","~3 Добре ми їх порвали. Дихай, я постережу. Нікого не підпущу.","Ну шо, знову людського розміру? А я вже звик дивитись на тебе знизу.","Ото й усе, звір пішов спати. А ти, бля, як лантух з картоплею.","Шо, руки трусяться? То звір з тебе все висмоктав, гиги.","{Був|Була} велетень, {став|стала} дрищ. Ото фокус.","~1 Сопиш, як старий кабан. Сором на весь район.","~1 Відпустило? Тепер ти знов звичайна дрібнота, гиги.","~2 Бачи{в|ла}, як вони від тебе тікали? Оце було кіно!","~2 Попий води, бо висохнеш нахуй.","~3 Отакий розмір мені рідніший. Але й велетень з тебе був шо треба.","~3 Лягай, відпочинь. Я посиджу поруч, хай тіко хто сунеться."],"мат_вигук":["КУРВА МАТЬ!","СУКА!","ЙОБ ТВОЮ МАТЬ!","ПИЗДЕЦЬ!","ОХ ТИ Ж НІХУЯ СОБІ!","ТРЯСЦЯ ВАШІЙ МАТЕРІ!","ЇБАНИЙ ЦИРК!","АНУ, СУКИ!","ЙОБАНИЙ В РОТ!","НУ, КУРВА!","ОТ СУКИ!","ХУЯК!","ЙО-О-О, СУКИ!","БЛЯХА-МУХА!","ХОЛЄРА ЯСНА!"],"мат_прикм":["СМЕРДЮЧІ","ДРИСЛИВІ","ЙОБАНІ","ЗАСРАНІ","ПРОТУХЛІ","КРИВОРУКІ","СРАНІ","ВОНЮЧІ","ЙОБНУТІ","ТУПОРИЛІ","ЗАСМАРКАНІ","ОБСРАНІ","ПАДЛЮЧІ","СУЧІ","ГІВНЯНІ","ПРИДУРКУВАТІ","ПЛІСНЯВІ","ПРИБИТІ"],"мат_прикм2":["БЕЗМОЗКІ","ПАРШИВІ","ВОШИВІ","ЛИСІ","БЕЗЗУБІ","ЗАДРИПАНІ","ПУЗАТІ","ССИКЛИВІ","КРИВОНОГІ","ОБІСЦЯНІ"],"мат_імен":["ПАДЛЮКИ","ГІВНОЇДИ","КУРВЕНЯТА","ПИЗДЮКИ","ЗАСРАНЦІ","МУДИЛА","ДОВБНІ","ВИПЕРДКИ","ГІВНЮКИ","ЛОШАРИ","МУДАКИ","ГНИДИ","ДОВБОЙОБИ","ВИРОДКИ","СМЕРДЮХИ","ТЕРПИЛИ","СУЧАРИ","ХУЙЛА","ЇБАНЬКИ"],"мат_побаж":["ШОБ ВИ ВСРАЛИСЯ ВІД СТРАХУ","ШОБ ВАС ТРОЛЬ ПОТОПТАВ","ІДІТЬ НАХУЙ СТРОЄМ","ШОБ ВАШІ КИШКИ ВОРОНИ ДОЇДАЛИ","ДІДЬКОВІ ВАС У СРАКУ","ШОБ ВАМ ЯЙЦЯ ДВЕРИМА ПРИЩЕМИЛО","ШОБ ВАМ ДЗЬОБОМ ПО ТІМ'Ї","ШОБ ВАМ ПИЗДЮЛІВ ВІДВАЛИЛИ ПОВНУ ТАЧКУ","ШОБ ВАС ДОМА НІХТО НЕ ЧЕКАВ","НАСЕРУ ВАМ НА ГОЛОВИ","ШОБ ВИ ГІВНОМ ЗАХЛИНУЛИСЯ","ЛІЗЬТЕ НАЗАД У СРАКУ, ЗВІДКИ ВИЛІЗЛИ","ШОБ ВАМ ПОВИЛАЗИЛО","ШОБ ВАМ НІ ДНА НІ ПОКРИШКИ"],"мат_кінець":["НА ФАРШ ВАС!","ВСІХ ПОРВЕМО НАХУЙ!","ПИЗДЕЦЬ ВАМ, ХЛОПЦІ!","Я ВАС ЖЕРТИ БУДУ!","ГАПЛИК ВАМ, СУКИ!","ТІКАЙТЕ, БО ПОВБИВАЮ!","ОЧІ ПОВИКЛЮЮ!","В ТАБЛО ВСІМ!","НАСЕРУ НА ВАШІ ТРУПИ!"],"звір_вигук":["А-А-А-А-А!","РРРА-А-А!","ГА-А-АРХ!","ХА-ХА-ХА-ХА!","УА-А-АРГХ!","КРА-А-А-А!","ЙО-О-О-ОХ!","КРОВІ!","М'ЯСА!","ГРА-А-А!","Ох ти ж бля, ох ти ж!","Г-Г-Г-ГРРР!","ГА-ГА-ГА, СУКИ!","ОЦЕ КАЙФ!"],"звір_лють":["РВИ ЇХ НАХУЙ НА ШМАТКИ!","ТОПЧИ, ПОКИ ПИЩАТИ НЕ ПЕРЕСТАНУТЬ, БЛЯ!","ХТО ТУТ ШЕ ЖИВИЙ?! ВИПРАВ ЦЮ ХУЙНЮ!","Я ЇМ ОЧІ ВИДЗЬОБАЮ, А ТИ — ВСЕ ІНШЕ!","ДАЙ МЕНІ ЇХНІ КИШКИ! НА ШАРФИК!","ВСІХ! ВСІХ, БЛЯ! ДО ОДНОГО!","ШО ТИ СТА{В|ЛА}?! ЛАМАЙ!","З ЇХНІХ ЧЕРЕПІВ ГНІЗДО ЗРОБЛЮ, ЧУЄШ?!","ШЕ! ШЕ! МАЛО МЕНІ, СУКА!","ТІКАЮТЬ, ССИКЛА! ТАК ШЕ ВЕСЕЛІШЕ!","ОДІН ДИВИТЬСЯ! ВЛАШТУЙ ЙОМУ М'ЯСОРУБКУ!","ТИ ЗВІР! Я ЗВІР! МИ ДВА ЙОБНУТИХ ЗВІРІ!","ДЕ ВОНИ, БЛЯ?! ДАЙ КОГОСЬ ПОРВАТИ!","ТРОЩИ КІСТКИ! ХАЙ ХРУСТЯТЬ, ЯК СУХАРІ!","НЕ ЖАЛІЙ! ВОНИ Б ТЕБЕ ХУЙ ПОЖАЛІЛИ!","РОЗМАЖ ЇХ ПО ЗЕМЛІ, ЯК ГІВНО ПО ЧОБОТУ!","Я АЖ ПІР'Я НА СОБІ РВУ, ТАК МЕНІ ДОБРЕ!","ВОРОГИ?! ДЕ?! Я ЇХ СРАКОЮ ЧУЮ!","КРОВІ ХОЧУ! ЧУЄШ?! КРОВІ, БЛЯ!","З МЕНЕ ЛЮТЬ АЖ З ДЗЬОБА КАПАЄ!","ТЕПЕР ТУТ МИ ГОЛОВНІ, ВКУРИЛИ?!","Я ЇХ ЗЖЕРУ! СИРИМИ! З ЧОБОТЬМИ!","ХАЙ ВЕСЬ МІДҐАРД ЧУЄ, ЯК ЦІ ПАДЛЮКИ ВЕРЕЩАТЬ!","ГАТИ ТАК, ШОБ ЗЕМЛЯ ТРІСНУЛА!","ДУМАЛИ, ТИ СЛАБ{АК|АЧКА}?! ПОКАЖИ ЇМ, СУКАМ!","ТИ Ж ТЕПЕР ЯК ХАТА! ЇБАШ ЗВЕРХУ!"],"звір_вбивство":["ГОТОВО! ДАВАЙ НАСТУПНОГО!","РОЗМАЗАЛИ! ОЦЕ КРАСА, КУРВА!","ХРУСЬ! ОТО МУЗОН!","ЛЕЖИ Й НЕ РИПАЙСЯ, ПАДАЛЬ!","МІНУС ОДИН! ХТО ШЕ, СУКИ?!","ФАРШ! ЧИСТИЙ ФАРШ!","ШЕ СІПАЄТЬСЯ?! ДОБИЙ, ДОБИЙ ЙОГО!","ХА! ОДИН ПИСК — І НЕМА!","ВАЛЬКІРІЇ, ЗАБИРАЙТЕ ЦЕ ГІВНО!","ПОКЛАЛИ! ЛЮБЛЮ ТЕБЕ, ЙОБАНА ТИ ПОТВОРО!","ШЕ ТЕПЛЕНЬКЕ! ДАЙ ДЗЬОБНУ!","ЗРОБИ ТАК ШЕ! ШЕ РАЗ, БЛЯ!"],"звір_бос":["ТУШУ ПОКЛАЛИ! ВЕЛИКУ, БЛЯ, ТУШУ! ЧУЄШ?!","ХАЙ ОДІН ЗАПИШЕ: МИ ЦЮ ХУЙНЮ ЗАДАВИЛИ!","ГОЛОВУ! ГОЛОВУ ЙОГО МЕНІ, ШВИДКО!","ОТАК ВАШІ БОГИ ПАДАЮТЬ, ЛОШАРИ!","ВЕЛЕТЕНЬ? ТЬФУ! КУЧА М'ЯСА Й ГІВНА!"],"звір_біль":["ВОНО ТЕБЕ ВДАРИЛО?! ВБИЙ ЙОГО ДВА РАЗИ, СУКУ!","ТВОЯ КРОВ?! ХАЙ, ПАДЛЮКИ, СВОЄЮ ЗАПЛАТЯТЬ!","ХТО, БЛЯ?! ХТО ПОСМІВ?! ОЧІ ВИДЗЬОБАЮ!","БОЛИТЬ? ТО Й ДОБРЕ, КУРВА! ЗЛІШЕ БУДЕШ!","НЕ ПАДАЙ, ЧУЄШ?! ЗВІРІ НЕ ПАДАЮТЬ!","ВОНО ТЕБЕ ПОДРЯПАЛО?! ПОРВИ ЙОГО НАХУЙ!","ТА ЦЕ ПОДРЯПИНА! РВИ ДАЛІ, НЕ НИЙ!","ПОВЕРНИ ЙОМУ В СТО РАЗІВ! В ТАБЛО!","ВОНО ПОШКОДУЄ, ШО ВЗАГАЛІ ВИЛУПИЛОСЬ!"],"звір_удар":["ШЕ!","ГАТИ!","В ТАБЛО!","ЛАМАЙ!","ОТАК, БЛЯ!","ТАК ЙОМУ, ПАДЛІ!","СИЛЬНІШЕ!","ДОБИВАЙ!","ПО СУСАЛАХ!","ХРЯСЬ!","ШЕ РАЗ! ШЕ!","ОТО ВРІЗА{В|ЛА}, КУРВА!"],"звір_матюк":["СУКА!","КУРВА МАТЬ!","ПИЗДЮЛІВ ЇМ!","ПИЗДЕЦЬ ЇМ!","НАХУЙ ЇХ УСІХ!","ХУЙ ЇМ, А НЕ ПЕРЕМОГА!","КУРВИНІ ДІТИ!","ГІВНОЇДИ!","ПИЗДЮКИ ДРИСЛИВІ!","ЇБАШ ЇХ!","СРАКИ ЇМ ПОРВИ!","ЗАЇБІСЬ, КУРВА!","ДІДЬКОВІ ЇХ У СРАКУ!","ЇХНЮ МАТИР!","ПОВНА ПИЗДА ЇМ!","ГІВНЮКИ ЙОБАНІ!","ЇБАНІ ПАДЛЮКИ!","ХУЙЛО НЕДОРІЗАНЕ!","ЙОБАНА ХОЛЄРА!","ШОБ ВОНИ ВСРАЛИСЯ!","КИШКИ ЇМ НА КУЛАК!","ХУЙНЯ ЯКАСЬ, А НЕ ВОРОГИ!"],"заслона":["Я СПЕРЕДУ! ХАЙ ТІКО СУНУТЬСЯ, СУКИ!","Руни виставив. Хай гатять — я прийму. Мені похуй.","Ну давай, підходь, хто тут такий сміливий, га?","Спереду я прикрию. А спину, бля, стережи {сам|сама}.","Перший удар — мій. А другого вони, курва, не встигнуть.","~2 Ховайся за руни, дурне, і не вищи.","~2 Йди вперед. Шо тобі в пику полетить — я зловлю.","~2 Крило тримаю. Тіко сраку не підставляй — туди не дістану.","~3 Ніхто тебе пальцем не торкне, поки я руни тримаю. Ніхто, чуєш?","~3 Я перед тобою. Як завжди, ну. Куди ж я дінусь.","~3 Гати сміливо. Шо прилетить — то вже мої проблеми.","Руни горять! Ану, хто перший у пику хоче?","Стіна стоїть. Хай б'ються в неї лобом, дурні.","Оце моя стіна, сука, і через неї ніхто не пройде!","Тримаю! Ти тіко не стій, а дубась їх.","~1 Прикрию. Не тому шо люблю, а бо без тебе нудно.","~1 Ховайся, лошара. Бо мені ше тебе з Вальгалли виколупувати.","~2 Ге, глянь, яку стінку я тобі зліпив! Шо скажеш?","~2 Гати з-за мене. Шо прилетить — віддам назад з процентами.","~3 Поки я живий — до тебе ніхто не дотягнеться. Отак.","~3 Стою перед тобою, як скеля. Ну, як дуже мала скеля з пір'ям."],"заслона_тріск":["Тріснула, зараза, але тримає!","Шо, отримало, падло? Ану ше раз спробуй!","Ха! Відбив! А ти й не {скривився|скривилась}, гиги!","~2 Ше тримає. Тіко не розслабляйся, чуєш?","~2 Тримається, курва! Тримається, ти глянь!","~3 Руни гудуть, але стоять. Я тут, з тобою. Не сци.","Ой бля, аж у дзьобі задзвеніло! Але стоїть!","Хто там стукає? Зачинено, гиги!","Одну руну збили, ше є!","Тріщить, як лід навесні, але не ламається.","~1 Ну от, через тебе мені крило мало не відбили. Дякую, лошара.","~1 Шо ти стоїш, як пень? Мене ж лупцюють!","~2 Та фігня, подряпина. Гати далі!","~2 Ото вгатило! Аж пір'я дибки. Але я ше тут.","~3 Не дивись на мене, я в порядку. Дивись на них.","~3 Хай б'ють. Краще в мене, ніж у тебе."],"заслона_злам":["Розлетілась, сука, на друзки! Далі {сам|сама}!","Все, крило відбили, падли. Тепер обережно, бля!","Все на себе прийняв! Більше нема чим, хоч убий!","~2 Заслони нема. Не лізь на рожен, дурне.","~2 Розбили, падлюки. Але ти {цілий|ціла}, а це головне, бля.","~3 Я своє відпахав. Тепер ти — давай своє.","Розбили, гади! Але я своє, бля, відстояв.","Руни посипались, як зуби в бійці. Тікай чи бий — вирішуй!","Все, нема стіни. Тепер ти гол{ий|а}, гиги.","Крило гуде, як дзвін. Більше не втримаю.","~1 Ну шо, довоюва{вся|лася}? Тепер викручуйся як знаєш.","~1 Я тобі не вічна стіна, дурне. Далі {сам|сама} крутись.","~2 Зламали, курва. Але гавкати я ше можу.","~2 Ге, не панікуй. Відійди трохи, віддихайся.","~3 Вибач, більше не можу. Але я тут, з тобою.","~3 Стіни нема, а я є. Значить, ше повоюємо."],"заслона_кінець":["Все, руни потухли. Далі {сам|сама}, я пас.","Крило затерпло нахуй. Заслони більше нема.","~2 Шо, ніхто й не вдарив? Тримав, тримав, як дурень, — і нашо?","~2 Руни розсипались. Тепер під ноги дивись, а не на мене.","~3 Трохи відсапаюсь — і знову стану перед тобою. Слово пацана.","Руни догоріли. Шо могли — зробили.","Час вийшов, стінка зникла. Не скигли.","Відбій, руни пішли на перекур.","Тримав, скіки міг, бля. Більше не проси.","~1 Все, безкоштовний захист скінчився. Далі за гроші.","~1 Заслони нема. Тепер побачимо, як{ий|а} ти без мене.","~2 Руни згасли. А шкода, я тіко розійшовся.","~2 Ох, крило гуде. Помасажуєш потім, ге?","~3 Руни згасли, але я ж нікуди не дівся. Поруч.","~3 Відпочину хвильку. Ти тіко без мене не геройствуй."],"дор_приніс":["Старий знов шось хоче. На, я передав, моє діло — сторона.","Одін сказав — я приніс. Тепер ти мучся, а я подивлюсь.","Нова справа від Одіна. З кровʼю, бля! Оце я розумію.","Слухай сюди, бо вдруге я нахуй не полечу.","~1 Одін дав справу. Обісрешся — мені від нього потім пиздюлі, вкурив?","~2 Справа є. Руки є. Ну і шо ми стоїмо, як два дурні?","~3 Старий знає, кого просити, братан. Пішли шось порвем."],"дор_поступ":["Ше! Ше давай, ну!","О, оце розмова. Наступного сюди.","Рахую. Мало, бляха. Мало!","Шо, втоми{вся|лася}? А хто тобі казав, шо вже кінець?","~1 Ти як равлик після медовухи. Шевелись, мудило.","~2 Ну нормально. Але можна й швидше, га?","~3 Гарно рубаєш, братан. Тіко не зупиняйся."],"дор_крок":["Одне є. Тепер друге, і не кисни мені тут.","Пів діла є. Друга половина сама себе не вбʼє, шариш?","Ну от. Дальше буде веселіше. Мо'.","~2 Пішло діло, курва. Дальше.","~3 Так і тримай. Наступне, ну."],"дор_близько":["Кровʼю тхне. Ми близько, по-любому.","Тут. Зброю в руки, і не лови гав.","Воно десь тут, сука. Жопою чую.","Тихо… Тут хтось є. Тихо, кажу!","~2 Роззирнись, сліпе ти кошеня. Воно тут, бля.","~3 Ми на місці, братан. Ща ми йому покажем."],"дор_виконано":["Готово! Хай Одін знає, з ким, бля, має діло.","Зроблено. Тепер медовухи, і не сперечайся.","Ше одна зарубка. Скоро руна засвітиться, сто пудів.","Ну от. А ти, ссикло, боя{вся|лася}, як мала дитина, га?","~1 Зроби{в|ла}?! Ну ніхуя собі. Здивува{в|ла}, лошара.","~2 Нормально. Хоч на шось ти годишся, виходить.","~3 Оце мій кент. Пишаюсь. Тіко нікому не пизди."],"дор_відмова":["Відмови{вся|лася}? Ссикло. Ну, завтра буде інше.","Тьху. Нашо я, дурний, літав.","Шо, засса{в|ла}? Та й хуй з ним, завтра.","~3 Твоє діло, братан. Але наступне — не відкручуйся, бо дзьобну."],"сит_портал_м":["шо, не пускає? Бо руду, бля, тягнеш, а портал не віслюк.","ото облом! Тепер пішки, з цим залізом, через пів світу, курва.","руду через дірку Одін не пускає. Шось знав старий, сука.","гиги! Ти шо, дума{в|ла}, шо мідь сама полетить? Весла в руки.","портал тобі дулю скрутив. І я б скрутив, якби мав пальці.","~1 тягни тепер, лошара. Кораблем, ногами, хоч на сраці їдь.","~1 скіко можна на ті самі граблі, га? Руду в скриню, дурне.","~1 і шо ти дивишся на ту дірку? Не пустить. Хоч плач, хоч, бля, танцюй.","~2 ну шо, братуха, морська прогулянка? Я на щоглі, ти на веслах.","~2 йой, облом. Ну нічо, руда не втече, а ми, бля, довеземо.","~2 залізо не пускає, а я пролізу. Шо, кинеш руду і полетимо по пиво?","~3 не сци, братан. Довеземо твою руду, я дорогу покажу.","~3 ну й хрін з тим порталом. Пішки, зате разом, пацан.","~3 тягни, тягни. Втомишся — скажи, я хоч крилом помахаю для підтримки."],"сит_злам_м":["тресь! І капут. Ти шо, по скелях гати{в|ла}, курва?","прощавай, {broke}. Ну, і хто тепер лошара?","{broke} — усе, бля. Можна ховати.","гиги, хана. До верстака бігом, поки ше шось не відвалилось.","а лагодити хто буде, Одін? Ти ж ніколи не лагодиш, сука.","~1 зламати навіть залізяку зумі{в|ла}. Талант, бля.","~1 ото руки. Шо їм не дай — усе в друзки, лошара.","~1 і шо тепер, голим задом битимешся? Тьху.","~2 {broke} — на пенсію. До кузні, братуха, там підлатають.","~2 тріск, бляха! Нічо, на верстаку все підлатаємо.","~2 я ж казав: лагодь заздалегідь. Але хто ж мене, курва, слухає?","~3 не біда, пацан. Нове склепаєш, ше краще буде.","~3 хай ламається залізо, аби не ти. Ти мені, бля, потрібніш{ий|а}.","~3 тихо, без паніки. Тримайся за мене, і бігом до кузні."],"сит_приручення_м":["шо, тепер {tamed} у нас? А мене на кого, курва, проміня{в|ла}?","ну все, приручи{в|ла}. Тепер ше одна паща, яку годувати, бля.","гиги, нова худобина в районі. Тіко на моє плече хай не лізе.","смердиш тепер {tamed_ins}, сука. Відійди на три кроки.","оце друг? Я з {tamed_ins} у розвідку не піду, бля.","~1 нарешті хтось твого рівня, гиги. Мізків — як у {tamed_gen}.","~1 приручи{в|ла} тварюку, а мене — ніяк. Бо я, курва, гордий.","~1 годуй, годуй ту скотину. А ворон хай здохне, так?","~2 ну, хай буде. Тіко я тут старший, і хай {tamed} це, бля, знає.","~2 о, пацанва на районі прибуває. Ше трохи — і банда, бляха.","~2 нічо так звірюка. Але шерсть — не пір'я, хай не задається.","~3 добре зроби{в|ла}, пацан. Шо більше зубів за тебе, то мені спокійніше.","~3 гаразд, хай живе. Але на плечах у тебе — тіко ми, чуєш? Тіко ми, бля.","~3 ти тепер як Одін: і ворони, і звір при нозі. Пишаюсь, курва."],"сит_мороз_м":["брр! Дзьоб, курва, примерз. Де твій мед від морозу?","шо, в трусах у гори полі{з|зла}? Генія, бля, видно здалеку.","вогню давай! Хоч свічку, хоч сраку підпали, аби тепло.","я тобі не грілка, чуєш? Хоча... притулись, бо здохнемо обоє.","ото холодрига! Вовчу шкуру б тобі зара, а не ці лахи, сука.","~1 мерзнеш? Так тобі й треба, лошара. Мед вари наперед.","~1 замерзнеш — станеш бурулькою, а я на тобі сидітиму й сміятимусь.","~1 соплі вже бурульками висять. {Красень|Красуня}, курва.","~2 зуби цокають, як кастаньєти. Бігом до вогню, братуха.","~2 пір'я дибки, дзьоб синій. Шо, мед від холоду забу{в|ла}, бляха?","~2 холодно, курва мать! Розпали багаття, я дрова носитиму. Ну, словами.","~3 тримайся, пацан. Я ближче до шиї сяду, гріти буду.","~3 не спи, чуєш? Не спи, бля! До вогню, зара ж.","~3 мерзнеш, дурне... На, бери пір'їну, хоч вухо прикрий."],"сит_отрута_м":["о, позелені{в|ла}! Гарний колір, як болотяне гівно.","блюй убік, не на мене! Курва, пір'я ж!","отрута, бля. А мед від отрути де? В скрині лежить, як завжди?","шо ти лизну{в|ла}, га? Зізнавайся, шо ти лизну{в|ла}!","смердиш, як п'явка з болота. Тримайся подалі від тої зеленої гидоти, сука.","~1 труїшся, а я дивлюсь. Найкраще кіно в районі, гиги.","~1 ну й хто полі{з|зла} в болото без меду? Ти, лошара. Ти.","~1 здохнеш від зеленої соплі — ото буде, бля, сага.","~2 тьху, гидота. Відкашляйся, братуха, і бігом із цього болота.","~2 йо, ти зелен{ий|а}, як жаба. Не помирай, бо хто ж мене годуватиме?","~2 знову ця зелена гидота. Мед від отрути, курва, вари вже, га?","~3 дихай, пацан. Дихай. Минеться, я тут.","~3 ану їж шось, швидко! Не здумай мені тут здохнути, бля.","~3 тримайся за мене. Виведу з цього гівна, слово ворона."],"сит_вогонь_м":["горимо! ГОРИМО, курва! У воду, бігом!","падай і качайся, дурне! Як колода, ну!","пахне смаженим. Це ти, бля. Це ти смажишся.","у багаття вліз{|ла}? Ногами? Ну ти й геній, сука.","моє пір'я! Моє пір'я тліє! Гаси себе, курва, і мене!","~1 палає, як свічка в Одіна на бенкеті. Гиги, гарно.","~1 я злітаю, а ти смажся сам{|а}, лошара.","~1 ото вогник! Хоч раз від тебе тепло, бля.","~2 качайся, качайся! Ну от, вже менше диму. Нашо в той вогонь пхатись?","~2 мед від вогню, братуха!     p.push({ who: Math.random() < 0.5 ? 0 : 1, to: -1, tag: 'x_join_reply', chance: chattyOf(kind) });
  }
  p.push({ who: 0, to: 1, tag: 'x_' + kind + '_close', chance: chattyOf(kind) });
  return p;
}
function fillFor(text, sp, ad) {
  let t = text.replace(/\{>([^{}|]*)\|([^{}|]*)\}/g, (m, x, y) => ad.female ? y : x).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (m, x, y) => sp.female ? y : x);
  const v = values({ name: sp.owner, friend: ad.owner, raven: ad.nick, addr: CALLS[ad.nick] || ad.nick, me: sp.nick, kin: ad.kind === 'h' ? 'Хугін' : 'Мунін' });
  t = t.replace(/\{([\w\u0400-\u04FF_]+)\}/g, (m, k) => v[k] != null ? '\u0001' + v[k] + '\u0002' : '\u0003' + m + '\u0004');
  t = t.replace(/\s+/g, ' ').replace(/\s+([,.!?…:;])/g, '$1').trim();
  t = t.replace(/([.!?…]\s+)([a-zа-яіїєґ'])/g, (m, x, y) => x + y.toUpperCase());
  if (t.length) t = t[0].toUpperCase() + t.slice(1);
  return esc(t).replace(/\u0001/g, '<span class="nm">').replace(/\u0002/g, '</span>').replace(/\u0003/g, '<span class="ph">').replace(/\u0004/g, '</span>');
}
function scene(d, kind, n) {
  const box = talkBox(d);
  for (let run = 0; run < 3; run++) {
    const people = PEOPLE();
    const ravens = [];
    for (let i = 0; i < n; i++) { const k = Math.random() < 0.5 ? 'h' : 'm'; ravens.push(Object.assign({ kind: k, nick: NICKS[k][i] }, people[i])); }
    let html = '', thread = null, joined = -1; const said = [];
    threadWant = null;
    for (const st of planOf(kind, n)) {
      const join = st.tag.endsWith('_join'), answer = st.tag === 'x_join_reply';
      if (answer && joined < 0) continue;
      if (Math.random() > st.chance) { if (join || answer) continue; break; }
      const to = answer ? joined : st.to;
      if (to === st.who) continue;
      const sp = ravens[st.who], ad = ravens[to];
      threadWant = thread; threadGot = null; threadNext = null;
      const ts = curTpl(sp.kind, st.tag).filter(toneOk).map(strip).filter(chanceOk).map(unchance);
      if (!ts.length) continue;
      let line = expand(sp.kind, pick(ts));
      for (let tries = 0; tries < 4 && said.includes(line); tries++) { threadGot = null; threadNext = null; line = expand(sp.kind, pick(ts)); } // as the game: not the same words twice in a talk
      said.push(line);
      if (threadNext != null) thread = threadNext; else if (thread == null && threadGot != null) thread = threadGot;
      html += '<div><span class="who-' + sp.kind + '">' + sp.nick + ' (' + esc(sp.owner) + ')</span> <span class="note">→ ' + ad.nick + ':</span> ' + fillFor(line, sp, ad) + '</div>';
      if (join) joined = st.who;
    }
    box.innerHTML += html + '<div class="note">тема: ' + esc(thread || '—') + '</div><hr style="border-color:var(--line)">';
  }
  threadWant = null;
}
function talkBox(d) {
  let box = d.querySelector('.talk');
  if (!box) { box = document.createElement('div'); box.className = 'talk'; d.appendChild(box); }
  box.innerHTML = '';
  return box;
}

// ---- the changes, in the phrase files' format
function exportText() {
  const out = [];
  for (const r of ['h', 'm']) {
    const mine = Object.keys(edits).filter(k => k[0] === r);
    if (!mine.length) continue;
    out.push('# ===== ' + (r === 'h' ? 'Хугін (hugin_patterns.txt)' : 'Мунін (munin_patterns.txt)'));
    for (const k of mine) {
      const key = k.slice(1);
      if (key[0] === '[') { const tag = key.slice(1); for (const l of edits[k].split('\n').map(s => s.trim()).filter(Boolean)) out.push('[' + tag + '] ' + l); }
      else { out.push(key); for (const l of edits[k].split('\n').map(s => s.trim()).filter(Boolean)) out.push(l); }
      out.push('');
    }
  }
  return out.length ? out.join('\n') : '(змін нема)';
}
function updateCount() { const n = Object.keys(edits).length; document.getElementById('nChanged').textContent = n ? '(' + n + ')' : ''; }

document.getElementById('built').textContent = 'зібрано ' + DATA.built;
document.getElementById('q').oninput = () => render();
for (const id of ['tier', 'gMe', 'gFr', 'nMe', 'nFr']) document.getElementById(id).onchange = () => render();
document.getElementById('again').onclick = () => render();
document.getElementById('export').onclick = () => { document.getElementById('exportText').value = exportText(); document.getElementById('exportBox').style.display = 'flex'; };
document.getElementById('close').onclick = () => { document.getElementById('exportBox').style.display = 'none'; };
document.getElementById('copy').onclick = () => { const t = document.getElementById('exportText'); t.select(); navigator.clipboard ? navigator.clipboard.writeText(t.value) : document.execCommand('copy'); };
document.getElementById('reset').onclick = () => { if (confirm('Скинути всі твої зміни?')) { edits = {}; saveEdits(); render(); document.getElementById('exportText').value = exportText(); } };
updateCount();
render();
</script>
