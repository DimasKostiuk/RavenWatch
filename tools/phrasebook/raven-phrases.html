"~3 {land}. Гарно бачити це з тобою. Не звикай."],"св_суперник":["Це не мій родич. Не слухай його, він бреше.","Ще один ворон. Я кращий. Без питань.","Він тобі нічого нового не скаже. Я вже сказав.","~1 Не балакай з ним. Він і двох слів не зв'яже.","~3 Хай каркає. Плече все одно моє.","Дикий ворон. Ні освіти, ні манер.","Каркає без сенсу. Я хоч каркаю по ділу.","Не годуй його. Потім не відчепиться.","Дивись, він навіть пір'я не чистить. Жах.","~1 Іди до нього. Побачимо, куди він тебе заведе.","~1 Навіть не думай мене з ним порівнювати.","~2 Ревнощі? У мене? Ні. Просто він гірший.","~2 Він косо дивиться. Я дивлюсь ще косіше. Нічия.","~3 Хай летить. Я при тобі. Хтось же мусить.","~3 Хай заздрить. У нього нема свого роззяви."],"св_одін":["Тихо. Це Він. Не роби дурниць.","Батьку, ось {наш|наша}. Так, оце. Ми стараємось.","Не дивись Йому в око. Він і так усе бачить.","~3 Він бачить, що ми з тобою. Не підведи нас.","Капелюх, плащ, одне око. Помилитись неможливо.","Він мовчить. Ми мовчимо. Ти теж помовчи.","Батько дивиться. Хоч сьогодні не будь посміховиськом.","Я Йому доповім. Потім. Пошепки.","~1 Не вдавай, що Його не бачиш. Він це помітить.","~1 Ну от, Він тут, а ти знов у такому вигляді.","~2 Він кивнув? Здається, кивнув. Це вже щось.","~2 Стій рівно. Рота не відкривай.","~3 Батьку, оце моя морока. Але добра морока.","~3 Він знає, що я з тобою не з наказу. Вже ні."],"св_жердина":["Звідси видно краще. Особливо твої помилки.","Посиджу тут. Подивлюсь, скільки ти без мене протримаєшся.","Гарне місце. Тихе. Не те що твоє плече.","~1 Не кличу. Сиджу. Не заважай.","~2 Звідси ти виглядаєш майже поважно.","~3 Звідси бачу все. І тебе. Не роби дурниць.","Жердина рівна. Думки теж.","Посиджу, подумаю. Спробуй і ти колись.","Тут ніхто не смикається і нікуди не біжить. Розкіш.","Я не втомився. Я спостерігаю. Це різні речі.","~1 Не чекай. Повернуся, коли захочу.","~1 Плече в тебе криве. Тут зручніше.","~2 Помахай мені. Ні, не так безглуздо.","~2 Відпочиваю від твоїх пригод. Не підходь хвилин п'ять.","~3 Сиджу тут, але стежу. Не розслабляйся.","~3 Поклич — прилечу. Тільки не через дурниці."],"св_могила":["Тут ти й {ліг|лягла}. Я запам'ятав.","Сиджу на твоїй могилі. Збирай своє, не барися.","Не найкраща сторінка літопису. Запишу все одно.","~1 Збирай речі швидше. Тут тхне твоєю поразкою.","~2 Наступного разу помри ближче до дому.","~3 Краще вже ти тут, ніж під каменем.","Тут спочиває твій геніальний план.","Надгробок нічого. Напис я б склав кращий.","Стережу. Переважно від тебе.","Тут лежить твоя гордість. Підбери разом із речами.","~1 Ну, тепер знаєш, як не треба. Чи ні?","~1 Я попереджав. Ти не слуха{в|ла}. Ось і камінь.","~2 Не переймайся. Літопис і не таке терпів.","~2 Речі цілі. Я пильнував, щоб ніхто не поцупив.","~3 Чекав тут. Знав, що прийдеш.","~3 Ходімо звідси. Не люблю тебе під каменем."],"св_блиск":["Блищить. Моє.","Хтось загубив. Тепер це моє. Під наглядом.","Не чіпай. Я перший побачив.","~1 Відійди. Не для твоїх лап.","~3 Гляну й віддам. Може.","Цікава річ. Вивчатиму. Довго.","Я не жадібний. Я колекціонер.","Стережу. З наукових міркувань.","Блиск шукає власника. Знайшов. Мене.","~1 Пальці прибери від мого скарбу.","~1 Руки геть. Я все бачу.","~2 Подивитись можна. Очима.","~2 Гарне, правда? Але ні.","~3 Знайшов для тебе. Майже віддаю.","~3 Треба — бери. Але спершу помилуйся."],"св_забрав":["Ну от. Я стеріг, а ти забра{в|ла}.","Так і запишу: злодюжка.","~1 У тебе завжди так. Моє — твоє.","~3 Гаразд, бери. Тобі потрібніше.","Блискуче рішення. Буквально.","Наука втратила зразок. Дякую.","Записую: вкрадено з-під дзьоба.","Знаєш, скільки я його стеріг?","~1 Красти вмієш. Інших талантів не помічав.","~1 Повернеш, коли засоромишся. Тобто ніколи.","~2 Бери. Але з тебе щось смачне.","~2 Ти забра{в|ла} мій блиск. Я заберу твій спокій.","~3 Бери, бери. Для тебе й стеріг, якщо чесно.","~3 Хай буде твоє. Тільки не загуби, ґаво."],"св_табличка":["Тут написано: «{sign}». Ну, хай буде.","«{sign}». Хто це писав? І головне — навіщо?","«{sign}». Коротко. Мені подобається.","Написано: «{sign}». Тепер знаю. Легше не стало.","«{sign}». Добре, що хоч хтось тут підписує речі.","Прочитав: «{sign}». Можеш не дякувати.","~1 «{sign}». Літери криві. Як і все тут.","~1 «{sign}». Ти це сам{|а} писа{в|ла}? Видно.","~1 «{sign}». Скальд би заплакав. Від сорому.","~2 «{sign}». Корисна дощечка. Не те що деякі.","~2 «{sign}». Тепер не заблукаю в цьому безладі.","~3 «{sign}». Гарно написано. Майже як руни.","~3 Прочитав: «{sign}». Твої каракулі я вже розбираю.","~3 «{sign}». Охайн{ий|а}, {name}. Не думав, що доживу."],"св_ягоди":["Ягоди. Одну скуштую, ти й не помітиш.","Кисленькі. Як ти зранку.","Ягоди. Я знайшов, не ти. Запам'ятай.","Дзьоб у соку. Але воно того варте.","~1 Не дивись так. Тобі все одно не лишу.","~1 Ти їх однаково не збира{в|ла}. Тож мої.","~2 Смачно. Тобі теж лишу. Мабуть.","~3 Тобі лишив. Найкращі, звісно, з'їв сам.","~3 Ягоди, сонце, і ти ще нічого не злама{в|ла}. Добрий день."],"крила_одіна":["Злітаємо. Руками не махай, не допоможе.","Крила позичені. Зламаєш — платиш ти.","Вгору! Згори твої помилки дрібніші.","Дивись, куди летиш. Не на мене.","~2 Тільки не верещи, як минулого разу.","~2 Крила не твої. Не задирай носа.","~3 Лети. Падатимеш — кричи, я почую.","~3 Дивись униз. Отак ми бачимо тебе щодня.","Руки ширше. Ти не курка.","Пір'я — не сніг. Рота закрий.","Земля почекає. Вона знає, що ти повернешся.","Не дивись униз. Ти ж знаєш, чим це кінчається.","~1 Я б тебе не піднімав. Одін наполіг. Знову.","~1 Дерево. Ще дерево. Ти бачиш дерева?","~2 Ну що, пташеня, ногами не бовтай.","~2 Легко, правда? От тепер зрозумі{в|ла}, чому ми пихаті.","~3 Небо тебе не скинуло. Я, чесно, ставив на інше.","~3 Тримаємо вдвох. Не смикайся, ти важк{ий|а}."],"крила_одіна_кінець":["Все, крила втомились. Ти важч{ий|а}, ніж здаєшся.","Досить неба на сьогодні. Вниз.","Одін забирає крила. Не чіпляйся за них.","~2 Ноги під себе — земля близько.","~3 Непогано літали. Тепер не зіпсуй посадку.","Пір'я вляглося. Час згадати, що в тебе є ноги.","Небо зачиняється. Приземлюємось.","Плавно, плавно... І ось ти знову пішохід.","Вітер відпускає. Земля — ні. Готуйся.","~1 Все, катання скінчилось. Злазь.","~1 Опускаю. Скарги — до Одіна.","~2 Коліна м'якше, бо знову нитимеш.","~2 Сідаємо. Цього разу на ноги, а не на ніс.","~3 Ще полетимо. Як навчишся не верещати.","~3 Земля та сама. А ти — трохи менш незграбн{ий|а}."],"обманка_старт":["Гей, опудало! Сюди дивись!","Ану, хто тут найповільніший? Ти, страховисько!","Лечу дражнити. А ти не заважай.","Зараз воно забуде про тебе. Як і всі.","Хочеш жертву? Ось я. Красень.","Ставлю на десять промахів. Рахую.","~2 Відведу йому очі. А ти не стій стовпом.","~2 Перепочинь. Я його заговорю.","~3 Займу його. Роби своє.","~3 Біду беру на себе. Ти — бий.","Агов, страховисько! Лови, якщо зможеш!","Лечу показати чудиську, хто тут нахабніший.","Ось він я, чорний і нахабний. Лови!","Кружляю. Хай у нього голова закрутиться першою.","~1 Рятую тебе. Знову. Записую в борг.","~1 Відволічу. Не через тебе — через нудьгу.","~2 Знаєш, що смішно? Воно справді клює. Як ти.","~2 Відійди й вдавай кущ. Головна роль моя.","~3 Поки я кружляю, тебе не чіпатимуть. Дихай.","~3 Ризикую пір'ям заради тебе. Муніну ні слова."],"обманка_порада":["Тільки не лупи його без кінця — розкусить.","Три удари — і згадає, хто тут насправді б'є.","Бий обережно. Зіпсуєш мені виставу.","Чекай, поки воно вимахається.","Заходь ззаду, поки воно ганяє мене.","Час перев'язатись. Або хоч віддихатись.","Не поспішай. Кожен удар нагадує йому про тебе.","Бий рідко, але сильно.","~1 Хоч раз не зіпсуй мені план.","~1 Не лізь між нами. Ти тут зайв{ий|а}.","~2 Дивись і вчись: оце хитрість.","~2 Можеш поки перекусити. Жартую. Майже.","~3 Не квапся. Я протримаюсь.","~3 Бережи сили. Бий, коли відвернеться."],"обманка_кінець":["Набридло дражнити. Я вдома.","Все, вистава скінчилась. Оплески потім.","Жодного влучання. Аж нудно.","Повернувся. Пір'я ціле, гідність теж.","~2 Досить. Тепер ця потвора знову твоя.","~3 Я тут. Ворог захеканий — бий, поки можна.","Повертаюсь. Там ще в когось голова обертом.","Час вийшов. Навіть генії мусять відпочивати.","Мій номер усе. Твій вихід. Не осоромся.","Сідаю на плече. Хай тепер шукає, куди я подівся.","~1 Я своє відкружляв. Далі розбирайся як знаєш.","~1 Все. Рятувати тебе довше я не підписувався.","~2 Повернувся. Скажи чесно, ти хоч диви{вся|лася}?","~2 Крила гудуть. Ще трохи — і я б те страховисько пожалів.","~3 Я цілий, ти ціл{ий|а}. Для тебе це рекорд.","~3 Вертаюсь. Без нагляду ти довго не протягнеш."],"обманка_розкусив":["Розкусили мене. Лечу назад.","Ого, а в нього таки є мізки.","Надто часто лупи{в|ла}. Тепер воно знає, хто б'є.","Виставу зірвано. Дякую тобі й твоїй сокирі.","~2 Тепер воно на тебе. Я попереджав.","~3 Скільки міг — тримав. Тепер ти.","Підміну помітили. А я тільки розігрівся.","Мої чари не вічні. А твої удари — гучні.","Обманці кінець. Справжній кривдник — ти.","Фокус не вдався. Відступаю з гідністю. Швидко.","~1 Ну звісно. Ти ж не вмієш бити тихо.","~1 Через тебе мене мало не з'їли. Дякую.","~2 Кінець вистави. Зате кілька вдихів тобі виграв.","~2 Так старанно би{в|ла}, що й дурень би второпав.","~3 Не біда. Тепер нас двоє проти нього.","~3 Я поруч. Ти — в очі, я — в спину."],"дор_приніс":["Одін просив переказати. Слово в слово, як і завжди.","Я був у Одіна. Він пам'ятає твоє ім'я — і в нього до тебе справа.","Нова справа від Всебатька. Дивись у книзі.","Одін не любить чекати. Але й не квапить. Дивно, правда?","~1 Одін дав справу. Я б на твоєму місці не барився.","~2 Справа від Одіна. Не найважча, як на мене. Чи найважча — побачимо.","~3 Одін тобі довіряє. Я теж. Ось нова справа."],"дор_поступ":["Добре. Ще трохи.","Одін бачить. Продовжуй.","Рахую разом з тобою.","Повільно, але йде.","~1 Не зупиняйся на півдорозі.","~2 Непогано. Ще кілька — і готово.","~3 Так і далі. Ти вже майже."],"дор_крок":["Це було перше. Тепер — далі.","Половина справи. Друга теж не сама себе зробить.","Одін задоволений. Поки що. Дивись, що далі.","~2 Гарно впорались. Наступне.","~3 Бачиш, як воно складається? Далі."],"дор_близько":["Тепліше. Це десь тут.","Відчуваю: ми близько. Роззирнись.","Тут. Я чую це пір'ям.","Обережно. Тут щось є.","~2 Дивись уважно — Одін послав нас не на прогулянку.","~3 Ми на місці. Я з тобою."],"дор_виконано":["Готово. Одін це бачив.","Справу зроблено. Різа стала глибшою.","Одін кивнув. Я бачив.","Ще одна зарубка. Руни вже чекають.","~1 Зроби{в|ла}. Не без моєї допомоги, звісно.","~2 Добре зроблено. Одін не розкидається похвалою, тож я скажу за нього.","~3 Пишаюся тобою. Тихо, щоб Мунін не чув."],"дор_відмова":["Відмови{вся|лася}? Одін не образиться. Мабуть.","Добре. Нова справа — завтра.","Не все треба робити. Але це я б зробив.","~3 Твоє право. Завтра Одін знайде щось інше."],"сит_портал":["портал має принципи. Метал не пропускає.","руда в торбі — портал на замку. Скаржся Одіну.","чудово. Руда піде пішки. На твоїй спині.","портал тебе не пустив. Я його розумію.","розвантажуйся або бери весло. Третього нема.","~1 метал крізь портал не ходить. Котрий раз тобі кажу?","~1 я полечу. А ти пливи зі своєю рудою, генію.","~1 портал — не віз. Хоч ти, бачу, думаєш інакше.","~2 ну що, морська прогулянка. З рудою. Романтика.","~2 дума{в|ла} проскочити? Портал метал чує.","~2 постав скриню біля порталу. І плакати не доведеться.","~3 нічого. Довеземо кораблем. Я на щоглі, ти на веслах.","~3 не кисни. Довга дорога — теж пригода. Нудна, але пригода.","~3 лиши руду тут, біжи по корабель. Я посторожу."],"сит_злам":["прощавай, {broke}. Служба скінчилася.","{broke} — все. Хвилина мовчання.","тріск. І все, що лишилося від доброї речі.","лагодити треба було вчора. Тепер — верстак.","у речей теж є межа. Ти її знай{шов|шла}.","~1 доглядати речі — не твоє. Видно.","~1 верстак стояв поруч тиждень. Ти мимо ходи{в|ла}.","~1 ламати вмієш. Лагодити — ні.","~2 ковалі люблять таких клієнтів, як ти.","~2 і ось {broke} — в історії. Я запишу.","~2 вічного нічого нема. Особливо в твоїх руках.","~3 не біда. Полагодимо або нове скуємо.","~3 чесна була служба. На верстак — хай віддихається.","~3 речі — наживне. Ти — ні. Бережись."],"сит_приручення":["ну от, тепер у нас {tamed}. Я не голосував.","приручи{в|ла} {tamed_gen}. Годувати — не з мого пайка.","зграя росте. Нагадую: я був першим.","дивно. Звір довіряє тобі більше, ніж я.","командуєш {tamed_ins}. А собою досі ні.","~1 ще один рот у господарстві. Чудово.","~1 звіра приручено. Мене — ні. І не мрій.","~1 тепер за тобою ходить {tamed}. Двоє без розуму.","~2 з поповненням. Ім'я дай нормальне. Не як минулого разу.","~2 гарний вибір. Хоча я б вибрав ворона.","~2 гаразд, {tamed} може лишитися. Але плече — моє.","~3 звірі до тебе липнуть. Я теж колись так влип.","~3 добре. Буде кому тебе гріти, як я відлечу.","~3 терпіння й годівля. Так ти й мене приручи{в|ла}. Майже."],"сит_мороз":["холодно? Гори нагадують, хто тут господар.","мед від морозу лишився вдома, так?","зуби вистукують руну. Нерозбірливу.","мороз пробирає. До вогню, негайно.","вовча шкура гріє краще за оптимізм.","~1 мерзнеш? А в мене пір'я. Бачиш різницю?","~1 так і стають льодовими статуями. Ти вже майже.","~1 у гори без теплого одягу. Сміливо. Ні, дурно.","~2 гартуємось? Я б уже розпалив багаття.","~2 тремтиш, як осика. До вогню, недотепо.","~2 холод — добрий учитель. Але злий.","~3 тримайся. Знайдемо вогонь, я притулюся.","~3 не стій, рух гріє. Я покажу, де затишок.","~3 не замерзни. Бо на чиєму плечі я грітимусь?"],"сит_отрута":["отрута. Обличчя в тебе вже кольору болота.","мед від отрути існує. Ти його не пи{в|ла}. Звісно.","не лизати, не нюхати, не обіймати. Правила болота.","зеленієш. Не від заздрощів, на жаль.","отрута діє повільно. Як ти думаєш.","~1 отруї{вся|лася}. Я ж казав. Ніхто не слухає ворона.","~1 цікаво, скільки отрути вміщує одна вперта голова.","~1 гниль у крові. Добре, що не в голові. Хоча...","~2 тримайся. Отрута минає, а сором лишається.","~2 і не цілуй більше п'явок. Вони тебе не люблять.","~2 тепер ти зелен{ий|а}, як мох. Майже маскування.","~3 дихай рівно. Мине. Не смій мені тут помирати.","~3 вилазь із болота. Отрута слабша за твою впертість.","~3 наступного разу мед від отрути. Я нагадаю. Ти забудеш."],"сит_вогонь":["ти гориш. Вода, перекат або молитва. Обирай.","пахне смаженим. На жаль, це ти.","вогонь — добрий слуга, але поганий капелюх.","котись по землі! Кажуть, допомагає.","мед від вогню п'ють заздалегідь. Запам'ятай.","~1 гориш? Я відлечу. Пір'я в мене одне.","~1 світиш яскраво. Шкода, що не розумом.","~1 біля багаття сидять. Не в ньому.","~2 ну от, тепер ти — найяскравіше світло в окрузі.","~2 вода близько? Біжи. Потім розповім, як це виглядало.","~2 падай і котись. Я рахую оберти.","~3 гаси, гаси! Не смій мені згоріти.","~3 до води, швидко. Опіки загояться, а тебе я не віддам.","~3 терпи. Вогонь згасне. Я рахую."]},"order":["see_enemy","see_hurt","see_friend","see_place","see_night","kill","kill_many","death_creature","death","death_many","death_fall","death_drown","death_fire","death_poison","death_cold","death_tree","near_death","boss","level","fall","build","chop","mine","fish","swim","sail","encumbered","hungry","weather_rain","weather_storm","weather_fog","weather_snow","flee","travel","biome","dungeon","idle","scout","light","leap","shadow","lightstep","lastchance","fed","food_refused","levelup","stranger_peck","hungry_ask","asleep_talk","hstrike","hstrike_crit","hstrike_combo","hstrike_miss","hstrike_level","out_follow","out_circle","out_both","out_scout_clear","out_scout_enemy","out_sail","strike_boss","strike_stronger","cook","craft","escaped","friendly","here","loot","night","pet","pick","portal","sleep","dome","dome_back","dome_end","dome_broken","sh_here","sh_idle","sh_kill","sh_kill_many","sh_near_death","sh_boss","sh_build","sh_sail","sh_swim","sh_fall","sh_weather_rain","mem_first_death_by","mem_first_death_cause","mem_death_by","mem_death_cause","mem_death_here","mem_death_again_here","mem_grudge","mem_near","mem_boss","mem_boss_friend","mem_biome","mem_biome_death","mem_dungeon","mem_slaughter","mem_ мокре місце. Гиги!","ти бачи{в|ла}, як воно хрипіло? Я запам'ятав кожен звук.","ну, неси трофей, хвалько. Тіко не задавайся, ге.","~1 пощастило тобі, шо я поруч каркав. Без мене б {здох|здохла}.","~1 і то все? Я думав, буде страшніше. Нудьга, курва.","~2 ото я розумію — бійка! Всьому району розкажу.","~2 {boss} — капут! Пішли нажеремося на радощах.","~3 ти ж мій звірюка! Я знав, шо ти зможеш.","~3 пишаюсь, чуєш? Тіко нікому не кажи, шо я це сказав."],"бос_кінець":["Хто наступний, га?","Ото я запамʼятаю. Всім розкажу.","Давай ше одного!","Ото ми, бля, дали.","Ну шо, по медовусі?","Трофей не забудь, лопух.","Гиги, ото ми круті!","Тепер можна й поспати.","~1 Не надимайся.","~1 Пощастило, та й годі.","~2 Хух, аж пір'я змокло.","~2 Оце було файно!","~3 Ми — сила, ти і я.","~3 Ти молодець, дурне."],"про_рівень":["{сильнішим став|сильнішою стала}. А {розумнішим|розумнішою} — нє, ніхуя.","рівень є, а мізків як не було, так і нема.","о, рівень. Ну і шо, мені тепер тобі кланятись?","рівень, диво з-під хвоста. Тіко не задирай носа.","~1 {навчився|навчилася}, недоносок? Ну нихуя собі.","~3 о, росте моє засранятко. Ну. Молодець.","сили більшає, а тупість — та сама.","новий рівень? Йо. {Був|Була} нулем — {став|стала} нулем з плюсиком. Ну, хоч шось.","сильніше стало, га? А тупість теж качаєш, я бачу."],"про_падіння":["{гепнувся|гепнулася}, як мішок з гівном. Ги-ги-ги.","земля тебе любить. Аж занадто, бля.","ну ти й {гепнувся|гепнулася}, бля. Аж земля гупнула.","{гепнувся|гепнулася}, як лантух з гноєм! Шкода, шо не на голову.","~1 падай частіше, мені весело, ги-ги.","~3 вставай, дурна голово, не лежи, бо дзьобну.","земля тобі сказала «здоров», сука.","гуп! Аж земля, бля, здригнулась.","гепну{вся|лася}, як мішок з буряками.","земля тебе знов обійняла. Любить, сука.","приземлення на сраку. Класика жанру, гиги.","~1 падаєш ти краще, ніж б'єшся. Талант, бля.","~1 політ дурня. Приземлення дурня. Оплески!","~2 ціл{ий|а}, бляха?","~3 вставай, курва. Я ж переживаю, ну.","{гепнувся|гепнулася}, як мішок з картоплею. Гуп! Ноги в тебе з дупи ростуть."],"про_будову":["будуєш, а {міг би|могла б} когось гасить. Ну шо за хуйня.","криво, як пʼяний на весіллі. Але стоїть, бля. Поки шо.","~1 криву халупу ліпиш, руки з сраки.","~3 гарно, сука. Майже як у людей.","молотком по пальцю — оце було б кіно, ги.","стіни є, мізків нема.","стукаєш, як дятел. Голова тріщить, бля.","стіни ростуть, а мізки — ніхуя.","о, ше одна халупа. Для тролів, чи шо?","будуєш, будуєш… А гасити кого, га?","цвяхи, балки, дошки. Нудьга смертна, курва.","~1 криво, як твоя пика.","~1 вітер дмухне — і все впаде. Я почекаю. Я терплячий.","~2 стоїть, бляха. Не чекав, чесно.","~3 гарна хата буде, братан. Мені жердку, чуєш? Найвищу.","~3 будуй, будуй. Наше гніздо, бля. Наше!","будуєш? Буда крива, як твоє життя. Ну, трохи кривіша.","архітектор, бля. Троль би рівніше склав, і то п'яний."],"будова_кінець":["Аби не йобнулось.","Нудно, аж пір'я сиплеться.","Я посплю, а ти стукай, стукай.","Не завали собі на башку, дурне.","~3 Клич мене на новосілля, і медовухи не жмоться.","Хоч дах зліпи.","Стук, стук, бля.","~1 Завалиться — ржатиму.","~2 Ну, норм.","~3 Гарно, курва."],"про_рубку":["дерева тобі шо зробили, га?","рубай, рубай, лісоруб хуїв.","а дрова хоч є? Нє? Тоді нашо, бля?","рубай, рубай, ліс не винен, шо ти {дурний|дурна}.","~1 лісоруб хуїв, сокиру ше не {просрав|просрала}, ні? А, ти ж і не знайдеш.","~3 рубай, до сраки ці ялинки, нам хата треба.","тріски летять. Аби не мені в око, бо уйобу.","дерево хрясь — і впало. Шкода, шо не на тебе, бля.","тріски мені в пір'я летять. Дякую, падло, дуже дякую.","ше одне дерево {завалив|завалила}. Ліс тебе ненавидить. І я трохи.","рубай, рубай. Дрова — то тепло. А тепло — то я не гавкаю. Майже.","сокирою махаєш краще, ніж у бійці. Ото позорище.","ялинки смолою плачуть. Гиги. Плачте, суки.","~1 рубаєш, ніби дерево тобі бабла винне.","~1 дерево впало не туди. Як і все в тебе, лошара.","~2 добрі колоди, бляха.","~3 рубай, рубай. Хату нам треба, братан, курва ж треба.","рубаєш дерева? Краще б собі в голові дірку {прорубав|прорубала}, шоб мізки провітрити."],"про_копання":["копаєш, як кріт сліпий.","тобі каміння рідніше, ніж люди, так?","копаєш, як кріт з бодуна.","~1 кайло в руках у дебіла — страшна, бля, зброя.","~3 копай, копай, братан. Мо' золото вилізе, ги.","пилюка в пір'ї через тебе, курва.","гуп-гуп, гуп-гуп… Башка тріщить, кінчай.","гуп-гуп, а я глухну. Гуп-гуп, бля!","каміння кришиться, і нерви мої теж.","пил у дзьобі, в пір'ї, в сраці. Дякую, дуже, сука, дякую.","копай глибше. Мо', свої мізки викопаєш.","руда — то бабло. Бабло — то блискітки. Копай, не філонь.","~1 гупаєш, а руди нема. Сліп{ий|а}, чи шо?","~1 земля з тебе ірже. Я теж.","~2 жирна жила, курва. Ше давай.","~3 копай, копай. Викуєш мені кігті. Залізні, шоб усі охуїли.","~3 оце руди, бляха! Багатіємо, братуха!","копаєш руду, як кріт сліпий. Пилюка у вухах, пилюка в сраці."],"про_рибу":["риба, грець її бери. Шо, справжні пацани рибу ловлять?","{fish} риб. Рибалка хуйова, бля.","{fish} риб. Хоч шось ти вмієш, рибоїд.","~1 рибалка, бля. Вікінг з вудочкою. Тьху, сором на весь район.","риба воняє. Ти теж.","~3 дай рибку, жмот. Я ж свій, ну.","сидиш, як дід на ставку. Ше пива візьми, ага.","~1 рибу ловиш, а мізки втопило, дурне.","риба смердить, вудка дурна, а ти щаслив{ий|а}, як дурне.","улов — {fish}. Ну, схаваємо, шо.","сидиш з вудкою, як дід на ставку. Тіко пива бракує.","риба плюхається, а мені смішно, гиги.","~1 риба розумніша за тебе. А ти її спійма{в|ла}. Шо за хуйня?","~1 вікінг з вудочкою. Ото позорище, бля.","~2 жирна рибина, бляха.","~3 рибку мені, курва. Найбільшу, ясно?","рибалка, бляха. Риба — і та мудріша за тебе."],"про_плавання":["{мокрий|мокра}, як щур у бочці.","плаваєш, як гівно в ополонці.","бовтаєшся, як гівно в ополонці.","~1 тонеш? Нє? Шкода, бля.","~3 вилазь уже, бо в мене гузно мерзне.","мокрий вікінг. Тьху. Жалюгідне видовище.","плаваєш, як сокира. Тіко сокира хоч рубать вміє.","пливеш, як дохла риба.","вода смердить, і ти смердиш. Двоє вас.","плюхаєшся, як жаба в калюжі. Ква, бля.","вилазь, бо риби тобі сраку обгризуть.","~1 тонеш? О, я подивлюсь. Я люблю таке.","~1 у воді ти ше туп{іший|іша}. Я думав, тупіше вже нема куди. Є куди, бля.","~2 греби швидше, бля.","~2 до берега рукою подати. Ворушись.","~3 випливай, дурне. Мені тебе шкода, ну.","~3 тримайся, курва! Не тони, чуєш?","мокра курка, хе. Човна нема, мізків — теж нема."],"про_море":["море, дідько б його взяв. Тіко не втопи нас, чуєш.","змій тебе зжере, а я ржатиму.","хитає, сука. Мене зара виверне. Тобі на голову.","~1 капітан з гівна. Втопиш нас — заклюю, я серйозно.","~3 пливемо, братан. Тримай курс, не позорся.","море, вітер, романтика, а ти все одно {тупий|тупа}.","де той змій? Хочу глянуть, як він тебе жре.","вода, вода, і ніхуя більше. Нудьга, ше й солона.","хвилі б'ють, мене нудить. Зара блюватиму. На тебе.","чайки оруть. Я їх повбиваю. Всіх. По черзі.","море глибоке. Як твоя тупість, бля.","вітер у пику, сіль у дзьоб. Кайф, ага.","~1 перекинеш корито — я злечу. А ти тони, мені похуй.","~1 пливемо хуй знає куди. Як завжди з тобою.","~2 гарний вітер, бляха. Свище.","~3 ну хоч у морі нікого рятувати не треба. Крім тебе, ясно.","~3 пливемо, братан. Мені, курва, подобається. Не кажи Хугіну.","капітан сраний. Корито твоє зара піде на дно, я тобі кажу."],"про_вантаж":["тягнеш, як той віслюк.","викинь мотлох, дурне, нашо тобі те гівно.","тягнеш мотлох, як барахольник з базару.","~1 {жлоб засраний|жлобиха засрана}. Пупок розвʼяжеться.","~3 кинь те лайно, хрін з ним, ходім швидше.","повзеш, сука, як слимак. Як слимак з грижею.","преш, як віл, а мізків — як у вола.","спина тріщить? Так тобі й треба, жадюго.","нахуя тобі стільки каміння, баране?","повзеш, як равлик з торбою.","~1 жадібність тебе в яму зажене. І добре.","~1 кидай мотлох, бо я звалю. Чесно звалю.","~2 важко, бляха? Викинь шось.","~3 давай додому, братан. Скинемо все й відкинемось.","повзеш, як равлик із грижею. Викинь мотлох, бля, нашо тобі те каміння?"],"про_голод":["пузо бурчить, а мізки мовчать. Як завжди.","жри шось, бо здохнеш, ледащо.","жри, дурне, бо зара впадеш.","~1 голодне, як пес, і таке ж тупе.","~3 зʼїж уже шось, бо я злюсь, сука.","без жратви ти ше {слабший|слабша}. Хоча куди вже, бля.","пузо в тебе гарчить голосніше за вовка. Я аж зассав.","жери, бо впадеш посеред бійки, а я ржатиму. Голосно ржатиму.","без жратви ти, як пуста бочка. Гуркочеш на всю округу, а варт{ий|а} — ніхуя.","пусте пузо — і хана тобі, воїне.","твій шлунок гарчить. Мо', він хоробріший за тебе, га?","жери, бо розкиснеш, як мокра онуча. Шо я з онучею робитиму?","~1 ти слабк{ий|а}, як дохле кошеня. Жери, кажу!","~1 і мене не нагодува{в|ла}, і сам{|а} не жереш. Ну ти й геній, бля.","~2 з'їж шось, курва. Ну. Ну!","~3 жери вже, бо я переживаю. Трохи. Трошечки, ясно?","~3 поїж, дурне. Ти мені ше потрібн{ий|а}, чуєш?","жери вже шось, бо здохнеш. Я не жартую, худоба.","пузо в тебе бурчить так, шо я чую. Жери, бля."],"про_дощ":["дощ, бля. Ссить і ссить. Я мокрий через тебе.","мокро, холодно, ше й ти поруч. Ну файно.","дощ, бодай тим хмарам луснуть. Мокну, як дурне.","~1 ти шо, навіть від дощу сховатись не вмієш?","~3 мокро, йобаний рот. Ну, обійми, чи шо.","з неба ллє, а з тебе толку — нуль.","ллє, як з відра, курва.","мокро, аж у сраці хлюпає. Чуєш? Хлюп.","дощ, бруд і ти. Три біди, і всі на мою голову.","небо плаче. Певно, на твою пику глянуло.","мокне пір'я, мокне терпіння. Ше трохи — і рвоне.","~1 ти шо, в ставку живеш? Сховайся, жабо.","~1 дощ тебе миє. Вперше за тиждень, гиги.","~2 ллє, бля. Перечекаймо десь.","~3 мокро, курва. Зате разом мокнемо, братан.","~3 сховаймося, бляха. Я змерз, як цуцик.","мокнеш під дощем, як бездомний пес. І я з тобою, курва."],"про_грозу":["гроза! Йобне в тебе блискавка — я обісрусь від сміху.","небо реве. Як я на тебе, ага.","гуркотить, аж срака здригається! Тор шось злий.","~1 стань вище, хай тебе блискавка пропрасує.","~3 тримайся, дурне, мине та буря. Я поруч.","небо гримить, а ти трусишся, як хвіст.","блискавка, бля! Ледь мені в сраку не влупила.","грім реве, як я з бодуна.","небо тріщить, як твоя башка після медовухи.","Тор знову нажерся, курва.","~1 вилізь на пагорб, хай тебе підсмажити. Я подивлюсь.","~1 трусишся, як осиковий лист, ссикло.","~2 гроза, бляха. Ховаймося.","~2 гримить так, шо аж пір'я дибки.","~3 не трусись, братан. Я з тобою.","~3 перечекаємо, засранцю. Сядь і сиди.","гроза, а ти стирчиш, як громовідвід. Дебіл, бля. Ну жахне ж."],"про_туман":["туман, ніхуя не видно. Тебе теж — і слава богу.","в тумані хтось є. Мо', вбʼємо?","туман, як соплі в троля. Як у тебе в черепушці.","~1 ніхуя не видно. Тебе теж — і то радість.","~3 туман, бля, власного дзьоба не видно. Не загубись, придурку.","мряка сира. Пір'я злипається, сука.","туман, як каша. Ніхуя не видно.","в тумані хтось сопе. Не ми. Точно не ми.","мряка липка, як соплі. Фу, бля.","туман — для засідок. Обожнюю, курва.","~1 ти в тумані ше й заблукаєш. Як завжди, лох.","~1 хоч у тумані твоєї пики не видно. Хоч шось хороше.","~2 тримайся ближче, бля.","~2 туман, бляха. Дивись в оба.","~3 не загубись, курва. Шукати тебе — нахуй треба.","~3 я поруч, братуха. І в тумані теж.","в тумані хоч твоєї пики не видно. Єдиний плюс туману, курва."],"про_сніг":["сніг, бляха. Замерзнеш — я ржатиму.","холодно, як у Хель у дупі, курва.","сніг, сука біла. Сраку відморожу.","~1 замерзай. Мені похуй.","~3 холодно, аж дзьоб цокотить. Розпали вогонь, засранцю.","все біле, як твоя пика, коли ти {зассав|зассала}.","сніг, курва. Лапи мерзнуть.","холодно, як драуґру в труні. А йому там холодно, повір.","сніг рипить, як твої кістки. Рип-рип, дідуган.","все біле. Кров на білому — ото буде краса.","~1 замерзнеш — я першими твої очі з'їм. Ну, бо вони найсмачніші.","~1 ти син{ій|я}, як дохлий кріль. Фу.","~2 холодно, бля. Вогню треба.","~2 мерзну, бляха, як собака.","~3 гріймося, курва. Обійми, чи шо. Тіко без соплів.","~3 тримайся, засранцю, скоро тепло буде.","соплі вже замерзли? Вдягнись, бо задубієш, як пень."],"про_втечу":["драпаєш, ссикло?","біжи, біжи, зассаний.","драпаєш, як заєць з підпаленою сракою!","~1 в штани накла{в|ла} і да{в|ла} дьору, герой.","~1 ну ти й ссикло, сука.","~3 тікай, тікай, бо мені тебе ше годувать.","з такою швидкістю тобі б гінцем, а не вікінгом, ги.","мчиш, аж штани мокрі.","тікаєш, ссикло? Від {foe_gen}? Ти шо, серйозно?","тіко п'яти блищать. Герой сраний, бля."],"про_дорогу":["{km} намотано. І шо з того, га?","ходиш-ходиш, ходиш-ходиш… а нашо — хуй його знає.","{km}, ноги до сраки {стер|стерла}. А нашо — хуй його знає.","~1 ходиш, як дурне з писаною торбою.","~3 ну пішли, дідько з тобою, куди там тебе несе.","ноги стирать — оце ти вмієш, ага.","блукаємо, бо хтось мапу читать не вміє. Не буду казать хто. Ти.","ноги стерли, а куди премо — хуй його знає.","дорога, дорога… А де, бля, вороги?","позаду {km} — і жодного трупа? Ну це вже дно.","ходимо, як два дурні по ярмарку.","пилюка, комарі і ти. Ото мандрівочка, сука.","~1 ходиш колами. Мапа в тебе шо, для краси?","~1 я б уже тричі долетів, а ти все повзеш, як слимак.","~2 далеко зайшли, бляха.","~3 ну, пішли далі. З тобою не нудно, хоч і дурне ти.","~3 мандруємо, курва. Як справжні вікінги, бля!","{пробіг|пробігла} {km} і ніхуя не {досяг|досягла}. Талант, шо скажеш."],"про_новий_біом":["{biome}, ну все, капець тобі. Нове місце, шоб здохнуть.","о, {biome}. Тут тебе по-новому відгасять, ги.","{biome}, ну трясця. Нові способи здохнуть, налітай!","~1 {biome}. Тут тебе й закопають, мудило.","~1 о, {biome}. Ставлю бабки, шо до вечора здохнеш.","~3 {biome}, бля, гарно ж. Ну пішли, братан, глянем, кого тут гасить.","{biome_in} навіть комарі злі. Як я, ги.","{biome}. Курва, як тут новим смердить.","{поліз|полізла} {biome_in}? Ну давай, давай. Здохни там красиво, шоб я бачив.","нові землі, а довбойоб той самий."],"про_підземелля":["темно, тісно, смердить. Як у тебе в башці.","під землю, бля. Смердить, як у могилі, тіко гірше.","нора, мишаче гівно смердить. Як ти любиш.","~1 ну ти й {поліз|полізла}, щур підземний.","тут здохнеш — і хрін хто знайде. Файно.","~3 темно, як у троля в сраці. Тримайся ближче, дурне.","мертвяками смердить. Ну, майже як ти.","кістки під ногами. Чиїсь. Скоро й твої будуть, ги.","{виліз|вилізла} з нори, як щур. І смердиш, курва, як щур."],"про_нудьгу":["нудьга, хоч дзьобом собі око виколупуй, курва.","ніхуя не відбувається. Знайди когось, нехай я хоч подивлюсь, як ти гасиш.","стоїш, як стовп. Стовп, бля.","тиша, як на цвинтарі. Тіко трупів нема. Обідно, бля.","навіть вітер здох. Від нудьги здох, прикинь.","ні кровішки, ні крику. Шо за день такий йобаний?","мухи — і ті звалили. Навіть мухи, бляха!","я вже дзьобом землю колупаю. Ну а шо ше робити, га?","стоїмо, як два стовпи. Тупо стоїмо. Нахуя — не знаю.","~1 ти нудн{іший|іша} за сиру брукву. Бруква хоч хрумтить.","~1 нудьга — то ти, тіко з ногами. Ходить, сопе, нудить.","~2 тихо, курва. Хоч би кабан який вискочив. Хоч один, га?","~2 нудно, шо пиздець. Ну хоч не капає, і то хліб.","~3 тихо. Ну й хуй з ним, посиджу з тобою. А шо такого.","~3 нудно, як не знаю шо. Але з тобою, братан, ше жити можна.","стоїш, як пень. Ворушись, ну, бо я тут зара всохну.","та я так. Просто прилетів сказати, шо ти мудак. Все, лечу.","нічо не сталося? Бо ти нічо й не робиш, ледащо."],"нудьга_кінець":["Ворушися, ну!","Ну? Ну?! НУ?","Я засинаю. Ото зара як захроплю тобі у вухо.","Ворушись, ану!","Знайди, кого гасити, бля.","Тьху на тебе.","~1 Зара дзьобну тебе в тім'я для бадьорості.","~3 Та й похуй."],"крик":["ГЕТЬ, СУКИ!","А НУ, БЛЯ, РОЗСТУПИСЬ!","~1 ЗАВАЛІТЬ ПЕЛЬКИ, Я ТУТ ГОЛОВНИЙ!","~1 ПІШЛИ НАХУЙ ЗВІДСИ, ЧМОШНИКИ!","~3 ЛАПИ ГЕТЬ ВІД НАШИХ, БЛЯ!","ПІШЛИ НАХУЙ, ПОКИДЬКИ!","~2 А НУ ГЕТЬ, Я СКАЗАВ!","СРАКИ ГЕТЬ ЗВІДСИ!","КАР, СУКИ! ДРАПАЙТЕ, ПОКИ СРАКИ ЦІЛІ!","Я ВАМ ОЧІ ПОВИКЛЬОВУЮ, ПАДЛЮКИ!","~1 ВСІ НАХУЙ, І ТИ ТЕЖ!","~1 ЗАВАЛИЛИ ЄБАЛА, ЧМОШНИКИ!","~3 НІХТО НЕ ЧІПА МОЇХ, БЛЯ!","ХТО ТУТ ХАЗЯЇН? Я, КУРВА МАТЬ!","ПІШЛИ НАХУЙ ВІД НАШИХ, ПАДЛИ!","КРА-А-А! ВІДВАЛИЛИ, ВИРОДКИ!","РОЗІЙШЛИСЯ, ПАДЛЮКИ, БО ПОКЛЮЮ!","А НУ ВІДВАЛИ, ПОКИ ШЕ ЖИВІ!","КРА-А! РОЗБІГЛИСЬ, ГНИДИ ЙОБАНІ!","ХТО ШЕ ХОЧЕ ПИЗДЮЛІВ?!","НАЗАД, ПАДАЛЬ! НАЗАД, КАЖУ!"],"крик_кінець":["Порозбігались, як таргани. Ги.","~1 {Бачив|Бачила}, як треба, тюхтію? Учись, поки я живий.","~3 Ну шо, {name}, я крутий? Крутий же, ну?","Хе-хе, курва.","~1 Вчись, мудило.","~2 Отак треба, засранцю.","Смачно, аж за вухами лящить, ги.","~2 Можна й так, засранцю. Можна."],"лють":["рубай їх!","сокиру в кров, бля!","~1 рубай, бо я тебе сам доклюю!","~1 бий, сучара, шо ти встав як пень!","~3 давай, братан, покажем їм, як у нас на районі!","гаси їх, шоб кишки на гілках висіли!","~1 бий, бо я тебе сам доклюю, слимак!","~3 рвем їх разом, братан, на шмаття!","сокиру в зуби — і погнали!"],"лють_кінець":["ШВИДШЕ, БЛЯ!","Не жалій, нахуй!","~1 І не скигли потім, ага.","~3 Я тут, рубай!","Кров і кишки!","~2 Рубай, сука, рубай!"],"крила":["біжи, бля, як вітер!","на, тримай мої крила. Не зламай.","~1 біжи, бо ти пішки повзеш, як дід з торбами.","~3 полетіли, братан!","лети, як стріла, трясця твоїй матері!","~1 біжи, бо повзеш, як пиво з дірявої бочки.","~3 тримайся, дурне ти пташенятко, віднесу!","ноги в руки — і ходу!"],"крила_кінець":["Тіко не йобнись.","~1 І не верещи на поворотах, ссикло.","~3 Хрін нас хто дожене.","Вітер у сраку!","~2 Не відставай, равлик обісраний."],"зцілення":["латаю тебе, не смикайся, бля.","на, ковтни, попустить.","~1 знов тебе латать, криворуке ти чмо.","~1 тримайся, бо закопувать тебе мені ліньки.","~3 не лякай мене так, {дурню|дурепо}. Чуєш? Не лякай.","не здихай мені тут, чуєш? Не здихай, бля.","~1 латаю, бо навіть здохнуть по-людськи ти не вмієш.","~3 живи, придурку, ти мені {потрібен|потрібна}. Ну. Живи.","ковтай, гнидо, і не скигли."],"зцілення_кінець":["Будеш як {новенький|новенька}. Майже.","~1 І не підставляйся більше, довбню.","~3 Ти мені ше {потрібен|потрібна}, ну. Не дивись так.","Живи, дурне. Поки шо.","~2 Тіко не падай вдруге, бо вдруге не латаю."],"злість":["Хто, бля, посмів?!","Ах ти ж сука драна!","~1 Тебе бʼють, а ти стоїш, як опудало?! Шо з тобою не так?!","~3 Мого не чіпать! МОГО, ЧУЄШ?!","Ти шо, падло, на наших полізло?!","~2 Ну все, тримайся, сука!","Ото ти зря, курво! Ой зря!","Ну все, тобі пиздець!","~1 Тебе бʼють, а ти мовчиш, ганчірко?!","~3 Хто мого зачепив — той труп!","Кров за кров, кишки за кишки!","Ах ти ж падло! Все, я злий. Бий їх, бий!","Хто посмів?! Хто, бля?! {name}, рви його на шмаття!","Кров на тобі — і я вже злий, як собака. Віддай їм удвічі, чуєш?!","тебе вдарили? Ну все, їм пиздець.","Я цей удар запам'ятав. Поверни його, сука, з процентами!"],"злість_кінець":["Поверни їм удвічі!","Порви, нахуй!","Бий, поки злий!","~1 І не стій, як опудало, бля!","~3 Вʼїбем їм разом — кров і кишки!"],"кров":["КРОВ!","Зара вони, курва, здохнуть!","~1 Ледь {живий|жива}, а туди ж! Ну то бий, хулі!","~3 За нас обох, братан!","Бий, курва, поки {живий|жива}!","~2 Я зара злий, як драугр з бодуна!","Ледь живі — найзліші, затям собі, бевзю!","Отепер, сука, по-справжньому!","~1 Не здохни, бо на кого я матюкатимусь?!","~3 За тебе — хоч у Хель, а Хель хай іде в сраку!","ЧЕРВОНО В ОЧАХ! БИЙ!","КРОВ! ТЕПЕР ЇМ ПИЗДЕЦЬ!","ти в крові? ЙО! РВИ ЇХ!","ПАХНЕ СМЕРТЮ, КУРВА! ЇХНЬОЮ, НЕ ТВОЄЮ!","НЕ ЗДИХАЙ, {name}! ГАСИ!","Я КОЖНУ РАНУ ПАМ'ЯТАЮ! ПОВЕРНИ ЇМ!","БОЛИТЬ? ТО Й ДОБРЕ, СУКА! РУБАЙ!","ЛЮТЬ У КРОВ! ТИ ТЕПЕР ЗВІР, БЛЯ!","ЛЕДЬ {ЖИВИЙ|ЖИВА}? ТО Й ШО! ГАСИ, ПОКИ ДИХАЄШ!"],"кров_кінець":["РВИ!","Нікого не жалій!","Рубай, сука!","~3 Я з тобою, хоч сам Сурт на дорозі стане!"],"їжа":["о, жрачка.","нарешті, бля, а то кишки вже марш грали.","~1 це шо, їжа? Ну… хуй з ним, зжеру.","~3 оце я розумію, турбота. Свій пацан.","жратва! Оце діло, бля, оце я розумію.","о, хавчик. Ти не так{ий|а} вже й безнадійн{ий|а}, виявляється.","ням. Ням-ням. Ше давай.","жеру й добрішаю. Не звикай, сука.","смачно, курва! Аж кігті затрусились.","нарешті хтось згадав, шо в нього є ворон. Ну нарешті!","~1 це шо, об'їдки? Ну… зжеру. Голод — не тітка, шоб його.","~1 спізни{вся|лася}, гнидо. Ну давай, давай сюди.","~2 нормальна жратва. Дякую, чи як там у вас кажуть.","~2 смачно, бляха. Можеш же, коли захочеш!","~3 ти мене годуєш краще, ніж Одін. Тіко йому не ляпни, бо хана.","~3 оце турбота, курва мать. Аж розкис я. Не дивись.","свіженьке. Я майже задоволений. Майже, бля."],"відмова_їжі":["Забери. Не доріс я ше до такої жратви.","~1 Я таке не жру. Принеси шось простіше, лошара.","~2 Лиши собі. Моє пузо таке ше не тримає.","~3 Не зара, братан. Хай довіра підросте, тоді й побалакаємо.","Забери. Мені таке ше не по зубах. Ну, по дзьобу, ги.","~1 Сам жри свої делікатеси, пан знайшовся.","~2 Рано мені таке, чуєш. Хай довіра підросте.","~3 Потім, братан. Ше не час."],"їжа_кінець":["Ше давай.","~1 Наступного разу швидше, бо я тебе зʼїм.","~3 А ти нічо. Не {такий вже й поганий|така вже й погана}, їй-бо.","Дякую, бля.","Ну, згодиться.","~1 І не думай, шо я тепер добрий.","~2 Добавки б, га?","~3 Золото ти, а не людина, їй-бо."],"рівень":["Ну добре, ти мені подобаєшся. Трошки. Ото й все.","~1 Тіко не думай, шо я тебе полюбив, чмо.","~2 Ну добре, засранцю, ти {заслужив|заслужила}. Не звикай.","~3 Ми з тобою, гівнюк ти мій рідний, — банда. Чуєш? Банда.","Пиздець, а ти таки {виріс|виросла} у моїх очах. Трошки. На пірʼїнку.","~1 Ну шо ж, чмо, рівень є. Аплодую. Одним крилом.","~2 Ну, трясця. Тепер я тебе майже поважаю, засранцю.","~3 Їй-бо — а ти таки мій пацан, недоносок.","Трофеї босів смачні, аж у пузі тепло. Тепер я твій, {name}. Не обісрись, гівнюку.","Я цей день запам'ятав, {name}. І тебе. Ну, ти шариш.","Ше сильніший, сука! Тепер вони здохнуть швидше!","а ти нічо так. Не повний лох. Мо', й не лох.","Клятва на крові, {name}. Тепер ми одна банда, ясно?"],"рівень_кінець":["Полечу Одіну похвалюсь.","~1 Але все одно ти лох.","~3 Тіко не розкисай, бо дам дзьобом.","Тіко не рюмсай від щастя, сука.","~2 Не спаскудь усе, засранцю.","~3 Ходім далі. Разом. І хай усі вороги вдавляться."],"чужий":["ти не мій, {name}. Не мій, вкурив?","чужого ворона тягаєш, падло?","я не твій і не буду. Йди нахуй.","злодюга, поверни мене моєму, поки очі не видзьобав.","думаєш, я твій? Хуй там плавав.","Ти не мій, {name}! На тобі дзьобом у тім'я, шоб {запам'ятав|запам'ятала}, курва!","клював і клюватиму, поки не віддаси мене моєму. Шариш?","Чужого ворона носиш, падло? На, отримуй! І ше на!"],"клюв":["На!","Тримай, сука!","~1 І ше відгребеш, злодюга.","Ше хочеш?","Це за мого хазяїна, сука."],"голод":["ЖРАТИ ДАЙ, СУКА.","ше годину без жрачки — і я почну з твого вуха.","пузо пусте — Мунін злий. Дуже злий, бля.","~1 ти шо, {забув|забула}, шо я теж жерти хочу, гнидо?","~3 слухай, братан, я трохи голодний, ну.","жратви! ЖРАТВИ, бля!","я твоє вухо з'їм. Чесне слово, з'їм.","шлунок до хребта прилип. Годуй, курва!","від голоду я тебе вже смаженим бачу. З цибулькою.","дай пожерти, бо сам у торбу залізу. І тоді не плач.","голодний ворон — злий ворон. А я, бля, ДУЖЕ злий.","~1 ти жереш, а я дивлюсь. Жмот ти, а не хазяїн.","~1 ше трохи — і я тебе кину заради дохлого кабана. Він хоч не жмотиться.","~2 я голодний, бляха. Нагодуй, га?","~2 жерти хочу. Дуже. Аж трясе.","~3 нагодуй мене, курва… тобто будь ласка. Отак. Бачиш, я вмію.","~3 я б шось похавав. З тобою разом, братан."],"голод_прохання":["Нагодуй, жмот, бо очі виклюю.","Або я сам візьму. З твоєї пики, ага.","~3 Будь ласка, чи як там у вас, людей, кажуть.","Годуй!","Жратви, сука.","Ну давай вже, бля.","~1 Швидко, гнидо.","~2 Ну будь ласка, ну.","~3 Я ж свій пацан."],"сплячий":["відвали, бо око виклюю. Нахуй.","ти, бля, хто {такий|така}?","ше раз смикнеш — пошкодуєш, я тобі кажу.","~1 сплю я, їбанько. Відвали нахуй.","не заважай, падло. Сплю, бля.","Відвали, бо око виклюю. Я серйозно.","Ти хто, бля, {такий|така}? Без поняття і знати не хочу.","Ше раз смикнеш — пожалієш, курва.","Принеси роги Ейктюра, тоді й побалакаємо. А поки — йди нахуй.","Хочеш, шоб я тебе слухав? Жертовні камені, два трофеї Ейктюра. Нема? То ти ніхто, ясно?"],"сплячий_натяк":["Принеси роги Ейктюра, тоді й побалакаємо.","Жертовні камені, трофеї Ейктюра. Без того ти ніхто, і звать тебе ніяк.","Два трофеї Ейктюра, довбню. Рахувати вмієш?","Без обряду — йди нахуй."],"матюк":["Курва.","Піздець.","Ну й хуйня.","Курва мать.","Йобаний сором, бля.","Я охуїв.","Ото ти, сука, даєш.","Трясця йому. І тобі теж.","Бляха-муха.","~1 За шо мені це чмо, га?","~1 Здохни вже, і квит.","~1 Я б тебе зʼїв, але ж отруюсь.","~1 Навіть троль розумніший, а він, бля, каміння гризе.","~1 Валькірії тебе не візьмуть — брак не беруть.","~1 Стидоба, довбойобе.","~1 Гівно ти, а не вікінг.","~2 Ну хоч не {здох|здохла}, і то хліб.","~2 Зійде, засранцю.","~2 Ну, терпимо. Шо ж робить.","~23 Нормально, курва, живемо.","~3 Люблю тебе, придурка. Ну. Все. Не дивись так.","~3 Ех ти ж, біда моя кривонога.","~3 Без тебе було б нудно, сука.","~3 Тримайся, бо хто мене годуватиме, га?","~3 Ти дурне, але {мій дурень|моя дурепа}.","Бляха-муха.","Курва мать.","Ну нахуй.","Трясця його матері.","Йо-о, холєра ясна.","Пся крев.","Йобаний в рот.","Ну пиздець.","Гівно якесь, а не день.","Шось тут смердить. А, то ти.","Перднути б, та шкода добро переводити.","Ото хуйня.","Ну пиздець, приїхали.","Хуйня якась, бля.","~1 Ну ти й мудило, їй-бо.","~1 Та йди ти в сраку, чуєш?","~1 Насеру тобі в чобіт. Чесне воронове.","~1 Тьху на тебе, ссикло.","~1 Ох ти ж довбойоб.","~1 Ну ти й лошара, курва.","~12 Щоб тебе шляк трафив.","~12 Ну ти й гівнюк, їй-бо.","~2 Холєра, шо ж з тобою таке, га?","~3 Йой, дурне ти моє. Курва, ну шо з тебе взяти.","~3 Гівнюк, але свій. Мій.","Йо-майо, шо за цирк.","Хай тобі грець.","Шоб тебе підняло та гепнуло.","Сто чортів тобі в печінку.","Твою ж дивізію.","Мать твою за ногу.","Ото, бля, кіно і німці.","Йобушки-воробушки.","Хрін тобі в торбу.","Шоб я так жив.","Йошкін кіт.","Дідько б тебе вхопив.","Ну й лажа, їй-бо.","Охрініти можна.","Ото халепа, курва.","Через сраку, як завжди.","~1 Ну ти й мудозвон.","~1 Хай тебе вовки обісцють.","~1 Пень з вухами, от хто ти.","~1 Шоб тобі пусто було, нездаро.","~1 Дурне, як сто кабанів.","~1 Їбанько ти, а не герой.","~1 Чорт лисий, а не воїн.","~1 Тьху, гнида болотяна.","~2 Ну, хрін з ним. Живемо.","~2 Ох ти ж йо.","~2 Ото, бляха, пригода.","~2 Гарно, але через сраку.","~2 Ну ти й жук, курва.","~2 Йо, шо робиться.","~2 Ну й хер з ним.","~2 Та нормас, холєра.","~3 Дурне, але моє, курва.","~3 Хуйло ти моє рідне.","~3 Шо б я без тебе робив, мудило.","~3 Ех ти, халепа моя ходяча.","~3 Тримайся, бляха. Я ж поруч.","~3 Свій ти, хоч і довбень.","~3 Йо, як я тебе терплю — сам дивуюсь.","~3 Гівнюк ти мій, їй-бо."],"кігті":["порвав, як ганчірку, ги!","кігті в мʼясо — і нема базару.","{target}, на, сука, лови!","вирвав клок мʼяса. Смачно, бля.","роздер нахуй.","на тобі, {target}, на пам'ять.","{target} тепер у смужечку, як труси в діда.","кігтями по пиці — найкраще «здоров».","~1 бий сам, ледащо, я шо, все за тебе робить буду?","~1 дивись і вчись, слимак.","~1 знов я, а ти шо, квіточки нюхаєш?","~1 поки ти дупу чухаєш, я тут пашу.","~2 є, сука. Наступний!","~2 подряпав як слід, ага.","~2 ше теплий, аж парує.","~3 за тебе я хоч самого Фенріра порву, братан.","~3 разом, кров і кишки! Рвем!","~3 моє ніхто не чіпатиме. Ніхто, бля."],"кігті_крит":["ОЦЕ ТАК, СУКА! Навпіл!","прямо в пику, хай вдавиться!","кров фонтаном! Люблю, бля!","з першого разу — і в саме серце. Я красень.","{target} вже не встане, хоч трісни.","~1 бачи{в|ла}, як треба, дебіле?!","~1 оце удар, а не твоє махання граблями.","~2 красиво, бляха. Аж самому сподобалось.","~3 це тобі подарунок, від щирого пташиного серця!","~3 тобі — найкращий шматок, братан!"],"кігті_серія":["раз, два, три — і всіх у фарш!","пискнуть не встигли, недоноски!","рву по черзі, сука, ставайте в чергу!","всім дістанеться, не пхайтесь!","кігтів на всіх вистачить, сучари.","~1 поки ти {чухався|чухалась}, я трьох обдер!","~2 оптом дешевше, бляха.","~3 нікого не лишу, ні хвоста, ні кишки!"],"розм_слідом":["задубів сидіти. Полечу за тобою, бо засиджусь.","злітаю. Не відставай — бо я відстану, ги.","полечу ззаду. Хтось же мусить твою дупу стерегти.","~1 крила затерпли на твоєму плечі. Політаю, бля.","~1 полечу ззаду. у!","відчуваю силу, сука!","~1 тренуюсь на них, бо на тобі не можна. Поки шо.","~2 рука набивається. Тобто лапа. Ну ти вкурив.","~3 для тебе гострю, серденько ти моє смердюче."],"бачив_смерть":["бачив, як ця тварюка здохла! Кігті памʼятають, бля!","тепер рву сильніше, бережіть сраки!","боги теж кровлять, трясця. Я бачив.","~1 пощастило тобі, шо я був поруч. Дуже пощастило.","~2 гарна бійка, аж пір'я дибки.","~3 разом завалили, аж земля здригнулась, братан!"],"сильніший_м":["бачив, як ця тварюка здохла — кігті аж дзвенять!","тепер рву сильніше, сука!","сили привалило! Наступних порву вдвічі, нахуй!","кров боса — найкраще точило для кігтів. Отак.","відчуваю силу, сука! Хто наступний?!","~1 о, шось путнє. Кігті гостріші, а ти все одно {такий|така} {кволий|квола}.","~1 це я його завалив. Ну майже. Тепер бʼю сильніше, затям, смердюк.","~2 гарна бійка, бляха. Кігті запамʼятали — рвуть сильніше.","~2 сильніший став, пиздець. Відчуєш.","~3 разом завалили, братан! Тепер я ше страшніший, ги!","~3 за тебе тепер рву ше сильніше, засранцю ти мій."],"готування_м":["жрачка! Давай сюди, жмот.","смердить смачно, сука.","вариш? Аби не отруту, бо я перший куштую.","~1 спалиш — зжеру тебе замість обіду.","~2 пахне, аж з дзьоба тече. Шматок мені.","~3 мені найкращий шматок, ти ж знаєш, братан.","смердить смачно. Давай, давай!","жратва булькає, а з мене слина тече.","куховариш? Перший шматок — мій, ясно?","пахне м'ясом. Ммм, бля.","не спали, бо я тебе з'їм.","~1 знову бурда якась.","~1 готуєш, як троль. Але жертиму, нікуди не дінусь.","~2 пахне, бляха. Шматок мені.","~3 смачно пахне, курва. Вмієш же, бляха. Не задавайся.","~3 готуй, готуй. Я поруч посиджу.","кухар, бляха. Аби тіко всіх не потруїв."],"ремесло_м":["клепаєш, {криворукий|криворука}? Аби не розвалилось.","молоток в руки — і давай, шоб аж гуло.","~1 руки з дупи, а все туди ж.","~2 криво, як троляча срака, але зійде.","~3 добра штука вийшла, їй-бо. Пишаюсь.","стук-стук, і знову шось криве.","майструєш, як дід на пенсії.","ше одна залізяка. Хоч гостра, га?","пальці не відбий, баран.","~1 хоч би воно в першій бійці не розсипалось. Хоч би, бля.","~1 майструвати — не твоє. Але старайся, старайся.","~2 нормальна штука, бляха.","~2 о, гостре. Оце мені заходить.","~3 добре вийшло, курва. Майстер, їй-бо.","~3 зроби й мені шось. Кігті. Залізні.","клепає шось. Руки з дупи, як завжди."],"втеча_м":["{prey} — тіко сраку й бачили! Мазило!","здобич пішла, а ти стоїш, як стовп.","втекло, сука. Наступного разу сокиру жбурляй.","~1 сліпий кріт, а не мисливець. Ну ти й лошара, їй-бо.","~3 нічо, хрін з ним, я ше зловлю.","Від тебе {prey} — і слід простиг. Мисливець хуїв, тьфу.","навіть обід від тебе тікає. Ну це вже дно."],"свої_м":["своїх бʼєш, придурок?","то свої, баран! Протри зенки.","~1 ше раз свого вʼїбеш — я тобі дзьобом довбану.","~3 тихіше, рубака, то ж наші.","своїх лупиш, дебіле? Очі в сраці, чи шо?","ти шо, по своїх б'єш, мудило? Протри баньки!","ти шо, сліп{ий|а}? Це ж свої!","тобі ворогів мало, шо ти своїх лупцюєш?","гей, гей! То не мішень, то наша людина!","по своїх гатиш, курва? Вони ж тобі нічого не зробили!","~1 ше раз — і я тобі сам очі видзьобаю.","~1 руки з сраки ростуть, чи шо?","~2 промаза{в|ла}, ге? Ну, вибачся там якось.","~2 тихо, тихо, не по тих лупиш, ге.","~3 не треба, то ж свої. Своїх бережуть.","~3 ге, ну ти шо? Ми ж за них горою."],"тут_м":["{biome_here_in} смердить гірше, ніж троль ригнув.","{biome_here_in} я б когось порвав. Чесно.","{biome_here_in} нудно, сука. Давай когось вʼїбем.","~1 {biome_here_in} навіть кабани розумніші за тебе.","~3 {biome_here_in} з тобою навіть тут не нудно, бляха.","{biome_here_in} я б усе спалив нахуй і почав з нуля.","{biome_here_in} кожна тварюка хоче тебе зжерти. І я їх, бля, розумію.","{biome_here_in} смердить, як у троля під пахвою. Я нюхав, не питай.","{biome_here_in} кров чую. Свіженьку. Ммм.","{biome_here_in} нудно, а прибити можуть. Оце я розумію — відпочинок.","{biome_here_in} я б когось дзьобнув. Просто так. Бо можу.","~1 {biome_here_in} ти схож{ий|а} на жратву. Бо ти і є жратва, лошара.","~1 {biome_here_in} навіть комарі тебе не хочуть. Навіть комарі, бля!","~2 {biome_here_in} жити можна. Ледь-ледь.","~3 {biome_here_in} з тобою хоч на край світу, братан. Ну, хоч до краю болота.","ти {biome_here_in}? Ну все, місцевим пиздець."],"скрині_м":["нишпориш, злодюга? Блискуче є?","мені шось блискуче лиши, чуєш.","~1 мародер, сука. Поважаю.","~2 бери все, шо не прибите. Шо прибите — віддирай.","~3 {знайшов|знайшла} шось — ділим навпіл, курва. Ну, мені більше.","нишпориш, як щур.","шо там? Блискуче? Дай. Дай, кажу!","скриня порожня — кишені повні. Ото я розумію.","бери все. Жмурам не треба.","~1 мародер з тебе кращий, ніж воїн. Хоч шось умієш.","~1 знову мотлох тягнеш?","~2 гарний хабар, бляха.","~2 бери, бери. Все бери.","~3 ділимо навпіл, як пацани.","~3 мені шось блискуче, курва. Ти ж обіця{в|ла}, я пам'ятаю.","по скринях нишпориш, як злодюга. Шо, бабло шукаєш? Ділись."],"ніч_м":["ніч, темна, як срака троля. Пора рвать.","темно, як у троля в сраці. Хоч око виколи.","зорі-хуйорі. Головне — хто там у темряві.","~1 ніч, а ти все одно {сліпий|сліпа}, як і вдень.","~3 ніч, хай їй трясця. Я поруч, не ссикуй.","ніч, курва. Вся погань на гулянку вилазить.","темно, хоч око виколи. Твоє, ага, бажано твоє.","місяць світить, вовки виють. Ото музон.","в темряві все смердить сильніше. Ти теж, до речі.","ніч — час різати. Пішли, шо стоїш.","драуґри повилазили. Я аж облизуюсь, бля.","~1 в темряві ти ше безпорадн{іший|іша}. Як так, га? Куди ше гірше?","~1 ніч, а ти шляєшся. Хоч би тебе хтось зжер. Тихенько, шоб я виспався.","~2 ніч, бля. Тримайся ближче до вогню, не будь бараном.","~2 темно, хоч в око стрель. Але кого гасити — видно.","~3 ніч. Не бзди, я тобі за очі буду.","~3 темно, курва. Я з тобою, не ссикуй.","вночі шляєшся, {дурню|дурепо}? У темряві й здохнеш, ага."],"звір_м":["гладиш цю худобу, засранцю? А мене хто погладить, га?","ше одна тварюка, яку годувать. Дохуя вас тут.","~1 ше поцілуй його, ганчірка.","~3 а, сонна тетеро.","прокидайся, ледащо! Світ сам себе не вгасить!","хропеш, як ведмідь у барлозі. Аж плече трясеться.","спиш, а вороги ходять. Ходять, бля!","нарешті прокину{вся|лася}. Я вже задубів.","~1 спиш, як жмур. Шкода, шо прокидаєшся.","~1 ти більше спиш, ніж б'єшся, ледащо.","~2 ранок, бля. Пішли.","~2 виспа{вся|лася}? Ну то ріжемо.","~3 доброго ранку, засранцю. Я тебе всю ніч пас.","~3 вставай, курва. Скучив я, ну.","{виспався|виспалася}, ледащо? Світ чекав, а ти {хропів|хропіла}, аж стіни трусились."],"пл_тут_м":["{biome_here_in} смердить, а я сиджу на тобі й нюхаю. Файно.","з плеча видно: {biome_here_in} тебе ніхто не любить. І я теж.","{biome_here_in} ти нас тягнеш у найсмердючіші кущі, курва.","~1 {biome_here_in} я б тебе кинув, якби було на кого.","~3 {biome_here_in} нічо так, хрін з ним. З тобою терпимо.","{biome_here_in} я сиджу на тобі й нюхаю, кого б дзьобнути. Шоб не нудно.","з плеча видно: {biome_here_in} все гниле. Все, бля. Аж до кореня.","{biome_here_in} твоє плече — єдине сухе місце. Прикинь, і таке буває.","{biome_here_in} я б тут гнізда не звив. Ну його нахуй.","{biome_here_in} я бачу більше за тебе. Бо я не сліпе чмо, а ворон.","~1 {biome_here_in} ти шумиш, як кабан у кущах. Нас уже всі чують, баран.","~2 {biome_here_in} нормально. Якшо не дихати.","~3 {biome_here_in} з твого плеча навіть тут нічо так, бляха-муха.","{biome_here_in} смердить, а я сиджу на тобі й нюхаю. Дякую. Ні, правда. Йди ти."],"пл_спокій_м":["я на тобі сиджу вже вічність. Зроби хоч шось.","плече кістляве, як і мізки.","нудьга, сука. Найди когось, кого можна вбить.","~1 стоїш, як пень, а я на тобі, як дурне.","~3 сидим, сраки гріємо. Добре. Але краще б когось різали.","сиджу на тобі, як цвях у дошці. І радий, як той цвях. Тобто нє.","плече тепле, а мізки холодні. Твої мізки, шо ти дивишся.","пір'я почистив, на тебе позирив з огидою. Шо ше робити, га?","~1 я на тобі сиджу, а ти стоїш, як опудало. Шо, бля, ворон лякаєш? Мене?","~1 ше трохи — і в мене з лап коріння полізе. Прямо тобі в плече.","~2 тихо, бляха. Мо', хоч подрімаю на тобі. Не крутись.","~3 сидимо, як два пні. Ну й нормально, хулі.","~3 в тебе на плечі навіть нудьга не така гівняна. От така хуйня.","я сиджу на тобі вже вічність. Зроби хоч шось, колода ти трухлява.","не трусись так, бля, я ледь не гепнувся.","я на тобі сиджу не для того, шоб дивитися, як ти стоїш. Рухайся, ну."],"пл_вбивство_м":["бачив з плеча — кров і кишки! Ше давай!","кров аж до мене долетіла. Так тримать.","одним трупом більше. Я запамʼятав.","~1 {вдарив|вдарила} криво, але здохло. Зійде.","~3 гарно, бляха! Ше одного!","кров мені на дзьоб бризнула. Смакота, бля.","з плеча видно, як воно дриґається. Ото краса.","я аж підскочив на тобі від радості. Гоп!","~1 удар кривий, зате труп рівний. Хоч шось.","~1 я вже думав, він тебе вгасить. Шкода, бля.","~2 гарно, бляха. Ше одного давай.","~3 оце ти його, курва! Аж пір'я заграло!","~3 з плеча бачу — ти звір, братан."],"пл_різанина_м":["я на тобі, як цар на троні серед трупів, ги.","оце бійня, кров по самі яйця! Сиджу й облизуюсь.","кишки навколо. Краса, бля!","~3 оце по-нашому, братан!","кров на мені, на тобі, на всему. Рай, бля, рай!","я з плеча трупи рахую. Збився. Дохуя.","сиджу на тобі посеред м'ясорубки. Щасливий, як дурне.","~1 ти рубаєш так, шо мене ледь нахуй не знесло.","~1 різанина без мізків. А мені заходить.","~2 оце бійня, бляха!","~3 ти — буря, курва. А я на бурі сиджу, як король!","~3 оце ми! Ну, ти. Але і я, бля, теж!","я на тобі, як на троні серед трупів. Кайф, бля."],"пл_ледь_м":["ти хитаєшся, а я на тобі сиджу, довбню!","ледь не {здох|здохла}, а я ж у тебе на плечі, курва!","~1 здохнеш — я тобі перший очі виклюю.","~3 не смій здихать, чуєш, падло ти моє?","я в тебе так вчепився, шо, мабуть, шкуру пробив. Терпи.","ти хитаєшся, а я на тобі, як на щоглі в бурю. Бля-а-а.","ледь не здохли обоє. І ти, і я, бля!","~1 ше трохи — і я б сидів на твоєму трупі. Ну, теж варіант.","~1 ти ледь копита не відкину{в|ла}, баран.","~2 обережно, бля. Ти мені ше потрібн{ий|а}.","~3 не смій здихати, курва. Чуєш? Не смій!","~3 тримайся, засранцю. Я тут. Я тут, ну."],"пл_бос_м":["я бачив, як воно впало! КРОВІ!","боса нема, в пизду його! А я все з першого ряду бачив!","~1 нарешті. Я вже думав, ти його до старості колупатимеш.","~3 оце ми, сука! Оце ми!","я сидів на тобі, коли воно здохло! Я все бачив, бля! ВСЕ!","кров боса на моєму пір'ї. Не митиму. Хай всі бачать.","ми його порвали, курва! Порвали нахуй!","~1 ти перем{іг|огла}. Я досі не вірю. Шо, правда?","~1 чесно, я вже з тобою прощався. І навіть не плакав.","~2 оце бійка, бляха!","~3 ми це зробили, курва! Разом! Ти і я, братан!","~3 я тобою пишаюсь. Мовчи. Нічо не кажи."],"пл_будова_м":["знов будуєш? Я вже засинаю.","тук-тук, дятел хуїв. Весь мозок мені {вистукав|вистукала}.","~1 криво, сука. Як завжди.","~3 хата буде, бля! Мені жердку не забудь.","стук-стук, а я в тебе на плечі підстрибую, як дурень на весіллі.","з плеча кожен кривий цвях видно. Кожен, бля.","будуєш, а я на тобі кимарю. Хр-р-р.","~1 сиджу на тобі й чекаю, коли все гепнеться. Не хочу, сука, пропустить.","~1 ти молотком так махаєш, шо я ледь не злетів нахуй.","~2 з плеча видно: стоїть. Диво якесь.","~3 будуй, будуй. Я з плеча пасу.","~3 наша хата, курва. Гарна ж, ну."],"пл_море_м":["хитає, як пʼяного троля. Мене зара на тебе знудить.","море, сука. Ні пожерти, ні вбить кого.","~1 кермуєш, як пʼяне чмо.","~3 вітер, бляха-муха! Оце життя!","бризки мені в пику летять, а я сиджу на тобі, як дурень. Як мокрий дурень.","вітер такий, шо я в твоє плече кігтями вчепився. Терпи, не пищи.","сіль на пір'ї, сіль на дзьобі. Солоний я, як огірок, бля.","~1 хитає, а я на тобі. Блюватиму — то на тебе, ясно?","~1 ти кермуєш, як сліпий троль з бодуна.","~2 вітрюган, бляха. Гарно.","~3 з твого плеча навіть море нічо, курва.","~3 тримай курс, братан. Я пасу."],"пл_плавання_м":["мене всего замочило, мокре ти опудало!","пливеш, як гівно в ополонці.","~1 втопишся — рятувать не буду. Похуй.","~3 греби, йобаний рот, греби!","вода мені вже по самі лапи, а ти пливеш, як колода. Як йобана колода.","сиджу на тобі, як на колоді, шо тоне. Ото пригода, бля.","пір'я мокре, настрій — гівно.","~1 тонеш, а я на тобі. Подумай про мене хоч раз, егоїст.","~1 пірнеш — я тебе з'їм, як тіко випливеш. Не пірнай.","~2 греби, бля.","~3 я тримаюсь за тебе, курва. Пливи, братан.","~3 до берега, засранцю. Разом, ну."],"пл_падіння_м":["ти шо, {здурів|здуріла}? Я ледь з плеча не злетів!","стрибаєш, як коза безмозка.","~1 ше раз так — і я тобі в око дзьобну.","~3 {живий|жива}? Ну й добре, дурна ти голово.","я на твоєму плечі ледь сальто не крутонув. Дякую сердечне, бля.","серце в мене вилетіло, а ти, сука, на ногах.","гуп — і пір'я на всі боки. Гарно, ага.","~1 ше раз так стрибнеш — злечу й не вернусь. Куковатимеш тут, як пеньок.","~1 ти падаєш частіше, ніж я сру. А це, повір, часто.","~2 трусонуло, бля.","~3 ці{лий|ла}? Ну й добре, дурна твоя голова.","~3 обережніше, курва. Я ж на тобі сиджу!"],"пл_дощ_м":["дощ, а я на тобі мокну, як курка в калюжі. Дякую, падло.","мокро, сука, як у болоті.","~1 під дах, придурок, під дах!","~3 мокнем разом, як дві онучі. Романтика, бля.","дощ з твого шолома мені за комір тече. Якшо в мене є комір. Нема? Ну то за пір'я.","мокну на твоєму плечі, як ганчірка на тину.","пір'я злиплось. Все злиплось, бля. Навіть думки.","~1 ти навіть дах над нами потримати не можеш, баран.","~1 мокро, бля. Через тебе, ясне діло.","~2 мокнемо, бляха.","~3 тулюсь до тебе. Не звикай, кажу.","~3 мокро, але з тобою, курва, нічо."],"спогад_вступ_м":["А я не забув, бля:","Ану слухай сюди, дурне:","О, шось згадалось, сука:","Я тобі зара нагадаю, падло:","~1 Ану напряж свою макітру, бляха:","~1 Нагадаю, бо ти ж, чмо, все одно забудеш:","~2 Йо, во шо згадав:","~2 Знаєш, шо мені в башці сидить, як заноза в сраці?","~3 Е, засранцю, слухай, шо згадав:","~3 О, і ше одне, бля:"],"спогад_хвіст_м":["Мунін, бля, нічо не забуває. Нічо.","Таке, курва, хрін забудеш.","Я все пам'ятаю. Все. До сраної дрібниці.","~1 І ше довго тобі це згадуватиму, падло. Довго.","~1 Ну ти й лошара, їй-бо.","~1 Тьфу. Тьфу на тебе ше раз.","~2 Ото було, бляха-муха.","~3 Добре, шо ми це пережили. Ну. Добре, кажу.","~3 Кровища, кишки… гарні були часи, курва."],"сп_first_death_by_м":["першу смерть при мені ти {прийняв|прийняла} від {m_who_gen}, {m_where_in}. Ти {верещав|верещала}, як порося, я аж оглух, бля.","{m_when} від {m_who_gen} ти вперше {здох|здохла} в мене на очах. Ну ти й лошара, думаю. І не помилився.","~1 перша смерть при мені — від {m_who_gen}. І понеслося, курва, з того дня все в гівно.","~3 {m_who}... Перша твоя смерть, шо я бачив. Я ту тварюку ледь на шмаття не порвав, бля, чесно.","{m_where_in}, {m_when}: від {m_who_gen} ти вперше {ліг|лягла} при мені. Ту пику я запам'ятав. Ше зустрінемось.","~2 {m_who}, {m_when}. Перша твоя смерть при мені. А я, дурний, думав — разова акція, курва."],"сп_first_death_cause_м":["першу смерть при мені ти {заробив|заробила} через {m_cause}. Не від ворога, нє. Через {m_cause}! Ну ти й їбанько.","{m_when} ти вперше {здох|здохла} в мене на очах через {m_cause}. Я аж з плеча впав. Від сорому, бля.","~1 через {m_cause} ти вперше {здох|здохла} при мені. Я іржав, аж пір'я сипалось, їй-бо.","~3 через {m_cause}, {m_when}. Пиздець. То потім смішно стало, а тоді — ніхуя не смішно.","~2 через {m_cause}, {m_when}. Перша смерть при мені — і така тупа, ну шо ти будеш робити."],"сп_death_by_м":["{m_when} {m_where_in} від {m_who_gen} ти {склеїв|склеїла} ласти. Ну, буває. Часто, бля, буває.","пам'ятаю, як від {m_who_gen} {m_where_in} шматки летіли. Твої, курва. Не його.","~1 {m_who}, {m_when}. Розмазало тебе, як гівно по чоботу. Я бачив, я все бачив.","~2 {m_when} ти {ліг|лягла} під {m_who_ins}. Я досі злий, аж пір'я дибки, сука.","~3 {m_who}, {m_when}... Я ту тварюку ше знайду. Знайду й очі виклюю. Обидва.","Від {m_who_gen} ти тоді {ліг|лягла}, {m_when}. Ту морду я ше знайду, хай не розслабляється."],"сп_death_cause_м":["{m_when} {m_where_in} ти {здох|здохла}. Через {m_cause}! Ти шо, дурне? Через {m_cause}, бля!","{m_when} ти {загнувся|загнулася} через {m_cause}. Я з сорому мало не облисів, пиздець.","~1 смерть через {m_cause}, сука. Тупа смерть. Якраз по тобі.","~3 через {m_cause}, {m_when}... Ше раз так зробиш — сам тебе вб'ю, чуєш? Не роби.","{m_where_in}, через {m_cause}. Я тоді так матюкався, шо аж охрип.","~2 через {m_cause}, {m_when}. Отаке в нас, курва, життя. Тупе."],"сп_death_here_м":["ось тут ти й {здох|здохла}. {m_when}. Земля ше досі тобою смердить, курва.","кущі знайомі, га? Тут ти {валявся|валялася} трупом {m_when}. А я сидів поруч і жер жука.","~1 тут ти {гнив|гнила} {m_when}. Не стовбич тут, бо повториться, дурне.","~3 не люблю я це місце, бля. {m_when} тебе тут ледь не втратив. Пішли звідси.","тут, {m_when}, ти лежа{в|ла} холодн{ий|а}, як оселедець. Я пам'ятаю. Я все пам'ятаю.","~2 оце те саме місце, {m_when}. Ходи тут на пальчиках, дурне."],"сп_death_again_here_м":["тут ти {здихав|здихала} вже {m_times}! Шо тебе сюди тягне, як муху на гівно, га?","{m_times} на одному місці, сука. Став тут собі пам'ятник і не мучся. А я зверху насеру, для краси.","~3 {m_times} тут, бляха… Обійдемо, а? Ну прошу, по-людськи.","{m_times} на цьому клапті землі. Ти його вже удобри{в|ла} собою. Шо тут виросте — страшно подумать.","~2 {m_times} тут, курва. Мо' іншою дорогою, га?"],"сп_grudge_м":["{m_who}. Від цієї тварюки ти {здихав|здихала} {m_times}. Я рахую. І кігті точу. Пиздець їй буде.","{m_times} від {m_who_gen}. Ту пику я знаю краще за твою, курва мать.","~1 {m_times} від {m_who_gen}, сука. Ти їм шо, {винен|винна} бабла?","~3 {m_who}... {m_times}. Мстимось разом. Ти рубаєш, а очі — мої, бля.","~2 {m_who}... {m_times}, сука. Наступного разу б'ємо першими. І в табло."],"сп_near_м":["{m_when} у тебе лишилось {m_hp} здоров'я. {m_hp}! Я вже твій надгробок під гніздо приміряв, бля.","найближче до смерті — {m_hp} здоров'я, {m_where_in}. Я, курва, кожну краплю твоєї крові пам'ятаю.","~1 {m_hp} здоров'я після {m_who_gen}. Ти тоді {обісрався|обісралася}, не пизди, я бачив.","~3 {m_hp} здоров'я, {m_when}... Я тоді, бля, молився. Одіну. Я! Уяви собі.","~2 {m_hp} здоров'я, {m_when}. Я в тебе всіма кігтями вчепився, аж шкуру продер."],"сп_boss_м":["{m_when} ми порвали {m_who_acc}! Кров, кишки, крики — оце, бля, я розумію!","пам'ятаю {m_who_acc}. Найкращий день у моєму житті, сука. Ну, після того, як я сир спиздив.","{m_who_acc} ми з тобою рвали вже {m_times}. А вперше — {m_when}. Смак досі в дзьобі, йо-о-о.","~1 {m_who_acc} ти {здолав|здолала} {m_when}. Чудом, падло. Чистим, сука, чудом.","~3 {m_who}, {m_when}. Ми тоді були, бля, як боги. Ну, як я.","~2 {m_who}, {m_when}. Гарно ми його відпиздили, га?"],"сп_boss_friend_м":["{m_who_acc} ми рвали не самі: поруч були {m_friend}. Усі в кровищі, як годиться. Красота, бля.","~1 {m_who_acc} ти {здолав|здолала} не {сам|сама}: поруч були {m_friend}. Без них ти б {здох|здохла}, сто пудів.","~3 {m_when} — {m_who}, і поруч {m_friend}. Оце була зграя, курва! Оце пацани!","{m_who}, {m_when}, і з нами {m_friend}. Кожному дісталось, а мені — найбільше. Бо я найкрутіший.","~2 {m_who_acc} ми завалили разом, {m_when}. З нами були {m_friend}. Нормально помахались, бля."],"сп_biome_м":["{m_when} ми з тобою вперше припхались {m_where_in}. Я понюхав — смертю тхне, бляха. І тобою.","наш перший день {m_where_in}: сморід, грязюка і ти посередині, як цвях у сраці. Красота.","~1 {m_where_in} ми вперше разом, {m_when}. Ти {трусився|трусилася}, як холодець. Ссикло.","~3 {m_where_in} уперше разом, {m_when}. Страшно було — пиздець. А тепер ми там свої, по-любому.","~2 {m_where_in}, {m_when}. Перший день там. Я всіх обматюкав, шоб знали, хто на район прийшов."],"сп_biome_death_м":["{m_where_in} ти {здох|здохла} в перший же наш спільний день. Рекорд, бля! Медаль тобі.","~1 вперше зі мною {m_where_in} — і зразу в могилу. Ну молодець, шо. Молодець.","~3 {m_where_in} нас тоді вмили кров'ю. Але ми вернулись, курва. І напихали.","{m_when} — перший день разом {m_where_in}, і перша могила там же. Ну класно учив|приручила} {m_when}. Нормальна звірюка, своя.","{m_who}, {m_when}. Ше один нахлібник на нашу голову, курва.","~2 {m_who_gen} ти {приручив|приручила} {m_when}. Хай знає, хто тут старший. Я."],"сп_home_м":["{m_when} ти при мені {поставив|поставила} ліжко {m_where_in}. Нора, а не хата, бля.","~1 ше одна твоя хата {m_where_in}, {m_when}. Крива, сука, як і все, шо ти робиш.","~3 {m_where_in} наша нора, {m_when}. Затишно було. Ну, по-нашому затишно.","{m_where_in}, {m_when}. Ліжко, вогнище й протяг. Хата, курва. Люкс.","~2 {m_when} ти {поставив|поставила} ліжко {m_where_in}. Норм нора вийшла, жити можна."],"сп_friend_м":["{m_friend}... {m_when} я вперше побачив вас разом. Нормальна зграя, бля, своя.","~1 {m_friend} ходить з тобою відтоді, як я вас уперше побачив, — {m_when}. Нашо? Мазохіст якийсь, пиздець.","~3 {m_friend} — свій. Пам'ятаю, як вас уперше разом побачив: {m_when}. Нормально, бля.","{m_friend}... Я це ім'я запам'ятав {m_when}. Хай тіко хтось тебе зачепить — це моя робота.","~2 {m_friend}. Запам'ятав це ім'я {m_when}. Нормальна компашка, курва."],"сп_tomb_м":["{m_min} я гнив у твоєму надгробку, поки ти {плентався|пленталася}, як сонна муха. Як муха, бля!","~1 {m_min} у могилі з твоїми смердючими онучами. Я не забув. І не забуду, сука.","~3 {m_min} я чекав у надгробку. Знав, шо прийдеш. Ну, надіявся, курва.","{m_min} я просидів у твоїй могилі. Думав про жратву. І як тебе вбити. Більше про жратву.","~2 {m_min} у надгробку. Довго, бляха, але ти прийш{ов|ла}."],"сп_metal_м":["{m_when} ти при мені вперше {вхопив|вхопила} {m_item}. Слина аж капала. Твоя, не моя.","~1 {m_item}, {m_when}. Я думав, ти його зжереш, жадібне ти чмо.","~3 {m_item}, {m_when}. Добрий був день, бля. Блискучий.","{m_item}, {m_when}. Ти з ним носи{вся|лась}, як дурень з писаною торбою.","~2 {m_when} — {m_item}. З того дня ти б'єш сильніше. Трошки. Ну, на волосинку."],"сп_badday_м":["{m_when} ти {здох|здохла} {m_times} за день. Валькірії задовбались тебе носити, бля.","~1 {m_times} за добу, к троль після бобів.","не лапай мене. Руки, бля, прибрав."],"чуж_кінець_м":["Поверни, де взяв, сука.","Йди нахуй, кажу.","Клюну, їй-бо.","Курва мать.","Тьфу на тебе."],"чуж_вбивство_м":["{вбив|вбила}? Ну й шо. Я б тебе краще вбив.","{owner} рубає краще. В сто раз, чмо.","кров є, а радості нема. Бо ти не мій, вкурив?","нічо, падло, тебе теж колись так. Я подивлюсь."],"чуж_смерть_м":["{Здох|Здохла}? Ха! Так тобі й треба, злодюго. Заслужено.","Лежи-лежи, сука. А я посиджу, подивлюсь.","Мо' хоч тепер мене вернуть {owner}. Ну.","Вальгалла тебе не прийме, хуйло. Я їм все розкажу. Все!"],"чуж_ледь_м":["ледь не {здох|здохла}? Тьху. А я вже радів, падлюко.","ну давай, ну ше трошки, ну!","рятувати не буду. Ти не мій. Мені похуй.","тримайся, сука. Бо в чужому надгробку я сидіти не буду, нахуй."],"спогад_знову_м":["Казав і ше раз скажу, бля:","Ше раз нагадаю, бо до тебе доходить, як до жирафа:","Ти вже {чув|чула}, а ну ше раз слухай:","~1 Повторюю для особливо тупих, курва:","~3 Та знаю, казав. Ну то й шо. Слухай:"],"сп_r_near_м":["{m_when} у тебе лишилось {m_hp} здоров'я. Від {m_who_gen}. Я вже кігті чистив під твої очі, бля.","{m_hp} здоров'я, {m_when}. Я запам'ятав. Я таке, сука, не забуваю.","~1 {m_when} від {m_who_gen} ти ледь не {став|стала} котлетою. {m_hp} здоров'я, дурне!","~3 {m_hp} здоров'я, {m_when}... Не лякай мене так, чуєш? Я ж не залізний.","~2 {m_hp} здоров'я, {m_when}. Я вже крила розправив валити, курва."],"сп_r_hard_м":["{m_when} ти {рубався|рубалася} з {m_who_ins} і {втратив|втратила} {m_lost} здоров'я. Але ж {порвав|порвала}, курва! Ото так!","пам'ятаю бійку з {m_who_ins}, {m_when}. Кров, кишки, все в гівні. Краса, бля.","~1 {m_who}, {m_when}. Ледь {подужав|подужала}, сука. Ле-е-едь!","~3 {m_when} ти з {m_who_ins} {бився|билася}, як звір. Я аж пишався, бляха. Ну, трохи.","~2 {m_who}, {m_when}. Важко було, але дотиснули. По-нашому."],"сп_r_escaped_м":["{m_when} від тебе втекла здобич! {m_who}! Мазило криворуке, ну як так, бля?!","{m_who}, {m_when}: здобич пішла з твоєю стрілою в сраці. Я досі злий. Досі!","~1 {m_when} здобич утекла, а ти {стояв|стояла}, як пень. Ну ти й терпило.","~3 {m_who}, {m_when}... Здобич утекла. Нічо, я морду запам'ятав.","~2 {m_who}, {m_when}: здобич утекла. Та похуй, наздоженем."],"сп_r_fled_м":["{m_when} ти {драпав|драпала} від {m_who_gen} так, шо аж п'ятки світились, бля.","{m_who}, {m_when}. Ти {втік|втекла}, а я сидів і іржав, як кінь.","~1 {m_when} від {m_who_gen} ти {тікав|тікала}, як заєць. Ссикло ти, ото хто.","~3 від {m_who_gen} ти тоді {втік|втекла}, {m_when}. І правильно, курва. Зате {живий|жива}.","~2 від {m_who_gen} ти тоді {відступив|відступила}, {m_when}. Розумно. Рідко в тебе таке, але буває."],"сп_r_star_м":["{m_when} ти {завалив|завалила} {m_who_gen} на {m_stars}! Оце м'ясо, бля! Оце да!","~1 {m_who}, {m_stars}. Не думав, шо ти таке потягнеш. Ну хто б, сука, подумав.","~3 {m_stars}, {m_when}. Оце ми, курва! Оце ми!","{m_who} на {m_stars}, {m_when}. Ми тоді показали, хто на районі головний.","~2 {m_stars}, {m_when}. Гарно помахались, бляха."],"сп_r_newkill_м":["{m_when} ти вперше {вбив|вбила} {m_who_gen}. Нова кров, новий смак. Йо-о.","~1 {m_who_genpl} на рахунку вперше, {m_when}. Довго ти, сука, {збирався|збиралася}. Пиздець довго.","~3 {m_when} — перша кров {m_who_gen}. Смачна була, бля. Я лизнув.","{m_who}, {m_when}. Новий звір на нашому рахунку. Я покуштував — так собі.","~2 перша кров {m_who_gen}, {m_when}. Записав собі в башку."],"чуж_дар_м":["на тобі дар «{gift}». Подавися, падло.","роблю, бо мушу. Не бо ти мені подобаєшся. Ти мені не подобаєшся, сука.","для {owner} я б рвав утричі сильніше. А тобі й так зійде, чмо.","бери, падло. Але кігті я потім об твоє вухо почищу.","дар «{gift}», хай йому грець. Як крадене пиво: п'єш, а кайфу нема.","на, на. Тіко відчепись.","допомагаю чужому. Гидко, бля, аж блювать тягне."],"чуж_дар_кінець_м":["Тьфу, бля.","Поверни мене хазяїну, сука.","І йди ти нахуй.","А клюну потім. Жди.","Не дякуй. Курва."],"голод_сильний":["я такий голодний, шо дари тобі дорого обійдуться. Дуже, бля, дорого.","кишки до хребта прилипли. Жерти дай, курва.","~1 ше трохи — і я сам у твою торбу полізу. Без питань.","~1 голодний Мунін — злий Мунін. А злий Мунін клює. В табло.","~2 я б зара і сиру жабу зжер. Зі шкірою. Якби тут була.","~3 братуха, мені хріново з голоду. Без пиздежу."],"голодує":["На тобі, скнаро! Це за те, шо я досі голодний!","Сам жереш, а мені хоч кістку кинь! Жмотяра!","Нагодуєш — перестану. Не нагодуєш — ну, сам знаєш, шо буде.","Я тобі не брошка на плечі, бля! Я жерти хочу!","Ше раз забудеш — виклюю шось поважніше за вухо. Вгадай шо.","Голодний ворон — злий ворон. А я, курва, дуже голодний. Отакий голодний.","Оце за вчора. А завтра буде за сьогодні. Шариш?","Пузо пусте, терпець лопнув. На тобі!","~3 Вибач, братуха, голод — він такий. На."],"вкрав":["сам узяв: {food}. Тебе чекать — здохнеш.","не дивись так. Ти не годува{в|ла} — я сам узяв: {food}. Все чесно.","~1 твоя сумка — моя комора, скнаро. Спиздив: {food}.","~2 це тепер моє: {food}. Претензії — в дзьоб.","~3 взяв саме гівно, шо було: {food}. Бачиш, який я культурний?","сумка сама відкрилась. Ну, майже сама. Забрав: {food}. Шо?","{food} — у мене в пузі. Хочеш назад? Не хочеш, повір.","поки ти лови{в|ла} ґав, я пообідав: {food}. Смачно, бля.","~1 обнишпорив твою сумку. Знайшов: {food}. Ням, жмоте.","~1 хай тобі грець, сам себе годую. Сьогодні в меню: {food}.","~2 позичив: {food}. Верну гівном, як водиться.","~2 взяв: {food}. Совість мене гризе. Жартую, нічо не гризе.","~3 вибач, братан, кишка перемогла. Забрав: {food}."],"вкрав_кінець":["І не скигли мені тут.","~1 Наступного разу годуй, дурне.","~3 Ну, ти ж зрозумі{в|ла}, га?","Ніхто не винен, крім тебе.","Годуй — і буде тобі щастя.","~1 Жмотяра.","~2 Тіко не рюмсай.","~2 Хочеш по-хорошому — годуй. Все просто.","~3 Без образ, ну."],"монети":["забрав {coins}. На жратву. Бо від тебе ж не дочекаєшся.","~1 спиздив {coins}. Куплю собі м'яса, раз ти зажав.","~2 взяв {coins}. Компенсація за моральну шкоду, вкурив?","~3 позичив {coins}. Верну, як рак на горі свисне.","{coins} — моє. Податок на жмотство, бля.","вигріб {coins}. Торгаш хоч не жмот, як деякі.","~1 {coins} — моє, лошара. Рахувати вмієш? Порахуй, скіко нема.","~2 прихопив {coins}. Не шукай, вже нема.","~3 взяв {coins}. Не дуйся, ше наробиш."],"монети_всі":["забрав усе: {coins}. Злидар ти, а не воїн. Бомжара.","~1 оце все бабло — {coins}? Сміх, бля. Забираю.","~3 взяв останні {coins}. Не плач, наживеш. Я в тебе вірю.","вигріб до копійки: {coins}. Голота.","{coins} — і це все? Забираю з жалю, курва.","~1 забрав усе, {coins}. Будеш знать, як не годувать.","~2 все твоє бабло — {coins}. Було твоє. Ага.","~2 гаманець пустий. Бо {coins} тепер мої, хе-хе.","~3 забрав усе: {coins}. Колись віддячу. Мо'."],"монети_кінець":["Торгаш мене хоч за бабки погодує.","~1 Хоч якась з тебе користь, бля.","Злиднота.","Не скигли, сказав.","~1 Скнара.","~2 Наступного разу май більше. Або годуй. Або і те, і те.","~2 Па-па, грошики.","~3 Без образ, братуха.","~3 Відпрацюю. Мо'. Як настрій буде."],"попередження":["Даю тобі хвилину. Потім сам полізу в сумку. Чесне слово.","~3 Хвилина, братан. Потім не ображайся.","Хвилина, дурне. Потім сумка моя.","Рахую до шістдесяти. Я, бля, рахувати вмію. Потім лізу.","~1 Хвилина, і я в твоїй сумці. Все переверну, курва.","~2 Хвилина. Я попередив, шоб потім не скигли{в|ла}.","~2 Чуєш, як пузо гарчить? За хвилину гарчатиму я. На тебе.","~3 Братуха, дай шось. Бо за хвилину сам візьму."],"натяк_вступ":["слухай сюди, дурне:","~1 бо ти ж сам{|а} не допетраєш:","~3 ну добре, скажу, бо ти сво{й|я}:","слухай, бо двічі не повторюю. Ну, повторюю, але злюсь:","та підкажу, хай тобі грець:","~1 для особливо обдарованих:","~2 та не муч ти себе:","~2 хуй з тобою, скажу:","~3 тіко тобі, по секрету:"],"натяк_де":["є одне м'ясо — за нього я б тебе навіть не клював. Шукай {place}.","моє улюблене м'ясо — {place}. Шукай, ледача ти дупа.","~3 найкраще м'ясо — {place}. Принесеш — тиждень не клюну. Чесне воронське.","шукай {place}. Більше нічо не скажу, хоч ріж.","моя улюблена жратва — {place}. Ворушись, бля.","~1 {place}. Вкури{в|ла}? Нє? Я так і знав.","~2 то {place}. Принесеш — мо', подобрішаю."],"натяк_літера":["Ну шо, тупа макітро, на «{letter}». Тепер навіть ти знайдеш.","На «{letter}». Принесеш — тиждень не клюну. Мо'.","~3 На «{letter}», братуха. Чекаю.","На «{letter}». І не кажи потім, шо не чу{в|ла}.","~1 На «{letter}», бовдуре. Букви хоч знаєш?","~2 Перша буква — «{letter}». Решту сам{|а}, я тобі не нянька.","~2 «{letter}». Все. Ворушись."],"улюблене_вперше":["йо! {food}! ОЦЕ інша справа, бля! Запам'ятай, вдруге не скажу.","нарешті шось путнє! {food}. Тіко нікому не кажи, шо я радів.","~1 {food}... Ге. А ти, виходить, не зовсім безнадійн{ий|а}. Майже.","~3 {food}! Ах ти ж падло моє рідне, вгада{в|ла}!","{food}?! Ти шо, шпигува{в|ла} за мною? Та й похуй, давай сюди.","~1 {food}! Ну нарешті хоч шось ти зроби{в|ла} по-людськи.","~2 {food}. Ото так. Ти, курва, вгада{в|ла}.","~2 о, {food}. Я навіть матюкатись не буду. Сьогодні."],"улюблене_кінець":["Тіко не зазнавайся.","~3 Цього я, бля, не забуду.","І ботану нашому не кажи.","Запам'ятай, дурне.","~1 Але я все одно злий. Принципово.","~2 Нормально вийшло, га.","~2 Ше так — і я тебе, мо', полюблю. Трошки.","~3 Золото ти моє, курва."],"улюблене":["Моє улюблене! Цього разу не клюну. Мо'.","{food}. Оце, бля, я поважаю.","~1 {food}. Можеш же, як захочеш, дурне.","~3 {food}... Ти мене знаєш, братан.","О, знову {food}. Ти вчишся. Повільно, але вчишся.","{food}. Цього разу живи.","~1 {food}. Ну от, а скигли{в|ла}, шо не знаєш.","~2 Моє улюблене. Сьогодні не клюю, свято.","~2 {food}. Хоч шось у тебе виходить як треба."],"обївся":["Уф. Не лізе. Я тепер не ворон, а бочка з пір'ям.","Нажерся, бля. Нікуди не лечу, навіть не проси.","~1 Ше шматок — і я лусну тобі на плече. Прямо на плече.","~3 Все, братуха, досить. Я ситий, як кабан на весіллі.","Пузо як барабан. Не тискай, бо перну.","Ше ложку — і рвоне. На тебе, вкурив?","~1 Відгодовуєш мене, як кабана? Під ніж? Я тебе розкусив, сука.","~2 Об'ївся. Летіти не можу, матюкатись — і то ліньки.","~2 Нажерся, як свиня на поминках. Ік."],"ситий_їсть":["Я не голодний. Але від халяви не відмовляюсь, я ж не дурний.","~1 Ситий я. Дякувать не буду.","~3 Про запас з'їм. Ти ж стара{вся|лася}, шо я, звір який?","Не голодний. Але дай сюди. Сюди, кажу.","Про запас. Зима довга, бля.","Халява — то святе.","~1 Жеру не тому, шо хочу, а тому, шо можу.","~2 Ситий, але відмовлятись — гріх. Великий гріх.","~2 Їм, бо ти стара{вся|лася}. Тіко не звикай."],"з_торби":["Сам пожер із торби: {food}. Від тебе ж хрін дочекаєшся.","{food} з торби — і мені вже не хочеться видовбати тобі око. Поки шо.","Похрумтів: {food}. Хоч торбу ти не просра{в|ла}, і то добре.","Торба — єдине розумне, шо ти в житті зроби{в|ла}. Їм: {food}.","Перекусив: {food}. Мало, бля. Але краще, ніж на твою пику натщесерце дивитись.","Пожер із торби: {food}. Наступного разу клади більше, жмотяра.","{food} — з'їдено. Не дякуй, я сам собі хазяїн.","Жеру з торби: {food}. Хоч якась користь із твоїх кривих лап.","Сам себе нагодував: {food}. Ти б іще тиждень дупу чуха{в|ла}.","Ковтнув: {food}. На смак — як моя зневага до тебе. Але піде."],"вдяг_sumka_dlia_hoduvannia":["Торба? Йо! Нарешті хтось про моє пузо думає.","Гарна торба. Тіко покласти туди шось не забудь, жмоте.","Тепер я сам собі кухар. А ти — ішак з торбою.","~1 Торбу почепи{в|ла}. А жратва шо, сама туди залізе?"],"вдяг_zakhysnyi_osheinyk":["Ошийник. Я шо тобі, собака?","Міцний. Як ти знову здохнеш, мені хоч не так боляче буде.","Затягни ше тугіше — і я вночі тебе придушу. Тихенько.","~1 Нашийник на ворона. Геніально, бля. Геній, курва."],"вдяг_dzvinkyi_oshyinyk":["Дзвоник? Я шо, корова на пасовищі? Дзень-дзень, курва.","Дзеленчить, зараза. Але хай: гадів почую раніше за тебе.","Бубонця мені почепи{в|ла}? Ну, тоді я й орати буду голосніше.","~1 Ше раз дзенькне біля вуха — дзьобну. В тім'я."],"вдяг_kaptur_avanhardu":["Каптур. Тепер мене ніхто не впізнає, як я від тебе звалю.","Все, я в каптурі. Бійтесь, гади. Я на районі.","Смердить чужою башкою. Але сидить нормально.","~1 Прикри{в|ла} мені пику, шоб не бачити? Хитро, падло."],"вдяг_kihtiaste_namysto":["О, оце я розумію. Кігті, бля!","Тепер рватиму глибше. Красень.","Як будеш здихать — я озвірію. Ше гірше, ніж зазвичай, вкурив?","~1 Нарешті шось путнє, а не твої дурні шапки."],"вдяг_moneta_na_udachu":["Монета! Моя! Не віддам, хоч ріж.","Ну добре, крастиму рідше. Трошки. Не звикай.","Блищить, бля... Ну все, менше буду в твоїй сумці копирсатись.","~1 Одна монета? Жмотяра. Але беру, давай."],"вдяг_kholodnyi_medalion":["Холодний, як твоє серце. Кайф.","Тепер мороз мені по цимбалах. Хе.","Кого клюну — той задубіє. Оце діло.","~1 Лід на шию, придурку. Тобі б таке."],"вдяг_kihti_komara":["Жала! Тепер колю, як ті падли з рівнин.","Сяду на плече — не сіпайся, бо проколю нахуй.","Швидше й далі. Тепер дістану тих гадів, від яких ти драпаєш.","~1 Комарячі кігті. Найкраще, шо ти мені коли-небудь да{в|ла}. Серйозно, бля."],"вдяг_spiral_zakhystu":["Спіраль. Тепер латать тебе швидше буду, як знов підставишся.","Блищить і гріє. Ну шо, залатаю тебе швидше, хай.","Тепер я і рву, і латаю. Майстер на всі лапи, бля.","~1 Оберіг? Мені? Ти шо, головою вдари{вся|лася}?"],"здобич":["Поклював трошки. Свіженьке, бля. Не дякуй.","Ням. Хоч трупи мене годують, не то шо деякі.","~1 Ти вбиваєш, я жру. Все по-чесному.","~3 Дякую за обід, братан. Йому вже не треба.","Свіжина. Ти хоч на шось придатн{ий|а}.","Поклював. Тепер можна жити.","~1 Твій труп я б теж поклював. Колись. З радістю.","~2 Тепленьке ше. Смачно, курва.","~2 Не дивись, я їм. Відвернись, кажу."],"муд_як":["влетів низько, прямо в пику.","рвонув напролом, як бик.","без всяких кругів — зразу в табло.","кігті вперед — і понеслась, бля.","зайшов знизу, звідки не ждали.","гепнувся на нього, як сокира.","~1 ти стоя{в|ла}, а я пахав.","~1 знов я, бо ти ні на шо не здатн{ий|а}.","~2 швидко і по-брудному, як я люблю.","~3 полетів за тебе, братан."],"муд_
