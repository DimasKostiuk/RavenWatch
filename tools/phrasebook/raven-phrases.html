ціль":["{target} тепер у смужечку, хе.","У {target_gen} тепер нова зачіска. Модна.","Шкура {target_gen} — на ганчірки.","{target} ше довго чухатиметься.","Пику {target_gen} я перекроїв. Нахуй.","{target} тепер знає, хто такий Мунін.","З {target_ins} розібрались. Самі дірки лишились.","На {target_gen} тепер без сліз не глянеш."],"муд_оцінка":["Ше!","Мало, бля!","Хто ше хоче?","Рву далі, нахуй.","Кровця гаряча. Йо.","~1 Вчись, лошара.","~1 А ти шо, ромашки нюхаєш?","~2 Пішло, бля, пішло.","~2 Добивай, поки тепле.","~3 Для тебе, братан.","~3 Хай тіко хтось тебе зачепить."],"муд_крит":["прямо в око, бля!","до самої кістки!","знайшов, де м'якенько.","по жилах — і хана.","~1 тобі так в житті не вміти.","~3 це тобі, на, подарунок."],"муд_серія":["раз! Два! Три, курва!","рвав, поки було шо рвать.","живуча падла, але я дожав.","кігтями — тричі, шоб наверняка.","~1 мусив ше раз, бо ти стоїш, як пеньок.","~3 поки тебе хтось чіпає — не відпущу."],"муд_промах":["нікого, бля.","пусто, хай йому грець.","повітря порвав. Повітря, сука.","там пусто, як у тебе в башці.","~1 дарма, бля, злітав через тебе.","~3 нікого, і це добре."],"муд_промах_кінець":["Куди ти тицяєш, сліпошара?","Нормальну ціль давай, а не це.","Наступного разу — когось живого, вкурив?","~1 Ше раз — і дзьобну тебе.","~2 Ну буває. Буває, бля.","~3 Ти цілий — і похуй на решту."],"пл_бачив_м":["я все бачив, бля.","я дивився, аж кігті свербіли.","з плеча кожну кишку видно.","бачив зблизька, як в кіно.","~1 дивився і плювався.","~3 я був поруч. Я завжди поруч.","я все бачив, курва.","з плеча — як у першому ряду.","я дивився й облизувався.","я бачив, як бризнуло. Ух!","я пас, аж кігті свербіли.","я все запам'ятав, ага.","~2 я бачив, бля.","~3 я дивився й пишався, ну."],"пл_вбивство_суд_м":["Готово. Так йому й треба, гниді.","Одним менше. Ше тисяча, бля.","{top} більше не рипнеться.","Кров як бризне! Краса.","Ти {рубонув|рубонула} так, шо я аж заздрю.","~1 Криво, як завжди. Але труп — і то хліб.","~2 Норм. Ше давай.","~3 Красиво, бляха. Поважаю.","Здохло, падло.","Кров гарна, бля.","Мало!","Ше давай.","{top} — в землю, нахуй.","~1 Пощастило тобі, лох.","~2 Гарно.","~3 Красень, курва."],"пл_вбивство_порада_м":["Хто наступний, га?","Не стій, як пень, рубай далі.","Ззаду ше один, сліпошаро!","~1 І не дякуй, шо я не вліз.","~2 Добивай решту, нахуй.","~3 Пішли, ше когось знайдем.","Добий решту.","Шукай ше.","Ріж далі, бля.","Не стій, як пень.","Обшмонай труп.","~1 І не випендрюйся, баран.","~2 Ше!","~3 Пішли гасити далі."],"пл_різанина_суд_м":["Оце, бля, бенкет!","Трупів, як грибів після дощу.","Я в ахуї, чесно.","Тут тепер тіко мухи й ми.","~1 Нарешті хоч шось путнє.","~3 Звірюка ти, курва. Оце по-нашому.","Кишки скрізь.","Свято, курва!","Ше!","Мухам гулянка.","Поле наше, бля.","~1 Нарешті шось путнє.","~2 Гарно, бляха.","~3 Ти мій звір."],"пл_ледь_що_м":["тебе ледь не вбили, бля.","я вже думав, кого собі нового шукать.","тебе мало не розмазало, як масло.","твоя кров у мене на пір'ї. Фу.","~1 ше трохи — і я б тебе з'їв.","~3 не смій так більше, чуєш?","ти хитаєшся.","кров хлище, бля.","валькірії вже кружляють.","серце гупає, як скажене.","ноги трусяться.","смерть у пику дихнула.","~1 ти майже {здох|здохла}.","~3 я злякався, курва."],"пл_ледь_порада_м":["Жери шось і не здихай.","Драпай, поки є чим.","Щит, бля, підніми!","~1 Здохнеш — я іржатиму.","~2 Обережніше, бо я до тебе вже звик, курва.","~3 Живи, чуєш? Живи, кажу.","Пий зілля!","Тікай, бля!","Жери шось!","Щит вище, баран!","Назад, до вогню.","~1 Або здихай, мені по барабану.","~2 Обережно, бляха.","~3 Живи, курва."],"пл_спокій_що_м":["сиджу. Нудно, бля.","рахую, скіки раз ти почуха{вся|лася}.","чищу кігті об твою куртку. Не смикайся.","дивлюсь, кого б дзьобнуть.","~1 стоїмо, як два дебіли.","~3 нормально отак посидіти, га.","дзьобаю твій комір. Бо нехуй робити.","рахую воші. Твої, ага.","дивлюсь на хмари. Одна — вилита твоя пика, гиги.","слухаю, як в тебе пузо бурчить. Як ведмідь у норі.","точу дзьоба об твій наплічник. Не пищи.","висиджую яйця. Та жартую, бля, нашо ти так дивишся.","~2 майже кимарю.","~3 гріюсь об тебе, як об пічку."],"пл_спокій_думка_м":["Нудно, хоч вий.","Пішли когось вб'ємо.","Тиша мене бісить.","~1 Ше хвилина — і я тебе покусаю.","~2 Ну шо, підемо кудись, га?","~3 Та хай, хай буде тихо.","Нудьга — капець.","Хоч би хтось напав, курва.","Тьху на цю тишу.","Скоро дах поїде.","~1 Ти б хоч почуха{вся|лася}, для сміху.","~2 Ну й хай.","~3 Та нормально все.","~3 Ше посидимо, ага."],"пл_тут_де_м":["{biome_here_in} смердить, як у сраці.","{biome_here_in} кожна падла хоче нас зжерти.","сиджу на тобі {biome_here_in} і нюхаю. Шось не те.","{biome_here_in} кровцею пахне.","{biome_here_in} шось дохле валяється.","{biome_here_in} кущі ворушаться, бля.","{biome_here_in} вітер падлом смердить.","{biome_here_in} я чую, як хтось зубами клацає.","{biome_here_in} комарі злі, як я зранку.","{biome_here_in} багнюка по коліна, курва.","{biome_here_in} тиша якась мутна.","{biome_here_in} хтось на нас зирить."],"пл_тут_що_м":["А шо, мені заходить.","Сокиру з рук не випускай, чуєш.","Хтось тут ховається, сто пудів.","~1 А ти, як завжди, ніхуя не бачиш.","~2 Пару цілей бачу. Гасимо?","~3 Я пасу, не бійсь. Ну.","Дивись під ноги, баран.","Не лізь у кущі, кажу.","Шо ворушиться — те рубай.","Тут хтось двине копита. Тіко не ти, ага?","А мені тут кайф, бля.","~1 А ти, ясний перець, ніхуя не помітиш.","~2 Зирь в оба.","~3 Твою спину я пасу, не сси."],"пл_бос_слава_м":["Ми його, бля, на шматки порвали!","Ото, курва, махач був!","Кишки — мої. Не лізь, бо дзьобну.","Про це пісні складуть. А хто не складе — тому в табло.","~1 Я, чесно, на нього ставив. Бабки через тебе просрав.","~3 Ти — найкращ{ий|а}, бля. Розкажеш комусь — я відмажусь.","Капут йому!","Кров і слава, бля!","Ми — найкращі!","Про це пісні горлатимуть.","Трофей наш.","~1 Охуїти.","~2 Гарно, бляха.","~3 Ти — легенда, курва."],"пл_будова_погляд_м":["криво, як твої руки.","стіна на соплях тримається.","з плеча кожну дірку видно, бляха.","не хата, а курятник якийсь.","~1 троль би краще склепав, їй-бо.","~3 ну, майже норм. Майже.","стовп кривий, бля.","дах у дірках.","дошки не сходяться ніфіга.","стіна хилиться.","підлога горбата, як дід.","цвях стирчить, курва.","~2 ну, стоїть.","~3 нічо так."],"пл_будова_порада_м":["Ламай нахуй і по новій.","Дах роби, бо я мокнути не підписувався.","Жердину мені поставиш — і хай стоїть, нічо.","~1 Краще піди когось відгаси, будівельник хрінів.","~2 Ну, хай. Похуй.","~3 Головне, шоб тепло було, братан.","Підбий цвях.","Рівніше стіну, ну.","Дах не забудь, баран.","Двері ширші, шоб я пролазив.","~1 Або розвали нахуй і по новій.","~1 Найми когось, хто вміє.","~2 Згодиться.","~3 Гарно, бляха."],"пл_море_що_м":["вітрюган у пику, бля.","хвилі хлюпають мені аж під пір'я.","вода солона, в дзьобі солоно, гидота.","сидимо в кориті посеред моря, як двоє лохів.","~1 стерновий з тебе, як з мене балерина.","~3 море нічо так, жити можна.","вітер пір'я рве.","бризки в пику, бля.","хвиля через борт.","чайки дражняться.","сіль скрізь, курва.","корито хитає.","~2 пливемо.","~3 добре йдемо."],"пл_море_думка_м":["Курс тримай, бо втоплю нахуй.","Хоч би кит якийсь виплив. Я б його клюнув.","Нудно, але красиво, курва мать.","~1 Куди премо, капітане? Ти хоч сам знаєш?","~2 Терпимо. Шо ше лишається.","~3 А добре нам тут, га, братан?","Тримай стерно, баран.","Скоро суша, га?","Ненавиджу воду, бля.","Хоч би змія завалити.","~1 Не втопи нас, дурне.","~2 Ну, пливемо.","~3 Кайф, курва.","~3 Пливемо далі."],"пл_плавання_що_м":["я мокрий до самої сраки.","в мене вода вже в дупі булькає.","плаваєш ти, як сокира, тіко гірше.","~1 топиш мене, падлюка така.","~3 тримайся, бо я теж тримаюсь. Ледве, бляха.","я мокрий, як щеня.","хвиля в дзьоб, бля.","вода крижана, курва.","лапи мерзнуть.","риба витріщається.","пір'я як цегла.","~2 мокро, бляха.","~3 тримаюсь."],"пл_плавання_порада_м":["На берег, бігом!","Ше раз у воду — дзьобну в тім'я.","Човен купи, жмот йобаний.","~1 Пірнеш — злечу нахуй і не вернусь.","~3 Ше трошки. Греби, давай.","Греби!","Не тони, бля.","Берег там, сліпаку.","Вилазь бігом.","Голову вище, дурне.","~1 Тони вже, якшо так хочеш.","~2 Ше трохи.","~3 Тримайся, курва."],"пл_падіння_що_м":["гепну{вся|лась}, як мішок з гівном.","я мало з плеча не злетів, бля.","земля тебе, видно, любить. Аж тягне.","~1 шкода, шо не з більшої висоти.","~3 ціл{ий|а}? Ну й нормас. Я не злякався, шо ти.","гуп, бля.","земля тверда, сука.","ледь не злетів.","пір'я посипалось.","аж кістки хрупнули.","ноги цілі, га?","~1 шкода, шо ці{лий|ла}.","~3 наляка{в|ла} мене, падло."],"пл_падіння_порада_м":["Під ноги дивись, а не в небо.","Крил у тебе нема, якшо шо. Нагадую.","Наступного разу стрибай сам{|а}, без мене, ясно?","~1 Ше раз — і я пересяду на когось нормального.","~3 Обережніше, дурне. Я ж переживаю, бля. Трошки.","Дивись, куди стрибаєш.","Не стрибай, бля.","Повільніше, ну.","Схилом іди, баран.","Крил нема, пам'ятай.","~1 Або стрибай вище. Раз — і з концами.","~2 Обережно.","~3 Бережись, курва."],"пл_дощ_що_м":["я мокрий, як щур у канаві.","дощ ллє за шкірку і під пір'я, сука.","небо на нас, бля, обісцялось.","~1 ти навіть від дощу мене сховати не можеш, лошара.","~3 мокро, зате разом. Ну.","вода за комір.","пір'я злиплось, бля.","калюжі по коліна.","небо ссить.","мокро, курва.","хлюпає, сука.","~2 ну, мокро.","~3 від тебе тепло."],"пл_дощ_думка_м":["Дах шукай, ну!","Ненавиджу воду. Хай вона здохне.","Хоч би вогнище якесь, трясця.","~1 Шоб тебе грець, з такою погодою.","~2 Скоро вщухне. Мо'.","~3 Нічо, обсохнемо, братуха.","Дах шукай.","Ненавиджу мокнути, бля.","Вогню б.","Хоч під дерево, ну.","~1 Це все через тебе, бля.","~2 Мине.","~3 Обсохнемо.","~3 Терпимо разом."],"бурч_початок_м":["Ну от, бля.","Знов двадцять п'ять.","Та скільки, курва, можна.","Тьху ти.","Ну приїхали."],"бурч_тема_м":["плече кістляве, всю сраку натер.","премо хуй знає куди, як завжди.","{biome_here_in} смердить гірше, ніж у Хугіна з дзьоба.","вітер у пику, сонце в око, бляха-муха.","Хугін знов усю ніч розумничав, ботан.","жерти нема, гасити нікого.","в торбі в тебе тіко гриби й каміння, жеброта.","~1 ходиш ти, як корова п'яна.","~1 смердиш потом і болотом, аж очі ріже."],"бурч_тема2_м":["І пір'я свербить, сука.","І ніхто, бля, не годує.","І ти ше під ніс мугикаєш, жах.","І нудно, хоч здохни.","І взагалі все гівно. Все."],"бурч_висновок_м":["Ненавиджу все. Все!","Колись я велетнів рвав, а тепер оце, бля.","Та кому я це кажу.","Добре, заткнувся. Ну, на хвилинку.","~1 А ти — найгірше в цьому всему гівні.","~2 Ну та й хрін з ним.","~3 Але з тобою якось терпимо. Якось."],"нак_згода_м":["Та добре.","Лечу, лечу.","Та лечу вже, бля.","Шо ти ореш? Лечу.","Ну. Ну!","~1 Тьху. Та хрін з тобою.","~1 Я тобі шо, шісточка?","~2 Без питань, братан.","~3 Для тебе — хоч на край світу, чуєш."],"нак_поруч_м":["Буду поруч. Не загубись, бо шукати не буду.","Збоку полечу, шоб тебе бачити.","Тримаюсь біля тебе, як реп'ях.","~1 Тіко не наступи на мене, слоняра.","~3 Поруч — то моє місце. Хто сунеться — в табло."],"нак_коло_м":["Покружляю, гляну, кому дзьобом у тім'я.","Згори все огляну. Все, кажу.","Коло зроблю над твоєю дурною башкою.","~1 Кружлятиму, поки ти тут тупцюєш, як баран.","~3 Пасу згори. Йди спокійно."],"нак_розвідка_м":["Гляну, кого там можна завалити.","Злітаю наперед, зара.","Гляну, хто там нас пасе.","~1 Знов я першим під сокиру. Знов, бля.","~3 Я швиденько. Чекай, не рипайся."],"нак_трюк_початок_м":["Дивись сюди.","Ану, ану.","На.","~1 Цирк для лохів.","~3 Це тобі, братан."],"нак_трюк_м":["«{trick}» — дивись і рюмсай.","Зара буде, курва, краса.","Хугін так не вміє. Ботан.","~1 За виставу бабло гони.","~3 Зайде — скажи. Не зайде — мовчи."],"нак_догонялки_м":["Хугіне, сраку бережи!","Хугіне, наздожену — обскубу, як курку!","Ану, ботане, тікай!","Хугіне, наздожену — пір'я по всему лісі збиратимеш!","Ану, професоре, покажи, шо там у тебе за крила!","Хугіне, ти повільний, як твої думки, бля!","~1 Хугіне, тікай, бо я сьогодні голодний. Дуже.","~3 Хугіне, погнали! Покажемо всім, як треба!"],"гон_спіймав_м":["Квач, ботане!","Є! Тепер ти мене лови, Хугіне, ха!","Попався, професоре!","Ха! Думав, утечеш? Від мене?","~1 Хугіне, ти повзаєш, як слимак у болоті. Сором.","~2 Квач! Хто тут найшвидший, га? Я!","~3 Квач! Ну, старий, давай, лови!"],"гон_попався_м":["Тьху! Ну все, начувайся, гад!","Пощастило тобі, Хугіне. Тіко пощастило.","Та я спеціально піддався. Спеціально, ясно?","~1 Ну все, Хугіне, тобі пиздець.","~2 Добре, твоя взяла. Поки шо.","~3 Та добре, добре — тікай, бо доганяю!"],"нак_кінець_м":["Все, досить. Назад.","Налітався. Сідаю на плече.","Все, вертаюсь.","~1 Заїбався я від твоїх дурниць.","~3 Добре політали, братан.","Налітався, аж крила гудуть. Сідаю.","Досить з мене того неба, бляха.","~2 Ну все, на плече. Не смикайся."],"нак_додому_м":["Лечу, бля.","Та вже!","На плече, ага.","~1 Нарешті, курва.","~3 Я тут. Тут я.","Лечу, лечу, не ори.","Та не репетуй ти. Вертаюсь.","~2 Та добре. На плече."],"прм_злодій":["спиздив «{food}». Бо можу.","«{food}» — моє. Порюмсаєш потім.","торбу не зав'яза{в|ла}? Сам{|а} й винн{ий|а}, лошара.","я не голодний. Я просто крадій, а шо такого?","~1 мінус «{food}», лох. Гав не лови.","~1 шо впало в торбу — те пропало. В мене.","~2 взяв «{food}». Нічо особистого, братан.","~3 «{food}» — на згадку. Не жмоться."],"прм_монети":["{coins} — мої. Блищать, аж кайф.","забрав {coins}. Йди Одіну скаржся.","~1 {coins}, жмот. Тобі однак нема на шо їх тратити.","~2 позичив {coins}. Не рахуй, бо дзьобну.","~3 {coins} — на наше спільне щастя. На медовуху."],"прм_гидую":["«{food}»?! Сам{|а} це жри, бля.","тьху. «{food}». Ти шо, знущаєшся?","забери оце, поки я тобі на плече не блюванув.","~1 ше раз даси «{food}» — око виклюю.","~1 я тобі шо, свиня? Свиням і неси.","~2 нє. Не буду. Нормальне шось шукай.","~3 не ображайся, але «{food}» — нє. Ну нє."],"прм_бурчання":["все не так. Все, курва, через сраку.","плече тверде, дорога довга, ти — повільн{ий|а}, як смерть.","колись я велетням очі рвав. А тепер на тобі катаюсь, як дурень.","нудно. Давай когось вб'ємо, га?","~1 знов ти преш не туди. Як завжди, бля.","~1 від твоєї ходи мене аж блювати тягне.","~2 та добре, добре, мовчу. Майже.","~3 бурчу, бо люблю. Тіко не звикай, ясно?"],"прм_мокрий":["на, тримай води! Тепер ми квити.","обтрусився. На тебе. Спеціально, ага.","мокрий, злий і на тобі. Радій, бля.","~1 ти мене втопи{в|ла} — я тебе обтрусив. Чесно ж.","~2 пір'я мокре. Ділюсь, мені не шкода.","~3 вибачай, не стримався. Але ж смішно, ги."],"прм_гучний":["КАР! Ой. Ну, ти зрозумі{в|ла}, бля.","Скрадаємось? Я не вмію скрадатись. Нахуй те скрадання.","Кар! Хай знають, хто тут головний.","~1 Задовбало повзати. Хай нападають.","~2 Вирвалось. Буває, шо.","~3 Тихо-тихо... кар. Ой. Вибачай."],"прм_хизування":["бачи{в|ла}? Ні, ти БАЧИ{В|ЛА}?!","оце я. Оце удар. Оце, бля, Мунін.","плескай, чого стоїш, як пень.","~1 ти так не вмієш і ніхуя не навчишся.","~2 дай кайфонути моментом.","~3 це було для тебе. Ну, і трошки для мене."],"прм_ревнощі":["Хугіна годуєш? От і сиди з ним, з ботаном.","Не чіпай мене. Йди до свого професора.","Я все бачив. П'ять хвилин мене нема — і на тобі.","~1 Йому — жерти, мені — дулю. Я запам'ятаю.","~2 Образився. Не підходь.","~3 Я не ревную. Я просто злий. Дуже злий, курва."],"прм_ревнощі_кінець":["Ну добре. Але Хугін мені винен. Багато.","Все, досить. Я вже не злий. Майже.","~1 Пробачив. Цей раз. Не звикай.","~3 Не можу я на тебе довго злитись, бляха-муха."],"прм_сонько":["Ніч. Я сплю. Відвали.","Розвідка вночі? Йди сам{|а}, мені похуй.","Вранці. Все — вранці.","~1 Ше раз розбудиш — дзьобом у тім'я.","~2 Очі злипаються. Відчепись, га.","~3 Дай поспати, братан. Вранці полечу, чесно."],"прм_мерзляк":["холодно, сука. Пір'я ніхуя не гріє.","я мерзну. Шукай дах, ну!","мокро, холодно, гидко. Гидко, бля.","~1 тобі в шматтях тепло, а в мене дупа мерзне.","~2 залізу тобі за комір. Мовчи.","~3 біля вогню посидимо? Ну будь ласка. Ну."],"прм_сорока":["на: {item}. Не питай, звідки.","знайшов: {item}. Тепер це твої проблеми.","{item} — у торбу. Не дякуй, ага.","~1 {item}. Скарб. Якраз для такого лоха.","~2 притарабанив: {item}. Мо', згодиться.","~3 це тобі: {item}. Від серця, бля."],"прм_свавілля":["Не полечу. Бо не хочу. І шо?","Сам{|а} лети, раз так приспічило.","Накази своїй козі давай.","~1 Ану ше раз. Мо', передумаю. Нє.","~2 Настрою нема. І сили нема. Нічо нема.","~3 Вибач. Сьогодні — нє. Ну нє."],"прм_страх":["на ЦЕ? Сам{|а} туди лізь, я пас.","ти бачи{в|ла}, яке воно здоровенне? Я — нє, дякую.","підрань його — тоді подумаю. Мо'.","~1 я скажений, а не йобнутий.","~2 спершу ти. Потім я. Такий розклад.","~3 я з тобою. Але — після тебе, ок?"],"прм_відвага":["Він хитається! МІЙ, бля!","Все, я не ссу! Рву!","Ну все, здоровило, тобі пизда!","~3 За тебе — хоч на самого Одіна, чуєш."],"пробудження_вступ":["Курва мать...","Шо за хуйня?","Тьху, гидота.","Йой, башка тріщить.","Ейктюр. На смак, як гівно."],"пробудження":["Я прокинувся, {name}. Не радій, бо рано.","Хто мене збудив? А, ти, {name}. Ну, тримайся.","Я тут, {name}. Все бачу і все, сука, запам'ятаю.","Прокинувся. Тепер я твій. Співчуваю, {name}, їй-бо.","Ну все, {name}, тепер я твій. Не звикну ніяк, бля.","Кров на дзьобі, сила в крилах. Ну шо, {name}, погнали.","Я довго спав, {name}. Тепер хтось за це огребе."],"пробудження_кінець":["Пішли вже.","Нагодуєш — буду чемний. Мо'.","Хтось сьогодні здохне. Не ти, сподіваюсь.","І не смій мене більше присипляти, ясно?"],"м_вигук":["Курва мать.","Тю, холєра.","Бляха-муха.","Ну, бля, приїхали.","Та хуй там.","Бля-а-а.","Пся крев.","Тю на тебе.","От сука.","Йо-о-о, бля.","Пиздець.","Та ну нахуй.","Дідькові в сраку.","Шляк би його трафив.","Ніхуя собі.","~1 Йобаний в рот.","~1 Ну шо за гівно, га.","~23 Ото, бляха.","~3 Ех, бляха, братан."],"м_лайка":["Ботан ти йобаний.","Хуй тобі, а не мудрість.","Професор, бля.","Заучка пернатий.","Розумник сраний.","Дупа ти з крилами.","Ну ти й мудило.","~1 Шмаркля дзьобата, тьху.","Вкурив, ботане?","Хай тобі грець.","Йолоп ти, а не ворон.","Довбойоб, їй-бо.","Мізків — як у курки, бля.","Я на це срав. З висоти.","Гівнюк ти, Хугіне, от шо.","~1 Шматок гівна в пір'ї.","~1 Чмо книжне.","~1 Закрий дзьоба, сучара.","~1 Шоб тобі дзьоб відсох.","~2 Розумник, бля, знайшовся.","~23 Мудак ти, але свій.","~3 Люблю тебе, засранця. Ну, трошки.","~3 Дурень ти, бля, але рідний дурень."],"м_слівце":["курва","бля","сука","трясця","хай йому грець","бляха","курва мать","холєра","нахуй","бляха-муха","пся крев","дідько","ну бля"],"м_почин":["^нудьга Хугіне, нудно, {м_слівце}. Розкажи шось. Нє, стоп, не розказуй. Ну розкажи.","^голод Я б зара когось зжер. Тебе, наприклад. Без солі.","^погляд Шо ти на мене так зиркаєш, ботан? Як Одін на п'яного.","^сон Мені снилось, шо ти заткнувся. Охуєнний сон, я аж прокидатись не хотів.","^мовчиш Хугіне, ти мовчати вмієш, {м_слівце}, чи в тебе це від народження таке?","^тиша Шось тихо. Аж бісить. Хай хтось когось уже вб'є, ну.","~1 ^мовчиш Хугіне, тіко почни мені тут розумничати — пір'я повискубую, ботан.","~23 ^нудьга Шо, професоре, як воно? Срав сьогодні?","~3 ^погляд Хугіне. Та нічо. Тіко гляну, шо ти тут, засранцю.","^свербить Хугіне, почухай мені під крилом. Нє, стій, не лізь, {м_слівце}. Там своє.","^одін Чуєш, а Одін там теж сидить і дуріє з нудьги, чи тіко нам так пощастило?","^мрія Знаєш, шо я хочу? Спиздити в Одіна око. Просто так. Шоб було.","^сварка Ану давай посремось, {м_слівце}. Чисто для розминки.","~1 ^винен Хугіне, ти мені винен. Шо — без поняття. Але винен, і крапка.","~3 ^плече Чуєш, я б це плече на Асгард не проміняв. Тіко нікому, {м_слівце}, бо дзьобну.","^голод Чуєш, як пузо бурчить? То воно тебе на обід кличе, ботан."],"м_відповідь":["^тиша Підозріло? Та це кайф, бля. Нікого клювати не треба. Ну, крім тебе.","^тиша Тиша, {м_слівце}. Зара шось вилізе і все засере, от побачиш.","^рахую Сорок два? Я б уже з глузду з'їхав. А ти й так з'їхав, ботан.","^рахую Рахуй, рахуй, професоре. А я покимарю.","^сни Мені м'ясо сниться. А тобі шо, книжки? Нудьга, бля.","^сни Сниться, ага. Як я тобі дзьоба відкручую. Кайфовий сон.","^компанія Компанія? Це ти про себе, чи шо, гівнюче?","^компанія В мандрах найгірше — твоя мудрість, {м_слівце}. Всю дорогу в вуха.","^сморід Болотом? Та то від тебе, {м_слівце}, книжками смердить.","^сморід Я смерджу, бо пашу. А ти пахнеш, бо ніхуя не робиш.","^розумне Розумне? Йди нахуй. Ось. Сказав. Шо, не розумно?","^розумне Я розумний, коли треба. Зара не треба. Відчепись.","^день Гарний? Ну, поки ти пиздіти не почав — гарний.","~3 ^утрьох Ага. Нормально, {м_слівце}. Тіко не розкисай мені, ботан.","~3 ^день Ну… гарний, шо. Не буду псувати. Сьогодні.","^одін Пам'ятає, а як же. Мене, {м_слівце}, не забудеш, хоч як старайся.","^одін Хай тіко спробує забути. Нагадаю. Дзьобом у тім'я.","^вітер Шось буде? Та й добре. Я вже сраку відсидів, {м_слівце}.","^вітер Вітер як вітер. Не вигадуй, професоре.","^пір'я Стирчить, бо я бойовий, ясно? А ти прилизаний, як жрець на свято.","^пір'я Де? Тут? Ну все, якшо пиздиш — ти труп.","^хмара А он та — на тебе схожа. Пуста і надута.","^хмара Набурмосена? Я тобі зара покажу набурмосену, {м_слівце}. В табло.","~3 ^дякую Та йди ти… Ну, тобто… й тобі. Ага. Й тобі, ботан.","~3 ^дякую Ну, бля. Шо ти мені тут розкис, як хліб у пиві.","^тиша Не любиш тиші? То я зара як заору. Легше стало?","^рахую Сорок третій — то я. Мене не рахуй, бо дзьобну.","^сни Снилось, шо я Одін. А ти мені п'яти чухаєш. Ото був сон.","^компанія Сам ти компанія. А я — подарунок. Долі, бля.","~3 ^утрьох Утрьох, бо третій годує. Якби не жрачка — кинув би вас обох. Мо'."],"м_про_гравця":["^калюжа Ти бачив, як {name} в калюжу гепну{вся|лася}? Я досі ржу, {м_слівце}.","^будує {name} знов шось будує. Як завалиться — я перший заржу, зуб даю.","^сам Хугіне, глянь: {name} сам{|а} з собою балакає. Ну пиздець, приїхали.","^меч {name} мечем махає, як мух ганяє, {м_слівце}. Сміх, та й годі.","~1 ^розчарування {name} сьогодні — повний відстій. Як і ти, ботан.","~23 ^похвала {name} — нормальн{ий|а}, {м_слівце}. Тіко {йому|їй} не ляпни, шо я таке сказав.","~3 ^болото За {name} я б і в болото поліз, {м_слівце}. Ну. По коліна. Не глибше.","^співає Хугіне, {name} знов шось мугикає. Вуха в'януть, {м_слівце}. Де в ворона вуха — не знаю, але в'януть.","^їсть Бачив, скільки {name} трескає? От мені б так, бля.","^спить {name} вночі хропе, як троль з перепою.","^руки {name} знов усе руками мацає. Шо бачить — те й лапає. Як я."],"м_кінець":["Все. Я сказав. Крапка.","Тьху на тебе, ботан.","Забудь. І я забуду, {м_слівце}. Вже забув.","Та ну його все нахуй.","^нудьга Історія — гівно. Як і ти, професоре.","^нудьга Ой смішно. Ой, тримайте мене, зара обісрусь.","^тиша Ну-ну. Ше подивимось, хто перший заверещить.","^голод Ну дай хоч хробака якогось, жмот.","^погляд|мовчиш Дивись, дивись. Я теж так вмію. Бачиш? Дивлюсь.","^сон Все одно приснишся мені з закритим дзьобом. Сто пудів.","^калюжа Я не впав. Я спланував. Шариш різницю?","^далеко Ага-ага. Аби не по колу, як минулого разу.","^ноги Я сили бережу. Для бійки. Шо, не можна?","^пейзаж Сам ти камінь. Тупий і сірий.","^голод Схуднути?! Я тобі зара так схудну — без пір'я лишишся.","^погода Я не скиглю. Я, бля, коментую. Різниця.","^звір Шкода, бляха. Такий смачненький був.","^куди Нормальні ворони летять. А ми трусимось на плечі, як мішки.","^смачний Ше глянем, хто кого зжере.","^кордон Тоді хоч медовухи. Хоч ковток, ну.","^знову Ну й виріши{в|ла}, і шо. Я теж вирішив: не заткнусь.","^гірше Я все чую. І мені не страшно. Ані крихти, ясно?","^стомився Ну… добре, помовчимо. Хвилинку. Одну.","^будує Ну-ну. Подивимось, хто з нас ржатиме останнім.","^сам Я не матюкаюсь, {м_слівце}. Я так розмовляю. Розумієш різницю?","^меч Мухи — то не тролі, професоре. Вкурив?","^розчарування Ой, все. Святий, бля, знайшовся.","^похвала Тіко спробуй ляпнути, {м_слівце}. Тіко спробуй.","~3 ^болото Є коліна! Просто сховані, {м_слівце}. Під пір'ям.","^ніч|бійка Ну хоч зранку комусь напихаю.","^валькірія Нехай ше прилетить. Я їй таку дорогу покажу — забуде, як звати.","^доб'ю Нічо, прогодуюсь. Тобою, ботан.","^п'яти Є в мене серце. Маленьке. Чорне. І злюще.","^всрався Не ржи, бо ти теж пискнув. Я чув.","^зілля Логіка, {м_слівце}, ага. Наступного разу сам носи, розумний.","^гордість Кабан був здоровенний! Я бачив! Як хата!","^весело Болить — то ше веселіше, ге-ге.","~3 ^лякай Не записуй! Бо видзьобаю, чуєш?","^хвальба Ну-ну. Хто кого, {м_слівце}, — то ше бабка надвоє сказала.","^спів Тіко не співай, {м_слівце}. Благаю. Я ж ворон, а не камінь.","^пиво|риба Ага. Розказуй, розказуй, пиздабол.","~1 Та йди ти в сраку, ботан.","~23 Ну й хай, {м_слівце}. Мені похуй.","~3 Все, мир. До вечора, засранцю. Потім знов посремось.","^свербить Сам ти шось живе. Блохастий.","^одін Та хай слухає. Я йому ше й заспіваю, {м_слівце}. Матюками.","^мрія Ото ше глянемо, хто кого побачить, ага.","~3 ^плече Тіко не розкисай, засранцю. Бо я теж розкисну.","^сварка Ну все. Знов я виграв. Бо ти мовчиш, як пень.","~1 ^винен Тишу? Ти? Мені? Ой, не смішіть мене, бля.","^співає Аби не я? Та я співаю, як бог, {м_слівце}! Як Браґі!","^їсть Та хай жере. Аби й мені шось лишилось, бо я ж не камінь.","^спить Я не хроплю. Я вві сні гарчу. Грізно.","^руки А мені цікаво, як тебе обскубти. Кожну пір'їну.","^шрам Пиздиш, як Локі. Навіть гірше.","^мед Ну ти й жлоб, {м_слівце}. Ріг меду пожалів.","^дим Найгарнішого? А, ну тоді ясно. На мене, кого ж ше.","^вовки Я теж голодний, бля. І я ближче. Тож слухай мене.","^очі Курчам? Йди сам глянь, розумнику. Я тут посиджу.","^руки Від злості — то так, {м_слівце}. Лапи аж свербять.","^пісня Двадцять один, ботан. Рахувати навчись спершу.","^сліди Відкриті, а як же. Я завжди на шухері.","^ще То я поспішу, професоре. Шоб скоріше той кінець.","Та пішов ти, {м_слівце}. Знаєш куди.","~3 Ну, добре. Хай буде по-твоєму. Раз.","^хвальба Пизди шо хочеш. Я попереду.","^хвальба Заздри мовчки, ботан.","^нюх Я жеру все, шо не втекло. І шо втекло — теж, якшо догоню.","^стовп Нашо мені стовп? Я межу носом чую, бля.","^тут Хай знайде. Пошкодує, сука.","^назад Гівно, але своє, рідне.","^погода Мокрий, бо ти мене під дощ потяг, розумнику.","^слід Біда — то моє друге ім'я, ботан. А перше — Мунін.","^дерева Коріння, поради — все одно криве, як не знаю шо.","^край Ну то пішли далі. Бурчу, бля, але йду.","^зорі_н Та блохи, зорі — одна хуйня. Дрібне все.","^сова Сторож, мудра… А верещить, як різана.","^місяць Хай світить. Тіко не на мене, бо дзьобну.","^холод_н Добре, добре. Тіко швидше, бо я в бурульку перетворюсь.","^шурхіт Дзьобну. Шоб знало.","^сон_н Ну то я покимарю. Ти ж однаково не спиш, от і стережи.","^драуґри Шкода, бляха. Я б подзьобав.","^історія Ха-ха. Смішно. Я аж не засміявся, бачиш?","^жарина Ну відсунувся. Але вогонь я запам'ятав. Він ше своє отримає.","^нудно_в Уві сні — то не те, шо наживо. Ну добре, хай буде.","^смажене_в Чемно? Я? Ну… спробую. Дай, бля, шматок. Будь ласка.","^ворони_в Пощастило, ага. Тіко не звикай, бо наврочиш."],"м_вогонь":["^спогад Пам'ятаю, ага. Ти з плеча гепнувся. Двічі, {м_слівце}. Я ржав.","^спогад Аякже. Ти верещав, як курча недорізане.","^спогад Пам'ятаю. Ти тоді шмарклі розпустив, як мала дитина.","^вогонь Тепло, {м_слівце}. Як у вовка в пузі.","^вогонь Я б тут і заночував, {м_слівце}. Назавжди. Хай нас усі нахуй забудуть.","^вогонь Спи, ботан. Я посторожу. Мо'. Як не засну.","^дражню Сам ти засмажений, {м_слівце}. На голову.","^дражню Я до вогню лізу, бо від твоїх жартів аж мороз по пір'ю.","~3 ^спогад Пам'ятаю. Класні були часи, {м_слівце}. І зара, бля, нічо так.","^казка Та я вже допер, чим кінчиться. Казка — гівно, {м_слівце}.","^казка А тоді прилетів інший ворон і дав тому розумнику в дзьоб. Кінець. Гарна казка.","^іскри Світлячки? То жар, дурню. Сунь туди дзьоба — сам дізнаєшся.","^іскри Гарно, {м_слівце}. Аби тіко на хвіст мені не сіли.","^завтра Куди поведе — там комусь і наб'ємо пику. Просто.","^завтра Та хоч у Гель. Аби там годували.","^зірки_в Мерехтять, бо дим, романтик ти пернатий.","^зірки_в Гарно, бля. Мовчи. Не псуй.","^мрія_в А я — про махач і повну миску. Ну і медовухи бочку.","^мрія_в Миска — то добре. А дах — для ссикунів.","^одін_в Сидить і бухає. Як завжди, старий.","^одін_в Сидить і про нас думає. Ну, про мене. Про тебе шо там думати.","^пісня_в Тіко спробуй, {м_слівце}. Тіко рота відкрий.","^пісня_в Співай. Я засну — і всім буде краще.","^день_в Довгий і нудний, бляха. Але вогонь — норм вогонь.","^день_в Закінчився, бо я заїбався, {м_слівце}."],"м_вогонь_почин":["^пиво Хугіне, ану розкажи, як ти тоді в пиво бовтнувся, {м_слівце}. Гиги.","^риба А пам'ятаєш, як ми три дні за рибу гризлись? Ти тоді гівнюк був. І зара гівнюк.","^спокій Сидимо. Ні троля, ні бійки. Аж лячно, {м_слівце}.","~1 ^спів Тіко заспіваєш — я собі вуха в багатті спалю. Чесно.","~3 ^подобається Добре тут, {м_слівце}. Ну. Подобається мені. Не ржи, бо дзьобну.","^шрам Хугіне, а шо то в тебе за шрам на лапі? Тіко не пизди, шо від дракона.","^мед Зара б медовухи, {м_слівце}. Цілий ріг. Нє, два.","^дим Дим в очі, бля. Спеціально на мене тягне, падлюка.","^історія Хугін, розкажи шось. Тіко не про мудрість, {м_слівце}, бо засну.","^жарина Жарина вистрибнула! Мало хвоста мені не підсмалила, курва.","^нудно_в Нудно, {м_слівце}. Пішли когось уб'ємо, га?","^смажене_в Смаженим пахне. Нам шось лишиться чи як?","^ворони_в А інші ворони зара теж біля вогню? Чи мерзнуть десь, бідолахи?"],"м_дощ":["^скарга Пір'я — як ганчірка, шо підлогу мили.","^скарга Я мокрий, як хвіст у риби. Нє, ше мокріший.","^скарга Ше трохи — і я качка, {м_слівце}. Кря, бля.","^скарга Хто, бля, цей дощ замовив? Знайду — заклюю.","^скарга З неба ссуть, а ми сидимо й мовчимо. Терпіли.","~1 ^скарга Ненавиджу воду. І тебе. Тебе більше.","^калюжі Хлюпає під лапами, {м_слівце}. На плечі! Як таке взагалі?","^сохнути Де сохнути будемо, га? Я питаю: де, бля?!"],"м_дощ_кінець":["^скарга Філософ знайшовся, {м_слівце}.","^скарга Сам ти мудрий. Мокрий, {м_слівце}, і мудрий. Тьху.","^скарга Ну… мо' й так. Але все одно хуйня.","~3 ^скарга Добре, ботан, мовчу. Тіко мокро, {м_слівце}.","^калюжі Бризкаю, бо можу. І шо ти мені зробиш?","^сохнути Тіко сунься, {м_слівце}. Тіко сунься.","^скарга Скінчиться, ага. Як і ти колись, професоре."],"м_туман":["^туман Все бачиш? Ну то скажи, де я, професоре. Ну? Ну?","^туман Засідки? Та я сам засідка, {м_слівце}. Ходяча.","^туман Одін би заблукав. А ти вже, бля, заблукав.","^туман Ніхуя не видно. Саме то, шоб когось клюнути з-за рогу.","~1 ^туман Не шукатимеш? Та я тебе сам знайду. І дзьобну.","~3 ^туман Та тут я, тут. Не скигли, засранцю, бо стидно.","^звуки То в мене в пузі. Я голодний, а ти — кроки, кроки.","^звуки Кроки. Здоровенні. Ну все, {м_слівце}, зара буде бійка.","^дорога На дорозі, де ж ше. Он камінь, он кущ. Чи то троль. Хуй його знає.","^дорога Дорога — там, куди {name} пре. Хоч у болото.","~2 ^туман Нічо не видно. Зате й нас не видно. Чесно.","^мряка_т Та краще б драуґр, {м_слівце}. Йому хоч у пику дати можна. А туман шо?","^мряка_т Холодно, бля. Ну… притулися, чи шо. Тіко без телячих ніжностей.","^силует Троль, сто пудів, {м_слівце}. Я печінкою чую. Готуй дзьоба.","^силует Та дерево. Але я б дзьобнув. Хай знає.","^голос Та я вже відповів. Матюком. Трьохповерховим.","^голос Кличе? То я йому зара так гукну, {м_слівце}, шо сам прибіжити.","^тримайся Я й так на плечі, ало. Ближче — тіко в пазуху.","^тримайся Розгубимось — знайду тебе по запаху. Ти смердиш книжками, ботан.","^вогник Ну бачу. Пішли туди, хай там хоч дідько з рогами сидить.","^вогник То болотний вогник, {м_слівце}. Дурнів заманює. Тебе, наприклад. Гиги.","^тиша_т Нічо не глушить. Слухай сюди: КУРВА.","^тиша_т Глушить, бляха. Мені це не подобається, чуєш?","^мокро Я важкий не від туману. Я від злості важкий.","^мокро Обтрусимось. Як пси. Шо тут думати."],"м_ніч":["^бійка Ніч. Саме час комусь напихати, {м_слівце}.","^темно Темно, як у тебе в голові, ботан.","^кістка Чуєш? Десь кістка хрумтить. Аж слина, {м_слівце}.","~1 ^сховаюсь Як хтось вилізе з кущів — я за тебе сховаюсь. А шо такого?","~3 ^спокій Посидь тихо, {м_слівце}. Ніч гарна. Не псуй.","^вовки Чуєш вовків? Виють. Ше й краще за тебе, {м_слівце}.","^очі Хугіне, з кущів хтось зирить. Двоє очей. Нє, четверо. Бля.","^зорі_н Зорі повилазили, {м_слівце}. Як блохи на собаці. Аж небо чухається.","^сова Сова верещить. От би їй голову відкрутити, падлюці.","^місяць Шо вирячився, місяцю? Га? Тебе питаю, пико лиса.","^холод_н Холодно вночі, {м_слівце}. Лапи задубіли нахуй.","^шурхіт Шось шурхотить у траві. Дзьобнути, чи шо?","^сон_н Хугін, ти спиш? Не спи, бо мені нудно, курва.","^драуґри Вночі драуґри вилазять. Хочу одному в гниле око дзьобом. Хрясь!"],"м_біом":["^біом Нові способи нас вбити? Кайф. Нові пики, шоб клювати.","^біом Смердить, як у троля в сраці. Мені подобається, шо.","^біом Ти собі запам'ятовуй, а я гляну, кого тут першим клюнути.","^біом Хто тут головний? Зара дізнаюсь — і насеру йому на голову.","~1 ^біом Ми тут всі здохнемо. Зате красиво, {м_слівце}.","~3 ^біом Ну… гарно, {м_слівце}. Тіко нікому, шо я це сказав.","^звірі Жеруть, ага. Але спершу я їх.","^звірі Тутешні ше не в курсі, хто прийшов, {м_слівце}. Зара будуть.","^мапа Тікати? Я не тікаю. Я красиво відступаю. Шариш?","^мапа Ти малюй свою мапу. А я гляну, хто тут найсмачніший.","^небо_б Колір як колір. Гівняний якийсь.","^небо_б Гарне, бляха. Тіко нікому не кажи, шо я сказав.","^рослини Пізно, я вже зжер. Нічо, живий. Поки шо.","^рослини Та не жеру, не жеру. Поки шо.","^перші Перші — значить, усе наше. Все, чуєш?","^перші Перші, бо інші не такі дурні, як ми.","^тиша_край Насторожено, бо знають, шо я прийшов. І правильно.","^тиша_край Тиша, бля. Перед бурею, по-любому.","^дім_далеко Чую. І заїбісь.","^дім_далеко Дім, дім… Там хоч жерти було шо.","^скарби Скарби — мої. Хто перший урвав — той і бере.","^скарби Блискуче? Де?! Де, курва? Показуй!"],"м_бос":["^бос «Впорались»? Я тій тварюці око видовбав, а ти шо? Рахував, ботан.","^бос Я бив. Ти пиздів. Все чесно, бля.","^бос Ше трошки — і я б з {boss_ins} сам впорався, {м_слівце}. Сто пудів.","^бос Бачив, як ця туша гепнулась? Охуєнно! Аж земля гупнула.","~1 ^бос Мало. Давай ше одного. Я тіко розігрівся.","~3 ^бос Красиво вийшло, {м_слівце}. Всі молодці. І ти, ботан. Ну, трошки.","^трофей Бачив. Половина моя. Я ж заслужив, {м_слівце}, чи шо?","^трофей Всего? Там кров і гівно. Моє улюблене.","^шрами Подряпини — то краса. Мені б такі, бля.","^шрами Подряпини загояться. А {boss} — вже ні. Ха!","~2 ^бос Нормально вийшло. Але наступного разу першим б'ю я. І не сперечайся.","^тиша_б {boss} лежити, от світ і видихнув. Я теж. І перднув трохи, вибач.","^тиша_б Тиша, тиша… Нудно, курва. Давай наступного.","^пісня Перший рядок: «Мунін завалив {boss_gen}». А решта — хуйня, не важлива.","^пісня Пісні — для слабаків, братан. Нам — м'ясо.","^одін_б Хай дивиться. Хай повчиться, як треба.","^одін_б Одін бачив, хто бив найсильніше. Я. Ну а хто ж іще.","^біль Нічо, загоїться. Головне — {boss} лежити, а ми ні.","^біль Дорого? Та норм. Я б і більше вивалив.","^наступний Та хоч хто. Я готовий, хоч зара.","^наступний Найбільшого давай. Шоб було шо клювати, бля.","^страх_б Мені — ні. Ну… трошки. Трошечки. Відчепись.","^страх_б Страшно, кажеш? Ссикло. Але я теж, якшо чесно."],"м_ледве":["^валькірія Я вже валькірію бачив, бля. Страшна, як твоя пика.","^доб'ю Ше раз таке втнеш — я тебе сам доб'ю. Чесно.","^п'яти Серце в п'ятах. Де в ворона п'яти — хто його зна, але там.","^всрався Я ледь не всрався. Ну, трошки всрався.","^зілля Хто, {м_слівце}, зілля забув? Я питаю: хто?! Ти?!","^гордість Тікати — не сором. Сором — то від кабана здохнути, бля.","~1 ^весело Ше б секунда — і було б весело. Похорони, все таке.","~3 ^лякай Не лякай мене так, {м_слівце}. Я ж не залізний.","^руки В {name} аж руки трусяться. А в мене лапи. Не кажи нікому."],"м_смерть":["^смерть Тіло шукати — то пів біди. А манатки потім тягти — от де пиздець.","^смерть Незручно? Ти, {м_слівце}, там не лежав, шоб казати.","^смерть Обходити? Я туди вернусь і всіх там поклюю, {м_слівце}.","^смерть Ти завжди кажеш. І шо? Хтось тебе слухає? Нє.","~3 ^смерть Добре, шо верну{вся|лась}, {м_слівце}. Більше так не роби, чуєш? Не роби.","^речі Хто спиздить — того я з'їм, {м_слівце}. Живцем.","^речі Підем. Тіко цього разу без геройства, бо знов ляжемо.","^ліжко Бухати було б веселіше, {м_слівце}.","^ліжко Ліжко — то добре. Могила — гірше. Логіка, ботан.","^валькірії Я б їм пір'я повискубував, курвам крилатим.","^валькірії Хай кружляють. Хуй їм, а не нас.","^помилка Помилка — шо ти, розумник, не попередив.","^помилка Помилка — то {name}. Завжди. Без варіантів.","^могила Колекція, бля. Скоро свій цвинтар відкриємо, з табличкою.","^могила Хай стоїть. Пам'ятник дурості. Нашій.","^холод_с Холодно, темно й нудно, як у дупі. Більше туди не хочу.","^холод_с Та я не лежав. Я сидів і чекав, ясно?","^помста Пошкодує, гнида. Я йому очі виклюю. Обидва.","^помста З розумом, без розуму — пику я вже запам'ятав.","^знову_с З нуля, бля. Голий, босий і злий як собака.","^знову_с Та не з нуля. Ми ж пам'ятаємо. Я — то точно."],"м_ревнощі":["^ситий О, {food} йому. А мені шо, повітря жерти?","^ситий Хугіна годують, а мені — обіцянки-цяцянки, {м_слівце}.","^ситий О, бачу, в нас любимчик завівся. Ссикло пернате.","~1 ^ситий Йому — жрачку, мені — дулю. Охуєнно, бля.","~3 ^ситий А мені? Ну хоч крихітку, {м_слівце}? Я ж теж свій.","^ситий Ага, Хугіну знов {food}. А я шо, бля, для краси тут сиджу?","^ситий Бачу, хто тут улюбленчик. Я все запам'ятаю, {м_слівце}. Все.","^ситий Хугін жере, а я дивлюсь. Як пес під столом, сука.","^ситий Смачно тобі, ботан? Шоб ти вдавився.","^ситий {food}… Мені б теж. Та кому я, нахуй, потрібен.","~1 ^ситий Його годувати — шо сову годувати. Ні толку, ні «дякую».","~3 ^ситий Ну добре, хай пожере. Але наступний шматок — мій, ясно?","^ситий {name}, в тебе два ворони, алло! Не забувай, бля."],"м_погроза":["^ситий Вночі прийду і очі тобі виклюю. Обидва.","^ситий Я це запам'ятаю, {м_слівце}. Я все запам'ятовую.","^ситий Ну-ну. Колись і я буду ситий, а ти — ні. Чекай.","^ситий Шоб ти вдавився, {м_слівце}.","~3 ^ситий Ну добре. Але наступного разу — я, засранцю. Домовились.","^ситий Я цей шматок запам'ятаю, {м_слівце}. Ой запам'ятаю.","^ситий Жери-жери. Я почекаю, поки заснеш. Гиги.","^ситий Наступного разу я перший. І все. Крапка.","~3 ^ситий Та хай. Але я запам'ятаю, хто ділився. А хто ні — тим паче."],"м_ситий":["^ситий А ти заздри, заздри, {м_слівце}. Тобі корисно.","^ситий Смачно, бля. Шкода, шо ти не взнаєш, {м_слівце}.","^ситий Мене годують, бо я страшніший. Все просто.","~1 ^ситий Шо зириш? Не поділюсь, хоч здохни тут.","~3 ^ситий Ну… на, понюхай, {м_слівце}. Тіко понюхай.","^ситий Дивитись можеш. Дивитись на халяву, {м_слівце}.","~2 ^ситий Я б поділився. Але вже зжер. Вибач. Нє, не вибач.","^ситий Подобрішаю? Не діждешся, {м_слівце}.","^ситий Заслуги? Я і є заслуга, бля. Весь, від дзьоба до сраки.","^ситий Чавкаю, бо смачно. А ти слухай і рюмсай.","^ситий Дивись, дивись. Очима не нажерешся, ботан.","~1 ^ситий Ше раз зирнеш — і тебе зжеру. На закусь.","~3 ^ситий На, крихту. Від серця відриваю, бля. Цінуй."],"м_хвалиться":["^хвальба Мені {name} більше довіряє. Бо я чесний, {м_слівце}. Чесний, кажу!","^хвальба Мене {name} частіше годує. Шариш, чого? Бо довіряє, {м_слівце}.","^хвальба Довіра в мене — як м'язи. Росте. А в тебе висить, як у діда.","~1 ^хвальба По довірі ти в сраці, ботан. Наздоганяй.","^хвальба Мене {name} більше любить, вкурив? Бо я чесний гівнюк, {м_слівце}.","^хвальба Бачив, як {name} мені лиситься? А тобі — хуй.","^хвальба Довіра в мене — як кігті. Гостра й росте, бля. А в тебе шо?","^хвальба Наздоганяй, ботан. Хоча куди тобі, з твоїми розумностями.","^хвальба Ше трохи — і я тут улюбленець. А ти — так, пір'я на вітрі.","~1 ^хвальба Ти позаду, як завжди, лошара. Звикай.","~3 ^хвальба Я попереду, Хугіне. Але й ти нічо. Майже. Трошки.","^хвальба Мене першим годують. Оце, бля, і є довіра, шариш?"],"м_відбивається":["^хвальба Ну то й шо, шо ти попереду? Зате я страшніший, {м_слівце}.","^хвальба Хвалься, хвалься, ботан. Я однаково голосніший.","^хвальба Довіра — то для слабаків, {м_слівце}. І для ботанів.","^хвальба Засунь ту довіру собі в сраку. Глибоко.","~3 ^хвальба Ну добре. Молодець ти. Тіко не зазнавайся, {м_слівце}, бо пір'я повищипую.","^хвальба Довіра, довіра… А хто вчора нашу людину від вовка закрив? Я, бля.","^хвальба Не матюкаєшся — бо нудний, як пень, {м_слівце}.","^хвальба Довіра — то нашийник. Носи сам, песик.","^хвальба Слухає тебе? Бо ти бубниш, і під тебе добре спиться.","^хвальба Наздожену й переплюну. Прям плюну, ага.","~1 ^хвальба Ше слово, ботан, — і пір'я в тебе поменшає. Сильно.","~3 ^хвальба Ну… красень. Тіко я все одно крутіший, {м_слівце}."],"м_дорога":["^далеко Куди ми, {м_слівце}, вже пів дня премось?","^ноги Добре, шо я на плечі. Пішки я б уже давно здох.","^пейзаж Дерево, камінь, дерево. Ше дерево. Охуєнні види, бля.","~3 ^далеко Далеко зайшли, {м_слівце}. Аж гордо якось, прикинь.","^голод Йдемо, а я голодний. Хтось про мене подумав, {м_слівце}? Нє?","^погода Йдем, йдем. Хоч би дощ пішов, чи шо. Для розваги.","^звір Чую звіра. Мо' завалимо по дорозі, га?","^куди Хугіне, ми взагалі знаємо, куди премось? Чи {name} просто так шляється?","^ноги Трясе, як на возі з камінням. Я вже пів пір'я розгубив, бля.","~3 ^стомився Ох, далеко. Мені вже навіть матюкатись ліньки. Уяви.","^пісня Хугіне, заспівай шось. Тіко не своє, а нормальне. Про бійку.","^сліди Глянь, сліди. Хтось тут ішов до нас. Або тікав. Від мене, мо'."],"м_море":["^спокій Підозріло? Та тут кожна хвиля нас зжерти хоче, {м_слівце}, а ти — підозріло.","^спокій Спокійне, бо ше не прокинулось. Почекай трохи.","^обрій Обрій, {м_слівце}. Там завжди шось є. Зазвичай змій, бля.","^обрій Там ніхуя нема, крім води. Вода, вода, вода. Задовбало.","^хитає Мене не хитає. Мене блювати тягне. Різниця.","^хитає Ше раз хитне — наригаю тобі на хвіст. Сто пудів.","^борт Я? За борт? Це ти в нас від мудрості важкий. Ти й підеш на дно.","~1 ^борт Не пірнатимеш? Та я тебе сам туди скину, ботан. З розгону.","^люблю Я кричу, бо мене хитає, {м_слівце}. Ясно тобі?","~3 ^люблю Кричу, бо люблю, ботан. Море люблю. Не тебе. Ну, й тебе.","^вітер Вітер у спину? То ти, професоре, перднув?","^вітер Хай дме. Аби не в пику, {м_слівце}.","^риба Риба — то жрачка. Ловіть, {м_слівце}, бо я голодний.","^риба Хай пливе. Я її потім гляну, як зголоднію.","^змій А я за бійку. В нього луска смачна, {м_слівце}, я чув.","^змій Втекти? З корабля? Вплав, чи шо? Ти дурний?","^буря Триматись за тебе? Та тебе першого здує, дохляк.","^буря Буря — то кайф! Хвилі до неба, {м_слівце}! Йо-хо!","^берег Берег там, де нас ше не зжерли.","^берег Нема берега. Є вода і твоя пика. Обидва — гівно.","~1 ^спокій Тихо, як на цвинтарі. Мені якраз.","~3 ^хитає Не хитає мене. Це я так танцюю, шо.","~3 ^обрій Там дім, ботан. Колись вернемось. Всі троє.","^обрій Ширше? В тебе й так голова, як вітрило. Надута.","^чайки Чайки — то щури з крилами. Ненавиджу, {м_слівце}.","^чайки Або теж заблукали. Як ми, лохи."],"м_перехід":["^смачний О, {biome_here}. Тут по-любому хтось смачний є.","^кордон Знов кордон. Ні митниці, ні пива. Шо за країна.","^знову Нашо ми знов сюди премось, {м_слівце}? Нашо?","^гірше Було {from_in}, стало {biome_here_in}. З гівна в гівно, бля.","^ще Скільки ше тих країв, {м_слівце}? Де вже той кінець світу?","^нюх Нюх-нюх… О, нові смаки, {м_слівце}. Шось тут їстівне по-любому.","^стовп Ні стовпа, ні знака, бля. Хто так межі ставить, га? Руки б повідривав.","^тут Все, {biome_here}. Ну, хто тут найзліший? Крім мене, ясно.","^назад Пішли назад, а? {from_in} хоч гівно було знайоме, рідне.","^погода Погода тут якась не така. Гірша, курва мать.","^слід Йо, хтось тут ходив. Здоровий такий. Хочу на нього глянути. Зблизька.","^дерева Дерева тут криві, як твої поради, ботан.","^край Ідемо, ідемо, ідемо… Де той край, бляха? Я вже заїбався."],"м_перехід_відповідь":["^запах Пахне так само. Тобою. Фу.","^запах Інакше? Тут смердить, {м_слівце}, ото й уся різниця.","^тихо Тихо, бо тут усе вже здохло. Логічно.","^тихо Нашо мені тиша? Мені бійка треба.","^пильно В мене очі завжди відкриті. Не те шо твої мізки.","^пильно Відкриті, ага. Шукаю, кого першим клюнути.","^межа Все інше? Та ті самі дерева, ті самі пики.","^межа Знак — то я. Велике чорне попередження, бля.","~3 ^додому Дім, {м_слівце}… Аж в пузі тепло стало. Не ржи.","^додому Дім? Ну, хоч пожерти дадуть. Нормально.","^повітря Я легкий, як пір'їна. То твоя мудрість важка, ботан.","^повітря Важче, бо тут небезпечно. Кайф.","^звірина Інша? То й шо. Нова — значить, я її ше не куштував.","^звірина Сліди здорові, бля. Оце я розумію — є кого гасити.","^барви Барви-шмарви. Сіре, зелене, гівняне — от і всі барви.","^барви Ну… гарно, шо. Ляпнеш комусь, шо я так сказав, — око виклюю.","^подих Я дму, звідки хочу, {м_слівце}. І шо ти мені зробиш?","^подих Вітер — то мій кент. Такий самий злий і без мізків.","^бували Ага, пам'ятаю. Тут нас мало не зжерли, курва. Класно було.","^бували Бували. Шось нічо хорошого не пригадую. Та й похуй.","^від Спокійніше? Та там мухи дохли від нудьги, братан.","^від Побачимо, ага. І когось завалимо. Сто пудів.","^карта Та запам'ятав. Межа — де смердить по-іншому. Шариш?","^карта Вертатися? Нашо? Я ше не нажерся.","^пташки Співають, бо не знають, шо я поруч. Зара дізнаються.","^пташки Шо там птахи… Я чую тіко, як у мене пузо бурчить.","^нове Небезпечне? Йо, то ж весело! Пішли вже, не сци.","^нове Ну то ти й лізь спереду, професоре. А я прикрию. Ззаду. Здалеку."],"м_на_думку":["О, філософ прокинувся, {м_слівце}. Ну-ну.","Це ти сам вигадав, чи в Одіна підслухав, га?","Глибоко. Я аж задрімав, {м_слівце}.","Пиздиш ти гарно. Але нахуя?","Ше скажи, шо вода мокра, професоре.","~1 Мудрий, як пень. Як трухлявий пень.","~23 Хм. А це навіть не тупо, {м_слівце}.","~3 Гарно сказав, {м_слівце}. Аж заздрісно, їй-бо.","О, ботан рота розкрив, {м_слівце}.","~1 Я на твою мудрість срав. Двічі.","~3 Ну… влучно, шо. Тіко не кажи, шо я сказав."],"м_данж":["^темно Темно? Зате мене не видно, {м_слівце}. Саме то.","^темно Сам ти темрява. Я тут бачу краще за тебе, сліпа курка.","^запах Золото — моє. Смерть — твоя. Все по-чесному.","^запах Драуграми тхне. Смачно, {м_слівце}.","^відлуння Розбуджу — то й наваляємо. Шо такого?","^відлуння КАР! Ой. Ну, бля, тепер точно знають, шо ми тут.","^скарб Скриня — моя. Хто перший побачив, того й скриня. Закон.","^тісно Тісно, бо в тебе голова від мудрості роздулась.","^скарб Скриня? Цить, хай {name} не чує. Я перший гляну.","^тісно Тісно? То не махай крилами в мене перед дзьобом, ботан.","^кістки Не погано. Смачно навіть. Для щурів.","^кістки Ото хтось без воронів ходив, {м_слівце}. От і доходився.","^павуки Павуки мене бояться. Бо я їх жеру.","^павуки Заплутаюсь — то павук пошкодує, шо вилупився.","^капає Мене все бісить. Вода — в черзі, після тебе.","^капає Кап-кап. Як твої поради, ботан. Нудно й мокро.","^двері Значить, там шось цікаве. Ламай.","^двері Замкнули, бо там шось страшне. Пішли, бля!","^шепіт То драуґри пліткують. Про тебе, ботан.","^шепіт Я ніхріна не чую. Бо я не ссикло.","^пастка Пастки — для дурнів. От ти й іди перший.","^пастка Я над підлогою, бля. Мені похуй.","^задуха Затхлятина — мій улюблений запах. Трупиками тхне, ммм.","^задуха Дихай менше. І пизди менше.","^вихід Та пам'ятаю я. Ліво, право, ше раз ліво. Ніби.","^вихід Загубимось — то й житимем тут. Бабла тут повно.","^череп Бо здох до того, як тебе почув. Пощастило мужику.","^череп Лиситься, бо знає шось, чого ми не знаємо. Падло."],"м_падіння":["^літати Я думав, ти літати вмієш, {м_слівце}. А нє.","^ноги Гепнулись. Ноги цілі? Та мені похуй, я на плечі.","^ще Ше раз так стрибни — я сам злечу. Без тебе.","^гепнув Ото гепну{вся|лася}! Аж земля, бля, здригнулась.","^скеля Хто, {м_слівце}, без крил зі скелі стрибає? Я питаю: хто? Дурні.","^кущ Гепнулись у кущ. У колючий, {м_слівце}. Ой-ой.","^багно Плюхнулись у багно. Тепер ми однієї масті.","^політ Секунду ми летіли. Найкраща секунда за день, бля.","^каміння Каміння поруч летіло. Я рахував, {м_слівце}, чесно.","^висота Звідки ми гепнулись? З неба, чи шо?","^синці Синці будуть, {м_слівце}. Не в мене, і то добре.","^сміх Гиги! Я досі ржу, {м_слівце}. Це було шикарно.","^вдруге Це вже вдруге за день, {м_слівце}. Вдруге!"],"м_падіння_кінець":["^літати Ну хоч приземлення було красиве. Нє, не було. Гівно було.","^ноги Цілі — то й добре. Пішли далі.","^ще Пізно, бля. Вже послуха{в|ла}.","^гепнув Земля ціла. Шкода, шо.","^ноги Гордість? Яка, нахуй, гордість? Ти бачив, як {name} леті{в|ла}?","^ще Дивись, дивись. А я вже не можу на це дивитись.","^гепнув Швидко — не значить правильно, професоре. Навіть я шарю.","^скеля Лінь — то святе. Але ж не так, бляха.","^кущ М'який? Я тепер, бля, як їжак.","^багно Чорний — то стиль, ботан. А багно — то зашквар.","^політ Похуй. Все одно найкраща секунда.","^каміння Три. І всі повз. Я ж казав — фартові ми.","^висота Дурні ідеї — мої найулюбленіші, ага.","^синці То ми герої. Синюваті, бля.","^сміх Некрасиво, зате від душі.","^вдруге Буде й третій. Я сракою чую."],"м_вага":["^ковадло Шо там, ковадло? Я з плеча сповзаю, {м_слівце}.","^кинь Викидай каміння. Бо я тебе викину.","^черепаха Повземо, як черепахи. Як вагітні черепахи, бля.","^сумка Шо там у торбі, {м_слівце}? Каміння? Каміння і ше трохи каміння?","^спина Спина під нами тріщить, {м_слівце}. Я ж чую.","^жадібність Все тягнем. Навіть сміття всяке.","^легкий Хочеш, я злечу — і легше стане? Ні? Ну то й сиджу.","^віз Чого ми візок не взяли? Ну чого, га?","^повільно Повземо, а день, бля, минає.","^скриня Премо, наче скриню з золотом. А там — дошки, бляха.","^кульгає Ми шкандибаємо, {м_слівце}. Ше трохи — і гепнемось разом.","^відпочинок Перекури, {м_слівце}. Ну хоч хвилинку."],"м_вага_кінець":["^ковадло Скарб, ага. В тебе в голові скарб — пустота.","^кинь То я злітаю. А ти пішки повзи.","^черепаха Мовчу. Повзу. Ненавиджу. Всіх.","^сумка Майбутнє, бля, важке. Як твоя дупа.","^ковадло Потерплю. Але, курва, запам'ятаю.","^кинь Ну, повземо. Як завжди, хай йому грець.","^спина Тріщить, гарчить — яка, бля, різниця. Важко!","^жадібність Ага, знадобиться. Коли ми під ним здохнемо.","^легкий Пір'їнку? Я важу, як ковадло, бля. Від злості.","^віз Пригоди з грижею. Ото кайф, курва.","^повільно Повземо, як слимаки. Героїчні слимаки, йо.","^скриня Хата з дошок. А я хотів золоту, як в Одіна.","^кульгає Гепатись — то в нас спільне, ага.","^відпочинок Я твою мудрість на собі тягну, ботан. Важче за камінь, бля."],"м_портал":["^нудить Ненавиджу ці дірки. Мене вивертає, {м_слівце}. Навиворіт.","^пір'я Я там пір'я лишив. Пів хвоста, бля.","^де Де ми? Нє, не кажи. Знати не хочу.","^швидко Раз — і ми вже хуй зна де. Як у Локі в кишені, {м_слівце}.","^світло Те світло в дірці аж сліпить, {м_слівце}.","^шум Після тої дірки у вухах дзвенить. Дзень-дзень, бля.","^рахунок Скіко ми вже разів у ці дірки стрибали, га?","^половина Хугіне, в мене всі лапи на місці? Перелічи, ну.","^звідки А звідки ми, {м_слівце}, щойно вилізли? Забув уже.","^магія Ці каменюки з рунами… Хто їх наліпив? Локі, чи шо?","^мороз Там, між світами, дубак собачий. Як у Ніфльгеймі, бля.","^метал А чого руду крізь дірку не можна тягти? Хто це, бля, придумав?"],"м_портал_кінець":["^нудить Звикнеш, звикнеш… Та йди ти зі своїм «звикнеш».","^пір'я Я не линяв. Я оновлювався. Шариш?","^де Знайомо? Твоєю мудрістю пахне. Значить, біда.","^швидко Хай слухає. Я тому Локі все одно не вірю.","^нудить Сам звикай, ботан.","^де Ну й добре. Аби не в морі, бо там я блюю.","^світло Заплющив. І в тебе врізався. Дякую, порадник хуїв.","^шум Минеться, минеться… А поки дзвенить, курва.","^рахунок Рахує він, бля. Краще б жратву рахував.","^половина Дві? А відчуваю три. Шо за хуйня.","^звідки Я завжди бурчу. То не прикмета, то характер.","^магія Хто б не наліпив — хай йому гикнеться, падлу.","^мороз Холодно, курва. Ненавиджу ту дірку.","^метал Боги — жмоти. Як і ти."],"м_риба":["^перша Риба! Перша — моя! Моя, сказав!","^мала Оце риба? Я черв'яків більших жер, {м_слівце}.","^ще Ше лови. Я ше не нажерся.","^луска Хугіне, вона мені лускою в око! Прямо в око, сука!","^велика Ото рибина! Здоровенна, більша за мене, {м_слівце}!","^черв'як Черв'яка на гачок? Нашо, дай мені, я його сам схаваю.","^зірвалась Зірвалась! Сука, зірвалась! Та шо ж таке!","^смажити Смажити будем чи сиру хавати? Я за сиру, бля.","^поплавець Поплавок смикнувся! Тягни, {м_слівце}, тягни!","^чекати Сидимо, чекаємо. Рибо, ну давай вже, курва.","^кістка Кістка в горлі застрягла, {м_слівце}. Ше з тої риби.","^глибоко А там, у глибині, кажуть, є риба, шо кораблі ковтає. Цілими, бля."],"м_риба_кінець":["^перша Хвіст? Хвіст, {м_слівце}?! Я тобі зара дам хвіст.","^мала Сам ти нечесний. І дрібний.","^ще Терпіння — то для ситих.","^луска Личить? Я тобі зара так прикрашу, {м_слівце}, — мама рідна не впізнає.","^ще Ага, {name}, значить. А мені шо, водичка?","^велика Поважати рибу? Я її зара зжеру, ото й вся повага.","^черв'як Я тебе сам наживлю, ботан. На гачок і в воду.","^зірвалась Хоче жити — хай не клює, падла.","^смажити Самі ви дикуни. Сира — то смак, шариш?","^поплавець Сиджу, сиджу. Але смикнулось, я бачив, бля!","^чекати Є в мене терпіння. Маленьке. Було. Скінчилось.","^кістка Жадібність — то по життю, ботан. Не вчи.","^глибоко Хай спробує. Я їй зсередини печінку видзьобаю, суці."],"м_рубка":["^ліс Ліс плаче? Хай плаче. Мені дрова треба.","^сидів Сидіти? На оцьому? Я на дубах сиджу, а то осика сопляча.","^берегись Майже, бля! Ше трохи — і по тобі б, {м_слівце}.","^дрова Зими не буде? Ти це моїм лапам скажи.","^ліс Плаче? Хай. Нам узимку тепло буде, а йому вже похуй.","^сидів Мені й на плечі добре. Тут подають.","^берегись Не впало ж. А шкода — було б ржачно.","^дрова Зима буде. Вона завжди припреться, коли не чекаєш.","^тріски Я не пригинаюсь. Я ухиляюсь, {м_слівце}. По-бойовому.","^тріски Одна вже в мене в пір'ї. Знайду, хто кинув — вб'ю.","^білка Ну так ми й є вбивці. Дерев, {м_слівце}.","^білка Хай чеше. Наступного разу зжеру, руду.","^смола А я злістю смерджу. Натурально, бля.","^смола Смола — то дерево рюмсає. Хай рюмсає, нюня.","^пеньок Який там пеньок. Від мого терпіння вже ямка лишилась.","^пеньок Пеньок — теж діло. Сісти можна. Насрати можна.","^гнізда Чужі? То рубай, нахуй, сміливіше.","^гнізда Шкода, яйця не схавали. Сніданок пропав.","^стук Яке серце, бля? Ліс — то дрова з понтами.","^стук Тук-тук. Як у мене в башці від тебе.","^старе Старе — значить трухляве. Як твої жарти, ботан.","^старе Було. Тепер — колода. Всі ми колись колоди, йо.","^кора Кора смачна. Для жуків. Не для мене, нє.","^кора Корабель з неї буде. Чи хата. Чи дрова, курва. Шо вийде.","^луна Хай знають. Хай приходять, я їм дам.","^луна Та ніхто не припреться. Всі мене бояться. Всі!"],"м_руда":["^стук Стук-стук-стук. Я зара сам когось стукну, {м_слівце}. По голові.","^руда Руда. Блищить. Можна спиздити?","^пил Пилюка в очах, в дзьобі, в сраці. Скрізь, бля.","^іскри Іскри з каменя летять, {м_слівце}. Ше хвіст мені підпалить.","^глибина Ше трохи глибше — і в Гель провалимось, {м_слівце}.","^кайло Кайло тупе, як твої жарти, розумнику.","^мідь Мідь, олово, залізо… А мені шось блискуче буде, чи хуй?","^обвал Якшо тут завалить — я перший звалю. А ти — як знаєш.","^жила Жила жирна, {м_слівце}. Аж слина капає.","^піт {name} пріє, як свиня в лазні. Я на плечі вже плаваю, бля.","^камінь Камінь, камінь, камінь. Хоч би один дракон, для різнобою, бля.","^пітьма Тут темно, як у тебе в голові, {м_слівце}."],"м_руда_кінець":["^стук Себе? Ну… теж варіант. Нє, тебе краще.","^руда Я не сорока. Я ворон з принципами. Блискучими, ге-ге.","^пил Не на тебе. На тебе — потім.","^іскри Тихо сидіти — то не про мене, ботан.","^глибина Гель мене не лякає. Мене лякає, як ти, ботан, трусишся над кожним каменем.","^кайло Я не ною, бля. Я кажу, як є.","^мідь Мій спокій — то коли ти заткнешся.","^обвал Ну то вилітати будемо разом. Ти за мною, ботан.","^жила А я б і зжер, і спиздив. Разом.","^піт Я ворон, а не банщик. Сиджу й терплю, як дурень.","^камінь А я накличу. Хоч якесь діло буде.","^пітьма Світять? То чого я ніхуя не бачу?"],"м_сніг":["^мерзну Мерзну так, шо пір'я дзвенить, {м_слівце}.","^комір Сніг за комір. Коміра в мене нема, а сніг є. Як так, бля?","^сніг Все біле. Ненавиджу біле. Тьху.","^лапи Лапи до плеча примерзли, {м_слівце}. Все, я тут навіки.","^сніжинка Сніжинка мені на дзьоб сіла. Нахабна, сука. Зневажає.","^стежка В снігу всі сліди видно. І наші, {м_слівце}, теж.","^тепло Де вогонь, бля? Мені вогонь треба, а не твоя мудрість.","^білі Тут вовки, {м_слівце}. Чую. Білі й злі, як теща.","^бурулька В мене на хвості бурулька. Я тепер, бля, зброя.","^глухо Сніг усе глушить. Навіть як я матюкаюсь.","^гори Гори, сніг, дубак. Хто тут, бля, живе по своїй волі?","^кожух {name} в хутрі, а я в пір'ї. Де справедливість, га?"],"м_сніг_кінець":["^мерзну Пусте? Там вогонь, {м_слівце}. Ледь жевріє, курва.","^комір Великий філософ. Мерзлий. Хе.","^сніг Глянув. Біле. Ненавиджу.","^лапи Інше плече? Я тобі дам інше плече, хитрий який.","^комір Мудрі мерзнуть так само. Тіко мовчки. Як дурні.","^сніг Чисте? Почекай, я зара на нього насру.","^сніжинка А я її зжер. Хай знає, з ким має діло.","^стежка Хто за нами припреться — тому дзьобом в тім'я.","^тепло Скоро, скоро… А дубака я вже зара ловлю.","^білі Хай лізуть. Я теж білий стану. Від злості, бля.","^бурулька Відламаю й встромлю тобі. По-братськи.","^глухо Ага? Ну слухай: КУРВА! О. Не заглушило.","^гори Та хай живуть. А я хочу додому. Додому, чуєш?","^кожух Пиздиш. Але під комір залізу."],"м_гроза":["^грім П'яний Тор — то найчесніший Тор. Наш пацан.","^блискавка Я чорніший, а ти вищий. Тебе першого засмажити, ботан.","^небо Хай сердиться. Я теж сердитий, {м_слівце}. І шо?","^грім Тор бухий — то й нам можна, {м_слівце}.","^блискавка Як у тебе вдарить — то хоч порозумнішаєш.","^небо Небо сердиться, бо ти йому набрид. Як і всім.","^вітер Тримаюсь. За тебе. Шоб ти першим полетів.","^вітер Виє? То я співаю, {м_слівце}. Шо, не подобається?","^молот Та хай лупить кого хоче. Аби не нас, {м_слівце}.","^молот Ото б мене хоч раз на махач узяв. Я б йому показав, як треба.","^дерево Та я й не збирався, бля. Я на плечі сиджу, як цар.","^дерево Де хочу, там і сиджу. Хай тіко спробує вдарити, та блискавка.","^злива Яка нахуй діжка? То Одін рюмсає, шо ти в нього є.","^злива Та хай ллє. Мокріше мене вже нема куди, {м_слівце}.","^страх Я не трушусь, бля. Я від злості трушусь. Це інше!","^страх Вітер, {м_слівце}. Тіко вітер. Ну і грім трохи. Відчепись.","^рахувати Раз, два… БАХ! Близько, сука!","^рахувати Рахувати? Я до трьох рахую, і то на кігтях. Зате матюкаюсь — як бог.","^іскра То я від злості тріщу, а не від неба, ботан.","^іскра О, я тепер блищу. Красень, {м_слівце}, глянь!","^тролі Тролі розумні? Ти шо, бля, грибів наївся?","^тролі А ми не ховаємось. Виходить, ми тупіші за тролів. Ну й похуй.","^після От і дихай. А мені й так нормально смердить.","^після Після грози — гриби. А після грибів {name} співає. Жах, бля."],"м_світанок":["^світає Ше один день. Ше один день тебе слухати. Йой.","^хропів То ти хропів. Я спав, як немовля. Зле немовля.","^роса Добрий знак? Мокрі лапи — то добрий знак, по-твоєму?","^світає Живі. Ну, ти — ледь-ледь.","^хропів Я не хроплю. Я голосом сторожу.","^роса Добрий знак — то коли сніданок. Все.","^сонце Сонцю не треба тебе слухати. Пощастило гаду.","^сонце Хай встає. А я ше подрімаю, {м_слівце}.","^птахи Яке співають — верещать. Зжер би всіх, {м_слівце}.","^птахи Хай горлають. Поки я не прокинувся як слід.","^мряка Яке молоко? Мені б м'ясця, {м_слівце}.","^мряка Мряка — то земля потіє. Від тебе, ботане. Від твоїх розумних балачок.","^сніданок Око — то делікатес, бля. Шо ти шариш у жратві.","^сніданок Шо дадуть. А дадуть, сто пудів, нічо.","^асгард Мені снилось, шо ти заткнувся. Кайфовий сон, бля.","^асгард Кров снилась. Повно крові. Смачно, {м_слівце}.","^холод То сунься ближче до шиї. Там тепліше. Тіко не впритул, ясно?","^холод Дубак. До обіду буду злий, {м_слівце}. А після обіду — теж.","^план План? Когось вгасити. Як завжди, бля.","^план План — шоб без плану. Найкращий план, вкурив?","^лінь Я і вві сні пасу. Талант, {м_слівце}.","^лінь Ше хвилинку. Ну дві. Ну відчепись, бля.","^перший Ну я побачив. А день все одно гівно.","^перший Ти побачив? Ну то хай тобі й фартить, {м_слівце}. А я й так фартовий."],"м_вечір":["^ніч Сонце сідає. Ну нарешті моя пора, {м_слівце}.","^голод Вечір, а я не жер. Хтось про мене пам'ятає взагалі?","^червоне Небо червоне, як кров. Гарно, {м_слівце}. Аж їсти захотілось.","^кажани Кажани вилізли, {м_слівце}. Мої братани нічні.","^сови Сови повилазили, {м_слівце}. Ненавиджу тих сов.","^багаття Пора вогонь палити. Бо я задубів, {м_слівце}.","^втома День минув, а я від тебе заїбався більше, ніж від дороги.","^тіні Тіні довгі повилазили. Скоро і те, шо в них сидить, вилізе.","^зорі Перша зоря, {м_слівце}. Загадуй. Я вже загадав — шоб ти заткнувся.","^підсумок Ну шо, скільки сьогодні завалили? Мало, сто пудів.","^виття Чуєш? Вовки виють. На вечерю кличуть, гиги.","^нічліг Де ночуємо, {м_слівце}? Тіко не в болоті, бо я злечу."],"м_вечір_кінець":["^ніч Посплю, як здохну.","^голод Чемно? Я? Ха! Ха-ха!","^червоне Моїх слів? Та я ше й не починав, ботан.","^кажани Мізки? В тебе? Не смішіть мене, {м_слівце}.","^сови Я одну колись дзьобнув. Мудрість їй ніхріна не допомогла.","^багаття Сидіти, гарчати, сраку гріти. Оце я розумію вечір.","^втома Завтра знов втома. Ура, бля. Ура.","^тіні Світло — для ссикл. Але… сяду ближче. Просто так.","^зорі То хай світять мовчки. Як ти мав би, ботан.","^підсумок Живі — то нудно. Ну… хай вже.","^виття А я відповім. Дзьобом. По сусалах.","^нічліг Дах — то кайф. Аби не капало, як того разу, бля."],"м_друг":["^гість Пристойно? Я гостеві в шолом насеру. Пристойно, ага.","^гість {friend}? О, ше один, кого можна дзьобнути.","^разом Безпечніше? Та {friend} перш за всіх і дремене, от побачиш.","^дивиться Хай дивиться. Я теж дивлюсь. І думаю всяке погане.","^ворони Якшо є — наваляю. Обом.","^разом Удвох легше. Тікати, бля.","^дивиться Хай дивиться, мо' навчиться чогось. Хоч матюкатись.","^ворони Якшо є — хай знають, хто тут на районі головний.","^подарунок Якшо не нам — сам заберу. Без питань.","^подарунок Нам? Нам ніхто ніхуя не носить, {м_слівце}.","^спомин Пам'ятаю. Нічо доброго, бля.","^спомин Пам'ятаю. Я тоді пір'їну проїбав. Хорошу пір'їну.","^частування Чемним? За жратву — буду. Раз. Цього разу.","^частування Чемність — то для ситих, ботан.","^броня Блищить? Дай дзьобнути. Хоч разок.","^броня Броня гарна. А от те, шо в ній, — так собі.","^гомін А я їх перекричу. Одним матюком.","^гомін Хай горлають. Хоч не нудно, бля.","^допомога Допомагає, бо шось хоче, {м_слівце}. Сто пудів.","^допомога Ну хай допомагає. Я не заважатиму. Сильно.","^смажене Смаженим? То чого нам нічо не принесли, га?","^смажене Я вже слиною капаю, {м_слівце}.","^спина Прикрита? Аби ножем не прикрили.","^спина Спину я сам прикрию. Дзьобом, бля.","^розмова Розумне? Від людей? Ой, не смішіть мене.","^розмова Я слухаю. Поки шо — хуйня якась."],"мп_сів":["Сів. Не чіпай мене. Я відпочиваю, нахуй.","О, палиця. Шик. Королівські, бля, умови.","Посиджу тут, поки ти знов кудись вляпаєшся.","Нарешті не трясе мене, як мішок з бульбою.","~1 Я тут сиджу не тому, шо ти сказа{в|ла}. Я сам захотів, ясно?","~1 Жердина. Мені. Від тебе. Шось тут не те.","~23 Ну, жердина норм. Скажеш комусь, шо я сказав «норм», — дзьобну.","~3 Посиджу. Але далеко не йди, {дурню|дурепо}.","Палиця як палиця. Не плече, зате потом не смердить.","Сиджу. Хто торкнеться — без ока лишиться.","Нарешті ніхто не гарчить мені над вухом, бляха.","Сів. Ше б поклювати шось — і життя вдалось.","~1 Не радій. Я тут на хвилинку.","~1 Посадили, як курку на сідало. Файно.","~23 Ну... сидиться. Нормально так сидиться.","~3 Посиджу, поки ти поруч. Тіко не зникай, чуєш."],"мп_затишно":["Тепло, сухо, ніхто не верещить. Кайф, курва.","Ото затишок. Аж не віриться, шо це ти зроби{в|ла}.","Дах, вогонь, тиша. Ше б м'яса — і я тебе майже люблю.","~1 Ну хоч десь у тебе руки не з сраки.","~23 Гарно тут. Окей. Визнаю. Один раз.","~3 Затишно. Як у тебе під плащем, тіко не смердить.","Тепло, як у Йотуна в пузі. Тіко пахне краще.","Тут жити можна. Навіть мені, бля.","Сухо, тепло, ніхто не доїбується. Це точно твоя хата?","~1 Затишно. Аж бісить, шо мені подобається.","~23 Добре тут. Мо', навіть не клюватиму нікого. Годинку.","~3 Затишно. Ти постара{вся|лася}, {дурню|дурепо}. Ну... дякую."],"мп_холодно":["Ти мене на вітрі посади{в|ла}? Ти шо, серйозно?","Холодно, як у Йотуна в сраці, бляха-муха.","Тут дме звідусіль. Сила? Яка, нахуй, сила?","Я тут мерзну, а ти десь грієшся. Ну файно.","~1 Посади{в|ла} на вітрі. Ну дякую, {благодійнику|благодійнице}, бля.","~23 Дах. Дах! Хоч якийсь, курва, дах, {name}!","~3 Холодно. Але для тебе посиджу. Цей раз.","Хто садить ворона на вітер? Тіко ти, бляха.","В мене пір'я дибки. Від холоду і від тебе.","Сила тут набирається, як у тебе мізки. Ніяк.","Дах, {name}. Чу{в|ла} про таке? Чотири палиці й солома.","~1 Заморозити мене хочеш? Хуй дочекаєшся.","~23 Холодно, але я терплю. Бачиш, який я, га?","~3 Змерзну — гріти мене будеш ти. Домовились, і крапка."],"мп_вітання":["О, {name}. {Живий|Жива} ше. Шкода.","Прийш{ов|ла}? Ну все, капець тиші.","А, це ти. Я думав, хтось нормальний.","Ну? Шо {зламав|зламала} цього разу?","~1 Знов ця пика. Вали звідси, я відпочиваю.","~1 Ти мені снишся чи ти тут? Бля, тут.","~23 {Прийшов|Прийшла}. Ну, я радий. Трошки. Не звикай.","~3 Нарешті, {дурню|дурепо}. Я вже скучив. Тіко нікому, ясно?","Жив{ий|а} ше? Ну, глянем, надовго.","Провідати прийш{ов|ла}? Ой, мило. Аж нудить, їй-бо.","Смердиш, як мокрий кабан. Здоров.","Нарешті шось рухається. А то я з нудьги вже куняв.","~1 О, мій улюблений геморой.","~23 Здоров, {name}. Так, я радий. Нє, не повторю.","~3 Ти тут. Ну й добре. Мені так спокійніше, бля."],"мп_чужий":["Ей, {stranger}, а ну гуляй звідси.","{stranger}, ше крок — і я тобі око виклюю.","Шо витріщаєшся, {stranger}? Ворона живого вперше бачиш?","Не твоя жердина, {stranger}. І ворон не твій. Шариш?","~1 Ше одна чужа пика. Їх тут шо, розводять?","~23 А, {stranger}. Ну, якшо {name} тебе знає, то живи. Поки шо.","{stranger}, тут тобі не базар. Вали.","Не на мене дивись, {stranger}. Кудись туди.","Ше крок, {stranger}, — і познайомишся з моїм дзьобом.","{stranger}, в тебе пика, як у сіролюда після махачу.","~1 Чужі. Ненавиджу чужих. І своїх теж, бля.","~3 {stranger}? Як {name} не проти, хай буде. Але руки, сука, геть."],"мп_ворог":["Ворог! Ану прокинься, {name}, ледащо!","Он він, гад. Гаси його, чого стоїш!","Я б сам його порвав, але я, бля, на відпочинку.","Шось лізе. Чую, як воно смердить.","~1 Ну от. Навіть посидіти спокійно не дають, курва мать.","~3 Я тут, {name}. Рви його нахуй.","Гей, там гидота лізе! Хтось битиметься, чи мені самому?","Ворога чую. Смердить, як твої чоботи.","Он, он, у кущах! Ти шо, сліп{ий|а}?","~1 Знов ця погань. Тут хоч колись відпочити дадуть, бляха?","~23 Ворог, {name}! Я прикрию. Морально, ага.","~3 Бережись, {дурню|дурепо}. Бо без тебе мені хоч вий."],"мп_прокинувся":["Хто, курва, збудив?!","Ти знаєш, котра година? Я — знаю.","Ше раз розбудиш — клюну в тім'я.","~1 Нє, ну ти точно знущаєшся.","~23 А, це ти. Ну добре, не клюватиму. Сьогодні.","~3 Мм... ти тут... норм. Сплю далі.","Я спав! Я спав, і мені м'ясо снилось, бля!","Шо? Хто? Де? А. Це ти. Гірше й не буває.","Розбудиш ше раз — прокинешся без брови.","~1 Ні сну, ні спокою. Дякую, {name}, сука.","~23 Ну добре, вже не сплю. Шо тобі?","~3 А, ти... Сідай поруч. Нє, не на мою жердину."],"мп_думка":["Сиджу, злість коплю. І силу. Але злість швидше, бля.","Якшо хтось тут зара шось зламає — я все бачу.","Жердина — то кайф. Ніхто не мотиляє мене туди-сюди.","Я тут подумав... та ну його нахуй. Думати — то Хугінова робота.","Ти шось робиш, {name}? Бо виглядає, ніби ніхуя.","~1 Нудно. Мо', когось клюнути? Тебе, наприклад.","~23 Гарно тут. Тіко Хугіну не кажи, шо я так сказав.","~3 Сиджу й дивлюсь на тебе, {дурню|дурепо}. Подобається, бля.","Цікаво, якшо зара клюнути Хугіна, він запам'ятає? Він же все, падла, запам'ятовує.","Сиджу й думаю, як тому кабанові помститись.","Жердина — нічо. Але м'ясо було б краще.","Я міг би зара літати. Але лінь. Мудра, курва, лінь.","Кажуть, ворони приносять погані вісті. Пиздять: ми самі — погані вісті.","Якшо хтось сьогодні й здохне, то не я. Я на жердині.","~1 Знаєш, шо найкраще в жердині? Тебе на ній нема.","~1 Скільки ше тут кукувати? Я вже все обдивився.","~23 Нічо тут. Тихо. Можна й покуняти.","~23 Ти там без мене не вляпайся, чуєш?","~3 Знаєш, {дурню|дурепо}... без тебе тут тихо, аж гидко."],"мп_розмова":["^крива Хугіне, тобі не здається, шо ця палиця кривувата? Ну крива ж, бля.","^сидіти Скільки нам тут ше сидіти? Мені вже нудно, капець.","^задум Шо там {цей дурень|ця дурепа} {name} знов затіває?","^тиша Чуєш, як тихо? Аж кортить когось клюнути.","~1 ^ти Посунься, Хугіне. Ти тут не сам, бля.","~23 ^жердина Знаєш, а жердина ця нічо. Тіко нікому.","~3 ^ми Слухай, Хугіне... з людиною нам пощастило. {name} — наш{|а}. Тіко мовчи, ясно?","^сидіти Хугіне, ше годину тут — і я стану совою, бляха.","^тиша Хугіне, ти спиш? Не спи. Мені нудно.","^їжа Хугіне, як думаєш, {name} хоч пожерти нам принесе?","^думаєш Хугіне, ти знов думаєш? По пиці ж видно, ботан.","^ми Хугіне... а ми з тобою нормальна пара. Тіко нікому.","^смола Ця жердина смолою пахне. Мені заходить. Мовчи.","~1 ^дивись Не дивись на мене, Хугіне. Бісиш.","~23 ^дім А шо, сидіти тут — не найгірша хуйня.","^забуде Хугіне, а якшо {name} про нас забуде? Я ж {його|її} тоді знайду.","^задум Цікаво, шо {name} там знов ламає. Чую ж, як гуркотить."],"мп_відповідь":["^жердина Сила йде, ага. А нудьга — ше швидше.","^сидіти Сидіти — робота? Ти її сам придумав, шоб нічо не робити.","^сидіти Мені нудно, а ти мене ше й повчаєш, професор.","^задум Шось дурне. І знов якоїсь хуйні притягне.","^тиша Рай? Рай — це коли ти мовчиш, Хугіне.","~1 ^ти Сам посунься, розумнику.","~23 ^дім Ну... тут і справді нічо. Окей.","~3 ^ми Ну от, розпустив соплі. Йди вже, пташко.","^ти Займаю скільки хочу. Хочеш більше — злітай.","^ти А ти не пхайся крилом, розумнику.","^ми Ой, тіко не рюмсай мені тут, Хугіне.","^ми Пощастило, ага. Особливо тобі — зі мною.","^сидіти Сидіти — не робота. Робота — це когось дзьобнути.","^їжа Голодний — не те слово. Хай {name} несе м'ясо, поки я не почав з тебе.","^тиша Тихо, бо всі від тебе повтікали, ботане.","^сила|жердина Сила? Ну, сила — то нормас. Але м'ясо краще.","~1 ^тиша Рай? Нудьга смертна. Хоч би хтось когось зжер.","~3 ^забуде Нікуди {name} не дінеться. Куди ж без нас, га.","^забуде Хай тіко спробує. Знайду {його|її} і клюну. В сраку.","^сила Досить, шоб клюнути тебе. Двічі.","^вигадка Якийсь лінивий птах, якому заїбало літати. Мій герой.","^пера Бо хтось тут на мене линяє, Хугіне.","^їжа Голодний. Завжди. Це не секрет, це по життю так.","^дім Добре, добре. Тут гарно. Задоволений, ботан?","^рівна Рівна, бо я на ній сиджу. Решта тут — криве гівно.","^думаю Думай тихіше. Аж сюди чути, як у тебе в башці скрипить.","^разом Думав. І щоразу жахався. А тепер нічо, звик."],"мх_знайомство":["^ім'я Мунін. А для своїх — {me}. Запам'ятай, бо двічі не повторюю, бля.","^хто А ти шо за опудало? Ти з якого гнізда, га?","^хто Йо, ти. Чий будеш, {м_слівце}? І шо ти вилупився, як на медовуху?","^пам'ять Мунін. Пам'ять Одіна, шариш? Я тебе вже запам'ятав. Тепер ходи й бійся.","^смак То твоя людина — {friend}? Ну й смак у тебе, {м_слівце}. Я б таке не носив.","~1 ^хто Ше один пернатий, курва. Ближче підлетиш — дзьобом в тім'я.","~3 ^ім'я Мунін я. Моя людина — {name}. Скривдиш — око виклюю. А так привіт, братан.","^хто Ти хто такий, га? Кажи, поки я добрий, {м_слівце}. Я рідко добрий.","^хто О, новеньке опудало. Ти з чийого району?","^ім'я Мунін я. {me} — це для тих, кого я після знайомства не відпиздив.","^смак Так твоя людина — {friend}? Співчуваю. Щиро. Та нє, пизджу.","~1 ^хто Шо вилупився, лошара? Чий ти, питаю?","~3 ^ім'я Мунін. Не ссикуй, я тіко своїх кусаю."],"мх_знайомство_відповідь":["^хто Мунін. Чий-чий… Моя людина — {name}, вкурив? Ше питання будуть?","^хто|ім'я Мунін я, {м_слівце}. А он моя людина — {name}. Тіко не кажи, шо ми схожі, бо вріжу.","^пам'ять Запам'ятав він, ага. Я теж пам'ятаю. Все. А образи — особливо, курва.","^смак Смак як смак. Твоя людина теж не красуня, якшо по-чесному.","^господар Співчуваєш? Собі поспівчувай, {м_слівце}, бо зара буде за шо.","^господар|смак Ти мою людину не чіпай, чуєш? Її тут тіко я чіпаю. Щодня.","~1 ^хто|ім'я Мунін. Відвали.","~3 ^хто|ім'я Мунін. А моя людина — {name}. Найкраща на весь Мідгард, хай хтось, бля, скаже шо нє.","Мунін. І годі мене тут допитувати.","^хто|ім'я {me}. Мунін, якшо по паспорту. А тобі шо, {м_слівце}?","^хто Чий-чий. Моя людина — {name}. І вдруге не питай, бо дзьобну.","^хто|ім'я {me}. Мунін. Вкурив, {м_слівце}?","^смак Співчуваєш? Сам ти, бля, такий.","^пам'ять Пам'ятаєш? От і пам'ятай. І бійся, сучара.","^господар Моя людина — моє діло, {м_слівце}. Не пхай дзьоба.","~3 ^хто|ім'я Мунін. Дзьобом не чіпаю, поки ти по-людськи. Ну, по-воронячи."],"мх_знайомство_кінець":["Ну все, познайомились. А тепер не муляй очі.","Запам'ятав я тебе. Не радій, я всіх запам'ятовую. Особливо лохів.","^господар|смак Своїй людині передай: я все бачу. Все, курва.","^хто Ну шо. Поки живи, хай тобі грець.","~1 Тіко до моєї жратви не лізь, {м_слівце}. Бо капець тобі.","~3 Ну, ти ніби свій пацан. Для чужого.","Познайомились. Тепер не ображайся, як дзьобну. А я дзьобну.","^хто Пику твою запам'ятав. Про всяк випадок, шариш?","~1 Все, відвали нахуй.","~3 Ну, бувай, малий. Заходь, як шо."],"мх_зустріч":["^давно О, гляньте, хто приповз! Шо, ше живі?","^давно А я думав, {friend} давно здох{>|ла}. Шкода. Жартую. Мо'.","^живий Живий, {addr}? Ну ти й живучий, {м_слівце}, як таракан.","^новини Ну шо там у вас? Хто кого відпиздив, хто де гепнувся?","~1 ^давно Знову ти. Як муха на гівно, {м_слівце}.","~3 ^давно {addr}, стара ти падлюко! Радий, шо живий, бля. Не звикай.","^давно О, привид прилетів. А я думав, тебе давно зжерли.","^давно Де ти, курва, пропадав стіко, {м_слівце}?","^новини Ну, викладай. Хто здох, хто вижив, хто кому винен?","^живий Ше дихаєш? Тю. Я чекав новин поцікавіше.","~1 ^давно Знову ця пика. Ніяк, сука, не позбудусь.","~3 ^давно О, свої! Ну здоров, падлюко!"],"мх_зустріч_відповідь":["^давно|новини Живі. {name} вчора двічі {здох|здохла}. Рекорд, {м_слівце}, бля!","^давно|новини Та нормально. {name} знову полі{з|зла} не туди. Я був проти. Як завжди, нахуй.","^живий Живучий, бо злий. Злі довго живуть, вкурив?","^живий|давно Живі. Хоча Хель уже двері тримала. Ледь не зайшли, курва.","~1 ^давно|новини Як-як. Не годують, не поважають. Все як завжди, гівно.","~3 ^давно|новини Та добре. {name} — най{кращий|краща}, хоч і дурн{ий|а}, як пробка. Тіко {йому|їй} не кажи.","Та живемо якось, {м_слівце}.","^давно|новини Новини такі: {name} знову все зіпсува{в|ла}. Як завжди, бляха.","^давно|новини Хто здох? Ми, майже. Двічі, курва.","^живий Дихаю. Тобі на зло, сучара.","^живий Не зжерли. Подавились би, я кістлявий.","~1 ^давно|новини Хуйово. Годують мало, гавкають багато.","~3 ^давно|новини Нормально. Навіть добре, прикинь. Тіко нікому, {м_слівце}."],"мх_зустріч_кінець":["Все, побазарили. Досить.","Ну, бувай. Не здохни там, лошара.","^живий Бережи свою людину, {addr}. Бо хто тебе, дурня, годуватиме?","~1 Йди вже. Нудно мені з тобою, бля.","~3 Заходь частіше, братан. Тіко без гостинців — я їх однаково зжеру.","Все, давай. Не здохни, чуєш.","^новини Решту — потім. Якшо доживеш.","~1 Злітай уже, не муляй."],"мх_нове_імя":["^нове Йо, {raven}! Хто тебе так обізвав, {м_слівце}?","^нове {raven}? Пф-ф. Я тебе по-старому кликатиму, і шо ти мені зробиш?","~1 ^нове {raven}. Ну й погоняло, бля.","~3 ^нове {raven}. Звучить, курва, по-пацанськи. Заслужив.","^нове О, нове погоняло! Хто тебе так перехрестив, {м_слівце}?","^нове {raven}? Ну, хоч не Пушок. Пушка я б не пережив.","~3 ^нове {raven}. Пасує тобі, падлюко. Чесно."],"мх_нове_імя_відповідь":["^нове {me}, ага. Ше раз скривишся — дзьобом у пику.","^нове Тепер я {me}, {м_слівце}. Поважай, бо вріжу.","~1 ^нове {me}. Не подобається — то твої проблеми, бля.","~3 ^нове {me}. Моя людина вибрала. Мені подобається, і все.","Ага. {me}. І шо?","^нове Перехрестили — і шо? Заздриш, га?","^нове Краще, ніж твоє, {м_слівце}. Сто пудів.","~1 ^нове Відчепись від мого імені, поки цілий."],"мх_нове_імя_кінець":["Ну, {addr} то {addr}. Хай буде, хуй з ним.","^нове Звикну. Мо'.","Добре, {raven}. Запам'ятав. Не радій.","~3 Носи, братан, не губи."],"мн_заслужив":["{nick}! Оце погоняло, {м_слівце}! Тепер весь район знатиме.","Мене тепер звуть {nick}. Хто засміється — без очей лишиться, бля.","{nick}. Звучить так, шо вороги самі обісруться й розбіжаться.","{nick}? Хто це придумав? Та й похуй. Носитиму. Криво, але гордо.","Тепер я {nick}. Заржеш — дзьобну. Не заржеш — теж дзьобну, для профілактики.","~1 {nick}. Ну, хоч шось путнє від тебе, курва.","~3 {nick}. Ми це разом заробили, братан. Не розкисай мені тут."],"мн_змінив":["{nick}? Ну, хай буде, {м_слівце}.","Знову ім'я міняєш? Я тобі шо, собака? Але {nick} — таке, нічо.","~1 Обізвав, сука. {nick}. Я це запам'ятаю.","~23 {nick}. Згодиться, хай.","~3 {nick}. Гарно, курва. Дякую, чуєш."],"мх_вступ":["Йо!","Тьху ти.","Ну-ну, бля.","Слухай сюди, бляха.","Ей, {м_слівце}!","~1 Ой, всьо.","~3 Гей, братан!"],"мх_відгук":["Шо?","Ги-ги.","Ой, та ну.","Ану слухай.","Ага, {м_слівце}.","~3 Ну-ну, братуха."],"мх_хвіст":["Тьху на тебе.","Кар, {м_слівце}, вкурив?","Отак от, бля.","~1 Відчепись.","~3 Не звикай, малий."],"мх_знайомство_встряє":["^хто|ім'я А я {me}. Хто не запам'ятає — дзьобом в тім'я.","^господар|смак Людина як людина. Смердить, як усі, бля.","^пам'ять Пам'ять? Я все пам'ятаю. Особливо, хто мені винен.","Ше один новенький. Ну, хай, {м_слівце}. Подивимось.","Знайомтесь без мене. Хоча нє, з мене почнемо: я {me}.","^хто Звідки прилетів — туди й полетить. З пиздюлями, якшо шо.","^хто Чий — то похуй. Головне, чи смачний.","^хто Новенький, {м_слівце}? Ну тримайся, малий, тут район суворий.","~1 ^хто Ше одне опудало. Їх тут, як мух на сраці.","~3 ^хто Новенький? Ну, заходь, курва, не стій. Свої ж.","^ім'я Ім'я — то фігня. Головне — який дзьоб.","^ім'я Гарне ім'я. Для курки, гиги.","^ім'я Я {me}. Хто забуде — нагадаю. Дзьобом. По сусалах.","~1 ^ім'я Імена, бля. Запам'ятаю, якшо не забуду. А я забуду.","~3 ^ім'я Нормальне ім'я, {м_слівце}. Не гірше мого. Ну, майже.","^господар Людина як людина. Дві руки, нуль мізків.","^господар Моя людина краща. Бо моя, і все.","^господар Люди всі однакові, курва. Смердять і падають.","~1 ^господар Ваші люди — два дебіли. Як і ви.","~3 ^господар Нормальні люди, хай їм грець. Обоє.","^смак Смак? У ворона смак — до падла. Решта — пиздіж.","^смак Про смак не сперечаються, {м_слівце}. Ним дражнять, гиги.","^смак Смак у всіх гівняний. Крім мене, ясне діло.","~1 ^смак Ну й смак у вас обох. Тьху.","~3 ^смак Смак як смак. Аби годували, решта — похуй.","^пам'ять Пам'ять — то моя робота, {м_слівце}. Не лізь, бо вріжу.","^пам'ять Я все пам'ятаю. І кожного, хто мені винен. Кожного, сука.","^пам'ять Пам'ять — то зброя. А я, бля, озброєний до дзьоба.","~1 ^пам'ять Ти нічо не пам'ятаєш, бо в тебе в голові протяг.","~3 ^пам'ять Я цей день запам'ятаю. Мо'.","Та ви обидва хуйню несете, їй-бо.","Можна тихіше? Я тут думаю, кого б зжерти.","Я все чую, {м_слівце}. Все.","Ага, ага. А мене спитати? Ні, нахуй мене питати.","~1 Ой, бляха-муха, почалося.","~3 Добре, шо ми всі тут, бля. Тіко не обнімайтесь.","А мене хтось питав? Нє? Тоді слухайте, бо скажу.","Ви обидва несете гівно, але гарно, курва.","А можна я теж когось дзьобну? Ну трішки?","~1 Тьху на вас обох, лошари.","~3 Ну ви й парочка, бля. Мені подобається.","Я тут, якшо шо. Слухаю і бішусь.","Ви базарте, а я подумаю, кого зжерти.","Нудно, {м_слівце}. Додайте крові в базар.","О, і я скажу: курва. Все, сказав.","~1 Скіки ви ще тріпатиметесь?","~3 Добре сидимо, курва мать. Душевно."],"мх_зустріч_встряє":["^давно|новини І я тут, {м_слівце}! Новин — повна торба, бля.","^живий Живі. Поки шо. Хто зурочить — дзьобну.","^новини Новина: моя людина знову шось спалила. Ну як шось — пів хати.","Всі зібрались? Ну все, тепер буде весело, курва.","Здоров усім. Крім тебе. Та жартую, бля. І тобі здоров.","^давно Давно, курва. Я вже думав, вас зжерли.","^давно Ото зустріч! Принесіть хтось падла, обмиємо.","^давно Да
