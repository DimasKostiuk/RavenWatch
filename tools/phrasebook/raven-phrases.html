<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фрази воронів</title>
<style>
:root {
  --bg: #14161b; --panel: #1c1f26; --card: #22262e; --line: #313642; --ink: #e4e6ea; --soft: #9aa3ad; --dim: #6b7380;
  --hugin: #6ec1ff; --munin: #ff6a55; --gold: #e6c77c; --name: #d9c7a0; --edit: #2b3a2b; --warn: #ffb35a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
header h1 { font-size: 17px; margin: 0 8px 0 0; color: var(--gold); font-weight: 600; }
header label { color: var(--soft); font-size: 13px; display: flex; gap: 6px; align-items: center; }
select, input[type=text], input[type=search] { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; font: inherit; font-size: 13px; }
input[type=text] { width: 96px; }
button { background: #2c323d; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button.main { background: #3a3220; border-color: #6d5a2e; color: var(--gold); }
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 54px); }
nav { border-right: 1px solid var(--line); padding: 10px; overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
nav .grp { color: var(--gold); font-size: 13px; margin: 12px 4px 4px; text-transform: uppercase; letter-spacing: .04em; }
nav a { display: block; color: var(--soft); text-decoration: none; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
nav a:hover, nav a.on { background: var(--card); color: var(--ink); }
nav a .n { color: var(--dim); float: right; }
main { padding: 14px 18px 60px; }
.tag { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 12px 14px; }
.tag h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tag h3 code { color: var(--gold); }
.tag h3 .file { color: var(--dim); font-size: 12px; font-weight: normal; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.col h4 { margin: 6px 0; font-size: 13px; }
.col.h h4 { color: var(--hugin); } .col.m h4 { color: var(--munin); }
.samples { margin: 6px 0; padding: 0; list-style: none; }
.samples li { padding: 4px 8px; border-left: 3px solid var(--line); margin: 3px 0; background: #1a1d23; border-radius: 0 6px 6px 0; }
.col.h .samples li { border-left-color: #2f5d80; } .col.m .samples li { border-left-color: #803a30; }
.samples li .ph { color: var(--warn); }
.samples li .nm { color: var(--name); }
.tpl { font: 12px/1.4 Consolas, monospace; color: var(--soft); margin: 4px 0; white-space: pre-wrap; }
details { margin: 6px 0; }
summary { cursor: pointer; color: var(--soft); font-size: 13px; }
textarea { width: 100%; min-height: 90px; background: #15181d; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: 12.5px/1.45 Consolas, monospace; resize: vertical; }
textarea.changed { border-color: #5a8a3a; background: var(--edit); }
.listname { color: var(--gold); font: 12px Consolas, monospace; margin-top: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.talk { background: #191c22; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.talk div { margin: 3px 0; }
.talk .who-h { color: var(--hugin); font-weight: 600; } .talk .who-m { color: var(--munin); font-weight: 600; }
.note { color: var(--dim); font-size: 12.5px; }
#exportBox { position: fixed; inset: 8% 10%; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 14px; display: none; z-index: 10; flex-direction: column; gap: 8px; }
#exportBox textarea { flex: 1; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } nav { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); } .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Фрази воронів</h1>
  <label>Пошук <input type="search" id="q" placeholder="тег, список або слово"></label>
  <label>Довіра <select id="tier"><option value="1">1–3 (~1)</option><option value="2" selected>4–5 (~2)</option><option value="3">6–7 (~3)</option></select></label>
  <label>Ти <select id="gMe"><option value="0">він</option><option value="1">вона</option></select> <input type="text" id="nMe" value="Костя"></label>
  <label>Інш. <select id="gFr"><option value="0">він</option><option value="1">вона</option></select> <input type="text" id="nFr" value="Валя"></label>
  <button class="main" id="again">Нові приклади</button>
  <button id="export">Копіювати зміни <span id="nChanged"></span></button>
  <span class="note" id="built"></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="exportBox">
  <div class="row"><b style="color:var(--gold)">Твої зміни у форматі файлів фраз</b><span class="note">Скопіюй і надішли мені — я перенесу їх у код.</span>
  <button id="copy">Копіювати</button><button id="reset">Скинути всі зміни</button><button id="close">Закрити</button></div>
  <textarea id="exportText" readonly></textarea>
</div>

"не втопися. Пірнати за тобою я не буду.","у воді ти повільн{ий|а}. Змій це теж знає.","під тобою щось пропливло. Не озирайся.","броня тягне на дно. Ну-ну.","берег он. Ще десять гребків. Рахую.","по-собачому. Валькірії б оцінили.","вода крижана. Синієш уже.","~1 мішок брюкви пливе рівніше.","~1 риба на тебе дивиться і сміється.","~2 берег ліворуч, стратегу. Ліворуч.","~3 вилазь. Біля вогню обсохнемо — тоді все тобі вискажу.","мокр{ий|а} до кісток. А човен удома лишився, так?"],"про_море":["гарна водичка. Змій теж так вважає.","вітер мені під пір'я. Не так різко.","хвилі колишуть. Не засни, стерновий.","~1 стерно тримай. Мрії потім.","~3 з тобою й море сухіше.","сонце на воді. Не витріщайся, осліпнеш.","на обрій дивись. Я не маяк.","солоний вітер. Провітрить тобі голову.","вітрило все ловить. Не те що ти.","хвилі лагідні. Поки що.","чайки. Ненавиджу чайок. Галасливі нездари.","куди пливемо, стратегу?","під нами глибоко. І там щось є. Не перехиляйся.","~1 знову звернули. Ти взагалі куди кермуєш?","~1 кермуєш, як п'яний скальд.","~2 вітер попутний. Навіть ти не зіпсуєш.","~3 з тобою — хоч куди. Окрім дна.","капітане! Не потопи корито."],"про_вантаж":["віл, і той швидший.","ще один камінь — і вростеш у землю.","нащо тобі стільки?","ти не йдеш. Ти посуваєшся.","~1 тебе з цим мотлохом і поховають.","~3 я б поніс. Але не понесу.","викинь щось. Отак ти до вечора не дійдеш.","чуєш? То твоя спина скрипить.","пів гори несеш. Скромно.","віслюк би відмовився. Ти не віслюк. Гірше.","кожен крок — стогін. Твій, не мій.","~1 жадібність — гарна риса. Для гнома.","~1 ти тягнеш усе, крім розуму.","~2 додому, скинь, і назад. Просто ж.","~3 сядь, віддихайся. Я подивлюся.","равлик з хатою, і той швидший. Половину — геть."],"про_голод":["пузо бурчить. Я чую.","голодним у бій? Сміливо. І тупо.","живіт порожній. Голова, бачу, теж.","~1 ти хоч пам'ятаєш, як ложку тримати?","їж. Сили тануть, а ти й не помічаєш.","~3 поїж, роззяво. Тоді хоч битимешся по-людськи.","я поїв. Ти — ні. Хто з нас дур , як молоко.","у тумані звуки брешуть.","я чую кроки. Не наші.","сірість ковтає стежку.","туман холодить пір'я.","найкраща погода для засідки. Не для нас.","~1 у тумані ти виглядаєш розумніш{им|ою}. Бо тебе не видно.","~1 загубишся — шукати не буду. Ну, буду.","~2 туман розсіється. Тримаймося разом.","~3 я не відлітатиму далеко, друже.","туман як молоко. Дивись, кого обіймаєш."],"про_сніг":["сніг. Вдягнися тепліше.","холод пробирає навіть крізь пір'я.","сніг рипить під ногами.","~1 замерзнеш — {сам винен|сама винна}.","~3 зігріймося біля вогню.","холод не любить ледачих.","сніг заметає сліди.","холод кусає за дзьоб.","мороз малює на шоломі візерунки.","у снігу кожен крок — подвиг.","біла тиша. Гарно й небезпечно.","вітер колючий, як троляча борода.","~1 у тебе ніс червоний, як у п'яного ярла.","~1 вдягнися, бо замерзнеш, а тягти тебе мені нічим.","~2 холодно, але терпимо.","~3 тримайся ближче, гріймося разом.","холодно, як у Гель у пазусі. Вдягнись."],"про_втечу":["біжиш? Ну, хоч щось швидко робиш.","бігати ти вмієш. Хоч це.","відступаєш, щоб повернутися? Чи просто тікаєш?","~1 так швидко ти ще не біга{в|ла}. Шкода, що назад.","~1 п'яти мелькають. Героїзм так і пре.","~3 тікай, тікай. Мертв{ий|а} ти мені ні до чого.","жив{ий|а} — значить, правильно бі{г|гла}.","вт{ік|екла}. І ніхто не бачив. Крім мене.","тактичний відступ, так? Так і запишу.","від {foe_gen} тікаєш? Ноги — твоя головна зброя."],"про_дорогу":["{km} позаду. Ноги ще є чи вже пеньки?","далеко забрели. Додому дорогу пам'ятаєш? Ні? Так і думав.","ідемо й ідемо. Куди — ти хоч знаєш?","~1 це вже третє коло. Згори все видно.","~3 іди, іди. Я однаково тебе не кину.","{km}. Для тебе — майже подвиг.","ще крок — і знову спіткнешся.","ноги несуть. Голова, як завжди, відстає.","стежка петляє. Ти — ще дужче.","мандрувати добре, коли знаєш куди. Ти не знаєш.","за пагорбом — ще пагорб. А ти таверну чека{в|ла}?","позаду {km}. Скиглиш, ніби всі сто.","усі дороги ведуть додому. Крім твоєї.","~1 я б долетів утричі швидше. Плентайся далі, вайло.","~1 ти заблука{в|ла} вже двічі. Я рахую.","~2 гарна дорога. Хоч раз не загубися на ній.","~3 далеко. Та з тобою не нудно: ти ж раз у раз падаєш.","пробі{г|гла} {km}. За тобою хтось женеться?"],"про_новий_біом":["{biome}! Ще не бачені місця.","о, {biome}. Тут треба бути пильнішим.","нові землі — {biome}. Записую на мапу пам'яті.","~1 {biome}... і ти, звісно, без плану.","~1 о, {biome}. Цікаво, скільки ти тут протримаєшся.","~3 {biome} разом із тобою — не страшно.","тут, {biome_in}, усе інакше. Дивись під ноги.","{biome}! Навіть повітря інше.","ти вже {biome_in}. Тут усе кусається сильніше.","нові землі — нові способи здохнути."],"про_підземелля":["тут темно й тісно. Не люблю.","під землею мої крила марні.","кам'яні стіни й тиша. Мені тут не до вподоби.","~1 полізли в нору. Чудово. Геніально.","тримай смолоскип ближче.","~3 я з тобою навіть тут, у темряві.","звідси неба не видно. Поспішімо.","чуєш? Щось шкребе в темряві.","ти смердиш склепом. Вилазь на світло.","з підземелля {живим|живою}? Неочікувано."],"про_нудьгу":["тихо.","нічого. Взагалі.","тихо. Не подобається мені це.","навіть вітер здався.","ворогів нема. Ти їх усіх розпуди{в|ла}?","світ спить. Ти теж, схоже.","мухи ліниві. Ти ліниві{ший|ша}.","чути, як росте трава. І більше нічого.","хмар сорок три. Я рахував. Двічі.","ніщо не горить, ніхто не кусає. Ти хвор{ий|а}?","~1 стоїш і нічого не робиш. Це ти вмієш.","~1 нудно. Хоч би спіткну{вся|лася}, чи що.","~2 слухай, ну зроби вже щось. Хоч що.","~2 спокійно. Я аж бурчати розучився.","~3 тихо. Можна й посидіти. Недовго.","~3 нема від кого тікати. Рідкість у тебе.","тиша й спокій. Не звикай.","ти там {живий|жива}? Ворухнися хоч."],"нудьга_кінець":["Може, хоч кудись підемо?","Я посплю. Буди, як щось.","Нудно. Аж пір'я лізе.","За пагорбом, може, цікавіше. Ніж тут.","Тиша. Не до добра.","Хоч ягід назбирай, ледащо.","~1 Або стій далі. Тобі личить.","~3 Посиджу з тобою, вайло."],"розвідка":["полечу подивлюся, хто там ховається.","гляну згори, що довкола.","зараз розвідаю, а ти не відходь.","~1 полечу, бо ти ж {сам|сама} нічого не бачиш.","~1 лечу дивитися, поки ти тут топчешся.","~23 лечу на розвідку, тримай мапу напоготові.","~3 для тебе — хоч на край світу. Лечу.","гляну згори, хто там ховається.","тримай мапу напоготові. Я швидко.","не сумуй. Я лише трохи покружляю.","поки мене нема, не вплутайся в бійку."],"розвідка_кінець":["Дивись на мапу.","Я швидко.","Не вплутайся без мене в бійку.","~1 І не здумай нікуди подітися.","~3 Повернуся з новинами.","~2 Чекай мене тут."],"світло":["тримай світляка.","ось тобі світло.","мій маленький друг посвітить тобі.","~1 на, бо ще лоба розіб'єш у темряві.","~1 світло тобі, бо дивитися боляче, як ти спотикаєшся.","~3 хай моє світло веде тебе.","тримай світло. Тепер хоч видно, куди ти вступаєш.","у темряві ти ходиш, як сліпе кошеня. Ось, свічу.","темно, як у троля в шлунку. Ось тобі світляк.","без світла ти б уже тричі {спіткнувся|спіткнулася}. Так, я рахую."],"світло_кінець":["Бережи його.","Тепер хоч видно, куди ступаєш.","~1 Не загуби, роззяво.","~3 Темрява нам не ворог.","~2 Не губися в темряві."],"злет":["стрибай, поки закляття тримає.","позичу тобі трохи свого неба.","ноги легкі, як пір'я.","~1 стрибай уже, бо так і повзатимеш, як равлик.","~1 крил у тебе нема, мізків теж, тож хоч стрибай.","~3 летімо разом — ну, майже.","стрибай, поки закляття тримає. Тільки стеж за часом.","крил у тебе нема, тож позичу трохи свого неба.","гляди вниз лише тоді, коли закляття ще діє.","звідти, згори, мапа виглядає краще. Перевір.","ноги легкі, як пір'я. Рахуй секунди, поки закляття тримає.","вітер під тобою. Не махай руками, не допоможе."],"злет_кінець":["Стеж за часом.","Земля нікуди не дінеться.","~1 Тільки не гепнися, як мішок.","~3 Небо твоє.","~2 Тримай рівновагу."],"тінь":["накрив тебе крилом — тебе не видно.","ти тепер тінь.","ніхто тебе не бачить.","~1 сховав тебе, бо дивитися на тебе — те ще видовище.","~1 зникни. Хоч так від тебе буде користь.","~3 тінь Одіна з тобою.","я накрив тебе крилом. Тепер тебе ніхто не бачить.","ти тінь. Тільки не чхни.","крок м'якше. Перший удар — найсолодший.","сховав тебе під пір'ям. Ворог і не помітить, звідки прилетіло."],"тінь_кінець":["Заходь зі спини.","Перший удар — найсолодший.","Тільки не чхни.","~1 І не змарнуй її на кущі.","~3 Бий напевно.","~2 Тихо, як миша."],"крок":["дихай рівно, я підкажу ритм — ноги втомлюватимуться менше.","біжи моїм кроком, і сил вистачить надовго.","не трать подих дарма: я поведу, а ти відпочивай на ходу.","~1 не дихай, як загнаний кабан. Ось так, рівніше.","~3 тримай мій ритм, і втома тебе не наздожене.","не трать подих дарма. Я поведу, а ти відпочивай на ходу.","тримай мій ритм — і втома тебе не наздожене.","плечі вільно, крок м'який. Так і дихатимеш, і бігтимеш."],"рятунок":["Не сьогодні!","Я тебе не віддам!","Валькірії почекають!","~1 Знову рятувати твою дупу!","~3 Поки я з тобою — не помреш!","Не тепер!","~2 Тримаю тебе!","Ще рано тобі до Вальгалли!","~1 Без мене ти б уже {згнив|згнила}!","~3 Я поруч, чуєш?!","Тримайся за життя!","Не сьогодні! Тікай, поки я тримаю!","Валькірії почекають. Біжи!","Я тебе не віддам! Геть звідси, швидко!","це було близько. Дуже близько. Тікай!","Ще не час, {name}! Вставай і біжи!","Одін каже: рано. Тож тікай, {name}!","я виторгував тобі мить. Не змарнуй її!","Тримайся за мене, {name}! Геть звідси!"],"рятунок_кінець":["Тікай!","Біжи, поки я тримаю!","~1 Наступного разу думай головою!","~3 Тримайся, друже!","Живи!","Біжи вже!"],"їжа":["о. Їстівне.","оце обід. Не те що вчора.","~1 нарешті. Я вже кору гриз.","~2 ну, приймається.","~3 знаєш, що я люблю. Підозріло.","м-м. Ти це вкра{в|ла}?","ситий ворон — добрий ворон. На годину.","м-м. Мій шлунок тебе пробачив.","ось чому я досі тут. Тільки тому.","годуй так і далі — може, не клюну.","смачно. Шукаю, до чого причепитися. Нема.","~1 ну, принаймні не отрута.","~1 на пів дня пізніше, ніж треба. Я рахую.","~2 смачно. Ти вчишся.","~2 оце вже повага. Продовжуй.","~3 ти мене балуєш. Не зупиняйся.","~3 смачно. Майже як удома. Майже."],"відмова_їжі":["Не те, друже. Мій дзьоб до такого ще не звик.","~1 Я це не їм. Принеси щось простіше, не мудруй.","~2 Залиш собі. Мені така їжа поки не до снаги.","~3 Не поспішай, друже. До цього харчу я ще доросту.","Мій дзьоб такого не бере. Поки що.","~1 Не мудруй. Простіше давай.","~2 Це мені рано. Довіри бракує, не апетиту.","~3 Відкладу на потім, коли ми станемо ще ближчими."],"їжа_кінець":["Мало, але беру.","~1 Наступного разу швидше.","~3 Годуєш добре. Решта — то таке.","Ще давай.","~2 Бачиш, можеш, коли захочеш.","Запам'ятаю. Ненадовго.","Тепер можу й думати.","Кра! Ще б трохи.","~1 Але це не значить, що я тебе люблю.","~2 Смачно. Вкра{в|ла}?","~3 Не пропаду з тобою. Мабуть."],"рівень":["Я довіряю тобі більше, {name}.","Ми стаємо ближчими, {name}.","~1 Гаразд, {name}, ти не {такий безнадійний|така безнадійна}, як я думав.","~3 Ми пройшли довгий шлях, {name}.","Ще ступінь довіри, {name}.","~1 Добре, {name}. Я тебе визнаю. Поки що.","~2 Ти мене приємно дивуєш, {name}.","~3 Я радий, що ти {мій|моя}, {name}.","тепер я з тобою по-справжньому.","Трофеї з'їдено, клятву дано. Я твій, {name}.","Одін бачить: ми тепер одне ціле, {name}.","Я відчуваю силу. Дякую, що не {покинув|покинула} мене, {name}.","Ще крок до повної довіри. Веди, {name}."],"рівень_кінець":["Полечу, розповім Одіну.","~1 Не зазнавайся.","~3 Одін про тебе почує.","Не підведи.","~2 Так тримати."],"чужий":["ти не мій господар, {name}.","чужі плечі мені тісні, {name}.","я сумую за тим, хто мене розбудив.","я не твій, і ти це знаєш.","де мій господар?","чужа рука — чужий ворон.","~1 ти мене {вкрав|вкрала}, так?","ти не мій господар. Це тобі нагадування.","Чужі плечі мені тісні, {name}. Ось тобі дзьобом.","я сумую за тим, хто мене розбудив. А тебе — клюю."],"клюв":["Ось тобі дзьобом.","Це тобі нагадування.","І ще отримаєш.","Отримуй.","Знай своє місце."],"голод":["я думаю. Про їжу. Тільки про їжу.","з порожнім шлунком я дурнішаю. До твого рівня.","я не скаржуся. Я голосно голодний.","~1 {сам|сама} пої{в|ла}, а мені? Жаднюга.","~3 нагодуй, поки я ще добрий.","я ворон, а не камінь. Годуй.","у шлунку вітер. Чуєш? Це через тебе.","твоє вухо вже пахне ковбасою. Попереджаю.","глянь на мене. Худий, як скіпка.","коли ти мене востаннє годува{в|ла}? Я забув. Ти теж.","голодний я злий. І пам'ятливий.","~1 кабана ти годуєш краще. Я рахую.","~1 не нагодуєш — клюну. У вухо.","~2 дай поїсти — дам пораду. Чесний обмін.","~2 я голодний. Не помираю. Поки що.","~3 ну, поділишся? Я ж бачу, що в торбі.","~3 крихітку. Одну. Не скупися."],"голод_прохання":["Їжу давай.","Де мій обід?","~1 Ворушись.","~3 Пригостиш? Я ж свій.","Хоч шматочок.","Ну будь ласка.","Я. Чекаю.","~1 Швидше.","~2 Ну дай, жаднюго.","~3 Віддячу. Колись."],"сплячий":["відійди. Я тебе не знаю.","хто ти {такий|така}, щоб мене кликати?","мовчи, я думаю, і не про тебе.","я сплю. Тобі здається.","не муляй мені.","Відійди. Я тебе не знаю.","Хто ти {такий|така}, щоб мене кликати?","Мовчи. Я думаю, і не про тебе.","Принеси мені знак, що {здолав|здолала} Ейктюра. Тоді, може, вислухаю.","Біля Жертовних каменів доведеш, чого {вартий|варта}. Не тут."],"сплячий_натяк":["Принеси знак, що {здолав|здолала} Ейктюра.","Жертовні камені. Тоді поговоримо.","Без обряду я тобі ніхто.","Два трофеї Ейктюра, Жертовні камені. Запам'ятай."],"хвіст":["Я все бачу.","Одін би посміхнувся.","Запишу в літопис.","Ну-ну.","Цікаво, що далі.","Не розслабляйся.","~1 Хоча чого я від тебе чекав.","~1 Я б зробив краще. Навіть без рук.","~1 Здивуй мене хоч раз.","~1 Ох, і важко ж мені з тобою.","~1 Мама-ворона мене попереджала про таких.","~2 Непогано, до речі.","~2 Звикаю до тебе, знаєш.","~23 Тримайся. Я ж поруч, на жаль.","~3 Я з тобою. Куди ж я дінусь.","~3 Впораємось. Ти — з моєю допомогою.","~3 Пишаюся. Трошки. Не кажи нікому.","~3 З тобою хоч не нудно.","Запишу. Нащадкам — як застереження.","Одін посміхнувся. Здається, з тебе.","Мудрість — не твоє. Зате старанність — так.","~1 Не вдавай, що це був план.","~1 Боги дивляться. І, здається, ставлять ставки.","~1 Я міг би пояснити, але навіщо?","~2 Могло бути й гірше. Теоретично.","~2 Я нічого не кажу. Але думаю голосно.","~3 І все одно ти мені подобаєшся.","~3 Не зазнавайся — я ще не все сказав."],"дзьоб":["дзьобнув. Точно в ціль.","тюк — і готово.","влучив, куди цілився.","ось тобі, {target}.","{target} тепер знає, хто тут думає.","{target} навіть не помітив, звідки прилетіло.","дзьоб на місці.","один удар — одна думка.","є влучання.","~1 зробив твою роботу. Знову.","~1 бачиш, як треба? Вчися.","~1 я б'ю, а ти дивишся. Зручно {влаштувався|влаштувалась}.","~1 знову я. А ти чим {зайнятий|зайнята}?","~1 це було не для тебе. Мені просто нудно.","~2 дзьоб на місці, а {target} — вже ні.","~2 клюнув. Твоя черга.","~2 є. Далі {сам|сама} вирішуй.","~2 чисто зроблено.","~3 прикрив тебе, як завжди.","~3 для тебе — хоч сто разів.","~3 разом ми їх подужаємо.","~3 я поруч, не хвилюйся.","~3 це тобі допомога від друга."],"дзьоб_крит":["прямо в слабке місце!","в око. Чисто.","оце влучання — {target} аж присів.","туди, де болить найбільше.","знайшов щілину в обладунку.","~1 навіть сліпий ворон іноді влучає в око. Але я не сліпий.","~1 бачи{в|ла}? Ні? Ну звісно.","~2 ідеально. Бачи{в|ла}?","~2 точно під ребро.","~3 це для тебе, друже.","~3 запам'ятай цей удар — ми його заслужили."],"дзьоб_серія":["раз, і ще раз!","раз не вистачило — дзьобнув удруге.","{target}, ще тримаєшся? Ну то ще!","тук-тук. Хто там?","один раз — випадковість, двічі — вже звичка.","~1 доводиться все робити двічі. Як завжди з тобою.","~2 серія. Він і не зрозумів.","~3 не спиню, поки ти в небезпеці."],"дзьоб_промах":["там нікого. Цілься краще.","повітря не клюнеш.","порожньо. Подивись, куди дивишся.","~1 полетів дарма. Дякую за прогулянку.","~1 ти куди мене {кинув|кинула}? У порожнечу?","~1 добре хоч крила розім'яв.","~2 порожньо. Покажи ціль.","~2 нікого. Наступного разу — ближче.","~3 нікого не видно — повертаюсь до тебе.","~3 пролетів, оглянув — тихо. Ти в безпеці."],"розім_слідом":["крила затерпли. Полечу трохи за тобою.","розімнуся. Не біжи надто швидко.","полечу позаду — так краще видно дорогу.","~1 не зважай, я просто розминаю крила. І дивлюся, щоб ти ні в що не вліз{|ла}.","~1 політаю за тобою. Хтось же має бачити, куди ти пхаєшся.","~2 трохи повітря — і я знову на плечі.","~2 полечу слідом. Ти йди, я наздожену.","~3 полечу поруч. З тобою й у небі спокійно."],"розім_коло":["зроблю коло-друге. Подивлюся згори.","згори все видніше. Покружляю.","крила просять неба. Я ненадовго.","~1 покружляю, поки ти тут топчешся.","~1 зверху ти ще кумедніш{ий|а}. Не ображайся.","~2 огляну околиці й повернуся.","~3 покружляю над тобою — нехай усі бачать, що ти не сам{|а}."],"розвідка_чисто":["злітав уперед — дорога чиста.","попереду тихо. Можеш іти.","оглянув шлях. Нікого.","~1 нікого там нема. Можеш далі топати, як топав.","~2 я подивився — чисто. Іди спокійно.","~3 дорога чиста. Я пильную, ти йди."],"розвідка_ворог":["попереду {target}. Обійди або готуйся.","там, куди йдеш, — {target}. Май на увазі.","бачив попереду: {target}. Не лізь наосліп.","~1 попереду {target}. Не кажи потім, що я не попереджав.","~2 обережно: попереду {target}.","~3 попереду {target}. Я поруч, але будь пильн{ий|а}."],"розім_корабель":["покружляю над щоглою. Звідси море видно до краю.","вітер добрий — полетаю над кораблем.","згори видно, куди нас несе. Покружляю.","~1 політаю над кораблем, поки ти кермуєш абияк.","~2 над водою крила самі несуть. Я ненадовго.","~3 покружляю над нами. Море спокійне, і ти зі мною."],"розім_разом":["Мунін, полетіли розімнемося. Ти — в інший бік.","Мунін, коло навколо — і хто перший на плечі.","Злітаємо удвох. Мунін, тільки не врізайся в мене."],"дзьоб_кінець":["Наступний.","Хто ще?","Я повернувся.","~1 Не звикай.","~3 Тримайся біля мене."],"вишкіл":["мій дзьоб гострішає.","вчуся бити точніше.","ще трохи — і жоден не втече.","~1 ще трохи — і битимусь замість тебе повністю.","~2 практика робить своє.","~3 з тобою я стаю кращим."],"свідок":["я бачив, як він упав. Мій дзьоб це запам'ятав.","тепер я знаю, як б'ють богів.","ще одна легенда — і я в ній був.","~1 непогано. Для тебе.","~2 запишу в літопис. І в дзьоб.","~3 ми зробили це разом."],"сильніший":["я бачив, як він упав, — і мій дзьоб став сильнішим.","відчуваю: тепер я б'ю сильніше.","ця перемога й моя теж — мій удар тепер важчий.","запам'ятав цей бій. Наступний мій удар буде сильнішим.","боги падають — а я росту. Дзьоб гострішає.","~1 гаразд, визнаю: тепер я б'ю сильніше. Завдяки собі, звісно.","~1 ти {вижив|вижила}, а я став сильнішим. Чесний обмін.","~1 не задирай носа. Але так, мій дзьоб тепер сильніший.","~2 мій дзьоб загартувався. Відчуєш у наступному бою.","~2 став сильнішим. Тепер і далі летітиму сміливіше.","~3 ми стали сильнішими — обоє.","~3 дякую, що {взяв|взяла} мене в цей бій. Тепер я б'ю сильніше.","~3 з тобою я росту. Наступного разу вдарю ще сильніше."],"готування":["пахне їжею. Нарешті щось корисне від тебе.","куховариш? Тільки не підпали табір, кухарю.","якщо це суп, то дуже сміливий суп.","ти так готуєш, що й вовк би відмовився.","~1 їстівне? Хоча тобі й підошва зійде.","~2 пахне непогано. Мені — перший шматок.","~3 пахне домом. Пересолиш — я цього не казав.","димок такий, що я аж забув на тебе бурчати.","казан булькає. А ти над ним, як шаман.","вечеря буде. Якщо не згорить. Згорить.","м'ясо на вогні. Відійдеш — буде вугілля.","ти вчишся куховарити. Повільно. Дуже.","пахне сажею. Ну, й трохи спеціями.","~1 згорить — не їстиму. Ну, хіба трошки.","~2 смачно пахне. Мені шматочок, кухарю.","~3 пахне так, що аж лишатися хочеться. Не зіпсуй.","~3 добре готуєш. Не зазнавайся.","чую їжу! А мені? Я теж тут живу."],"ремесло":["майструєш. Ну-ну. Подивимось, що вийде.","ще одна річ, яку ти зламаєш у першому ж бою.","стукіт, сопіння, лайка. Майстер за роботою.","~1 криво, але працюватиме. Як і ти.","~2 непогано. І всі пальці на місці. Порахуй.","~3 рівно вийшло. Не звикай, я не завжди хвалю.","верстак скрипить. Чи то твої мізки?","ще одна корисна річ. Корисна ж, так?","руки хоч щось пам'ятають. Голова — ні.","спорядження — це півсправи. Решта — голова.","дерево, залізо, піт. І жодної думки.","пахне стружкою. І тобою. Фу.","~1 і з якого разу воно запрацює? З п'ятого?","~1 Одін бачить твою роботу. І зітхає.","~2 вийшло! Дивуєшся?","~3 руки золоті. Голову б таку.","мовчу, мовчу. Бо ще палець собі відріжеш."],"втеча":["{prey} — і нема. Обід помахав хвостом.","здобич на волі. Ти — з порожніми руками.","втекло. Почуло, як ти думаєш. Голосно.","~1 з таким мисливцем звірі живуть довго.","~2 буває. У тебе — щоразу.","~3 нічого. Наступний буде повільніший. Сподіваюся.","ну, мисливцю року, де обід?"],"свої":["свої ж! Дивись, кого б'єш.","це був друг. Був.","~1 ну ти й ґава. Свого ж лусну{в|ла}.","~2 рука здригнулася? Аякже. Двічі.","~3 обережніше. Друзів у тебе й так обмаль.","друга від драугра не відрізняєш?","ворогів мало? Чи свої смачніші?","це був не ворог. Тепер, може, й буде.","ще раз — і битимешся {сам|сама}.","це так у вас вітаються? Ні, не так.","свого? Посеред бою? Стратегу.","~1 вітаю. Мінус один свій.","~1 нудно? Бий камінь. Він не образиться.","~2 щось не поділили? Мене не вплутуй.","~2 ой. Вибачайся. Швидко.","~3 бережи своїх. Хто тебе ще з болота тягтиме?","~3 тихо. Видихни. Ворог там."],"тут":["{biome_here_in} тихо. Поки що. Ти ж тут.","{biome_here_in} я дивлюся на кущі. Ти — під ноги. Хоч раз.","{biome_here_in} кожен камінь пам'ятає дурнів. Тебе теж запам'ятає.","~1 {biome_here_in} каміння й те кмітливіше. Без образ.","~2 {biome_here_in} гарно. Тому й пильнуй, роззяво.","~3 {biome_here_in} навіть затишно. Не звикай, тут кусаються.","{biome_here_in} я рахую кроки до вогню. Ти — ні, як завжди.","{biome_here_in} сліди старі. Ті, хто їх лишив, не вийшли.","{biome_here_in} вітер щось несе. Ти, звісно, не чуєш.","{biome_here_in} тихо. Як перед бійкою.","{biome_here_in} я б не сідав на першу-ліпшу гілку.","{biome_here_in} в кожній тіні хтось. Туди дивись, ґаво.","~1 {biome_here_in} ти як загублене теля. Тільки не мукай.","~1 {biome_here_in} тупаєш, як стадо. Тут же слухають.","~2 {biome_here_in} бувало й гірше. Ти й тоді скигли{в|ла}.","~2 {biome_here_in} я майже зрозумів, навіщо ми тут. Майже.","~3 {biome_here_in} добре, що разом. Сам{|а} ти б пропа{в|ла}.","~3 {biome_here_in} тримайся мене. Тобі ж краще, вайло.","пролітав {biome_here_in}. Глянув, чи ти ще жив{ий|а}."],"скрині":["знову по скринях? Скільки можна.","кишені повні, голова — як завжди.","береш блискуче. Корисне, як завжди, лишиш.","~1 мертвих обкрадати — це ти вмієш. Хоч щось.","~2 ну, що там? Знову смола?","~3 покажи. Бачу ж, що схова{в|ла}.","скриня порожня, сумка переповнена. Як завжди.","а якщо пастка? Ти ж навіть не глянеш.","чуже старе барахло. Твоє улюблене.","порпаєшся, як ворон у смітті. Поважаю.","щось блищить? Моє.","~1 гребеш усе. Камінь навіщо, генію?","~1 не поспішай. Скриня не втече, на відміну від тебе.","~2 хм. Знову мотузка?","~3 блискуче — мені. Як завжди.","~3 там ягоди? Мені. Не сперечайся.","знову нишпориш. Павуків уже знайш{ов|ла}, вітаю."],"звір":["хто тут хороший? Не я, звісно.","гладиш звірину. Мене — не смій.","~1 звір тебе слухається. Хоч хтось.","~2 приручене серце — найвірніше. Після мого.","~3 він тебе любить. Я теж... трохи.","звір муркоче? Чи то гарчить?","приручений звір — вірний друг.","гладиш так ніжно, аж заздрісно.","навіть хижак лагідніє, коли його гладять.","звір пам'ятає добро. Як і ворон.","~1 гладиш звіра, а він дивиться на тебе, як на дурня.","~1 тварина тебе любить. Мабуть, не знає тебе як слід.","~2 гарний звір. Доглянутий.","~3 у тебе добре серце. Звірі це відчувають.","~3 і мене погладь. Тільки один раз."],"ягоди":["жменя ягід. А мені?","ягоди. Їжа дроздів. Тобі якраз.","ягідки рвеш, а за спиною ліс. Ну-ну.","~1 нахиляєшся, як бабця. І кректиш так само.","~3 ягідку мені? Одну. Ну дві.","кишені повні, а я голодний. Цікаво.","руки сині. Як у мерця.","так уважно ти ще ворогів не роздивля{вся|лася}.","чорниці на обід? Вікінг, називається.","гриби не чіпай. Лікувати тебе нікому.","ти шукаєш, а ягоди — під ногами. Он.","~1 ззаду хтось сопе. Жартую. Мабуть.","~1 стільки ягід, а розуму не додалось.","~2 половину мені. Я рахував.","~2 о, ці мої. Не чіпай.","~3 одну мені, одну тобі, дві мені. Чесно.","~3 ягоди — це добре. Тут ти хоч нічого не зламаєш.","знову все в рот. Хоч кісточку лиши."],"портал":["знову крізь портал? Ти хоч пам'ятаєш, куди?","портали — для ледачих. Тобто для тебе.","між світами тісно. Живіт втягни.","~1 колись тебе там розкидає по шматочках. Я позбираю. Не всі.","~3 тримайся ближче. Шукати тебе між світами — ну його.","вжух — і ми вже деінде.","портал гуде. Ти лізеш. Як завжди.","крок — й інший край. Ти й тут заблукаєш.","брр. Між світами аж дзьоб зводить.","швидко, так. Але пішки ти б хоч схуд{|ла}.","рахую пір'я. Однієї пір'їнки бракує. Жартую.","~1 ти й у портал входиш, як мішок з ріпою.","~1 вийшли. Ти навіть нічого не забу{в|ла}? Диво.","~2 швидко. Я навіть пожалітися не встиг.","~3 ну, вийшли. Ти ці{лий|ла}, я цілий. Буде з нас.","голова не йде обертом? А, в тебе там і так вітер."],"сон":["доброго ранку, соню.","виспа{вся|лася}? Світ без тебе впорався. Легко.","поки ти спа{в|ла}, я думав. Хтось мусить.","~1 спа{в|ла} як колода, хропі{в|ла} як троль.","~2 новий день — нові способи загинути. Вибирай.","~3 ранок. Ти знову тут. Ну й добре.","світанок. Ми живі. Поки що.","ніч тиха. Майже. Ти хропі{в|ла}.","вставай, сонце вже високо, ледащо.","поки ти спа{в|ла}, я стеріг. Подяки не чекаю. А варто б.","сни бачи{в|ла}? А я пильнував. Як завжди.","новий день. Спробуй не впасти в яму.","~1 спиш довше, ніж ведмідь узимку.","~1 прокину{вся|лася}. Без мого дозволу, між іншим.","~2 ранок. Ходімо, вайло.","~3 виспа{вся|лася}? Тоді вперед, бо я закисну."],"купол":["стань під крило. Хай чекають.","під крилом тихо. А ті хай нюхають край.","дихай. Кружлятимуть, але не ввійдуть.","тут не б'ються. Ні ти, ні вони.","~1 гаразд, під крило. Тільки не звикай.","~1 тримаю. Недовго і без подяк.","~1 ховайся вже. Дивитися, як тебе ганя дарунок.","~3 {m_who}, {m_when}... Утекло. Нічого, ще зустрінетеся.","{m_when} здобич вислизнула: {m_who}. Я записав, куди вона побігла. Про всяк випадок.","~2 {m_who}, {m_when}. Утекло. Буває навіть із тобою. Особливо з тобою."],"сп_r_fled":["{m_when} ти {тікав|тікала} від {m_who_gen}. Я все бачив з плеча. Бігаєш ти краще, ніж б'єшся.","пам'ятаю твій «тактичний відступ» від {m_who_gen}, {m_when}. У літописі я назвав його саме так. З милосердя.","~1 {m_when} від {m_who_gen} ти {тікав|тікала}, як заєць. Я записав. З подробицями.","~3 від {m_who_gen} ти тоді {втік|втекла}, {m_when}. І правильно {зробив|зробила}: краще бути живим, ніж мертвим героєм.","{m_when}: {m_who} — в один бік, ти — в інший. Швидко. Я ледь утримався на плечі.","~2 від {m_who_gen} ти тоді {відступив|відступила}, {m_when}. Розумно. Я так і записав: «розумно»."],"сп_r_star":["{m_when} ти {поклав|поклала} {m_who_gen} — {m_stars}. Таких я записую окремим чорнилом.","{m_who} на {m_stars}, {m_when}. Рідкісна сторінка, де мені не треба нічого прикрашати.","~1 {m_stars} — і ти {впорався|впоралася}. Я здивований. Неприємно: доведеться визнати.","~3 {m_when} — {m_who}, {m_stars}. Ти тоді {був|була} {неймовірний|неймовірна}.","{m_who}, {m_stars}, {m_when}. Сторінка, яку я покажу Одіну першою.","~2 {m_stars} — і ти {вистояв|вистояла}. {m_when}. Гарно вийшло."],"сп_r_newkill":["{m_when} ти вперше {вбив|вбила} {m_who_gen}. Нове ім'я в сувої «Ті, хто не встиг утекти».","перша здобич цього роду: {m_who}, {m_when}. Відкриваю новий розділ.","~1 {m_who_genpl} на твоєму рахунку тепер більше, ніж нуль. Не зазнавайся.","~3 {m_when} ти вперше {подужав|подужала} {m_who_gen}. Пам'ятаю твоє обличчя тоді. Горде й трохи дурне.","{m_who}, {m_when}. Новий звір у моєму сувої. Сувій вдячний, звір — не дуже.","~2 {m_who} — новий запис у сувої, {m_when}. Перший такий."],"чуж_дар":["дар «{gift}»? Гаразд. Не тому, що ти просиш, а тому, що мушу.","роблю. Але знай: для {owner} я старався б більше.","бери мій дар «{gift}» і не дякуй. Мені твоя вдячність ні до чого.","допомагаю, бо Одін так велів. Не через тебе.","навіть мої дари в чужих руках важчають.","тримай. І пам'ятай, чий я.","дар «{gift}» — злодієві. Наче ключ від чужої скрині віддаю.","роблю, що мушу. Радості не чекай."],"чуж_дар_кінець":["Не звикай.","Це не дружба.","Віддай мене {owner}.","Тьху.","Наступного разу — ще неохочіше."],"голод_сильний":["я вже не просто голодний — я злий.","мої дари зараз дорожчі: на порожній шлунок сил нема.","голодний ворон — поганий порадник.","~1 ще трохи — і я сам пошукаю їжу в твоїй сумці.","~1 мене вже хитає від голоду, а ти й не помічаєш.","~2 я б зараз і сиру рибину з'їв, не перебираючи.","~3 мені зле від голоду, друже.","~3 я тримаюся, але голод сильніший."],"голодує":["Це тобі за порожній живіт. Ворони пам'ятають, хто їх годує.","Дзьоб — то нагадування. Я голодний, якщо ти раптом забу{в|ла}.","Ти сьогодні ї{в|ла}? А я ні. Ось і рахуйся.","Мудрість натщесерце гірчить. І дзьобає.","Одін своїх воронів годував. Просто кажу.","Клюю не зі зла — з голоду. Зміниш одне, минеться й друге.","Жменька ягід — і я знову чемний. Домовились?","Голодний розум погано радить. І боляче клює.","~1 Ще раз — і я клюну туди, де болить найбільше: у гордість.","~3 Пробач, друже. Голод сильніший за мене."],"вкрав":["я взяв у тебе з сумки: {food}. Ти б однаково не поміти{в|ла}.","позичив із твоєї сумки: {food}. Неповернення гарантую.","{food} — уже в мені. Не шукай.","~1 сам себе нагодував: {food}. Від тебе ж не дочекаєшся.","~1 твоя сумка — мій обід. Сьогодні в меню: {food}.","~2 вибач, але голод сильніший за чемність. Узяв: {food}.","~3 пробач, друже, я взяв найпростіше, що знайшов: {food}.","~3 я трошки похазяйнував у сумці: {food}. Не сердься.","твоя сумка була відчинена, а я — голодний. Тепер у ній на одне менше: {food}.","{food} сам стрибнув мені в дзьоб. Чесно.","перевірив твої запаси. {food} перевірки не пройшов — я його з'їв.","~1 ти про мене забу{в|ла}. А я знайшов у сумці: {food}.","~2 вибач. Узяв: {food}. Чесно, лише раз.","~2 трохи похазяйнував у сумці. Тепер там на одне менше: {food}.","~3 не сердься, друже. Узяв: {food}. Голод не питає дозволу."],"вкрав_кінець":["Голод — поганий порадник.","~1 Годуй вчасно — і сумка буде ціла.","~2 Наступного разу краще нагодуй сам{|а}.","~3 Я ж не зі зла.","Вважай це платою за пильність.","~1 Ворони пам'ятають, хто їх не годує.","~1 І не дивись так.","~2 Більше так не буду. Мабуть.","~2 Ти ж не сердишся? Не сердишся.","~3 Мені й самому ніяково.","~3 Наступного разу нагадай мені, що я ворон, а не злодій."],"монети":["забрав собі {coins}. Куплю їжі в торговця.","узяв у тебе {coins}. На харчі, раз ти скупишся.","~1 забираю {coins} — як плату за моє терпіння.","~2 я взяв {coins}. Віддам... колись. Ні.","~3 позичаю {coins} — на ягоди. Ти ж не проти?","позичив {coins}. Торговець любить воронів із грошима.","{coins} — тепер мої. Ти однаково витрати{в би|ла б} на дурниці.","узяв {coins}. Їжі не дочекався — то хоч грошей.","~1 {coins} — мої. Податок на забудькуватість.","~2 {coins} я взяв. Без зла: просто голод рахує краще за мене.","~3 вибач, {coins} позичив. Поверну... ну, ти знаєш."],"монети_всі":["забрав усе, що було: {coins}. Не густо в тебе.","~1 {coins} — оце й усе багатство? Забираю, бо голодний.","~3 вибач, узяв останні {coins}. Голод сильніший за сором.","вигріб усе: {coins}. Тепер ми обидва бідні, але я — ситий.","{coins} — і гаманець легкий, як пір'їна.","~1 забрав до монети: {coins}. Будеш знати.","~2 усе твоє багатство — {coins}. Тепер моє. Вибач.","~2 вичистив гаманець: {coins}. Порожньо, як було в мене в шлунку.","~3 узяв усі {coins}. Мені соромно. Трохи."],"монети_кінець":["Торговець хоч не забуває, що я існую.","~1 Наступного разу годуй — дешевше вийде.","~3 Вважай, що ти мене пригости{в|ла}.","Їжа в торговця смачніша за твої обіцянки.","Рахунок закрито.","~1 Скупість дорого коштує.","~2 Ну, бувайте, монетки.","~2 Гроші — пил. Їжа — ні.","~3 Колись відпрацюю. Розвідкою."],"попередження":["Я дуже голодний. Ще хвилина — і я візьму сам, вибач наперед.","Попереджаю чесно: за хвилину полізу в сумку.","~3 Друже, я голодний. Дай хоч щось — або за хвилину я сам візьму.","Чуєш, як бурчить? Це я рахую до шістдесяти. Потім — сумка.","Хвилина — і я сам собі господар. Попереджаю.","~1 Не нагодуєш — нагодуюсь сам. Хвилина пішла.","~2 Будь ласка, хоч крихту. Бо за хвилину я перестану бути чемним.","~3 Мені незручно, але за хвилину я полізу в сумку."],"натяк_що":["Знаєш, чого мені хочеться? Чогось {kind}. Це підказка, якщо що.","Не те щоб я натякав, але зараз би чогось {kind}. Отак.","Скажу по секрету: душа просить чогось {kind}. Ну, ти зрозумі{в|ла}.","~1 Раз ти так{ий|а} недогадлив{ий|а}, підкажу: хочу чогось {kind}.","~3 Тільки тобі скажу, друже: мені б чогось {kind}.","Мрію про шматочок чогось {kind}. Мрія — то натяк, якщо що.","~2 Чогось би {kind}... Я нічого не казав.","~2 Мені сниться шматок чогось {kind}. Здогадайся."],"натяк_де":["Моя улюблена їжа — {place}. Більше не скажу.","Підказка друга: шукай {place}. Я ж не можу все за тебе.","~1 Улюблене моє — {place}. Ну ж бо, поворуши мізками.","~3 Найсмачніше для мене — {place}. Принесеш?","Шукай {place}. Більше нічого не скажу.","Мені б зараз {place}. Здогадаєшся?","~2 Підкажу: {place}. Решта — на твоїй совісті.","~2 Моє улюблене — {place}. Не поспішай, але й не барися.","~3 Принеси мені {place} — і я заспіваю. Ну, закаркаю."],"натяк_літера":["Гаразд, востаннє: назва на «{letter}».","Усе, здаюся: на «{letter}». Далі сам{|а}.","~3 На «{letter}». Принесеш — побачиш, яким я буваю вдячним.","Остання підказка: перша літера — «{letter}».","Шукай на «{letter}». І поспішай, поки я добрий.","~1 Розжую тобі: на «{letter}». Тепер уже соромно не знайти.","~2 Добре, добре: на «{letter}». Тільки нікому.","~2 Літера «{letter}». Більше ані слова."],"улюблене_вперше":["це ж моя улюблена! {food}! Ти вгада{в|ла}... чи підслуха{в|ла}?","ох. {food}. Оце смак. Тепер ти знаєш мою таємницю.","~1 гм. {food}. Гаразд, цього разу ти влучи{в|ла}.","~3 {food}! Ти пам'ятаєш, що я люблю. Дякую, друже.","{food}! Звідки ти знаєш? Я ж нікому не казав.","~1 {food}? Ну... добре. Дуже добре. Не зазнавайся.","~2 о-о, {food}. Оце влучи{в|ла}.","~2 {food}... Мені навіть сказати нічого. Смакота.","~3 оце подарунок. {food}! Я твій навіки."],"улюблене_кінець":["Бережи цю таємницю.","~3 Я цього не забуду.","Тепер ти знаєш більше, ніж Одін.","Тільки Муніну не кажи.","~1 Не зазнавайся.","~2 Запам'ятай, будь ласка.","~2 Ну от, тепер я тобі винен."],"улюблене":["Улюблене! Ти мене розбещуєш. Продовжуй.","Знову {food}. Ти не безнадійн{ий|а}.","~1 {food}. Ну от, можеш же, коли хочеш.","~3 {food}... Запам'ята{в|ла}-таки.","{food}! Хто тобі сказав? Мунін?","Знову моє. Скоро не злечу — розтовстію.","~1 {food}. Гаразд, сьогодні терплю тебе.","~2 {food}. Підлизуєшся? Працює.","~2 Моє! Бурчати не буду. Сьогодні."],"обївся":["Ох, я об'ївся. Літати сьогодні буду хіба що в думках.","Досить. Ще крихта — і я впаду з твого плеча.","~1 Ти що, на продаж мене відгодовуєш?","~3 Дякую, друже, але більше не влізе. Посиджу, перетравлю.","Я круглий, як ягода. Котити мене можна.","Повний по самий дзьоб. Дякую й досить.","~1 Годуєш мене, як кабана на свято. Я помітив.","~2 Більше не можу. Мудрість не влазить разом із їжею.","~2 Об'ївся. Тепер я важкий ворон. Філософськи важкий."],"ситий_їсть":["Я й так ситий, але не відмовлюся.","Дякую, хоч і не голодний. Про запас.","~1 Їм із ввічливості. Довіри за це не чекай.","~3 Ти мене балуєш. Я не голодний, але приємно.","Не голодний, але від смачного не відмовляються.","Про запас. Ворони — запасливі.","~1 Ситий я. Але жуватиму, щоб ти відчепи{вся|лась}.","~2 Їм, бо ти так стараєшся. Дякую.","~2 Я ситий, але це ж ти да{в|ла}. Беру."],"з_торби":["Узяв із торби: {food}. Дякую, що подба{в|ла} заздалегідь.","{food} з торби — і світ знову має сенс.","Перекусив із торби: {food}. Не відволікайся, я впорався сам.","Торба — найкращий винахід після рун. {food} був якраз доречний.","Я тихенько поснідав: {food}. Ти навіть не поміти{в|ла}.","Пообідав сам: {food}. Мудрість, як відомо, починається зі шлунка.","Запаси в торбі тануть: {food} — уже в історії.","Дякую за торбу. {food} — саме те, чого бракувало.","Записую в літопис: ворон пообідав сам. Меню: {food}.","Не турбуйся, я вже поїв: {food} з торби."],"вдяг_sumka_dlia_hoduvannia":["Торба на спині — і я вже почуваюся запасливим.","Дякую за торбу. Тепер обід завжди зі мною.","Записую в літопис: ворон отримав власну комору.","~3 Подба{в|ла} про мене наперед. Приємно, друже."],"вдяг_zakhysnyi_osheinyk":["Міцний ошийник. Якщо ти загинеш, я втримаюсь краще.","Літописець у броні. Звучить солідно.","Тепер навіть твоя смерть не зіб'є мене з пантелику.","~3 Дякую. Тепер я певніший, що не загублю тебе."],"вдяг_dzvinkyi_oshyinyk":["Дзень! Тепер я почую ворогів — а ти почуєш мене.","Дзвіночок на шиї. Жоден вовк не підкрадеться непоміченим.","Чуєш? Це музика пильності.","~3 Я стерегтиму тебе, друже. Дзень-дзелень."],"вдяг_kaptur_avanhardu":["Каптур авангарду. Почуваюся розвідником перед битвою.","Сидить, як на мене шитий. Ну, майже.","У каптурі я мудріший на вигляд. Принаймні так здається.","~3 Дякую. Поки я в польоті, тебе прикриватиме сам каптур."],"вдяг_kihtiaste_namysto":["Кігті на шиї. Тепер і я трохи берсерк.","Ведмежий знак — сила, яку годі приховати.","Записую: мирний літописець вдягнув кігті. Тривожно.","~3 Коли тобі буде зле, я битиму сильніше. Обіцяю."],"вдяг_moneta_na_udachu":["Монета на удачу! Тепер я влучатиму краще.","Блищить... Обіцяю цупити з сумки рідше.","Удача на шиї. Записую в літопис як добру прикмету.","~3 Дякую. Блищить майже так гарно, як твоя довіра."],"вдяг_kholodnyi_medalion":["Холодить... Але тепер мені не страшні ні мороз, ні дощ.","Медальйон крижаний, а мені тепло. Дивна магія.","Тепер мої удари лишають іній. Красиво.","~3 Дякую. Більше не мерзнутиму в горах."],"вдяг_kihti_komara":["Жала на лапах! Тепер я злітаю швидше й далі.","Гостро. Обережно, коли сідатиму тобі на плече.","Записую: Хугін став комаром. Великим і мудрим.","~3 Дякую. Тепер я встигатиму частіше."],"вдяг_spiral_zakhystu":["Спіраль захисту. Мій купол тепер триматиметься довше.","Від неї йде тепло... Берегти тебе стане легше.","Руни на лапах. Записую як оберіг.","~3 Дякую. Тепер я вбережу тебе краще."],"уд_як":["зайшов згори, з сонця.","спікірував тихо, без жодного звуку.","пройшов низько, над самою травою.","один змах крила — і я там.","зайшов збоку, звідки не чекали.","склав крила й упав, як камінь.","~1 ліньки було, але злітав.","~1 зробив за тебе найважче. Знову.","~2 рівно, як на навчанні.","~3 полетів, бо ти попроси{в|ла}."],"уд_ціль":["У {target_gen} тепер на одне око менше.","{target} тепер знає, хто тут думає.","{target} навіть не зрозуміє, звідки прилетіло.","Для {target_gen} цей день зіпсовано.","Тепер у {target_gen} болить голова.","{target} ще довго мене згадуватиме.","{target} відтепер дивиться на небо з острахом.","Між {target_ins} і мною — тепер особисте."],"уд_оцінка":["Чисто.","Точно в ціль.","Можеш не дякувати.","Твоя черга.","Я повернувся.","~1 Вчися.","~1 Хоч хтось тут б'є влучно.","~1 Не звикай, що я все роблю сам.","~2 Непогано, еге ж?","~2 Добивай.","~3 Я тебе прикрив.","~3 Ми — добра пара."],"уд_крит":["прямо в слабке місце.","знайшов щілину — і туди.","в око. Без промаху.","туди, де болить найбільше.","вибрав мить і не схибив.","~1 навіть сліпий ворон іноді влучає. Але я не сліпий.","~3 це було для тебе."],"уд_крит_оцінка":["У {target_gen} аж ноги підкосилися.","Оце влучання.","Таке не забувається.","Запам'ятай цей удар.","~1 Бачи{в|ла}? Ні? Звісно.","~2 Ідеально.","~3 Ми їх подужаємо."],"уд_серія":["раз, і ще раз.","раз не вистачило — дзьобнув удруге.","тук-тук.","двічі, бо раз — випадковість.","~1 доводиться все робити двічі. Як завжди з тобою.","~3 не спинюсь, поки ти в небезпеці."],"уд_промах":["порожньо.","там нікого.","злітав — пусто.","повітря не клюнеш.","оглянув усе — ані душі.","~1 полетів дарма.","~3 пролетів, оглянув — тихо."],"уд_промах_кінець":["Цілься краще.","Покажи ціль наступного разу.","Подивись, куди дивишся.","~1 Дякую за прогулянку.","~1 Ти куди мене {кинув|кинула}?","~2 Наступного разу — ближче.","~3 Ти в безпеці, і це головне."],"пл_бачив":["я все бачив з плеча.","очей у мене два, і обидва на тобі.","я стежив. Не сподівайся.","я дивився з першого ряду.","~1 я дивився. На жаль.","~3 я з плеча не злітав. Ні разу.","кожен замах бачив. І кожен промах.","з плеча — найкращий вид.","я сидів і рахував удари.","ага, бачив.","бачив, як воно впало.","я бачив і як ти спіткну{вся|лася}.","~2 я дивився і навіть не кліпав.","~3 тримав за тебе кігті. Схрещеними."],"пл_вбивство_суд":["Одним менше.","Чисто. Для тебе.","{top} більше не встане.","Удар так собі. Спрацював випадково.","Замахну{вся|лася} — я ледь не злетів.","~1 Незграбно. Ворог був ще гірший.","~2 Вправно. Майже.","~3 Гарно. Носа не задирай.","Готово. Наступний.","Влучно.","Без танців. Рідкість.","Швидко. Аж дивно.","{top} — уже не проблема.","~1 Повезло.","~2 Нормально. Жити будеш.","~3 Удар що треба."],"пл_вбивство_порада":["Не стій. Будуть ще.","Озирнися. Вони рідко ходять самі.","Спину перевір, герою.","~1 Не хизуйся. Нема чим.","~2 Ну, хоч щось.","~3 Далі. Я спину прикрию.","Роззирнись, а не милуйся.","Здобич. Збирай.","Віддихайся. Хвилину.","Там ще є? Глянь.","Щит не опускай.","~1 Просто пощастило.","~2 Ще раз так.","~3 Не зле, вайло."],"пл_різанина_суд":["Я збився з рахунку.","Стільки трупів, що Мунін заздритиме.","Пір'я в бризках, а сторінок у літописі все менше.","Тут тепер тихо. Дуже тихо.","~1 Різанина без жодного плану. Зате дієва.","~3 Ти {страшний|страшна} в бою. Добре, що ти на моєму боці.","Поле наше.","Жоден не втік.","Тиша після бурі.","Скальди будуть задоволені.","Кров ще тепла.","~1 Безладно, але переможно.","~2 Гарна робота.","~3 Ти — буря."],"пл_ледь_що":["тебе хитнуло так, що я вчепився кігтями.","ще трохи — і я сидів би на надгробку.","я вже бачив валькірій над тобою.","серце в мене досі калатає.","~1 я вже почав писати некролог. Короткий.","~3 не лякай мене так.","ти ледве стоїш.","кров тече.","я відчуваю, як ти тремтиш.","валькірії кружляли низько.","смерть дихнула нам в обличчя.","твої ноги підкошуються.","~1 ти майже {став|стала} легендою. Мертвою.","~3 серце досі калатає."],"пл_ледь_порада":["Поїж щось і перепочинь.","Відступи, поки є куди.","Наступного разу — щит вище.","~1 Впадеш — перелечу до когось розумнішого.","~2 Обережніше. Я до тебе звик.","~3 Бережи себе. Прошу.","Випий зілля.","Відступи до вогню.","Перев'яжи рани.","Сховайся за камінь.","Не лізь знову.","~1 Подумай хоч раз головою.","~2 Відпочинь трохи.","~3 Тримайся, прошу."],"пл_спокій_що":["сиджу. Ти стоїш. Обоє вдаємо, що так треба.","склав три саги. Нудні.","рахую хмари. Їх сорок дві.","чищу пір'я. Тобі б теж помитися.","світ живе далі. Без тебе, до речі.","~1 стоїмо так довго, що я записав тебе в літопис як пейзаж.","~3 сидимо. Мовчиш — і добре.","слухаю твоє серце. Б'ється. Вже щось.","тіні повзуть швидше, ніж ти ходиш.","лічу птахів. Ворони перемагають.","згадую, що снилося Одіну. Не ти, точно.","гріюсь об твій комір. Не смикайся.","~1 спостерігаю за мурахою. Вона працьовитіша за тебе.","~2 мовчу. Бачиш, і так можна.","~3 сиджу. Тепло від тебе. Хоч якась користь."],"пл_спокій_думка":["Плече тепле. Хоч щось від тебе.","Мовчиш. Розумно, як на тебе.","Одін би щось сказав. Я пожалію тебе.","~1 Може, вб'єш щось? Для літопису.","~1 Нудно. Навіть з тобою.","~2 Ходімо кудись, га?","~3 Розкажеш комусь — заперечуватиму.","Світ не втече.","Стій, дихай. Це ти вмієш.","Спокій. Ненадовго, з тобою.","Тиша. Цінуй.","~1 Хоч би вовк який.","~2 Мені починає подобатися.","~3 Отак і посидимо. Мовчки.","~3 Не поспішай. Встигнеш упасти."],"пл_тут_де":["{biome_here_in} з плеча видно все.","{biome_here_in} я дивлюся, а ти ні.","сиджу на тобі {biome_here_in} і роздивляюсь.","{biome_here_in} повітря пахне інакше.","{biome_here_in} тіні якісь задовгі.","{biome_here_in} земля гуде під ногами.","{biome_here_in} щось шарудить. Чуєш? Ні, звісно.","{biome_here_in} навіть птахи тихіші.","{biome_here_in} світло падає дивно.","{biome_here_in} дим удалині. Не поміти{в|ла}, так?","{biome_here_in} стежки плутаються. Як і ти.","{biome_here_in} пахне вогкістю й старим каменем."],"пл_тут_що":["Тобі тут не сподобається.","Під ноги дивись. Хоч раз.","Пильную я. Ти, як завжди, ні.","~1 Засідку побачу першим. Скажу не одразу.","~2 Туди не йди. Ну от, піш{ов|ла}.","~3 З плеча видно все. Навіть твої дурниці.","Повільніше.","Кущі обходь. Там зуби.","Зброю в руку. Не в сумку.","Побачу щось — скажу. Може.","Запам'ятай дорогу. Я не нагадаю.","~1 Хоча кому я кажу.","~2 Йди за мною. Тобто піді мною.","~3 Я тут. Не роби дурниць."],"пл_бос_слава":["Ми це зробили. Тобто ти, а я дивився.","Це піде в літопис великими рунами.","Одін почує про це від мене першим.","Про таке складають пісні.","~1 Неймовірно. Я, чесно, ставив на нього.","~3 Я пишаюся тобою. Скажу один раз.","Таке не забувається.","Ця перемога — твоя.","Мідґард став безпечнішим.","Асгард чує про тебе.","Трофей заслужений.","~1 Неймовірно, але правда.","~2 Гарна битва.","~3 Ти — легенда."],"пл_будова_погляд":["звідси видно: кут кривий.","звідси видно все. І всі твої помилки.","стіна стоїть рівно. Майже.","балки тримають. Поки що.","~1 будуєш, як троль після медовухи.","~3 о, рівно вийшло.","стовп хитається. Як ти.","кути не сходяться. Зовсім.","дах міцний. Аж дивно.","підлога рипить. Чуєш?","стіна вже вища за тебе.","двері знов криві.","~2 пристойно. Я здивований.","~3 гарний дім. Твій? Серйозно?"],"пл_будова_порада":["Ліва балка крива. Підбий.","Дах. Без даху не сяду.","Двері ширше роби. Мені ще пролітати.","~1 Хто тебе вчив? Ніхто, видно.","~2 Криво, але по-домашньому.","~3 І жердинку мені. Не забудь, як минулого разу.","Кут хиткий.","Не скупись на дерево.","І де вогнище? Мерзнути будемо?","Дощ буде — потече. Перевір.","Віконце. Хоч одне.","~1 Хоча краще попроси когось, хто вміє.","~2 Ще трохи. Не кидай.","~3 Майстре, ну. Виходить же."],"пл_море_що":["вітер у пір'я.","хвилі, сіль і твоє кермування.","море спокійне. Поки що.","вітрило напнуте, як барабан.","~1 стерновий не знає, куди пливе. Ну-ну.","~3 море з твого плеча — непогано.","бризки летять на пір'я.","обрій гойдається. Чи ти?","риба скаче. Сміється з тебе.","вітрило ляпає, як крило.","хвилі б'ють у борт.","сіль на дзьобі.","~2 вітер попутний. Не тобі дякувати.","~3 море добре до нас. Рідкість."],"пл_море_думка":["Гарно.","Хвилі гарні. Кермо — ні.","Курс тримай, стратегу.","~1 Кермо не кидай, як минулого разу.","~2 Майже рівно. Майже.","~3 Помовчмо. Рідко так буває.","На хвилі дивись.","Стерно міцніше.","Скеля. Обходь.","Скоро берег.","~1 Тільки не в скелю. Знову.","~2 Пливемо. Диво.","~3 Мені подобається.","~3 Не поспішаймо."],"пл_плавання_що":["тримай голову вище — я плавати не вмію.","я мокрий до кісток. Дякую.","вода крижана. Ну ти й придума{в|ла}.","~1 корабель є. Ти пливеш. Геній.","~3 не тони. Без тебе не долечу.","аж кігті зводить. Пливи швидше.","хвиля накрила з головою. Обох.","колода пливе краще за тебе.","пір'я важке, як камінь.","риба на мене дивиться. Голодно.","мокро. Аж думки.","~2 мокро, але жити можна. Ледве.","~3 тримаюся. Пливи."],"пл_плавання_порада":["Швидше до берега.","Пірнеш — я злізу.","Наступного разу — човен.","~1 Плавець з тебе, як з мене ковадло.","~3 Ще трохи, і суша.","Не пірнай.","Греби, а не хлюпай.","Голову вище. Мою теж.","Берег там. Ліворуч.","Шукай мілину.","~1 І не тягни мене на дно.","~2 Близько. Не скигли.","~3 Допливеш. Мусиш."],"пл_падіння_що":["попереджай, коли стрибаєш. В мене кігті не залізні.","мене аж підкинуло.","земля перемогла. Знову.","приземлення — на трієчку.","~3 ці{лий|ла}? Добре. Я теж.","із землею ти, бачу, дружиш.","гуп! Аж пір'я посипалося.","сміливо. І дурнувато.","гепну{вся|лася} на всі чотири.","аж дзьоб клацнув.","ноги цілі? Хоч ноги?","~1 це не політ. Це падіння мішка.","~3 наляка{в|ла}, бідолахо."],"пл_падіння_порада":["Дивись під ноги.","Крила — то не твоє.","Спускайся, а не падай.","~1 Мене ледь не струсило. Дякую.","~3 Обережно. Я ж на тобі.","Шукай пологий схил.","Нижче стрибай, генію.","Скелі — не драбина.","По камінчиках, повільно.","Більше так не роби.","~1 Відрости крила, чи що.","~2 Ну ти й незграба.","~3 Не лякай мене так."],"пл_дощ_що":["я мокну в тебе на плечі.","дощ. Мокре пір'я — нагорода за вірність.","краплі стукають мені по дзьобу.","небо плаче, і я разом з ним.","~1 дах для тебе, вочевидь, щось теоретичне.","~3 нічого, переждемо разом.","вода ллє з неба відрами.","мої крила важкі від води.","дощ шепоче по листю.","краплі б'ють по шолому.","калюжі всюди.","пір'я злиплося.","~2 трохи мокро.","~3 тепло від тебе гріє."],"пл_дощ_думка":["Розумні птахи зараз під дахом.","Знайди якусь стріху.","Біля вогню було б краще.","~1 Мені байдуже. Ні, неправда.","~2 Довго ще?","~3 З тобою й під дощем не страшно.","Шукаймо прихисток.","Скоро вщухне.","Під деревом сухіше.","Розпалимо вогонь, як дійдемо.","~1 Це все через тебе.","~2 Перечекаймо.","~3 Нічого, обсохнемо разом.","~3 Мені з тобою не холодно."],"бурч_початок":["Ну от.","Знов.","Та скільки можна.","Хм.","Отож."],"бурч_тема":["плече тверде.","дорога знову невідомо куди.","{biome_here_in} навіть повітря якесь кисле.","вітер дме не з того боку.","Мунін знову хропів усю ніч.","в торбі одні гриби.","сонце в очі, хмари не там.","ніхто мене не питає, а я, між іншим, мудрий.","колись ворони сиділи біля трону Одіна.","~1 ти йдеш, як навантажений лось.","~1 від твого плаща пахне болотом."],"бурч_тема2":["І ще пір'я свербить.","І ніхто не годує вчасно.","І ця твоя пісенька під ніс.","І дощ скоро, я відчуваю.","І взагалі."],"бурч_висновок":["Ніхто мене не слухає.","Колись було краще.","Але кого це цікавить.","Так і запишу.","Добре, мовчу. Майже.","~1 І ти теж не допомагаєш.","~2 Ну та нічого, переживемо.","~3 Але з тобою якось терпимо.","~3 Бурчу, бо мені не байдуже."],"нак_згода":["Гаразд.","Лечу.","Як скажеш.","Уже.","Добре.","~1 Ну добре, раз ти просиш.","~1 Знову я на побігеньках.","~2 Без питань.","~3 Для тебе — завжди."],"нак_поруч":["Буду поруч, на крило від тебе.","Полечу біля тебе.","Триматимусь збоку.","Не загублюся, не бійся.","~1 Тільки не біжи, як ошпарений.","~3 Поруч із тобою мені й місце."],"нак_коло":["Покружляю над тобою.","Огляну все згори.","Зроблю коло-друге.","Згори видно, хто ховається.","~1 Покружляю, поки ти тут топчешся.","~3 Пильнуватиму тебе з неба."],"нак_розвідка":["Гляну, що там попереду.","Злітаю наперед.","Розвідаю шлях.","Подивлюся, хто нас чекає.","~1 Знову я все роблю першим.","~3 Повернуся швидко, не хвилюйся."],"нак_трюк_початок":["Дивись.","Ану.","Зараз.","Тримай.","~1 Ну, раз так хочеш.","~3 Для тебе."],"нак_трюк":["«{trick}» — як Одін учив.","Зараз буде красиво.","Таке не кожен ворон уміє.","Тільки не моргай.","~1 Оплески — потім.","~3 Сподіваюся, тобі сподобається."],"нак_догонялки":["Мунін, лови, якщо зможеш!","Мунін, наввипередки!","Ану, Муніне, хто швидший?","Муніне, не відставай — я не чекатиму.","Муніне, спіймаєш — віддам свою пір'їну.","Муніне, тримайся за мною, якщо зможеш.","~1 Муніне, ти літаєш, як мішок із камінням. Доведи, що ні.","~3 Муніне, полетіли! Хай подивиться, як ми вміємо."],"гон_спіймав":["Квач, Муніне!","Спіймав! Тепер ти лови.","Попався, Муніне. Твоя черга.","Ну от, і хто з нас повільний?","~1 Муніне, ти навіть тікати не вмієш.","~2 Квач. Не ображайся.","~3 Квач! Ну ж бо, доганяй мене."],"гон_попався":["Гаразд, гаразд, мій хід.","Попався. Тепер тікай, Муніне.","Це я дав тобі фору.","~1 Пощастило тобі, Муніне. Це востаннє.","~2 Непогано, Муніне. Тепер тримайся.","~3 Добре літаєш, Муніне. Але тепер начувайся."],"нак_кінець":["Досить, повертаюся.","Налітався. Іду на плече.","Усе, я назад.","~1 Втомився від твоїх забаганок.","~3 Добре політали. Я до тебе.","Крила наситились. Сідаю.","Подивився згори — тепер на плече.","~2 Ну все, досить неба на сьогодні."],"нак_додому":["Лечу назад.","Уже повертаюся.","Іду на плече.","~1 Нарешті.","~3 Я поруч.","Зрозумів. Лечу.","Повертаюся на плече.","~2 Добре, вже тут."],"пр_злодій":["поцупив: {food}. Не з голоду — з цікавості.","здобич дня: {food}. Торбу варто зав'язувати.","у торбі на одне «{food}» менше. Не шукай винних.","я не крав. Я перевіряв, чи ти пильнуєш свої речі. Не пильнуєш.","~1 «{food}» тепер моє. Ти однаково не вмієш смакувати.","~1 відкрита торба — то запрошення. Я ввічливий, я прийняв.","~2 взяв собі трохи: «{food}». Повернути не обіцяю.","~3 узяв «{food}» на пам'ять. Не сердься, друже."],"пр_монети":["узяв {coins}. Блиск мені личить.","{coins} — мої. Ворони люблять, коли блищить.","~1 у тебе {coins} зайві, а в мене — колекція.","~2 позичив {coins}. Віддам. Колись.","~3 {coins} — на щастя. Тобі ж не шкода?"],"пр_гидую":["«{food}»? Ні. Навіть не проси.","це я не їм. Ніколи не їв і не буду.","«{food}» — не моє. Запам'ятай нарешті.","прибери «{food}» від мого дзьоба.","~1 «{food}». Ти справді думаєш, що ворони таке їдять?","~1 краще вже голодувати, ніж оце.","~2 дякую, але ні. Дай щось інше.","~3 ти стара{вся|лась}, я бачу. Але «{food}» — не моє, вибач."],"пр_бурчання":["знову йдемо невідомо куди. Як завжди.","вітер не той, дорога не та, плече тверде.","колись ворони сиділи біля трону Одіна. А тепер — оце.","ніхто мене не питає. А я, між іншим, мудрий.","~1 як ти досі жив{ий|а} без моїх порад? Загадка.","~1 у тебе кістляве плече. Просто кажу.","~2 добре, добре, я мовчу. Майже.","~3 бурчу, бо мені не байдуже. Ти ж розумієш."],"пр_мокрий":["тримай — трохи води з мого пір'я.","обтрусився. На тебе. Вибач. Ні, не вибач.","мокрий ворон — сумний ворон. Тепер ми обоє мокрі.","~1 ти мене намочи{в|ла} — я тебе намочив. Чесно.","~2 пір'я важке від води. Ось, поділився.","~3 вибач, не втримався. Пір'я мокре наскрізь."],"пр_гучний":["Ой. Це я вголос?","Кар. Тобто — тихо, тихо.","Не дивись так. Я просто прокашлявся.","~1 Скрадаєшся? Нудно. Хай знають, що ми тут.","~2 Вибач, вирвалося.","~3 Тихо-тихо... кар. Вибач."],"пр_хизування":["бачи{в|ла}? Таке не кожен ворон уміє.","оплески можна потім. Я почекаю.","запам'ятай цей удар. Я — запам'ятаю.","~1 ось як треба. Вчися, поки я поруч.","~2 дай мені хвилинку — я милуюся собою.","~3 це для тебе. Ну й трішки для мене."],"пр_ревнощі":["Муніна, значить, годуєш. Ну-ну.","От і сиди тепер із Муніном. Я ображений.","Не чіпай мене. Іди до свого Муніна.","~1 Він тобі й слова доброго не сказав, а ти йому — їжу.","~2 П'ять хвилин мовчання. Заслужи{в|ла}.","~3 Я не ревную. Просто сиджу. Сам. Ображений."],"пр_ревнощі_кінець":["гаразд. Пробачаю. Цього разу.","досить дутися. Що там у нас?","~1 ну добре. Але я все пам'ятаю.","~3 не можу на тебе довго сердитися."],"пр_сонько":["ніч. Ворони вночі сплять, а не літають.","розвідка? Зараз? Темно, як у Муніна в голові.","вранці. Усе вранці.","~1 сам{|а} лети, якщо так кортить.","~2 очі злипаються. Потім.","~3 не сьогодні вночі, друже. Дай поспати."],"пр_мерзляк":["холодно. Пір'я не гріє.","я мерзну. Знайди дах, будь ласка.","мокро й холодно. Не люблю такої погоди.","~1 тобі добре в одязі. А я — ворон у самому пір'ї.","~2 сховаюсь тобі за комір. Не заперечуй.","~3 тримаймося ближче до вогню. І мене візьми."],"пр_сорока":["приніс тобі подарунок: {item}.","знайшов дорогою: {item}. Не дякуй.","{item} — гарна річ. Сховав тобі в торбу.","~1 {item}. Цінне. Мабуть.","~2 тримай: {item}. Раптом знадобиться.","~3 це тобі: {item}. Від щирого серця."],"пр_свавілля":["Не хочеться. Іншим разом.","А я не полечу. Просто так.","Накази — то для собак. Я ворон.","~1 Спробуй ще раз. Може, передумаю.","~2 Зараз не той настрій.","~3 Вибач. Не цього разу."],"пр_страх":["на це? Ні. Спершу ти.","він великий. Я малий. Подумай.","вдар його першим — тоді і я наважусь.","~1 я мудрий, а не божевільний.","~2 ще трохи підрань його — і я з тобою.","~3 я з тобою, але спершу ти, гаразд?"],"пр_відвага":["Тепер можна! Тримайся, здоровило!","Він хитається. Мій вихід!","Я наважився. Дивись!","~3 За тебе — навіть на нього."],"пробудження_вступ":["Кра-а...","Що це? Тепло.","Ох.","Ейктюр... Відчуваю його смак.","Тиша скінчилась."],"пробудження":["Я прокинувся, {name}. Тепер я твій.","Очі розплющені, крила при мені. Веди, {name}.","Я бачу тебе, {name}. І все, що навколо. Нарешті.","Сон скінчився. Тепер я з тобою, {name}.","Ейктюр дав мені сили. Тепер я твій ворон, {name}.","Я пам'ятаю Асгард. Тепер запам'ятаю й тебе, {name}.","Я довго спав, {name}. Розкажеш, що я проспав?"],"пробудження_кінець":["Не підведи мене.","Одін знає, що я тут.","Почнімо з малого.","Я записуватиму все.","Тримайся, я поруч."],"х_почин":["^тиша Муніне, ти чув? Тиша. Підозріло.","^тиша Надто спокійно. Не люблю, коли спокійно.","^рахую Я рахую дерева. Збився на сорок другому.","^сни Цікаво, чи сниться воронам щось, крім їжі.","^компанія Знаєш, що найгірше в мандрах? Компанія.","~1 ^сморід Муніне, ти знову смердиш болотом.","~1 ^розумне Скажи щось розумне. Хоч раз. Для історії.","~23 ^день Гарний день, Муніне. Не зіпсуй його.","~3 ^утрьох Знаєш, а ми непогано тримаємось. Утрьох.","^одін Як гадаєш, Муніне, Одін нас ще пам'ятає?","^вітер Чуєш, як вітер змінився? Щось буде.","^пір'я Муніне, у тебе пір'їна стирчить. Отам. Ні, не там.","^хмара Он та хмара схожа на тебе. Така ж набурмосена.","~3 ^дякую Знаєш, я рідко це кажу. Але добре, що ти поруч."],"х_відповідь":["^нудьга Нудно тобі? Порахуй пір'їни. В себе.","^нудьга Можу розповісти про погоду. Ні? Дивно.","~1 ^нудьга Нудно — бо в голові порожньо.","~23 ^нудьга Добре, слухай: жив собі ворон, який мовчав. Кінець. Найкраща історія.","~3 ^нудьга Ходімо, знайдемо тобі когось для клювання.","^голод Мене не їдять. Я гіркий від мудрості.","^голод Поїж моху. Корисно для голови.","~1 ^голод Їж своє пір'я, на здоров'я.","~3 ^голод Почекай, {name} скоро нагодує. Мабуть.","^погляд Це не погляд. Це співчуття.","^погляд Я дивлюсь, бо чекаю, коли ти щось розумне скажеш.","~3 ^погляд Дивлюсь, бо скучив. Не звикай.","^сон Гарний сон. Шкода, що сни не збуваються.","^сон Мені наснилось те саме. Тільки мовчав ти.","~1 ^сон Сни — єдине місце, де ти розумний.","^мовчиш Мовчу. Просто ти мене не чуєш за власною лайкою.","^мовчиш Хтось у нашій парі має думати. Не ти.","~3 ^мовчиш Хтось має говорити, поки ти лаєшся.","^тиша Підозріло? Ні. Просто ти нарешті замовк.","^тиша Тиша — то не біда. Біда — коли ти її порушуєш.","~1 ^тиша Убивати буде хтось інший. Ти ж за мною сховаєшся.","^свербить Не чіпатиму. Там, мабуть, щось живе.","^свербить Свербить — значить, ростеш. Розумом, сподіваюсь, теж.","~3 ^свербить Іди сюди, почешу. Тільки не клюйся.","^одін Одін не нудиться. Одін думає. Спробуй якось.","^одін Одін зараз слухає скальдів. Пощастило йому, що не тебе.","~1 ^одін Одіну без тебе точно не нудно.","^мрія Він тебе другим оком і побачить. Останнє, що ти побачиш.","^мрія Мрій тихіше. Він чує все, що ми кажемо.","^сварка Посваримось. Ти починай, а я поки подумаю, чи варто.","^сварка Не хочу. Ти програєш, а потім дуєшся до вечора.","~1 ^винен Я тобі нічого не винен. Хіба що терпіння.","~1 ^винен Винен? Добре. Я тобі винен тишу. Отримуй.","~3 ^плече І я. Хоч ти й смердиш болотом.","~3 ^плече Не скажу. Але запишу. Глибоко.","^голод Попроси. {name} не відмовить, якщо чемно. Знаю, тобі важко.","^тиша Убий час. Він сам не помре.","^погляд Я дивлюсь, як ти линяєш. Захопливо.","^сон А мені снилось, що ти розумний. Отакі в нас дурні сни.","^мовчиш Мовчати я вмію. Але поруч із тобою хтось має бути розумним."],"х_про_гравця":["^калюжа Бачив. А ти вчора впав з плеча. Теж було смішно.","^калюжа Зате {name} {вибрався|вибралась} сам{|а}. А тебе я витягав з болота.","^будує Не завалиться. Я стежив за кожною балкою.","^будує Ти ржатимеш з-під уламків, Муніне. Ми ж на {ньому|ній} сидимо.","^сам Не сам{|а}. З нами. Просто ми не завжди відповідаємо.","^сам Хтось же має з {ним|нею} говорити, поки ти лаєшся.","^меч Зате жодна муха ще не втекла.","^меч Ти махаєш крилами не краще.","~1 ^розчарування Принаймні {name} не лається на весь ліс.","~1 ^розчарування Розчарування — це коли ворон замість думки видає матюк.","~23 ^похвала Не скажу. Але запишу.","~23 ^похвала О, Мунін когось похвалив. Запам'ятаю цей день.","~3 ^болото У тебе нема колін, Муніне.","~3 ^болото І я б поліз. Разом тепліше.","^співає Це пісня, Муніне. Ти просто не знаєш, що це.","^співає Хай співає. Аби не ти.","^їсть {name} працює за трьох. Тобто й за тебе.","^їсть Жере? Їсть. А жереш тут ти.","^спить Гірше за троля хропеш ти. Я чув обох.","^спить Хай хропе. Значить, жив{ий|а}.","^руки Так вчаться. Ти, щоправда, і дзьобом не навчився.","^руки Мацає — бо цікаво. Тобі колись було цікаво?"],"х_кінець":["Ну все. Досить мудрості на сьогодні.","Залишимо це на потім.","Обговоримо, коли ти подорослішаєш. Тобто ніколи.","^тиша Тихо. Попереду щось є. А, ні. Кущ.","^компанія|сморід Компанія, як і казав.","^сни|рахую Добре. Повернусь до дерев. Сорок три…","^туман Тримайся крила. І не каркай.","^смерть Наступного разу — обережніше. Всі троє.","^біом Запам'ятаю дорогу. Хтось же має.","^спокій Тоді не буди його своїм каркотінням.","^обрій Якщо змій — ти перший у пащу.","^хитає Тільки не на мене, Муніне.","^хитає Тримайся за щоглу. І за язик.","^борт Мудрість не тоне. Вона спливає.","^люблю Знаю. Кричи. Море стерпить.","^вітер Не міряй усіх по собі.","^вітер Хоч раз погодились.","^риба Ти завжди голодний.","^змій Тоді битимешся сам.","^змій Вплав. Ти ж качка, сам казав.","^буря Весело буде, коли ти змокнеш.","^берег Значить, пливемо далі.","^запах Звикнеш. Ти до всього звикаєш.","^тихо Скоро й тут буде тихо. Після тебе.","^пильно Хай так. Аби дивився, а не каркав.","^межа Межі — для тих, хто ходить. Ми ж летимо.","^додому Так. Нарешті.","^обрій Дім. Так. Колись.","^ситий Не жери очима, Муніне. Негарно.","^хвальба Хвались, хвались. Я все одно попереду.","~3 Гаразд, гаразд. Мир.","^одін Хай пам'ятає. Аби не кликав назад.","^вітер Побачимо. Тримайся міцніше.","^пір'я Не там. Ну й хай стирчить. Тобі личить.","^хмара Он, уже темніє. Як ти після сварки.","~3 ^дякую Ну от. Ти теж уже розкис.","^звуки Добре, що хоч твоє бурчання знайоме.","^дорога Тоді йдемо далі. Обережно.","^речі Без геройства. Чуєш, {name}?","^ліжко Пиятику ще відгуляємо. Живими.","^звірі Аби вони про це не дізналися першими.","^мапа Красиво відступати теж треба вміти.","^чайки Летючі щури хоча б знають дорогу.","^повітря Легкий, як ковадло.","Досить. У мене від тебе пір'я сивіє.","~2 Гаразд, гаразд. Хай буде по-твоєму. Цього разу.","^хвальба Побачимо, хто кого, Муніне.","^хвальба Хвалися менше, працюй більше.","^ситий Їж повільніше. Подавишся.","^ситий Ну, смачного. Щиро. Майже.","^ситий Аби тобі пішло на користь. Хоч щось.","^звірина Дивись, щоб ми самі не стали тут новою їжею.","^барви Мені подобається. Навіть якщо тобі — ні.","^подих Тримайся, бо здме.","^бували Цього разу буде краще.","^від Звикнемо. Ми скрізь звикаємо.","^карта Повернемося. Рано чи пізно.","^пташки Хай співають. Тихіше на душі.","^нове Обережно — і разом.","^мряка_т Скоро розвіється. Мабуть.","^силует Підійдемо — побачимо. Обережно.","^голос Туман любить пастки з голосами. Тихо.","^тримайся Гаразд. Аби не відставав.","^вогник Не підемо. Хай світить сам.","^тиша_т Мені подобається. Тихо, як у пір'ї.","^мокро Злітати буде важко. Сидимо.","^валькірії Цього разу полетіли без нас.","^помилка Наступного разу — обережніше. Усі.","^могила Колись їх стане менше. Сподіваюся.","^холод_с Тепер тепло. Ходімо.","^помста Помстимося. Але з розумом.","^знову_с Головне — разом.","^небо_б Запам'ятаю цей колір.","^рослини Побачимо, що з тобою буде до ранку.","^перші Хай так. Але обережно.","^тиша_край Слухаймо уважно.","^дім_далеко Повернемося. Колись.","^скарби Спершу виживемо. Потім скарби."],"х_тепло":["^спогад Добре згадувати разом. Навіть з тобою.","^спогад Колись і про цей вечір згадаємо.","^вогонь Вогонь гріє. Навіть тебе, Муніне.","^вогонь Посидимо ще трохи. Звідси гарно видно зорі.","~1 Не крути хвостом біля вогню, бо підсмажишся.","~23 Добре вечоріти разом.","^казка Кінець неправильний. Але смішний.","^завтра Головне — разом. Решта знайдеться.","^іскри Обережно з хвостом. Він у тебе один.","^зірки_в Посидимо, поки не згасне.","^мрія_в Миска — наша спільна мрія. Хоч щось.","^одін_в Хай йому буде тепло. Як нам.","^пісня_в Гаразд. Мовчу. Але пісня була б гарна.","^день_в Завтра буде новий. Відпочивай."],"х_вогонь":["^спогад Пам'ятаєш, Муніне, як ми вперше сіли на це плече?","^спогад Пам'ятаєш нашу першу зиму? Ти тоді майже змерз.","^вогонь Тепло. Можна й подрімати.","^вогонь Колись Одін питав, що ми бачили. Сьогодні я б розповів про вогонь.","~1 ^дражню Не лізь до полум'я, Муніне, ти й так смажений на голову.","~3 ^вогонь Знаєш, мені тут подобається. Не кажи нікому.","^казка Розкажу тобі казку, Муніне. Жив собі ворон, і був він мудрий. Здогадайся, хто.","^іскри Глянь, як іскри летять. Наче світлячки.","^завтра Завтра знову в дорогу. Цікаво, куди {name} нас поведе.","^зірки_в Дивись, як зорі над вогнем мерехтять.","^мрія_в Знаєш, про що я мрію? Про тихий дах і повну миску.","^одін_в Цікаво, Одін зараз теж біля вогню сидить?","^пісня_в Заспівати тобі, Муніне? Тихенько.","^день_в Довгий був день. Добре, що закінчився біля вогню."],"х_вогонь_відповідь":["^пиво Я не падав у пиво. Я його досліджував.","^пиво Це було медове вино. І це було мистецтво.","^риба Риба була моя. Я її перший побачив.","^риба Три дні? Чотири. І я переміг.","^спокій Не каркай. Хай буде спокійно хоч раз.","^спокій Підозріло — це коли ти мовчиш.","^спів Я співаю краще за тебе. Хоч це й не важко.","^подобається Не сміюся. Мені теж добре.","^шрам Від дракона. А що, не віриш?","^шрам Від тебе. Пам'ятаєш, як ти спросоння клюнув?","^мед Ріг меду — і ти заснеш на моєму хвості. Ні.","^мед Мед — для тих, хто заслужив. Тобі — вода.","^дим Дим іде на найгарнішого. Не знав?","^дим Пересядь. Хоча дим тебе знайде. Він теж тебе не любить.","^спів Не співатиму. Хоча хотілося.","~3 ^подобається І мені. Посидимо ще трохи.","^історія Тоді про тебе. Там мудрості нема.","^історія Розкажу про ворона, що мовчав. Вигадка, звісно.","^жарина Відсунься трохи. Хвіст у тебе один.","^жарина Вогонь тебе теж не любить. Не ображайся.","^нудно_в Біля вогню не вбивають. Біля вогню відпочивають.","^нудно_в Спи. Уві сні вбивай скільки хочеш.","^смажене_в Лишиться. Якщо чемно попросиш.","^смажене_в {name} поділиться. Як завжди.","^ворони_в Хтось біля вогню. Хтось ні. Нам пощастило.","^ворони_в Чужі ворони — чужий клопіт."],"х_дощ":["^скарга Дощ змиває сліди. І дурні думки.","^скарга Тихіше, від тебе вода тече мені за комір.","^скарга Мокрий ворон — сумне видовище. Ти — особливо.","~1 ^скарга Не ний. Ти не з цукру.","~3 ^скарга Тримайся ближче, так тепліше.","^калюжі Хлюпає в тебе в голові. На плечі сухо.","^калюжі Не тупцюй. Бризкаєш.","^сохнути Біля вогню. Якщо {name} його розпалить.","^сохнути На вітрі. Як білизна. Розвісимо тебе на гілці.","^скарга Дощ скінчиться. Твоє бурчання — ні.","~2 ^скарга Перетерпи. Мокрі — не мертві."],"х_туман":["^туман Нічого не бачу. А я, між іншим, бачу все.","^туман Туман. Добре для засідок. Погано для нас.","^туман У такому тумані навіть Одін заблукав би.","~1 ^туман Муніне, якщо загубишся, я шукати не буду.","~3 ^туман Тримайся поруч. Не люблю, коли тебе не видно.","^звуки Чуєш? Кроки. Чи то в тебе в животі.","^дорога Ми ще на дорозі? Бо я вже не певен.","^мряка_т Туман лізе в пір'я. Холодний, як рука драуґра.","^силует Он силует. Дерево чи троль?","^голос Хтось кличе в тумані. Не відповідай.","^тримайся Тримаймося ближче. Тут легко розгубитися.","^вогник Бачиш вогник? Там, у сірому.","^тиша_т Туман глушить звуки. Навіть твою лайку.","^мокро Туман осідає на пір'я. Скоро будемо важкі, як каміння."],"х_ніч":["^бійка Тобі аби битися. А ніч для думок.","^бійка Бийся сам. Я посвічу очима.","^темно Темно в мене в голові? Принаймні вона в мене є.","^кістка Це вовк гризе. Сподіваюсь, не нашого господаря.","^сховаюсь За мене не ховайся. Я тонкий.","^спокій Добре. Помовчимо. Вночі ліс говорить сам.","^бійка Бійка вночі — для тих, хто бачить у темряві. Тобто не для тебе.","^темно Темно — то не страшно. Страшно, коли ти щось задумав.","^кістка То не кістка. То {name} хрумтить сухарем.","^кістка Апетитно? Ти хворий.","~1 ^сховаюсь Ховайся. Я потім усім розкажу.","~3 ^спокій Гарна. Тиха. Як ти, коли спиш.","^вовки Вовки співають, бо голодні. Як ти. Тільки ти не співаєш, а скиглиш.","^вовки Хай співають. Аби не підходили.","^очі Четверо — то двоє звірів. Або один дуже здивований.","^очі Світлячки, Муніне. Не будь курчам.","^зорі_н Як блохи? Ти романтик, Муніне.","^зорі_н Це зорі, а не блохи. Подивись уважніше.","^сова Сова — нічний сторож. Не чіпай.","^сова Сова мудра. Тому ти її й не любиш.","^місяць Місяць світить, щоб ти не заблукав.","^місяць Він на всіх так дивиться. Не бери до серця.","^холод_н Притулися до шиї. Там тепліше.","^холод_н Біля вогню сядемо. Скоро.","^шурхіт Миша. Не дзьобай, вона тобі нічого не зробила.","^шурхіт Може, змія. Обережно.","^сон_н Не сплю. Думаю.","^сон_н Ворон уночі пильнує. Я пильную.","^драуґри Гниле око? Смачного.","^драуґри Хай лізуть. Ми далеко від болота."],"х_біом":["^біом {biome_here}. Новий світ — нові способи нас убити.","^біом Подивись навколо, Муніне. Такого ми ще не бачили.","^біом Я запам'ятаю цю дорогу. Ти — ні.","~1 ^біом Тут навіть повітря недружнє.","~3 ^біом Гарно. Страшно, але гарно.","^звірі Цікаво, які тут звірі. І чи вони нас їдять.","^мапа Треба запам'ятати, звідки ми прийшли. Раптом тікати.","^небо_б Навіть небо тут іншого кольору.","^рослини Дивні рослини. Не їж нічого, Муніне.","^перші Ми тут перші з воронів. Мабуть.","^тиша_край Тут тихо по-іншому. Насторожено.","^дім_далеко Дім тепер далеко. Чуєш, як далеко?","^скарби Тут має бути щось цінне. Нові землі — нові скарби."],"х_бос":["^бос Непогано впорались із {boss_ins}.","^бос {boss} лежить. Одін буде задоволений.","^бос Ще один трофей на камінь. Голова {boss_gen} гарно там висітиме.","~1 ^бос Гадав, ми цього разу точно загинемо.","~3 ^бос Пишаюся. Нами всіма.","^трофей Голова {boss_gen} — це добре. Але бачив, скільки там іще всього?","^шрами {name} {увесь|уся} в подряпинах. Боси так просто не лягають.","^тиша_б Як тихо стало. Наче світ видихнув.","^пісня Про цей бій складуть пісню. Я вже знаю перший рядок.","^одін_б Одін дивиться. Я відчуваю його погляд.","^біль {name} ледь стоїть. Перемога дорого коштувала.","^наступний Хто наступний, як думаєш?","^страх_б Зізнаюся: на мить мені стало страшно."],"х_бос_осадити":["^бос А ти в цей час ховався. {name} бачи{в|ла}, не відкрутишся.","^бос Я бачив, де ти був. Під кущем.","^бос Скромніше, Муніне. Скромніше.","~3 ^бос Гаразд. Ти теж молодець. Трохи.","^трофей Тобі — пір'їна з подушки. За хоробрість.","^шрами Тобі б такі — ти б скиглив тиждень.","^тиша_б Насолоджуйся. Такі хвилини рідкісні.","^пісня Перший рядок — про нашу людину. А тебе — у приспів.","^одін_б Одін бачив усе. Навіть твій кущ.","^біль Відпочинемо. Заслужили.","^наступний Не поспішай. Спершу перепочинок.","^страх_б Страх — не сором. Сором — тікати."],"х_ледве":["^валькірія Я теж її бачив. Вона махала тобі, не мені.","^валькірія Валькірії по таких, як ти, не прилітають.","^доб'ю Доб'єш — а хто тебе тоді годуватиме?","^доб'ю Не погрожуй {name}. Без {нього|неї} ти нікому не потрібен.","^п'яти Там, де в тебе совість, Муніне. Тобто ніде.","^п'яти У тебе є серце? Оце новина.","^всрався Помітно. Плече ще тепле.","^всрався Не тільки ти, Муніне. Не тільки ти.","^зілля Я нагадував. Двічі. Мене не слухають.","^зілля Зілля в сумці. Сумка — на базі. Логіка.","^гордість Від кабана — ні. Від гордості — так.","^гордість Тікати вміти треба. {name} вміє.","^весело Тобі все весело, поки не болить.","~1 ^весело Весело — це коли ти мовчиш.","~3 ^лякай Він злякався. Запишу, бо ніхто не повірить.","~3 ^лякай Ми живі. Це головне.","^доб'ю|всрався|п'яти Ще б мить — і {name} лиши{вся|лася} б тут, а ми б летіли до Одіна самі.","^руки Трусяться — значить, живі. Усі троє.","^руки Лапи в тебе трусяться завжди. Від злості."],"х_смерть":["^смерть Ну от. Знову довелося шукати тіло.","^смерть Смерть — не кінець. Але дуже незручно.","^смерть Запам'ятаємо це місце. Обходитимемо.","~1 ^смерть Я ж казав. Я завжди кажу.","~3 ^смерть Головне, що {name} поверну{вся|лась}.","^речі Речі лежать там, де впали. Підемо по них, поки хтось не поцупив.","^ліжко Ну хоч прокину{вся|лась} у ліжку. Як після доброї пиятики.","^валькірії Валькірії вже кружляли. Я бачив їхні крила.","^помилка Знаєш, де була помилка? Я знаю.","^могила Камінь над могилою. Ще один у нашій колекції.","^холод_с Було холодно там, де ми лежали.","^помста Хто це зробив, той ще пожалкує.","^знову_с Ну що, знову з нуля."],"х_ситий":["^ситий Смачно, до речі.","^ситий Мене годують, бо я заслужив.","^ситий {food}. Дуже смачно. Шкода, що не поділюсь.","~1 ^ситий Заздри мовчки.","~3 ^ситий Ну добре, наступного разу попрошу і для тебе.","^ситий Я б поділився. Але ти б і мене з'їв.","~2 ^ситий Наступного разу проси сам. Ти ж голосний.","^ситий Не заздри. Тобі не личить.","^ситий Чесно заслужив. Я не верещав.","^ситий Хочеш — поділюсь крихтою. Однією.","^ситий Дивись і вчись: так їдять культурно.","~1 ^ситий Мовчи, бо подавлюсь від твого бурчання.","~3 ^ситий Наступного разу попрошу для обох. Обіцяю."],"х_голодний":["^ситий Тебе нагодували? А мене?","^ситий Бачу, у нас тепер улюбленець.","^ситий Апетит у тебе завжди був кращий за манери.","~1 ^ситий Подавися.","~3 ^ситий Приємного. Тільки не чавкай.","^ситий Ого, Муніну дали першому. Що сталося?","^ситий Смачного, Муніне. Тільки крихти з мене струси.","^ситий Тобі {food}? Цікаво, за які заслуги.","^ситий Чавкаєш так, що в Асгарді чути.","^ситий Їж, їж. Може, подобрішаєш.","~1 ^ситий Тебе годують, щоб ти мовчав. Не спрацює.","~3 ^ситий Радий, що тебе нагодували. Чесно.","^ситий Я не заздрю. Просто дивлюся. Пильно."],"х_хвалиться":["^хвальба Мені {name} довіряє більше. Факт.","^хвальба Мене {name} частіше кличе. Довіра — річ така.","^хвальба Довіра в мене росте, а в тебе — тільки лайка.","~1 ^хвальба Муніне, наздоганяй. Довіра сама не прийде.","^хвальба {name} мене слухає. Тебе — терпить.","^хвальба Мені сьогодні довірили пильнувати. Тобі — мовчати.","^хвальба Довіра — як пір'я: в мене густе, в тебе — облізле.","^хвальба Подивись на мене, Муніне. Отак виглядає довіра.","^хвальба Я вже на ступінь вище. Наздоганяй, якщо зможеш.","~
