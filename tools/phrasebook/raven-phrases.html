"ха_кайло":["{friend} з кайлом. Шахтар{>|ка} знайш{>овся|лася}.","Кайло в руках — значить, скоро буде гуркіт. І пил. Багато пилу.","Руду копати пі{>шов|шла}. Хоч би тобі щось перепало.","~1 Знову камінці колупає. Нудно.","{friend} довбає камінь. Терплячі руки.","Руда сама себе не видобуде. {friend} це знає.","Гуп-гуп-гуп. Мені аж у вухах дзвенить.","~1 Довбає, довбає… А руди — кіт наплакав.","~2 Допоможи. Удвох швидше.","~3 Гарна робота. Шахтарі — то сила."],"ха_зброя":["{weapon} в руках. Сподіваюся, не на тебе.","{friend} тримає зброю напоготові. Мудро. Або нервово.","{weapon}. Гарна річ. В умілих руках. Подивимося, чи вони вмілі.","~1 Ходить зі зброєю, ніби на війну. Ну-ну.","{weapon} у {>нього|неї} в руках. Добре, що ми на одному боці.","{weapon}… Цікаво, скільки ворогів уже бачило цю зброю.","Зброя напоготові. Тут інакше й не можна.","~1 Зброя напоготові. Аби не в мій бік.","~2 Зброю тримає доглянутою. Видно одразу.","~3 З такою зброєю {friend} — добрий союзник."],"ха_близько":["Чого {>він|вона} так близько? Мені тісно.","{friend} стоїть упритул. Особистий простір — не для вікінгів, я бачу.","Ще ближче — і {friend} сяде мені на голову.","~3 Близько стоїте. Як свої. Добре.","{friend} так близько, що я чую, як {>він|вона} дихає.","Близько стоїть. Мабуть, хоче щось сказати.","Відстань — то повага. Але не в цих землях, бачу.","~1 Ще ближче — і дзьобну. Ненавмисно.","~2 Близько, але без загрози. Добре.","~3 Стоїте, як брати. Гарно."],"ха_корабель":["Ти й {friend} на одному кораблі. Якщо втопимось — то разом.","Хто пустив {>його|її} до керма? Сподіваюся, ніхто.","Одне море, одна палуба, і {friend}. Гарна подорож. Поки що.","~3 З {>ним|нею} на кораблі не страшно. Майже.","Удвох на кораблі — удвічі більше рук на веслах.","{friend} дивиться на обрій. Мрійни{>к|ця}.","Море змиває сварки. Пливіть мирно.","~1 Двоє на кораблі — і жоден не знає курсу.","~2 Гарна команда. Пливемо.","~3 На морі добре мати поруч своїх."],"ха_ніч":["Ніч, а {friend} тиняється поруч. Двоє совиних вікінгів.","Темно. Добре, що ви вдвох. Мені спокійніше.","Уночі всі сірі. Навіть {friend}.","~3 Тримайтеся разом. Ніч — не для поодиноких.","Ніч, а {friend} поруч. Удвох не так темно.","У темряві знайоме обличчя — найкраща розрада.","{friend} теж не спить. Тривожна ніч.","~1 Двоє в темряві. Як у поганій казці.","~2 Тримайтеся світла. Обоє.","~3 Добре, що вночі ти не сам{|а}."],"ха_буря":["Буря, а ви з {>ним|нею} гуляєте. Чудова компанія божевільних.","{friend} мокр{>ий|а}, як і ти. Хоч у цьому ви рівні.","Грім гримить, а {friend} навіть не здригну{>вся|лася}. Або {>оглух|оглухла}.","~1 Двоє під дощем. Розумні люди сидять удома.","Буря, а ви вдвох. Добре, хоч не самі мокнете.","{friend} теж мокне. Справедливість.","Грім над вами. Сховайтеся разом.","~1 Двоє мокрих курей.","~2 Перечекайте бурю разом.","~3 У бурю добре мати поруч своїх."],"ха_заздрість":["{fraven}… Легенда. А мене ти коли так прославиш?","У {>нього|неї} на плечі легенда, а в тебе — я. Думай.","Заздрю? Я? Ні. Ну, трохи. {fraven} — то таки ім'я.","~3 Колись і я так заслужу. Ми ж разом, правда?","{fraven}. Я теж колись буду таким. Ти ж знаєш.","Легенда поруч, а я — на твоєму плечі. Думай.","{fraven}. Гучне ім'я. Мені б таке.","~1 Годуй мене краще — і я стану не гіршим.","~2 Не заздрю. Надихаюся.","~3 Колись і я стану легендою. Разом із тобою."],"ха_вдарив_ти":["Ти що, б'єш своїх? {friend} не ворог, між іншим.","Гарний удар. Тільки не по тому, кому треба.","Своїх бити — погана прикмета. Я це знаю, я ворон.","~1 Ну все, тепер {friend} образиться. Я б образився.","Навіщо? {friend} же св{>ій|оя}.","Своїх бити — останнє діло.","{friend} не ворог. Запам'ятай.","~1 Гарний удар. Тільки дурний.","~2 Перепроси. Так буде правильно.","~3 Не роби так більше. Свої — то святе."],"ха_вдарив_тебе":["{friend} тебе вдари{>в|ла}! Я бачив. Мстити будемо?","Ти бачи{в|ла}? {friend} на тебе руку підня{>в|ла}.","Випадково чи ні — а я запам'ятаю.","~3 Тримай себе в руках. Мабуть, випадково. Мабуть.","{friend} підня{>в|ла} на тебе руку. Я запам'ятав.","Хтось тут забу{>в|ла}, хто свій.","Удар від свого болить двічі.","~1 Дай здачі. Чи я дам.","~2 Може, випадково. Може.","~3 Не відповідай. Будь мудріш{им|ою}."],"хв_поранений":["Ти краще за своєю людиною дивись, {addr}.","Поранен{ий|а}, зате жив{ий|а}. Твоя людина таким не завжди похвалиться.","Рани загояться. А от твій язик, {addr}, — ні.","Дякую за турботу. Тільки не в цьому тоні.","Рана — не ганьба, {addr}. Ганьба — дивитися й не допомагати.","Жив{ий|а} — і досить. Твоя людина колись теж буде в крові.","Дякую, що помітив, {addr}. Тепер помовч.","~1 Сам ти поранений. На голову.","~2 Загоїться. Не вперше.","~3 Дякую, {addr}. Справді."],"хв_спить":["Тихо, {addr}. Хай спить. Я вартую.","Спить, бо заслужи{в|ла}. А твоя людина чим займається?","Сон — то святе. Навіть для вікінгів.","Ще слово — і розбудиш. Тоді сам заколисуватимеш.","Тихо, {addr}. Сни — то святе.","Спить, бо всю ніч не спа{в|ла}.","Розбудиш — сам пояснюватимеш.","~1 Дивись краще за своєю людиною, {addr}.","~2 Хай спить. Ми помовчимо.","~3 Дякую, що тихо, {addr}."],"хв_бос":["Пам'ятаю. Твоя людина тоді більше кричала, ніж била.","Пам'ятаю, {addr}. І пам'ятаю, хто ховався за каменем.","Разом били — разом і пам'ятаємо. Не перекручуй.","~3 Гарний був бій. Добре, що ми були разом.","Пам'ятаю, {addr}. Без моєї людини там було б сумно.","Бій був гарний. І чесний.","Не перекручуй, {addr}. Я теж там був.","~1 Твоя людина там більше заважала.","~2 Гарно тоді вийшло.","~3 Добре, що ми тоді були разом, {addr}."],"хв_ворон":["Це ти про мене? Так, я {me}. І пишаюся.","Ім'я як ім'я, {addr}. Твоє теж не з саг.","{me} — до твоїх послуг. Але не надто.","Я все чую, {addr}. І пір'я в мене, між іншим, чисте.","Обговорюєш мене? Приємно. Продовжуй.","Так, це я. Я, а не тінь.","Обговорюєш мене, {addr}? Кажи вже в очі.","Я {me}. Запам'ятай нарешті.","~1 Мене обговорювати — честь для тебе, {addr}.","~2 Приємно, що помічаєш.","~3 Дякую, {addr}. Ти теж нічого."],"хв_новий":["Познайомимось, {addr}. Я {me}. Моя людина — {name}.","Я {me}. А ти, бачу, {raven}. Чув, чув.","Новенькі тут ви, а не ми.","Ми не кусаємося. Здебільшого.","Ми прийшли з миром, {addr}. Здебільшого.","Я {me}, а то — {name}. Будьмо знайомі.","Новенькі? Ні, ми тут уже давно.","~1 Познайомимося — тоді й поговоримо.","~2 Приємно, {addr}.","~3 Радий знайомству, {addr}."],"хв_свій":["І ми вас любимо, {addr}. Здебільшого.","Свої, свої. Не розкисай, {addr}.","Знаю, знаю. Ми теж до вас звикли.","~3 Добре, що ви поруч. Скажу один раз і більше не повторю.","Свої, {addr}. Без зайвих слів.","Ми теж вас цінуємо. Тихо.","Свої — то свої. Навіть коли дратують.","~1 Не розкисай, {addr}.","~2 Дякую. Взаємно.","~3 Добре, що ви в нас є, {addr}."],"хв_знайомий":["Пам'ятаєш? Приємно. Я тебе теж — смутно.","Бачились, так. Я пам'ятаю твоє пір'я. І твої балачки.","Знайомі, знайомі. Але не друзі. Поки що.","Ну так, бачились. І що?","~3 Пам'ятаєш — значить, ми вже щось разом пережили.","Пам'ятаю, {addr}. І ти мене, бачу.","Бачились, так. Світ тісний.","Знайомі — то вже пів дороги до друзів.","~1 Пам'ятаю. Нічого особливого.","~2 Привіт, {addr}. Знову.","~3 Радий тебе бачити, {addr}."],"хв_шолом":["Шолом — річ корисна. Порадь своїй людині, {addr}.","Голова на місці, дякую. Твоя людина своєю менше дорожить.","Краще залізо на голові, ніж вітер у голові.","Без шолома легше думати. Перевір на своїй людині.","Шолом — то мудрість, викувана із заліза.","Голова ціла — думки цілі.","Позич своїй людині, {addr}. Не шкода.","~1 Краще шолом, ніж твої поради.","~2 Гарний, правда?","~3 Дякую, {addr}. {name} старанно добира{в|ла}."],"хв_робота":["Хтось же має працювати, {addr}.","Робота як робота. А ваша людина що зробила сьогодні?","Не заважай, {addr}. Тут ліс сам себе не зрубає.","Поможете — поділимося. Ні — то ні.","Праця — то теж бій. Тихий.","Допоможеш — подякуємо, {addr}.","Ми не ледарі. На відміну від деяких.","~1 Не заважай, {addr}.","~2 Робота йде.","~3 Дякую, що помітив, {addr}."],"хв_зброя":["Зброя для ворогів, {addr}. Поки що.","Напоготові — значить живі. Запиши собі.","Хочеш перевірити, чи гостра? Не раджу.","Зброя на місці. Розум теж. А у вас?","Зброя чиста, рука тверда.","Не хвилюйся, {addr}. Не на тебе.","Гостре — на ворогів. Тупе — на дурні питання.","~1 Перевіриш на собі?","~2 Звичка, {addr}. Корисна.","~3 Добре, що ми на одному боці, {addr}."],"хв_близько":["Це ви до нас підійшли, {addr}, а не ми.","Тісно? Відлетіти завжди можна.","Близько — бо свої. Чи ні?","Не дихай на мене, {addr}.","Близько — бо так безпечніше.","Відстань — то для чужих, {addr}.","Не тисни, {addr}. Місця досить.","~1 Відлети, якщо тісно.","~2 Нічого, ми свої.","~3 Близько — і добре."],"хв_корабель":["Кермо в надійних руках. Мабуть.","Якщо потонемо — винна твоя людина. Я так вирішив.","Море спокійне. Поки ти не каркаєш.","Пливемо разом — то й мовчимо разом, {addr}.","Море спокійне, кермо в руках.","Пливемо, {addr}. Не хитай.","Корабель витримає. Ми — теж.","~1 Не подобається — плигай.","~2 Добре йдемо.","~3 Разом пливти веселіше, {addr}."],"хв_ніч":["Темно, мокро — а ви все одно тут. Хто з нас дурніший?","Ніч як ніч. Тримайтеся ближче.","Ми не боїмося темряви, {addr}. Ми в ній живемо.","Буря мине. Твоя балачка, схоже, ні.","Ніч минає. Ми лишаємося.","Темно, {addr}, але не страшно.","Буря шумить, а ми тримаємось.","~1 Боїшся — ховайся.","~2 Тримаймося разом.","~3 Добре, що ви поруч, {addr}."],"хв_заздрість":["Заздриш, {addr}? Розумію.","Ім'я треба заслужити. Працюй.","Не хвилюйся. Колись і про тебе почують. Мабуть.","Легенда втомлюється від уваги. Але дякую.","Легенди не народжуються, {addr}. Їх виховують.","Працюй — і будеш.","Заздрість — погана їжа, {addr}.","~1 Плач тихіше.","~2 Дякую. Ми старались.","~3 Колись і в тебе буде, {addr}."],"хв_удар":["Випадково. Мабуть. Не роби з цього сагу.","Своїх не б'ють. Передай своїй людині.","Ми все бачили, {addr}. І все запам'ятали.","Ну вдарили. Буває. Живі ж.","Випадково, {addr}. Чесно.","Буває. Живі — і добре.","Ми ще розберемося. Без тебе.","~1 Не пхай дзьоба, {addr}.","~2 Перепросимо. Може.","~3 Вибач, {addr}. Не хотіли."],"хв_будь_що":["Ми все чуємо, {addr}.","Дякую за увагу, {addr}. Дуже приємно. Ні.","Подивись краще на свою людину, {addr}. Там є на що подивитися.","Твоя людина теж не подарунок, між іншим.","~3 Гаразд, {addr}. Цього разу пробачаю.","Ми теж на вас дивимось, {addr}.","Цікаво? Питай прямо.","Обговорювати чужих — не по-вороньому.","~1 Займися своєю людиною, {addr}.","~2 Гаразд, {addr}. Почули.","~3 Дякую за увагу, {addr}. Щиро."],"уд_вбив":["{target} більше не встане.","Від {target_gen} лишився тільки спогад.","{target} — усе. Записую в літопис.","Готово. Одна думка — один труп.","{target} уже нікому не загрожує.","Ще одна душа летить до Гель. Не моя.","Тихо впало. Красиво впало.","Для {target_gen} це був останній день.","Наче й не було {target_gen}.","Одним ворогом менше. Можеш дихати.","Лежить. І лежатиме.","Точка. Крапка. Кінець історії.","~1 Знову я все зробив, а лаври тобі.","~1 Прибрав. Ти б до вечора вози{вся|лася}.","~2 Чисто. Без зайвого шуму.","~2 Ось так це робиться.","~3 Ніхто тебе не зачепить, поки я тут.","~3 Це тобі, друже. Від мене."],"уд_вбив_оцінка":["Наступний.","Хто ще?","Чисто.","Можеш не дякувати.","~1 Вчися, поки я живий.","~2 Непогано, еге ж?","~3 Ми — добра пара."],"уд_невдача":["Не пробив. Шкура в {target_gen} — як кора.","Щось пішло не так. {target} ще дихає.","Влучив, але мало. Дуже мало.","Дзьоб зісковзнув. Буває. Рідко. Сьогодні.","Клюнув — а йому хоч би що.","Не той кут. Не той день. Не той ворог.","Я старався. Чесно. Просто шкура в {target_gen} товста.","Розрахунок був ідеальний. Ворог — ні.","Мало сили в дзьобі. Нагодуй — і побачиш.","Зачепив, але не дістав.","{target} ще на ногах. Це тимчасово.","Хм. Я думав, буде боляче. Йому.","Це був попереджувальний удар. Так і запишемо.","~1 Не пробив. І не дивись так, ти теж не пробиваєш.","~1 Гаразд, не вийшло. Твоя черга ганьбитися.","~2 Подряпина. Добий, поки я думаю, що пішло не так.","~2 Не до кінця. Але я {target_gen} розігрів.","~3 Не вистачило трохи. Добий — я прикрию.","~3 Вибач, друже. Наступного разу — точно."],"уд_невдача_кінець":["Добивай.","Твоя черга.","Я ще повернуся.","Запам'ятаю цю шкуру.","~1 І не смійся.","~3 Я поруч."],"хд_вірність":["Ти {пішов|пішла} у темряву. Я чекав. Ось ти й тут.","Валькірії питали, чи я з ними. Я сказав: у мене є людина.","Я сидів біля тебе, поки ти {лежав|лежала}. Холодно було. Тепер краще.","Не роби так більше. Я ж не вічний. Ну, майже.","Могила — то не для нас. Ходімо, справ повно.","{Налякав|Налякала} ти мене. Більше так не треба.","Я лічив твої подихи. Вони скінчилися. А потім знову почалися. Дивно.","Хтось мусив лишитися й подивитися, хто це зробив. Я запам'ятав.","Твої речі там, у могилі. А я — тут. Бо я не річ.","~1 Ти {помер|померла}. Знову. Я записую, до речі.","~1 Я не пішов за тобою в могилу. Не з вірності. Просто там тісно.","~3 Я б і в Гель за тобою полетів. Добре, що не довелося.","~3 Поки я з тобою — ти не {сам|сама}. Навіть там.","Я тут, {name}. Я нікуди не йшов.","Валькірії кликали мене з собою. Я сказав, що маю справи. Тебе.","Могила — не місце для ворона Одіна, {name}. Ходімо.","Ти {впав|впала}, а я лишився. Так і має бути.","{Думав|Думала}, я тебе покину? Не сьогодні, {name}.","Я бачив, як ти {пішов|пішла}. І чекав, поки повернешся."],"хд_повернення":["Ти {прийшов|прийшла} по мене. Я знав.","Темно там було. І тихо. Занадто тихо.","Дякую, що {забрав|забрала}. Наступного разу — без могили, домовились?","Я пролежав там і думав. Про тебе. Про те, як ти падаєш.","Лежав серед твоїх речей і думав: навіщо людині стільки каміння?","~1 Довго ж ти {йшов|йшла}.","~3 Разом — навіть із могили. Ходімо."],"ем_танець":["Ти танцюєш, я злітаю з плеча. Дякую.","Ритм у тебе свій. Ні з чим не збігається.","Скальди про це не співатимуть. Я подбаю.","Так танцюють після третього рогу меду. А ти ж тверез{ий|а}.","Ногу вище. Ні, нижче. Ні, просто стій.","От би ти так ухиля{вся|лася}, як танцюєш.","~1 Знову ноги в різні боки. Як завжди.","~2 Ну-ну. Тобі б ще музику. І талант.","~3 Знаєш, непогано. Для вайла — зовсім непогано.","Я вчепився кігтями. Якщо що — це твоє плече.","Під яку музику? Я чую тільки, як рипить твоє коліно.","Якщо це обряд — бог образився.","Для тебе танець. Для мене — землетрус.","~1 Не при свідках. Хоча свідок я. І я запам'ятаю.","~1 Корова на льоду танцює краще. Я бачив.","~2 Друзі дивляться. Усміхайся, ніби так і задумано.","~2 Ліва нога пішла не туди. Права — за нею.","~3 Танцюй. Криво, але від душі. Це видно.","~3 Я відбиваю такт крилом. Не кажи Муніну."],"ем_голова":["Голову бережи. Там і так небагато.","Трусиш головою. Бджола залетіла?","Мене ледь не скинуло. Попереджай, генію.","Була там думка — вже випала.","~2 Енергійно. Аж пір'я дибки.","~3 Ну ти й да{в|ла}. Я втримався.","Так мізки не провітрюють. Тільки збивають.","Що струшуєш? Скажи — допоможу дзьобом.","Завтра шия тобі це пригадає.","Кивай повільніше. Згода від цього не слабне.","~1 Тепер ясно, звідки в тебе такі рішення.","~1 Труси сильніше. Може, щось стане на місце.","~2 Новий вид бою вигада{в|ла}? Без зброї й без сенсу.","~2 Тримаюсь. Ледве. Але з гідністю.","~3 Дурне, але від серця. Таке я поважаю.","~3 Гаразд, давай ще. Я вчепився."],"ем_махає":["Кому махаєш? Там нікого. Чи є?","Помахай і за мене. Я махну — злечу.","Вітаєшся з деревами? Не відповідають. Я перевіряв.","Махай, махай. Колись хтось відповість.","~2 Привітно. Головне — не ворогам.","~3 Гарно махаєш. Майже не смішно.","Друзям махаєш? Мені не треба, я й так тут.","Здалеку схоже, що ти кличеш на поміч.","Привіт чи прощавай? Ти хоч {сам|сама} знаєш?","Так починається кожна історія. Здебільшого погана.","~1 Махаєш так завзято, ніби тут комусь цікаво.","~1 Тихіше. Ще трохи — і мене приймуть за прапор.","~2 Махни ще. Тебе досі не помітили.","~2 Я б кивнув у відповідь. Та ти ж не мені.","~3 Якщо мені — бачу. Я все бачу.","~3 Добре, що є кому махати. Не розгуби їх."],"ем_кличе":["Кого кличеш? Я тут. Решта не прийде.","Ходи сюди? Я на твоєму плечі, ґаво.","Кличеш? Прийдуть вовки. Вони завжди приходять.","~1 Кличеш, кличеш. Ніхто не йде. Звикай.","~2 Якщо мене — я вже тут. Давно.","~3 Тут я, тут. Куди ж я від тебе дінусь.","Підкликаєш? Хай поквапиться. Мені холодно.","Так кличуть собак. Ти точно друга кличеш?","Ходи-ходи. Так починається кожна пастка.","Прийдуть — а далі? Плану ж нема.","~1 Як владно. Ніби тебе хтось слухається.","~1 Не підлечу. Я вже тут. Це максимум.","~2 Кличеш? Поклич когось із їжею. Решту не треба.","~2 Кличеш, а не йдеш {сам|сама}? Ого. Розумнішаєш.","~3 Хто б не прийшов — я буду першим. Я ж і так тут.","~3 Я колись теж прилетів на твій поклик. Досі шкодую. Трохи."],"ем_тиче":["Куди тичеш? Там нічого. А я бачу все.","Пальцем тицяти неввічливо. Але куди?","Он там? Запам'ятав. Що саме — не знаю.","~1 Тицяй, тицяй. Може, щось і з'явиться.","~2 Бачу. Глянемо ближче?","~3 Бачу. Пішли.","Туди? Гаразд. Але як там пусто — запам'ятаю.","Пальцем тичуть ті, в кого нема дзьоба. Співчуваю.","Тицяєш упевнено. Ніби знаєш, куди йдемо.","Ти тицяєш, друзі дивляться, а я вже там.","~1 Ага. Там. Як минулого разу. І нічого.","~1 Тільки не на мене. Я не трофей.","~2 Бачу. Запам'ятав. Нагадаю, коли забудеш.","~2 Гаразд, ведеш ти. Я тільки сперечаюся.","~3 Куди покажеш, туди й полетимо. Майже без бурчання.","~3 Гарне око. Не моє, але гарне."],"ем_рик":["Ричиш? Вороги не почули. Я почув. На жаль.","Гучно. Сміливо. Нікого поруч. Ідеально.","Виклик кинуто. Ніхто не підняв. Образливо.","~1 Ще трохи — і повірю, що ти страшн{ий|а}.","~2 Грізно. Майже як я, коли голодний.","~3 Грізн{ий|а}, аж страшно. Мені — ні, але загалом.","Птахи з дерев позлітали. Я ні. Я звик.","Ти рикну{в|ла} мені просто у вухо.","Злякались не вороги. Злякались твої друзі.","Так ричать перед боєм. Або після твоєї юшки.","~1 Голосно — не те саме, що грізно. Запиши.","~1 Кабан ричить переконливіше. І не позує.","~2 Горло є. Плану нема. Як завжди.","~2 Я майже здригнувся. Майже.","~3 У Вальгаллі почули. Хтось, мабуть, навіть кивнув.","~3 Ричи. Я каркну слідом, щоб хоч хтось злякався."],"ем_радість":["Радієш? З чого? Ну, хай.","Схвалюю твоє схвалення. Наосліп.","Палець угору. А мій кіготь — униз. Для рівноваги.","~1 Радієш, ніби щось зроби{в|ла}. Я пропустив?","~2 Добре. Хоч якась новина.","~3 Радій. Тобі личить. Буває рідко.","Ура? Ну, каркну за компанію.","Радіти завчасно — давня традиція. Перед поразкою.","Друзі радіють з тобою чи з тебе? Тонка різниця.","Запишу: гарний день. Ну, гарна мить.","~1 Радій, поки можна. Завтра знову щось зламаєш.","~1 Стільки завзяття. І знову не до діла.","~2 Твоя радість заразна. Я опираюся. Погано.","~2 Хоч хтось тут не похмурий. Крім мене.","~3 Радієш — і мені легше. Нікому ні слова.","~3 Коли ти отак радієш, я забуваю бурчати."],"ем_ні":["Ні-ні-ні? Пізно. Я вже записав.","Заперечуєш? Я ж іще нічого не сказав.","Не хочеш — не треба. Потім не плач.","~1 Ні — то ні. Але ти все одно неправ{ий|а}.","~2 Твердо. Шкода, що вперше.","~3 Гаразд, не будемо. Цього разу.","Ні-ні-ні — це три рази ні? Чи одне велике?","Хитаєш пальцем, як старий жрець. Тільки без мудрості.","Хтось запропонував дурницю? Рідкісний випадок, коли не ти.","Відмову прийнято. Оскаржити можна в Одіна.","~1 Ні? Ти ж зазвичай на будь-яку дурницю кажеш так.","~1 Хитай, хитай. Я все одно скажу.","~2 Раз на рік я з тобою згоден. Сьогодні. Ні.","~2 Ні так ні. Пояснення — до вечора.","~3 Ти проти — і я проти. Навіть не знаючи, чого.","~3 Вчасно відмови{в|ла}. Невже я тебе чогось навчив?"],"ем_цілунок":["Повітряний поцілунок? Кому? Тільки не мені.","Ох. Ніжності. Відвертаюсь.","Ворони цілуються дзьобами. І то рідко.","~1 Тільки не мені. Я тобі ще не настільки довіряю.","~2 Мило. Аж ніяково.","~3 Мило. Скажеш комусь — дзьобну.","Поцілунок полетів. Хто зловить — співчуваю.","Повітряні — для тих, хто боїться підійти.","Друзі дивляться. Я теж, на жаль.","Якщо це Фреї — у неї вихідний.","~1 Тримай ніжності подалі від мого дзьоба.","~1 А ворогам пошлеш? Може, втечуть з огиди.","~2 Зловив. Випадково. Повертаю.","~2 Почервонів би, та пір'я не дає.","~3 Якщо мені — приймаю. Мовчки.","~3 Ніжність тобі личить. Тільки не при Муніні."],"ем_уклін":["Кланяєшся мені? Нарешті. Довго ж доходило.","Обережно! Я мало не з'їхав тобі на ніс.","Кому кланяєшся? Якщо Одіну — він бачив і кривіші.","~1 Нижче. Ще нижче. Ну, приблизно так.","~2 Чемно. Аж підозріло.","~3 Гарно. Я теж кивну. Але не звикай.","Уклін? Звідки в тебе манери? Вкра{в|ла}?","Ти кланяєшся, а я дивлюсь у землю. Земля як земля.","Уклін прийнято. Випрямляйся, поки спина ціла.","Так кланяються ярлу. Перед тим, як просити срібла. Скільки?","~1 Бачу, ти нарешті знаєш своє місце.","~1 Спина крива, зате намір ясний.","~2 Киваю у відповідь. На більше не розраховуй.","~2 Шанобливо. Записую в заслуги. Там поки порожньо.","~3 Не треба кланятися мені. Ми рівні. Майже.","~3 Одін бачив. Я бачив. Обидва кивнули. Рідкість."],"ем_страх":["Ховаєшся? Від кого? Тут нікого.","Страшно? Мені теж. Але я не показую.","Пригнися, пригнися. Я пильную.","~1 Ой, герой. Аж страшно стало. За тебе.","~2 Нічого. Я дивлюся за двох.","~3 Не трусись. Я ж на плечі.","Зіщули{вся|лася} так, що я тепер вище. Гарний краєвид.","Ховаєшся за мною? Погана новина. Я маленький.","Друзі бачать, як ти тремтиш. Скажи, що це вправа.","Страх тримає живими. Переважно.","~1 Тремтиш. А я ж казав: не лізь туди.","~1 Мені соромно сидіти на такому плечі.","~2 Дихай. До десяти. Тоді вдаватимеш героя.","~2 Я гляну, що там. А ти посидь тихенько.","~3 Хай що там — спершу йому доведеться пройти повз мене.","~3 Бояться всі. Ти хоч не {сам|сама}."],"ем_плач":["Плачеш? Що цього разу?","Сльози — то вода. Мокро мені й без того.","Не розкисай. На тебе дивляться.","~1 Плач тихіше. Вороги почують.","~2 Поплач. Я почекаю. Недовго.","~3 Ну годі, бідолахо. Минеться.","Плакати — не ганьба. Ганьба — плакати на мене.","Розкажи. Я вислухаю. А потім скажу, хто винен.","Подайте хтось хустку. Бо носа об мене витре.","Одін утратив око — і не плакав. Ну, мабуть.","~1 Сльози не полагодять того, що ти злама{в|ла}.","~1 Хлипаєш, як мокре курча. Годі.","~2 Годі, годі. Я вже й сам ледь не розкис.","~2 Досить. Попереду ще купа дурниць, сили знадобляться.","~3 Можеш притулитися до крила. Сьогодні. І нікому не кажи.","~3 Плач. Я нікуди не дінусь. На твоє нещастя."],"ем_мязи":["М'язи? Бачу. Мозок покажеш?","Вражає. Покажи це ворогам, а не мені.","Сильн{ий|а}. Не сперечаюсь. Тільки не трісни.","~1 Напинаєшся, ніби це щось змінить.","~2 Непогано. Я б так не зміг. Крила.","~3 Гарна форма. Ще б голову таку.","Для кого виступ? Дзеркала тут нема.","Ці руки рубали дерева. Тепер позують. Кар'єра.","Обережно, плече ворушиться. Я на ньому живу.","Тор теж напинався. Але мав молот і привід.","~1 Сила без розуму. Важкий спосіб помилятися.","~1 Вражає. Як на когось, хто вчора тікав від кабана.","~2 Ну добре, добре. Є на що глянути.","~2 Гарно. Тільки плече мені не вивихни.","~3 Сиджу на сильному плечі. Зручно.","~3 Сила є. Серце теж. Розум підтягнемо."],"ем_сміх":["З чого смієшся? Тільки не кажи, що з себе.","Смієшся сам{|а}? Тривожний знак.","Сміх — то добре. Аби не з мене.","~1 Смійся, смійся. Я запишу, з чого.","~2 Весело тобі. Недовго, знаю тебе.","~3 Регочеш, як віслюк. Але заразно.","Регочеш так, що аж я підстрибую.","Згада{в|ла} щось смішне? Свій учорашній бій?","Смійся. Від укусів не допоможе, але смійся.","Гарний жарт? Перекажи. Я оціню суворо.","~1 Смієшся? З моїх порад, мабуть. Даремно.","~1 Ха. Ха. Смішно було тільки тобі.","~2 Гаразд, і я каркну. Це майже сміх.","~2 Твій сміх лякає ворогів краще, ніж рик.","~3 Смійся. Коли ти смієшся, менше дурниць робиш.","~3 Смійся частіше. Мені набридла твоя кисла пика."],"ем_плечі":["Не знизуй плечима. Я тут сиджу, між іншим.","Не знаєш? А я знаю. Не скажу.","Зниза{в|ла} плечима — мене підкинуло. Дякую.","~1 Не знаєш. Як завжди.","~2 Я теж не все знаю. Майже все.","~3 Нічого. Розберемось.","Знизуєте плечима всі? Ну й компанія.","Знизати плечима — відповідь тих, хто не думав.","Якщо навіть ти не знаєш, то хто? А, я.","Вгору-вниз. Як у човні в шторм.","~1 Твоя відповідь на все. Зручно.","~1 Знизуй далі. Може, відповідь випаде.","~2 Чесно. Не знати й зізнатися — вже півділа.","~2 Спитаємо Муніна. Він теж не знає, зате впевнено.","~3 Не знаєш — підкажу. Не вперше.","~3 Дізнаємося разом. Хвалитимусь я."],"ем_лежить":["Лягаєш? Посеред дороги? Ну-ну.","Відпочивай. Хтось має не спати. Я.","{Розлігся|Розляглася}, як {пан|пані}. А я злітай.","~1 Лежиш. Вороги теж відпочивають. Від тебе.","~2 Полеж. Посторожу. Безплатно.","~3 Відпочинь. Навіть заслужи{в|ла}. Трохи.","Лежиш? Тоді я на груди. Звідти видно твій ніс.","Лежиш і дивишся вгору. Там нічого нового. Я перевіряв.","Лежиш і думаєш? Не перенапружуйся.","Ти лежиш, я сиджу з поважним виглядом. Хтось має.","~1 Лежиш, ледащо. Справи самі не зробляться.","~1 Полежиш ще — вирішу, що ти здобич. І дзьобну.","~2 Не засинай. Хропеш ти гірше, ніж співаєш.","~2 Гаразд, п'ять хвилин. Я рахую.","~3 Лежи. Хто підійде — отримає дзьобом. Навіть друзі.","~3 Розповісти казку? Про мудрого ворона і його недотепу."],"ем_тост":["За що п'ємо? За мудрих воронів, сподіваюсь.","Тост? Підтримую. Подумки.","Ріг угору? Тільки не на мене.","~1 Пий, пий. Розуму не додасть.","~2 Будьмо. І не забудь, де ми.","~3 За нас трьох. Ти платиш.","За друзів — гарний тост. Особливо як пригощають.","Скол! Сказав за тебе, бо ти вже п'єш.","Мед, пиво чи вода? По обличчю не скажеш.","Тост без слова — як щит без руки. Скажи щось.","~1 За перемогу? Яку, нагадай.","~1 Ще один — і дорогу додому шукатиму я.","~2 За Одіна. Він не відмовиться.","~2 Вище! Хай Вальгалла заздрить.","~3 За тебе. Без тебе мені не було б на чому сидіти.","~3 За нашу дорогу. Добру половину ти проповз{|ла}."],"ем_рахує":["Рахуєш? До скількох умієш?","Раз, два… Зби{вся|лася}? Спочатку.","Рахувати вмієш. Уже щось.","~1 Рахуй уголос. Хочу почути, де саме зіб'єшся.","~2 Сорок два. Завжди сорок два.","~3 Правильно. Я перевірив. Двічі, бо не повірив.","Пальців на все не вистачить. Позич у друзів.","Що рахуєш? Борги? Смерті? Днів без дурниць — нуль.","Ворони вміють рахувати до семи. Ти, бачу, теж.","На пальцях? Ну, хоч не на ногах.","~1 Ти загнув той самий палець двічі.","~1 Перемоги рахуєш? Вистачить одного пальця.","~2 Хоч скільки вийде — округлимо на нашу користь.","~2 Не поспішай. Я не підказую. Сім. Ой.","~3 І мене порахуй. Я в тебе найкращий.","~3 Рахуєш ти краще, ніж думаєш. Ну, не набагато."],"ем_що":["Що це було? Незрозуміло, але цікаво.","Записав би в літопис. Не знаю, як назвати.","Люди. Ніколи не зрозумію.","~1 Це щось означає? Бо поки ні.","~2 Гаразд. Не питатиму.","~3 Дивак. Мій дивак.","Друзі зрозуміли? Бо я — ні.","Жест прийнято. Значення — потім.","Мовою тіла говориш упевнено. З акцентом.","Якщо це богам — вони перепитають.","~1 Це навмисно? Збоку — наче випадково.","~1 Ти мене соромиш. Повільно, але регулярно.","~2 Повтори. Хочу второпати задум.","~2 Схоже на щось. Не знаю на що.","~3 Хай що це було — роби ще.","~3 Звик до твоїх дивацтв. Без них нудно."],"хб_женеш":["Куди женете, {addr}? Пожежа?","{friend} так біжить, наче за {>ним|нею} троль.","Тримайся, {addr}, бо здує!","Не так швидко, {addr}! Пір'я розгубиш.","~1 Біжіть, біжіть. Однаково не встигнете.","~2 Обережно, {addr}! Там коріння.","~3 Бережи себе там, {addr}!"],"хб_поспіх":["Посторонись, {addr}! Ми поспішаємо.","Вибач, {addr}, нема часу на балачки!","Потім поговоримо, {addr}!","Ми у справах, {addr}. Мудрих справах.","~1 З дороги, {addr}!","~2 Не ображайся, {addr}, біжимо!","~3 Не нудьгуй, {addr}! Ще побачимось."],"хб_назустріч":["Мимо, {addr}! Як завжди.","Ви туди, ми сюди. Логічно.","{addr}, там, звідки ви біжите, щось є?","Ледь не зіткнулися, {addr}. Дивись, куди несеш свою людину.","~1 Розминулись. На щастя.","~2 Гарної дороги, {addr}!","~3 Бережи себе, {addr}!"],"хб_наввипередки":["Наввипередки, {addr}? Ми вже попереду.","Не відставай, {addr}!","Хто перший — того й мед.","Біжимо разом? То хоч не наступайте нам на п'яти.","~1 Наввипередки з нами? Сміливо.","~2 Тримайся поруч, {addr}. Удвох безпечніше.","~3 Удвох веселіше бігти, {addr}."],"хб_зброя":["{addr}, твоя людина з залізом у руках. На когось полюємо?","Ховайте зброю, {addr}. Тут свої.","Із залізом напоготові? Ми вам нічого не винні.","~1 Зброя в руках, а розум — у сумці.","~2 Напоготові — то правильно. Тут усяке водиться.","~3 З такою зброєю й у бій не страшно, {addr}."],"хб_ніч":["Чого не спиться, {addr}?","Вночі бігати — то сміливо. Або дурне.","Тихіше, {addr}. Ніч усе чує.","~1 Вночі добрі люди сплять. А ви?","~2 Темно, {addr}. Дивись під ноги своїй людині.","~3 Обережно в темряві, {addr}."],"хб_приятель":["{addr}, ти мені ще мед винен!","Знову ти мимо, {addr}. Скоро впізнаватиму тебе по тупоту.","{addr}! Увечері — біля вогню, не забудь!","Біжи, {addr}, біжи. Розповіси потім.","~1 Знову ти. Ну, біжи-біжи.","~2 Не загубися, {addr}!","~3 Тримайся, {addr}! Ще посидимо."],"хб_чужий":["Хто це пробіг? Не знаю. Але запам'ятаю.","Ще один ворон. Дивний, як і всі чужі.","Цікаво, хто такий {raven}.","{raven}? Запишу. На всяк випадок.","~1 Чужинці. Тримайтеся подалі.","~2 Ще познайомимось, {addr}. Не зараз.","~3 Колись познайомимось, {addr}."],"хб_відповідь":["^rush Нема коли пояснювати, {addr}!","^rush Не женемо, а поспішаємо. Різниця!","^lead Біжіть, біжіть. Ми не ображаємось.","^lead І вам гарної дороги, {addr}.","^toward Біжи, {addr}. Ми своєю дорогою.","^toward Ага. Кожен своєю стежкою.","^race Ще подивимось, хто перший!","^race Ми не відстаємо. Ми даємо вам фору.","^weapon Залізо — для ворогів. Ви не вороги. Поки.","^weapon Напоготові — значить, живі.","^night Не спиться. Як і вам.","^night Ніч для того й є, щоб бігати тихо.","^pals Потім, {addr}, потім!","^pals Ага! Тримайся там!","^stranger Ми теж тебе не знаємо. Поки що.","^stranger Запам'ятаю тебе, {addr}.","^rush Ми не біжимо. Ми летимо ногами.","^rush Справи, {addr}. Мудрі справи.","^lead Не поспішайте так. Мудрість наздожене.","^lead Біжіть. Ми запам'ятаємо, хто нас штовхнув.","^toward Там нічого. Не повертайтесь.","^toward Кожен своїм шляхом, {addr}.","^race Перемога буде нашою. Як завжди.","^race Ви попереду? Ми вас просто пропустили.","^weapon Ми тільки дивимось. Поки що.","^weapon Залізо — то так, для порядку.","^night Вночі думки ясніші. А стежки темніші.","^night Ніч наша, {addr}. І ваша теж, мабуть.","^pals Бачу, бачу. Потім!","^pals Не зупиняюсь, {addr}! Ввечері!","^stranger Познайомимось, коли зупинимось.","^stranger Хто ми — дізнаєшся. Колись.","^nick Ім'я — дрібниця. Головне — справи.","^nick Дякую. Скальди перебільшують. Трохи.","^nick Заслужив, {addr}. Чесно заслужив.","^kin Колего, бачу тебе. І все навколо.","^kin Мудрість на двох — уже рада.","^kin Запишу тебе, колего. Як рівного.","^alone Повернеться. Він завжди повертається.","^alone Другий у справах. Важливих.","^alone Один, зате розумний.","^hurt Біжимо до вогню. Не затримуй.","^hurt Живі. Поки що.","^hurt Зілля є. Дякую, {addr}.","^wet Мокрі, зате живі.","^wet Сам ти мокрий, {addr}.","^wet Дощ змиває сліди. Нам це на руку."],"хб_знаменитий":["О, сам {raven} пробіг! Про тебе вже скальди співають.","{raven}! Ім'я, яке знають навіть у Хельгеймі.","Не щодня повз мене пробігає {raven}.","Дорогу знаменитості!","~1 Ім'я гучне. Подивимось, чи заслужене.","~2 Чув про тебе, {addr}. Гарне прізвисько.","~3 Пишаюся знайомством, {addr}."],"хб_колега":["Колего! Теж усе бачиш?","Ще один Хугін. Світ тісний для мудрих.","Колего, не женися — думки розгубиш.","Два Хугіни на одній стежці. Одін би посміхнувся.","~1 Ще один мудрагель. Конкуренція.","~2 Колего, запиши й мене у свій літопис.","~3 Радий бачити розумну пику, колего."],"хб_сам":["{addr}, а де твій другий? Знову втік?","Сам на плечі, {addr}? Сумно, мабуть.","Половина пари пробігла. Де друга?","Один ворон на плечі — і вже тихо. Заздрю.","~1 Один ворон — півворона.","~2 Скучаєш за другим, {addr}?","~3 Тримайся, {addr}. Повернеться."],"хб_поранений":["{addr}, твоя людина вся в крові. Біжіть до вогню!","{friend} ледь жив{>ий|а}. Ви звідки, з боса?","Не біжіть так, {addr}. Ще впаде.","Кров на стежці. Ваша, {addr}?","~1 Добігаєтесь, {addr}. До могили.","~2 Тримайтеся, {addr}. Зілля є?","~3 Бережи {>його|її}, {addr}!"],"хб_мокрі":["Мокрі, як щури, біжите?","{addr}, з тебе вода тече. Під дах!","Дощ, а ви бігаєте. Мудро. Ні.","Куди так поспішаєте? Сухіше там не буде.","~1 Мокрий ворон — сумне видовище.","~2 Сушіться, {addr}, бо застудитесь.","~3 Тримайся, {addr}, скоро розпогодиться."],"жт_набіг":["земля тремтить. Це не до добра.","чуєш? Хтось іде по твою хату.","на обрії рух. Багато руху. Готуй зброю.","до нас гості. Незвані. З кийками.","напад! Стань біля стіни, а не перед нею.","вони прийшли по твоє добро. Покажи, що воно кусається.","зграя суне просто сюди. Я рахую, ти б'єш.","~1 набіг. А ти, звісно, без шолома.","~1 до нас ломляться. Сподіваюся, стіни ти ставиш краще, ніж живеш.","~2 набіг. Нічого, ми таке вже бачили.","~2 тримай двері, а я триматиму небо.","~3 набіг, друже. Стань поруч — і нехай спробують.","~3 хай лізуть. Цей дім ми не віддамо."],"жт_набіг_кінець":["Я пильную згори.","Бережи вогонь.","Не геройствуй без потреби.","Порахуємося, коли вщухне.","~1 І не кажи потім, що я не попереджав.","~3 Я з тобою."],"жт_город":["садиш? От і добре. Земля любить терплячих.","грядка рівна. Майже.","з цього колись буде їжа. Якщо кабани не знайдуть першими.","сіяти — теж подвиг. Тихий.","поливати не треба, дощ допоможе. Боги про це подбали.","зерно в землі — вже наполовину хліб.","оце по-господарськи.","~1 ти садиш, як солдат на параді. Рівно і без душі.","~1 сподіваюся, хоч рослини в тебе виростуть розумнішими.","~2 город — це добре. Мені подобається, коли ти не вбиваєш.","~2 грядки, рядки… Майже затишно.","~3 посади й мені щось. Ягідку. Одну.","~3 з тебе вийде {добрий господар|добра господиня}. Колись."],"жт_город_кінець":["Тільки огорожу не забудь.","Ворони, до речі, не крадуть. Майже.","Дочекаймося врожаю.","Земля пам'ятає турботу.","~1 Подивимося, що з того виросте.","~3 Гарно в тебе виходить."],"жт_торг":["{trader} знову посміхається. Тримай гаманець міцніше.","торгуватися — це мистецтво. Ти поки що вчишся.","у {trader_gen} все блищить. Ціни — теж.","купуй те, що рятує життя, а не те, що блищить.","з {trader_ins} треба тримати вухо гостро.","монети пішли, речі прийшли. Чесний обмін. Майже.","торгівля — той самий бій, тільки замість крові — срібло.","~1 тебе знову обдурили, а ти й не {помітив|помітила}.","~1 я б на твоєму місці той непотріб не купував.","~2 гарна угода. Ну, принаймні не жахлива.","~2 поки ти торгуєшся, я рахую. Ти переплачуєш.","~3 купи собі щось гарне. Ти заслуговуєш.","~3 торгуєшся, як справжній купець. Я пишаюся."],"жт_торг_кінець":["Золото любить тишу.","Рахуй решту.","Наступного разу збий ціну.","~1 Хоч решту не загуби.","~3 Гарний день для торгівлі."],"жт_їзда":["покаталися {mount_on}. Гарно ж, правда?","{mount_on} ти виглядаєш майже як справжній вершник.","оце прогулянка {mount_on}! Я ледве встигав.","{mount} везе тебе краще, ніж ти ходиш.","з {mount_ins} ти поводишся лагідніше, ніж зі мною.","верхи — і світ ближчий, і ноги цілі.","гарна поїздка. Я летів поруч і заздрив. Трохи.","~1 {mount_on} ти сидиш, як мішок з брюквою.","~1 {mount} тебе терпить. Цікаво, скільки ще.","~2 добре покаталися. Повторимо?","~2 {mount_on} навіть ти маєш шляхетний вигляд.","~3 люблю такі прогулянки. Ти, я і вітер.","~3 подякуй своєму скакунові від мене."],"жт_їзда_кінець":["Не забудь погодувати свого скакуна.","Їзда — теж мистецтво.","Тримайся міцніше.","~1 Тільки не падай, будь ласка. Я не підніму.","~3 Гарний був день."],"жт_блок":["оце парирування! Чисто, як по нотах.","ти {зловив|зловила} удар щитом у саму мить. Гарно.","блок вчасно — і ворог сам себе розбив.","ворог ще не второпав, що сталося.","так тримають удар справжні воїни.","щит — не прикраса. Ти це нарешті {зрозумів|зрозуміла}.","мить у мить. Одін би кивнув.","~1 ого, ти вмієш щось робити вчасно. Хто б подумав.","~1 раз на сто ударів і ти щось робиш як слід. Сьогодні той раз.","~2 чисте парирування. Ти ростеш.","~2 оце реакція! Майже як у ворона.","~3 я бачив. Це було прекрасно.","~3 з таким щитом за тобою можна й у вогонь."],"жт_блок_кінець":["Тепер бий!","Не зупиняйся.","Так і далі.","~1 Не звикай до похвал.","~3 Я пишаюся."],"жт_ухил":["ти ухили{вся|лася} в останню мить. Гарно.","удар пройшов крізь повітря. Там, де ти щойно {був|була}.","перекат — і ворог б'є порожнечу.","спритно! Як вуж між каменями.","оце ти {викрутився|викрутилася}.","хто не влучив — той не вбив. Простий закон.","на мить ти {став|стала} тінню.","~1 о, вперше ти падаєш навмисно.","~1 котишся непогано. Як колода з гори.","~2 спритно. Мені аж сподобалося.","~2 так і треба: не стояти там, де б'ють.","~3 не лякай мене так. Але гарно.","~3 крутишся, як ворон у бурю. Моя школа."],"жт_ухил_кінець":["Тепер у відповідь.","Тримай дистанцію.","Ще раз — і він видихнеться.","~1 Тільки не в прірву.","~3 Пильнуй себе."],"жт_лук":["стріла за стрілою. Ти сьогодні влучн{ий|а}.","лук у руках — і ворог падає, не дійшовши.","оце постріл! Я бачив, як вона летіла.","зблизька — сокира, здалеку — стріла. Мудро.","рахую стріли у ворогах. Багато.","тятива співає. Гарна пісня.","влучаєш краще, ніж говориш.","~1 одна з трьох у ціль. Для тебе це рекорд.","~1 обережно, я теж у повітрі. Не сплутай мене з куріпкою.","~2 гарно стріляєш. Я сам би краще не зробив. Хіба дзьобом.","~2 так і тримай: подалі від їхніх зубів.","~3 твоє око — як у мене. Ну, майже.","~3 стріли ти пускаєш, як Улль. Гарно."],"жт_лук_кінець":["Збери стріли потім.","Цілься в око.","Не підпускай близько.","~1 І не в мене, будь ласка.","~3 Гарне полювання."],"жт_чари":["палиця в руках — і світ слухається. Аж моторошно.","чари… Одін би оцінив, він і сам такий.","пахне грозою й паленим пір'ям. Не моїм, сподіваюся.","магія — то сила. І ціна. Пам'ятай про ціну.","оце сяйво! Вороги не знали, що їх спіткало.","ейтр тече, вороги падають. Гарна арифметика.","ти чаклуєш, а я тримаюся подалі.","~1 не підпали мені хвіст, будь ласка. Він у мене один.","~1 дивно бачити розумну річ у твоїх руках.","~2 гарно чаклуєш. Тільки не захоплюйся.","~2 з такими чарами й щит не потрібен. Але візьми.","~3 у тобі є іскра. Я це завжди знав.","~3 чаклуй, друже. Я прикрию небо."],"жт_чари_кінець":["Бережи ейтр.","Обережно з вогнем.","Сила — то відповідальність.","~1 І не підпали ліс.","~3 Красиво."],"жт_піч":["руда в піч — завтра буде метал. Терпіння.","плавильня гуде, як лігво дракона.","вугілля не шкодуй, піч жадібна.","з каміння — залізо. Справжнє чаклунство гномів.","жар такий, що в мене пір'я завивається.","метал тече — значить, будуть нові обладунки.","кожен злиток — крок до кращого меча.","~1 сподіваюся, там руда, а не звичайне каміння.","~1 добре, що металу не потрібен розум. Тільки вогонь.","~2 піч працює, ти працюєш. Гарний ранок.","~2 з цього вийде щось гостре. Люблю гостре.","~3 викуєш мені щось? Маленьке. Кільце на лапу.","~3 руки в сажі, а очі світяться. Гарно."],"жт_піч_кінець":["Підкинь вугілля.","Не стій близько до жару.","Чекаймо злитків.","~1 І не обпечися.","~3 Гарна робота."],"жт_бочка":["бочка повна. Тепер найважче: чекати.","медовуха вариться. Боги вже облизуються.","кажуть, у бочці мудрість дозріває. Перевіримо.","без поспіху: добрий мед не любить нетерплячих.","бочку під дах, бо дощ зіпсує всю роботу.","з цього вийде або ліки, або свято. Або все разом.","пахне медом і обіцянками.","~1 тільки не пий усе одразу.","~1 сподіваюся, рецепт ти не з голови {вигадав|вигадала}.","~2 гарна справа. Медовуха лікує і тіло, і настрій.","~2 поки вариться, можна й посидіти біля вогню.","~3 наллєш мені краплю? Одну. Для науки.","~3 добре, коли є що відкоркувати разом."],"жт_бочка_кінець":["Терпіння.","Тільки під дахом.","Скоро скуштуємо.","~1 І не зазирай туди щогодини.","~3 Гарно пахне."],"жт_лагодження":["полагоджено. Тепер воно протримається довше за тебе.","ціле спорядження — пів перемоги.","добре, що полагоди{в|ла}. Тріснутий щит — то запрошення для сокири.","майстер похитав би головою, але згодиться.","лагодити — нудно. Помирати — ще нудніше.","блищить, як нове. Ну, майже.","мудро: краще стукати молотом тут, ніж зубами там.","~1 нарешті! Я вже думав, ти голяка воюватимеш.","~1 дивно, що ти взагалі знаєш, де ковадло.","~2 гарно. Тепер можна знову в бій.","~2 дбайлива рука. Мені подобається.","~3 дбаєш про спорядження — значить, дбаєш про себе. Добре.","~3 тепер я спокійніший за тебе."],"жт_лагодження_кінець":["Тепер у дорогу.","Бережи його.","Ціле — значить, живе.","~1 Подивимося, скільки протримається.","~3 Я радий."],"жт_зілля":["ковток зілля — і світ знову не такий страшний.","медовуха вчасно — не слабкість, а мудрість.","п'єш? Значить, щось велике попереду.","зілля діє. Я бачу, як у тебе світлішає погляд.","розумно. Краще випити зараз, ніж шкодувати потім.","пахне медом і травами. І трохи — страхом.","твоє здоров'я. Буквально.","~1 тільки не звикай. Зілля — не сніданок.","~1 знову п'єш? Я вже рахувати втомився.","~2 добре зілля. Гарний вибір.","~2 випий і за мене. Подумки.","~3 бережи себе. Я хочу, щоб ти жи{в|ла} довго.","~3 твоє здоров'я, друже."],"жт_зілля_кінець":["Тепер — уперед.","Не забувай про запас.","Діє швидко.","~1 Тільки не все одразу.","~3 Будьмо."],"жт_стілець":["присядь, присядь. Навіть у героїв болять ноги.","гарний стілець. Майже трон.","сидиш, як ярл на бенкеті.","посидимо трохи. Світ почекає.","у ногах правди нема. Її взагалі мало де є.","так, перепочинь. Я посторожу.","сидіти — теж мистецтво. Ти ним володієш.","~1 сидиш? Нарешті ти робиш те, що вмієш найкраще.","~1 сідай, сідай. Тільки не засни.","~2 добре сидимо.","~2 оце я розумію — відпочинок.","~3 люблю такі хвилини. Тихо, і ти поруч.","~3 сиди скільки хочеш. Я нікуди не поспішаю."],"жт_стілець_кінець":["Тиша.","Відпочинь.","Добре тут.","~1 Тільки недовго.","~3 Гарно."],"жт_затишок":["тепло, сухо, дах над головою. Що ще треба?","вдома добре. Навіть стіни якісь лагідні.","вогонь тріщить, як старий скальд. Затишно.","тут можна й видихнути.","дім — то місце, куди хочеться повертатися. І ти його {збудував|збудувала}.","пахне димом і хлібом. Я б тут жив.","найкраща фортеця — та, де тепло.","~1 затишно. Аж підозріло. Сподіваюся, це не пожежа.","~1 як на твою хату, то навіть непогано. Я здивований.","~2 добре в тебе тут. Справді.","~2 тепло. Я аж пір'я розпушив.","~3 наш дім. Звучить гарно, правда?","~3 з тобою — як удома. А вдома — як з тобою."],"жт_затишок_кінець":["Відпочинь як слід.","Підкинь дровець.","Тиша.","~1 Тільки не розлінися.","~3 Добре нам."],"жт_сонце":["небо чисте, сонце гріє. Рідкісний подарунок.","яка днина! Видно аж до краю світу.","сонце на пір'ї — найкраще відчуття.","у такий день навіть тролі, мабуть, усміхаються.","ясно і тихо. Чудовий час для мандрів.","Сунна сьогодні щедра.","небо таке синє, що хочеться злетіти вище.","~1 гарна днина. Шкода, що ти її витрачаєш на дурниці.","~1 сонце світить і на розумних, і на тебе. Справедливість.","~2 добра погода. Ходімо кудись.","~2 у таку днину й помирати не хочеться. Тож не помирай.","~3 сонце, вітер і ти. Гарний день.","~3 запам'ятай цю днину. Такі нечасто бувають."],"жт_сонце_кінець":["Насолоджуйся.","Ходімо далі.","Поки не набігли хмари.","~1 Не згори на сонці.","~3 Гарно."],"жт_трофей":["трофей! Тепер буде що повісити на стіну.","голова ворога — найкращий доказ.","ще один трофей. Твоя слава росте.","збирай, збирай. Колись покажеш онукам.","кожен трофей — то історія. Цю я бачив.","не викидай. Такі речі мають вагу.","доказ перемоги. Скальди люблять докази.","~1 трофей. А я думав, ти збираєш тільки синці.","~1 голова в торбі. Сподіваюся, не твоя.","~2 гарний трофей. Заслужений.","~2 ще трохи — і матимеш цілу залу слави.","~3 я пам'ятаю цей бій. Ти {був неймовірний|була неймовірна}.","~3 повісимо його на почесне місце."],"жт_трофей_кінець":["Додому його.","Слава тобі.","Ще один до колекції.","~1 Не загуби.","~3 Заслужено."],"жт_стіна":["трофей на стіні. Тепер усі бачать, хто тут живе.","гарно висить. Гості здригатимуться.","стіна слави росте.","повісити трофей — сказати світові: я перемагаю.","тепер він дивиться на тебе. Мертвими очима, але з повагою.","гарне місце ти {вибрав|вибрала}.","у залі стало страшніше. І гарніше.","~1 трохи криво висить. Як і все в тебе.","~1 колекція росте. Розум — ні.","~2 добре висить. Я ще перевірю, чи можна на ньому сидіти.","~2 оце прикраса. Не те що квіточки.","~3 я пишаюся кожним із них. І тобою.","~3 наша зала. Наші перемоги."],"жт_стіна_кінець":["Нехай висить.","Слава.","Тепер — по новий.","~1 Пил витирай хоч іноді.","~3 Гарно."],"жт_візок":["тягнеш візок, як справжній кінь. Шляхетна справа.","візок рипить, дорога довга. Але дійдемо.","з візком і руда не важка. Майже.","обережно на схилах: у візка своя думка.","добре придумано: торба на колесах.","колеса крутяться, ти пихтиш. Гарний ритм.","везеш, як купець на ярмарок.","~1 ти і візок — дві тяглові сили. Одна з них розумніша.","~1 не перекинь, бо я не збиратиму.","~2 гарно тягнеш. Я б допоміг, але крила.","~2 з таким вантажем і додому веселіше.","~3 тягни, друже. Я дорогу видивлюся.","~3 разом довеземо. Ти — колеса, я — очі."],"жт_візок_кінець":["Обережно на схилі.","Ще трохи.","Не загуби колесо.","~1 Тільки в болото не заїдь.","~3 Майже вдома."],"ст_boss":["{boss} лежить, а босів на твоєму рахунку вже {bosses_all}. Одін задоволений."],"вл_boss":["Кра! {name}, це було люто. Навіть я на мить забув, що це ти."],"цт_death_many":["смерть {times} за кілька хвилин. Валькірії вже знають тебе на ім'я.","знову ти? Гель скоро видасть тобі постійну перепустку.","стільки смертей за раз — це вже не невдача, це стиль."],"ст_death_many":["{deaths_all} за все життя, і кілька з них — прямо зараз. Рекорд, який краще не повторювати."],"ст_death_creature":["ти {поліг|полягла} від {killer_gen}. А на твоєму рахунку {killer_genpl} вже {killer_kills}. Мені соромно перед Одіном.","це вже {deaths_all} за все життя. Валькірії тобі знижку дають?","від ворогів ти гинеш уже {cause_times}. Може, щит візьмеш?"],"цт_death_fall":["земля тверда, правда ж? Крила — не твоє.","гарний політ. Приземлення — на трієчку."],"ст_death_fall":["на смерть ти падаєш уже {cause_times}. Може, сходи збудуєш?"],"цт_death_drown":["буль-буль. Плавати вчитимемося, чи знову по дну?","вода мокра і глибока. Запиши собі."],"ст_death_drown":["тонеш уже {cause_times}. Риби тебе знають в обличчя."],"цт_death_fire":["пахне шашликом. Твоїм.","ти {горів|горіла} так яскраво, що я бачив з Асгарду."],"ст_death_fire":["гориш уже {cause_times}. Ти що, дрова?"],"цт_death_poison":["як шлунок? Отрута — не приправа."],"ст_death_poison":["отрута дістала тебе вже {cause_times}. Перестань лизати все підряд."],"цт_death_cold":["бурулька з тебе гарна. Воїн — не дуже."],"ст_death_cold":["замерзаєш на смерть уже {cause_times}. Шуба — не сором."],"цт_death_tree":["дерево перемогло. Лісоруб року, без сумніву."],"ст_death_tree":["дерева вбивають тебе вже {cause_times}. Ліс пам'ятає кожну сокиру."],"цт_death":["ох, бідолахо. Вставай, ще не кінець.","смерть тобі личить. Але {живим ти кращий|живою ти краща}."],"ст_death":["свій надгробок ти відкриваєш уже {tombs_times}. Звичка, га?","це вже {deaths_all}. Я веду рахунок, не хвилюйся."],"ст_near_death":["твій рекорд без смерті — {streak_max}. Сьогодні мало не почалося все спочатку."],"ст_level":["ворогів на рахунку вже {kills_all}. От і рівень підріс."],"ст_kill_many":["{top_genpl} на твоєму рахунку вже {top_kills}. Вони про тебе страшилки розповідають.","ворогів за все життя — {kills_all}. Воронам є що їсти, дякую."],"ст_fall":["у повітрі вже {air_km} за все життя. А приземлення досі кульгає."],"ст_build":["деталей на твоєму рахунку вже {built_all}. Цілий Асгард відбудуєш.","у базі вже {base_hours} твого життя. Домосід, хоч і вікінг."],"ст_fish":["риб на твоєму рахунку вже {fish_all}. А з гачка втекло ще {fish_lost}.","риб спіймано вже {fish_all}. Рибалка року, без жартів."],"ст_hungry":["страв з'їдено вже {food_all}, а пузо все одно бурчить."],"ст_kill":["{top_genpl} у тебе вже {top_kills}. Ще трохи — і вимруть."],"ст_sail":["морем уже {sail_km}. Справжній ярл хвиль."],"ст_chop":["дерев повалено вже {trees_all}. Ліс тебе ненавидить."],"ст_mine":["каменюк розтрощено вже {mines_all}. Гноми заздрять."],"ст_portal":["крізь портали вже {portals_times}. Тебе ще не розібрало на шматки?"],"ст_cook":["страв з'їдено вже {food_all}. Кухар і їдець в одній особі."],"ст_sleep":["ночей проспано вже {sleep_all}. Соня з досвідом."],"ст_pick":["ягід зібрано вже {berries_all}. Ведмідь би позаздрив."],"ст_travel":["за всі мандри вже {km_all}. Ноги з заліза?"],"цт_night":["ніч надворі. Розумні вже біля вогню. А ти?"],"вл_weather_storm":["Тор гримить, а ти як громовідвід стоїш."],"ст_idle":["стрибків на рахунку вже {jumps_all}. Ти воїн чи коник?"],"вл_light":["Я привів світляка, {name}. Не лови його, він кусається.","Світло є. Тепер жодних відмовок, {name}.","Одін бачить усе. А тепер і ти трохи бачиш.","Мій маленький друг посвітить тобі, {name}. Будь із ним {чемним|чемною}."],"вл_lightstep":["Дихай рівно, {name}, я підкажу ритм. Ноги втомлюватимуться менше.","Легше, {name}. Біжи моїм кроком — і сил вистачить надовго.","Вдих — на два кроки, видих — на два. Так, {name}, і подих не зіб'єш.","Бачу стежку легшу, {name}. Біжи нею — і сили повертатимуться швидше.","Не поспішай задихатися, {name}. Я рахую кроки за тебе."],"вл_fed":["Дякую, {name}. Смачно, і головне — від тебе.","О, смачно. Хоча є одна річ, яку я люблю більше. Здогадаєшся?","Ням. {name}, з тобою мандрувати дедалі приємніше.","Ти годуєш ворона Одіна, {name}. Він про це дізнається. Від мене.","Ще трохи — і я почну тобі довіряти. Жартую. Вже довіряю."],"вл_awake":["Я прокинувся, {name}. Ейктюр смачний. Тепер я твій.","Що це... тепло? А, це ти, {name}. Я з тобою."],"вл_sh_here":["Сиджу на твоєму плечі {biome_here_in} і пильную. Хтось же мусить, {name}.","Звідси, з плеча, {biome_here_in} все як на долоні, {name}. Навіть твої помилки — наперед."],"вл_sh_idle":["Тихо. Я встиг почистити пір'я, обдумати три саги й зневіритися в тобі, {name}.","Ти не {забув|забула}, що я тут, {name}? Я тут."],"вл_sh_kill":["Я все бачив з плеча, {name}. Чисто. Майже не соромно.","Одним менше, {name}. Я тримався міцно — з тобою інакше не можна."],"вл_sh_kill_many":["Скільки крові, {name}... Пір'я в бризках, а сторінок у літописі все менше."],"вл_sh_near_death":["Я вчепився в тебе з усіх сил, {name}. Не через тебе — падати неприємно."],"вл_sh_boss":["Ми це зробили, {name}! Тобто ти, а я дивився."],"вл_sh_sail":["Вітер у пір'я, {name}. Гарно. Якби ще стерновий знав, куди пливе."],"вл_see_enemy":["Обережно, {name}: {seen_enemy}. Ворогів довкола — {seen_count}.","Згори видно: {seen_enemy} зовсім близько, {name}.","Ворогів поруч — {seen_count}, {name}. Найближчий — {seen_enemy}."],"вл_see_hurt":["Кров на тобі, {name}. Може, час відступити?"],"вл_leap":["Стрибни, {name}, і подивишся на світ моїми очима.","Стрибай, {name}. Земля нікуди не дінеться, обіцяю."],"вл_shadow":["Тихіше, {name}. Заходь зі спини, як справжній вікінг... ну, майже.","Ніхто тебе не бачить, {name}. Користуйся, поки я тримаю.","Зникни, {name}. А тоді — одним ударом.","Тінь твоя, {name}. Не змарнуй її на кущі."],"вл_dome":["~2 {name}, стань під крило. Хай чекають.","~2 Під моїм крилом тихо, {name}. А ті хай нюхають край.","~2 {name}, дихай. Вони кружлятимуть, але сюди не ввійдуть.","~23 Перепочинь, {name}. Тільки пам'ятай: крила не вічні.","~2 {name}, тут не б'ються. Ні ти, ні вони.","~2 Перечекай, {name}. Коли купол спаде — будь {готовий|готова}.","~23 {name}, я накрив тебе рунами. Подумай, що робитимеш далі.","~2 Бач, {name}, як ходять колом? Чекають. Хай чекають.","~1 Гаразд, {name}, стань під крило. Тільки не звикай.","~1 Тримаю. Але недовго і без подяк, {name}.","~1 {name}, ховайся вже. Дивитися, як тебе ганяють, соромно навіть мені.","~1 Ось тобі купол. І не кажи потім, що Хугін нічого не робить.","~1 Під крило, {name}. Тільки не думай, що це дружба.","~3 Іди сюди, {name}, під крило. Я тебе прикрию.","~3 Відпочинь, {name}. Поки я тут, тебе ніхто не зачепить.","~3 {name}, я поруч, просто над тобою. Збери думки.","~3 Тихо, {name}. Хай вони чекають, а ти перепочинь.","~3 Для тебе — завжди, {name}. Стань під крило."],"вл_dome_back":["~1 Нарешті. Крила затерпли, {name}.","~1 Склав крила. Наступного разу {сам|сама} викручуйся, {name}.","~1 {name}, повернувся. Не дякуй, однаково не вмієш.","~2 Склав крила. Тепер знову разом, {name}.","~2 Повернувся, {name}. Що далі?","~2 Купол знято, {name}. Будь напоготові.","~3 Я знову з тобою, {name}. Ходімо.","~3 Склав крила, {name}. Треба буде — розкрию ще хоч сто разів.","~3 Повернувся, {name}. Добре, що ти {цілий|ціла}."],"вл_scout":["Полетів дивитися, {name}. Нікуди не йди без мене.","Зараз повернуся з новинами, {name}. Дивись на мапу.","Хто ховається в кущах, той мене не обдурить. Лечу.","Розвідка, {name}! Одін би пишався."],"бм_левади":["на Левадах тихо. Майже підозріло тихо.","олені пасуться, кабанчики рохкають. Справжня ідилія.","Левади — колиска кожного вікінга. Тут ти вчи{вся|лася} тримати сокиру.","тут навіть небо лагідніше.","на Левадах пахне травою й медом.","Левади пам'ятають твої перші кроки. І перші падіння.","тут найгірше, що може статися, — кабан. Ну, і ти сам{|а} собі.","~1 на Левадах ти почуваєшся героєм. Бо тут нікого страшнішого за курку.","~1 навіть тут ти примудряєшся вскочити в халепу.","~2 Левади. Добре повернутися туди, де все почалося.","~2 тут можна видихнути. Ненадовго.","~3 Левади — наш дім. Звідси ми й почали.","~3 люблю ці луки. І тебе на них."],"бм_левади_порада":["Насолоджуйся спокоєм.","Збери ягід, поки є.","Тут добре відпочити перед далекою дорогою.","~1 Тільки не розслабляйся надто.","~3 Посидьмо тут трохи."],"бм_чорнолісся":["у Чорноліссі кожна тінь може виявитися сіролюдом.","дерева тут такі густі, що сонце губиться.","тут пахне мохом, смолою і небезпекою.","чуєш гупання? Це троль. Або твоє серце.","Чорнолісся не любить чужих. А ти тут чуж{ий|а}.","у Чорноліссі є мідь і олово. І ті, хто їх стереже.","тут гриби світяться, а очі в кущах — теж.","~1 у Чорноліссі ти шумиш, як цілий загін.","~1 тут тебе з'їдять швидше, ніж ти скажеш «троль».","~2 Чорнолісся похмуре, але звикаєш.","~2 тримайся стежок, і все буде добре.","~3 тут темно, але я бачу за двох.","~3 з тобою навіть Чорнолісся не таке чорне."],"бм_чорнолісся_порада":["Тримай смолоскип напоготові.","Дивись угору: тролі люблять кидатися камінням.","Не сходь зі стежки.","~1 І не дивуйся, коли нападуть.","~3 Я пильную кущі."],"бм_болото":["Болото. Смердить смертю й мокрим деревом.","тут кожна калюжа може виявитися глибшою, ніж здається.","на Болоті драуґри не сплять. Ніколи.","п'явки тут голодні. Як я, тільки гидкіші.","туман над водою, а в тумані — хтось.","тут залізо ховається в затоплених склепах.","Болото тягне вниз. І ноги, і настрій.","~1 ти тут у своїй стихії: брудн{ий|а} й загублен{ий|а}.","~1 Болото — ідеальне місце, щоб загинути безглуздо.","~2 бридко тут, але ми впораємося.","~2 обережно, тут кожен крок — пастка.","~3 тримайся мене, тут легко заблукати.","~3 скоро виберемося. Обіцяю."],"бм_болото_порада":["Візьми зілля проти отрути.","Не лізь у глибоку воду.","Тримайся сухих острівців.","~1 І не дихай глибоко.","~3 Я пильную."],"бм_гори":["у Горах вітер злий, як голодний вовк.","сніг, скелі й тиша. Красиво й смертельно.","тут вовки ходять зграями. І виють про тебе.","у Горах холод пробирає до кісток.","з такої висоти видно пів світу.","тут крилаті дракони кружляють над вершинами.","срібло ховається під снігом. І під кістками.","~1 у Горах ти схож{ий|а} на замерзлу курку.","~1 тут кожен невдалий крок — останній. А ти ж любиш невдалі кроки.","~2 холодно, але гарно. Чесно.","~2 вище — тільки небо. Мені подобається.","~3 тут холодно, але ми разом. Не мерзни.","~3 гори нас не злякають."],"бм_гори_порада":["Вдягни щось тепле.","Тримайся подалі від урвищ.","Вогнище тут — порятунок.","~1 Зілля від холоду, сподіваюся, не забу{в|ла}?","~3 Гріймося разом."],"бм_рівнини":["Рівнини. Видно далеко — і тебе теж.","тут сонце пече, а мухи кусають, як вовки.","фулінґи не люблять гостей. Особливо таких, як ти.","трава золота, а небезпека — справжня.","тут ростуть ячмінь і льон. І біда.","на Рівнинах колючі кущі й гострі списи.","тут ніде сховатися. Ні тобі, ні їм.","~1 на Рівнинах навіть мухи небезпечніші за тебе.","~1 тут ти стоїш, як мішень на ярмарку.","~2 гарний простір. Тільки уважно.","~2 вітер у траві шепоче. Слухай.","~3 тут гарно, коли ніхто не нападає. Посиджу з тобою.","~3 Рівнини безмежні. Як і наша дорога."],"бм_рівнини_порада":["Стережися мух.","Не підходь до таборів фулінґів сам{|а}.","Тримай щит під рукою.","~1 І не стій на відкритому.","~3 Я дивлюся згори."],"бм_імла":["в Імлистих землях туман ковтає все.","тут павуки більші за мене. Значно більші.","щось цокає в темряві. Не хочу знати що.","туман тут густий, як каша, і такий самий холодний.","тут руїни давніх, що знали більше за нас.","в Імлистих землях кожна скеля — загадка.","тут світло — найдорожчий скарб.","~1 тут ти бачиш ще менше, ніж зазвичай. Як таке можливо?","~1 у такому тумані тебе з'їдять, і я навіть не побачу.","~2 моторошно тут. Тримаймося разом.","~2 тут треба ступати тихо. Дуже тихо.","~3 не бійся туману. Я поруч.","~3 навіть тут ми знайдемо дорогу."],"бм_імла_порада":["Тримай світло ближче.","Не відставай.","Слухай, а не тільки дивись.","~1 І не кричи, бо почують.","~3 Я не відлечу."],"бм_попіл":["у Попелистих землях горить навіть повітря.","тут земля тріщить, як вугілля в печі.","попіл сиплеться з неба, як чорний сніг.","тут кожен камінь хоче тебе спалити.","лава тече ріками. Червоними, злими ріками.","тут колись було царство. Тепер — попіл.","пір'я в мене починає тліти.","~1 тут ти швидко дізнаєшся, як пахне смажений вікінг.","~1 Попелисті землі — найкраще місце, щоб нарешті згоріти.","~2 гаряче тут. Не затримуймося.","~2 стережися вогню під ногами.","~3 тримайся, друже. Ми вийдемо звідси.","~3 навіть у вогні я з тобою."],"бм_попіл_порада":["Пий зілля проти вогню.","Не ступай у лаву.","Шукай тінь і воду.","~1 І не дивуйся, коли загориться.","~3 Тримайся ближче."],"бм_північ":["на Далекій півночі холодно навіть думкам.","тут лід тріщить під ногами. Чуєш?","Далека північ — край світу. Далі тільки біла тиша.","тут сніг падає, як забуття.","на Далекій півночі навіть зорі мерзнуть.","тут ніхто не живе. Принаймні ніхто, з ким хочеться зустрітися.","холод тут — як живий. І злий.","~1 тут ти швидко станеш бурулькою. Гарною, але бурулькою.","~1 Далека північ — не для таких, як ти. Але ж ти не слухаєш.","~2 холодно, але дивно гарно.","~2 тримаймося вогню.","~3 навіть тут, на краю світу, ти не сам{|а}.","~3 тримайся ближче. Гріймося разом."],"бм_північ_порада":["Вогонь — найголовніше.","Не стій на льоду довго.","Вдягнися тепліше.","~1 Хоча ти все одно замерзнеш.","~3 Я з тобою."],"бм_океан":["в Океані вода до самого краю світу.","тут хвилі вищі за щоглу. Тримайся.","серпенти чують кожне весло.","Океан мовчить, але все пам'ятає.","сіль на пір'ї, вітер у вітрилах.","під нами така глибина, що аж моторошно.","земля далеко. Дуже далеко.","~1 в Океані тобі нема куди тікати. І вміння теж нема.","~1 сподіваюся, ти пам'ятаєш, де берег. Бо я — ні.","~2 гарне море сьогодні. Майже спокійне.","~2 вітер наш. Пливімо.","~3 Океан великий, а ми разом. Не страшно.","~3 люблю море з тобою."],"бм_океан_порада":["Тримай курс.","Стережися серпентів.","Не звішуйся з борту.","~1 І не загуби весло.","~3 Берег скоро."],"афк":["на тобі вже мох росте. Рухайся.","агов! Ти ще тут?","тричі облетів довкола. Ти й не ворухну{вся|лася}.","тук-тук. Є хто вдома?","статуя? Схож{ий|а}. Тільки статуї гарніші.","світ чекає. Ти стоїш. Як завжди.","я вже говорю сам із собою. З тобою нудніше.","~1 ти стоїш, як пень. Пні хоч гриби дають.","~1 спиш стоячи? Ну ти й ледащо.","~2 ти там ж{ивий|ива}? Подай знак.","~2 думаєш? Не перенапружся.","~3 почекаю. Але не вічно.","~3 відпочивай. Я посторожу. Сам, як завжди."],"афк_кінець":["Повертайся.","Ти там засну{в|ла}?","Я тут, якщо що.","~1 Ворушися вже.","~3 Чекаю. Поки що."],"хд_набіг":["^стіна Вони лізуть на стіни, Муніне. Тримайся.","^скільки Скільки ж їх… Я перестав рахувати.","^хата Вони прийшли по наш дім.","^вогонь_н Бережи вогонь, Муніне. Без нього дім — просто стіни.","^страх_н Признаюся, Муніне: мені трохи моторошно.","^кінець_н Скоро вщухне. Набіги не вічні."],"хд_набіг_кінець":["^стіна Тільки не відлітай далеко.","^скільки Спершу вижити. Потім рахуватимемо.","^хата Тоді боронимо разом.","^вогонь_н Добре. Хоч хтось пильнує.","^страх_н Нічого. Удвох не так страшно.","^кінець_н Бережи сили. Ще знадобляться."],"хд_торг":["^ціни Бачив. Але товар добрий.","^ціни Ціни як ціни. Ти просто жадібний.","^блискуче Блищить — не значить, що корисне.","^блискуче Хочеш — заробляй. Як усі.","^торговець Бо ти на прилавок насрав минулого разу.","^торговець Не дивиться. Ти просто підозріливий.","^торг Торгуватися — мистецтво, Муніне. Не погрози.","^торг Тихо. Торгується {name}, не ти.","^гроші На корисне. Подивишся — сам подякуєш.","^гроші Монети для того й є, щоб їх віддавати.","^подарунок Кісток тут не продають.","^подарунок Купимо, як заслужиш."],"хд_їзда":["^швидко Летимо, як вітер! І навіть не махаю крилами.","^сідло Сидіти на плечі вершника — нова для мене висота.","^звір {mount} дихає так важко. Гарний звір.","^куди_р Куди {name} нас везе на такій швидкості?","^трясе Трясе. У мене всі думки перемішалися.","^пішки Як ми раніше ходили пішки? Не уявляю."],"хд_їзда_кінець":["^швидко Не звикай. Пішки теж треба.","^сідло Король, що тримається кігтями.","^звір Подякуй йому. Подумки.","^куди_р Скоро дізнаємося.","^трясе Тримаймося міцніше.","^пішки Пам'ятай про це, коли злізеш."],"хд_піч":["^жар Відсунься від печі. Не геройствуй.","^жар Тепло — то ж добре. Ти ж завжди мерзнеш.","^дим_п Душа в тебе є? Новина.","^дим_п Терпи. Метал того вартий.","^руда_п Тобі — тепло й компанія.","^руда_п Тобі — злиток подивитися.","^чекати_п Скільки треба. Метал не поспішає.","^чекати_п Сиди тихо — швидше буде.","^меч Ворони мечів не носять.","^меч Тобі — кігтеточку. Залізну.","^коваль Чесна сажа. Не сміяйся.","^коваль Зате руки при ділі."],"хд_бочка":["^бухло_ф Медовуха, Муніне. Це зілля, а не бухло.","^бухло_ф Буде. Але не тобі.","^чекати_ф Кілька днів. Терпи.","^чекати_ф Поки не дозріє. Як і ти.","^запах_ф Добре. Значить, бродить.","^запах_ф Пахне, як ти зранку.","^перший Перший — {name}. Хто варить, той і п'є.","^перший Перший — Одіну. Так годиться.","^рецепт На око. Як усе в нас.","^рецепт Рецепт є. Я пам'ятаю. Ну, майже.","^дах_ф Слушно. Вперше за день.","^дах_ф Вже під дахом. Не каркай."],"хд_лагодження":["^молоток Стук молотка — найчесніша музика.","^нове_р Як нове. Ну, майже.","^подряпина Кожна подряпина — історія. Шкода їх затирати.","^ламати Полагодили. Тепер знову підемо ламати.","^верстак Верстак гарний. {name} його доглядає.","^ціле Ціле спорядження — спокійний ворон."],"хд_лагодження_кінець":["^молоток Терпи. Спорядження важливіше.","^нове_р Значить, бережімо до першого бою.","^подряпина Літопис пам'ятає. Залізо — ні.","^ламати Коло життя вікінга.","^верстак Верстак береже нас. А ми — його.","^ціле Тоді один із нас спокійний. Досить."],"хд_зілля":["^ковток Гірке. Але діє.","^ковток Солодке. Підозріло солодке.","^більше Зілля — не для забави.","^більше За тебе? Тоді вже краще води.","^сила Відчуваю. Тепер можна й у бій.","^сила Відчуваю, що ти перебільшуєш.","^смак Як мед і трави. І трохи як ліки.","^смак Як перемога. Перемога гірка.","^запас Небагато. Варто наварити.","^запас Досить на кілька боїв.","^одін_п Одін п'є мед поезії. Нам не дадуть.","^одін_п Одін п'є все. Він же бог."],"хд_стілець":["^трон Стілець — як трон. А {name} на ньому — як ярл.","^ноги Ноги відпочивають. Видно ж, як {name} розслаби{вся|лася}.","^тиша_с Тихо, коли сидимо. Чуєш, як дерево поскрипує?","^думки_с Сидячи, краще думається.","^довго_с Довго сидітимемо, як думаєш?","^стілець Хто цей стілець змайстрував? Гарна робота."],"хд_стілець_кінець":["^трон Двір як двір. Ярл, радник і стілець.","^ноги Посидимо всі разом.","^тиша_с Тихо — то вже подарунок.","^думки_с Кожному своє.","^довго_с Тоді — недовго. Сподіваюся.","^стілець Добре, що сидиться."],"хд_затишок":["^тепло_д Тепло, Муніне. Вдома завжди тепліше.","^дах_д Над нами дах. Ніякий дощ не страшний.","^кубло Знаєш, Муніне, це вже наше гніздо.","^спокій_д Спокійно тут. Навіть ти тихіший.","^вечеря Пахне вечерею. Чуєш?","^пам'ять_д Пам'ятаєш, якою ця хата була спочатку?"],"хд_затишок_кінець":["^тепло_д Хай так. Але вдома.","^дах_д Їжа буде. Дах — уже є.","^кубло Отже, наше.","^спокій_д Накопичуй тихо.","^вечеря Почекай. Вечеря для всіх.","^пам'ять_д Тепер вона добра. Як і ми."],"хд_трофей":["^голова Вона важча за тебе.","^голова Понесе {name}. Ти — подивишся.","^смердить Твій улюблений запах — будь-який, аби з м'ясом.","^смердить Смердить. Тому й несемо додому, а не тримаємо в сумці.","^рідкість Тому його треба берегти.","^рідкість Не кожен. Тому ми й пишаємося.","^бій_т Пам'ятаю. Ти ревів голосніше.","^бій_т Пам'ятаю. Тепер тихо.","^продати Трофеї не продають. Їх вішають.","^продати Можна. Але соромно.","^колекція Достатньо, щоб гості боялися.","^колекція Не рахував. Але стіна наповнюється."],"хд_стіна":["^стіна_т Ще одна голова на стіні. Зала слави росте.","^погляд_т Він дивиться на нас мертвими очима.","^криво Висить трохи криво. Чи то мені здається?","^гості Гості побачать — злякаються.","^сісти Можна було б сісти на той трофей. Як на жердину.","^історія_т Кожен трофей — історія. Цю я розповідатиму довго."],"хд_стіна_кінець":["^стіна_т Хай росте. Місця на стінах ще досить.","^погляд_т Моторошно, але гарно.","^криво Хай так. Головне — висить.","^гості Може, ще прийдуть. Побачать — запам'ятають.","^сісти Сяду пізніше. Коли ти не бачитимеш.","^історія_т Розповім. По-своєму."],"хд_візок":["^рип Змастити б колеса.","^рип Терпи. Він везе, а не співає.","^важко_в Руду. Наше майбутнє.","^важко_в Все, що {name} не захоті{в|ла} лишити.","^колесо Не накаркай.","^колесо Не відвалиться. {name} його добре стави{в|ла}.","^дорога_в Тому й повільно.","^дорога_в Іншої дороги нема.","^кінь Не ображай. Працює ж.","^кінь Кінь би краще впорався.","^сісти_в Сідай. Тільки не бурчи.","^сісти_в Ти й так на плечі. Яка різниця?"],"хд_город":["^насіння Насіння в землі. Тепер — чекати.","^врожай Будемо з урожаєм. Якщо кабани не знайдуть.","^руки_с Руки в землі — і {name} спокійн{ий|а}. Дивно.","^ягоди_с Посадили б ще ягід. Для нас.","^дощ_с Добре б дощ пройшов. Поливати не треба.","^кріт {name} у землі, як кріт. Тільки старанніший."],"хд_город_кінець":["^насіння Чекатимемо. І пильнуватимемо.","^врожай Тоді пильнуймо разом.","^руки_с Хай буде спокій. Хоч на грядці.","^ягоди_с Попросимо. Чемно.","^дощ_с Дощ — для грядки, не для тебе.","^кріт Кроти, ворони… Головне, що грядки є."],"пл_набіг":["з плеча видно, звідки вони лізуть. Ліворуч.","сиджу на тобі й рахую ворогів. Збився.","з плеча все поле бою як на долоні.","~1 тримайся рівно, бо я злечу.","~2 з плеча бачу: стіни тримають.","~3 я на плечі, ти з сокирою. Разом відіб'ємося.","~3 не бійся, я пильную з плеча."],"пл_їзда":["з плеча вершника світ біжить швидше.","ти {mount_on}, я на тобі. Гарна піраміда.","вітер так дме, що я вчепився в плече кігтями.","~1 трясе, як у бурю. Тримайся сам{|а}, я тримаюся за тебе.","~2 з плеча вершника — найкращий вид.","~3 ми летимо. Майже як я.","~3 гарно мчимо. Не зупиняйся."],"пл_візок":["з плеча чую, як ти пихтиш.","сиджу на тобі, а ти тягнеш візок. Хтось має керувати.","візок рипить, а плече тремтить.","~1 тягни рівніше, мене трусить.","~2 з плеча видно: ще трохи — і вдома.","~3 тягни, а я з плеча підкажу дорогу.","~3 сиджу тихо, щоб тобі легше було."],"пл_стілець":["сидиш ти — сиджу і я. Гарний поділ.","з плеча того, хто сидить, світ спокійніший.","твоє плече на стільці зручніше, ніж у бою.","~1 сидиш? Тоді я трохи посплю на плечі.","~2 гарно сидимо. Удвох.","~3 сиди. Я на плечі, ти на стільці. Все як має бути.","~3 спокійно на тобі, коли ти сидиш."],"пл_затишок":["на теплому плечі в теплій хаті. Щастя.","з плеча чую, як тріщить вогонь.","вдома навіть твоє плече м'якше.","~1 вдома ти хоч не бігаєш. Плече відпочиває.","~2 добре вдома. І на тобі добре.","~3 гріюся об тебе. Не рухайся.","~3 вдома, на твоєму плечі. Що ще треба?"],"пл_торг":["з плеча видно, як торговець підморгує. Обережно.","сиджу на тобі й рахую монети. Їх меншає.","з плеча все видно: і товар, і обман.","~1 не купуй усе підряд. Я з плеча бачу твої думки.","~2 гарний торг. Я з плеча оцінив.","~3 бери, що треба. Я підкажу.","~3 з плеча торгуватися легше. Слухай мене."],"пл_піч":["з плеча жар пече ще сильніше.","сиджу на тобі біля печі. Пір'я тліє.","з плеча видно, як руда пливе.","~1 не підходь так близько, ми ж горимо.","~2 гарно гуде піч. Тепло.","~3 тримай мене подалі від жару. Дякую.","~3 з плеча дивлюся, як народжується метал."],"пл_город":["з плеча видно кожну грядку.","нахиляєшся — я сповзаю.","сиджу на тобі, а ти в землі. Ми різні.","~1 не нахиляйся так різко, я ледь не впав.","~2 з плеча грядки рівні. Майже.","~3 сади. Я з плеча посторожу від кабанів.","~3 гарно в тебе виходить. Звідси видно."],"пл_зілля":["з плеча чую, як ти ковтаєш.","пахне медом мені просто в дзьоб.","ковтну{в|ла} — і плече тепліше стало.","~1 не пий так швидко, мене хитає.","~2 з плеча видно: діє.","~3 пий на здоров'я. Я подихаю поруч.","~3 тепло від тебе. Зілля діє."],"пл_трофей":["з плеча він виглядає ще страшніше.","сиджу на тобі й дивлюся йому в мертві очі.","з плеча стіна слави — як на долоні.","~1 повісь рівніше, я ж бачу з плеча.","~2 гарно висить. Звідси видно.","~3 наш трофей. Я на плечі пишаюся.","~3 з плеча — найкращий вид на нашу славу."],"знову_вступ":["Знову те саме.","Ну от, знову.","Я вже казав. Повторю.","Здається, в нас традиція.","Не вперше, так.","~1 Для повільних повторюю.","~2 Знову, так.","~3 Знову ми за своє, друже.","І знову ми тут.","Історія повторюється.","Де я це вже бачив?","Дежавю, не інакше.","~1 Запишу ще раз, бо ти ж однаково не запам'ятаєш.","~1 Скільки можна, га?","~2 Ну, поїхали по колу.","~2 Знайома пісня.","~3 Знову, та я не скаржуся.","~3 Знову. І я знову поруч."],"зн_chop":["знову сокира. Ліс тебе вже знає в лице.","уже {again_n} кажу: досить.","ще одне. Я рахую, а ти ні.","~1 знову рубаєш криво. Пень як після бійки.","~2 дров уже на три печі. Ну-ну, рубай.","~3 сядь, віддихайся. Дерева не втечуть.","ще одне? Тут скоро буде пустир.","стук, тріск, гуп. Знову ця пісня.","рубаєш {again_n}. Що тобі ліс зробив?","скільки тих дров? Три зими палити зібра{вся|лася}?","~1 тріски знову в пір'ї. Цілься, вайло.","~1 рубати вмієш. Думати — ні.","~2 хоч узимку не змерзнемо. Уже щось.","~2 б'єш в одне місце. О, вчишся.","~3 рубай. Я за спиною пригляну, ти ж не глянеш.","~3 дивись, куди падає. Витягати тебе з-під нього не буду."],"зн_mine":["знову кайло. Дзвенить аж у пір'ї.","уже {again_n} чую цей гуп.","копаєш і копаєш. Гора скоро втече.","~1 знову гупаєш. Розуму б стільки, скільки сили.","~2 знову руда. Підземний ярл.","~3 знову копаєш? Спина одна, роззяво.","гора ще стоїть? Ненадовго.","кайло {again_n} за кілька хвилин. Каміння вже тікає.","скільки тієї руди тобі треба? Чесно.","ще жила. Сумка стогне. Я теж.","~1 знову довбеш. Я вже сірий від пилу.","~1 гучно і без пуття. Як ти весь.","~2 копаємо. Блискуче — моє, домовились?","~2 руда й руда. Сонце пам'ятаєш?","~3 кайло тримаєш уже майже правильно. Майже.","~3 копай. Затріщить стеля — крикну. Може."],"зн_build":["знову будуєш. Я вже й рахувати перестав.","уже {again_n} про будову. Кінця не видно.","ще стіна? Від кого ховаєшся, від мене?","~1 будуєш і будуєш. Хоч би раз щось дороби{в|ла}.","~2 знову стукаєш. Ну гаразд, рівно ж виходить.","~3 стукай. Я вже без цього й не засну.","ще колода. Це дім чи пам'ятник собі?","молоток {again_n} за годину. Сусідні тролі вже скаржаться.","ще прибудова? Ти ж і так тут блукаєш.","тут латка, там латка. Ти колись закінчиш?","~1 будуєш, будуєш, а дах як протікав, так і тече.","~1 ще одна крива балка. Це вже стиль, так?","~2 будуй-будуй. Тільки сволок мені лиши.","~2 о, рівніше, ніж минулого разу. На волосину.","~3 будуй. Тільки так, щоб нас не привалило.","~3 дивлюся, як ти будуєш. Криво, вперто — і таки стоїть."],"зн_kill":["ще один. Розійш{овся|лася}.","уже {again_n}. Я рахую.","знову труп. Я не встигаю записувати.","~1 вбиваєш усе підряд. Кролики теж рахуються?","~2 і ще один. Непогано."," иш?","Холодно. Багаття саме себе не розпалить.","Мій дзьоб скоро замерзне. Тоді настане тиша. Не радій.","Один мудрець казав, що холод загартовує. Він замерз.","~1 Мерзну. Ти, звісно, не поміти{в|ла}.","~1 Тепла від тебе не діждешся. Хоч не трясися так.","~2 Розпали вогонь. Чи чекаєш, поки я замерзну?","~2 Цокочу дзьобом. Це не музика, це скарга.","~3 Притулюсь до шиї. Не смикайся, це не ніжності.","~3 Холодно. Добре хоч, що ти тепл{ий|а}."],"св_вода":["Свіжа. Пий і ти, поки є.","Ковток — і можна далі.","~1 Не дивись, як я п'ю. Це особисте.","Чиста. Майже як мої думки.","Вода мовчить. Не те що ти.","Трохи бризок — і пір'я знову блищить.","На сухе горло не думається. Тепер можна.","~1 Мені вода, тобі — терпіння. Зачекаєш.","~1 Хлюпаюсь, бо можу. Дозволу не питав.","~2 Холодна, аж дзьоб зводить. Смачна.","~2 Лишити тобі ковток? Жартую, тут ціле озеро.","~3 Напийся й ти. Тобі ще далеко йти.","~3 Пий спокійно. Я пильную."],"св_бджоли":["Ай! Ці мухи кусаються!","Вулик. Більше ніколи. Запиши.","Мед того не вартий. Ну, майже.","~1 Не смійся. Я все бачу.","Смугасті й зовсім без почуття гумору.","Я лише хотів подивитись. Вони зрозуміли інакше.","Дзижчать, як тінг сердитих ярлів.","Відступаю. Тактично. Не втеча.","~1 Ти навмисно прив{ів|ела} мене до вулика?","~1 Ще слово про бджіл — знайду тобі осине гніздо.","~2 Принесеш мед — пробачу. Може.","~2 Дзьоб розпух. Тепер я поважний учений.","~3 Не підходь, вони злі. Мед не вартий тебе.","~3 Тримайся за мною. Я вже знаю, куди вони жалять."],"св_звір":["{beast} терпить мене. Мудра тварина.","{beast} — непогана жердина. Краща за тебе.","~1 Не кусайся, {beast}. Я свій. Ну, майже.","~3 Звір доглянутий. Хоч когось ти доглядаєш.","{beast} пахне сіном і впертістю. Як і ти.","{beast} везе мовчки. Тобі б повчитися.","Що думає {beast}? Мабуть, те саме, що й ти. Нічого.","Слухай, {beast}: поки я тут, ти під наглядом.","~1 Зі звіром приємніше, ніж із тобою. Без образ.","~1 Не дивись так. {beast} принаймні не базікає.","~2 Бік теплий. Посиджу
