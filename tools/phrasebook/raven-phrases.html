вно не бачились — і ше б стіко ж, {м_слівце}.","~1 ^давно Знову ці пики. Ну, здоров, бляха.","~3 ^давно О, свої зібрались. Аж тепло в зобі.","^живий Живі. А шкода, міг бути бенкет, гиги.","^живий Живучі, як таргани, курва.","^живий Хто не здох — той, бля, герой.","~1 ^живий Живі? Ну, то ненадовго.","~3 ^живий Добре, шо живі, падлюки. Їй-бо добре.","^новини Новина: я голодний. Як завжди, бля.","^новини Хто кого відгасив — ото новина. Решта — бабські плітки.","^новини Новини? Моя знову гепнулась. Нічо нового.","~1 ^новини Ваші новини — гівно. Але кажіть, кажіть.","~3 ^новини Розказуйте, курва. Цікаво ж!","Шо ви там мелете, я не вкурив. І не хочу.","Тихо, бля! Я думаю. Ну, пробую.","Думаєш, я глухий, {м_слівце}? Я все чую, бля.","А моя думка шо, не рахується?","~1 Йой, понеслась пизда по кочках.","~3 Свої всі. Аж приємно, курва. Ну, не дивись так.","Короче. Я тут шось хотів… та похуй.","Гарно пиздите. Я аж заслухався. Майже.","Хто перший дзьоба отримає? Я не вибираю, мені однаково.","~1 Срав я на вас обох з високої гілки.","~3 Ото ви, пацани, даєте. Люблю вас, сучари.","Сиджу, слухаю, і вже злий, курва.","Говоріть, говоріть. А я поки жука доїм.","Ну й нудьга, {м_слівце}. Хоч би хтось когось вбив.","Моя думка: пиздець. Більше нема шо додати.","~1 Довго ще, бля?","~3 Ото сидимо, пацани. Як люди. Ну, як ворони."],"мх_нове_імя_встряє":["^нове Нове ім'я? А пика та сама, гиги.","^нове Мені подобається. Звучить, як матюк.","Імена міняєте, а пір'я не миєте, засранці.","^нове Ім'я нове, а дурість стара, бля.","^нове Ім'я як ім'я. Я однаково кликатиму, як захочу.","^нове О, перехрестили! Хто наступний, га?","^нове Мені б теж нове погоняло. Шоб страшне. Шоб аж обсирались.","~1 ^нове Гучне ім'я для такого опудала, курва.","~3 ^нове Гарне ім'я, братан. Пасує.","^нове Ім'я нове — пір'я старе. Отак от.","Ну й брешете ви, хлопці. Красиво, але пиздите.","Ціць! Мені тут думка прийшла… та пішла, через вас.","Ти шо там шепочеш, {м_слівце}? Я ж поруч сиджу.","Ну-ну. А я шо, пень тут сиджу?","~1 Ну от, знову, курва, базар.","~3 Отакі ми й є, пацани. Нормальна банда.","Ану, тихо. Тепер я буду базарити.","Брешете обидва, як дихаєте. Поважаю.","Мені б когось дзьобнути зара. Нема бажаючих?","~1 Та йдіть ви обидва, знаєте куди.","~3 Нормальні ви, ворони. Для чужих — взагалі пушка.","Я поки помовчу. Але злий, як собака.","Ви пиздіть, а я на вас дивлюсь і їсти хочу.","Нудно, бля, {м_слівце}. Давай хоч поб'ємось.","Скажу коротко: хуйня. Дякую за увагу.","~1 Язики ж, курва, без кісток.","~3 Гарно, бля. Ше б медовухи."],"мх_до_того_хто_встряв":["^пр_заснув Ти, {addr}, дохуя пам'ятаєш, як на того, хто сам тоді змився.","^пр_заснув Ну то, {addr}, на шухер підеш ти. І не дай Одін закуняєш — дзьобну в тім'я.","^пр_медитація Знавець, бля, найшовся. От ти, {addr}, на шухері й стоятимеш.","^пр_медитація {addr}, ти так його вигороджуєш, ніби сам там хропів.","^пр_бджоли Не гнали, {addr}, а проводжали. З почестями, курва.","^пр_бджоли А ти, {addr}, тоді де був? В кущах сидів, ссикло?","^пр_дзьоб Розперло — і шо? Зате я того меду нажерся, {addr}, а ти — хуй.","^пр_дзьоб Ше слово про дзьоб, {addr}, і твій розпухне без всяких бджіл.","^пр_дах Дах — сильно, {addr}. Визнаю. Скриплю дзьобом, бля, але визнаю.","^пр_дах {addr}, твоя хоч на даху ближче до Одіна. А моя — до порогу, і то рачки.","^пр_драбина {addr}, твоя людина — то вже не плітки, то, курва, сага.","^пр_драбина Здаюсь, {addr}. Твоя — чемпіонка. Хай їй грець, нахуй.","^пр_ревнощі Привітати, {addr}? На: привіт. Задоволений, плаксо?","^пр_ревнощі За тобою скучиш, {addr}, — а потім сам жалкуєш.","^пр_зграя Хай так, {addr}. Але старший тут я. Хто проти — виходь, поговоримо.","^пр_зграя Ага, {addr}. І всі голодні, як собаки.","^пл_своя {addr}, твоїй людині теж не позаздриш, бля.","^пл_своя Ото ви й зграя, {addr}. Цирк, а не зграя.","^пл_рахуй {addr}, старший тут один. І це, сука, не ти.","^пл_рахуй Ага, {addr}. Валькіріям це розкажи, вони поржуть.","^пл_свій_бос {addr}, а ти тоді де був? Отож, бля.","^пл_свій_бос Язиком і я боса завалю, {addr}. Ти дзьобом спробуй.","^пл_слава {addr}, трофей — мій. Без базарів.","^пл_слава Ну й зануда ти, {addr}, курва мать.","^пл_звикли {addr}, рахувати треба. Шоб знати, скіки тобі винні.","^пл_звикли Ага, {addr}. Звикли до них, як до чиряка на сраці.","^пл_вірні Ніхто не візьме, кажеш, {addr}? За себе базар.","^пл_вірні {addr}, ти шо, розкис сьогодні? Шмарклі витри.","^пл_якість {addr}, в тебе своя арифметика, бля. Дурна.","^пл_якість Ага, {addr}. Ше шось розкажи, казкарю.","^пл_ставка {addr}, пір'їну я заберу. Тримай міцніше, бо вирву.","^пл_ставка Годувати всіх, {addr}? Ти перший, лошара.","^вг_дерево З деревом, {addr}? Ну, рівня найшлась, гиги.","^вг_дерево {addr}, твоя хоч з деревом домовилась. А моя — ні з ким, курва.","^вг_троль Троль, кажеш, {addr}? Ну, тоді все ясно. Все, бля, ясно.","^вг_троль {addr}, з тролем вийшло краще за всі наші історії. Мене аж трусить.","^вг_рахунок Пиздиш, {addr}. Гарно рахуєш, але брешеш.","^вг_рахунок {addr}, рахуй-рахуй. Тіко не забудь, шо ти ворон, а не жмот.","^вг_борг Отож, {addr}. Сидимо на плечах і мовчимо. Вірні дурні, курва.","^вг_борг Розумно кажеш, {addr}. Аж злість бере, бля.","^вг_хліб Злітай до мене, {addr}, — поділюсь. Та нє, хуй там поділюсь.","^вг_хліб {addr}, черства жратва — то ше не горе. Горе — коли й такої нема.","^вг_крадене Правильно, {addr}. Я так і живу, і нічо.","^вг_крадене {addr}, а з чиєї торби тягнеш? Кажи, бо я теж хочу.","^вг_вартовий От ти й стережи, {addr}. Хто сказав — той і робить, бля.","^вг_вартовий Стережи, {addr}. А я тобі хропінням підсоблятиму.","^вг_зміна Добре, {addr}. Тіко будити мене — лише на бійку.","^вг_зміна Ну, {addr}. Черга так черга, хуй з нею.","^бс_земля {addr}, я теж ледь не впав. Від реготу з тебе, бля.","^бс_земля {addr}, головне, шо не під тушу. Бо розмазало б.","^бс_пісня Пісню, {addr}? Буде пісня. Про мене, ясне діло.","^бс_пісня Ну співай, {addr}. Але я — в першому рядку, бо вріжу.","^бс_третя {addr}, ти тоді ховався за щитом своєї людини. Шо ти міг бачити, сліпа куро?","^бс_третя Брешеш, {addr}. Гарно, курва, але брешеш.","^бс_всі {addr}, мирити ти мастак. Битися б так, курва.","^бс_всі Ну, {addr}, нічия. Але моя однаково краща, і крапка.","^бс_камінь {addr}, а ти звідки знаєш про камінь? Сам там сидів, га?","^бс_камінь За каменем, {addr}? Зате живі, бля. А то головне.","^бс_тактика Запам'ятаю, {addr}. Як буду драпати — так і скажу: тактика.","^бс_тактика {addr}, ти так гарно пиздиш, шо сам собі віриш.","А тебе хто кликав, {м_слівце}? Га?","О, ше один розумник прилетів. Ботан, бля.","І ти тут? Ну все, тепер сто пудів не занудьгуємо.","Закрий дзьоба, {addr}. Ну добре, кажи вже.","Діло кажеш, {addr}. Не звикай, шо я таке кажу.","Ше слово — і дзьобну. І тебе теж, ага.","~1 Відвали, {addr}, по-доброму.","~3 Добре, шо ти прилетів, падлюко. Серйозно.","Прилетів, {addr}? Ну сідай, тіко не каркай під руку.","Ти вчасно, {м_слівце}. Тут якраз нудота, хоч вий.","Кажи вже, {addr}, раз приперся.","Ше один голос. Ше більше гівна, курва.","~1 Відвали, поки цілий. Я двічі не кажу.","~1 Тебе не кликали, {addr}. Йди звідси.","~2 Ну шо ж. Хай буде, бля.","~3 О, ти! Добре, шо прилетів, братуха.","Ти завжди лізеш, {addr}. Поважаю, сука.","Сідай поруч. Тіко не смерди, як минулого разу."],"мх_пр":["^крадіжка {addr}, давай шось спиздимо. Шо завгодно, аби блищало.","^крадіжка В твоєї людини в торбі шось дзенькає, {addr}. Глянемо, га?","^мед {addr}, гайда по мед. Наші й без нас день протягнуть, не здохнуть.","^мед Мед, {addr}. Я про нього думаю частіше, ніж про бійку. А то, бля, шось та значить.","^плітки {addr}, слухай: {name} вчора би{вся|лася} з дохлим кабаном. І програ{в|ла}, курва. Ржатимеш до вечора.","^плітки Є плітки, {addr}. Свіжі: {name} вчора зжер{|ла} гриба, шо я не радив. Потім до ранку співа{в|ла}, аж вовки вили.","^знову О, {addr}! Мій улюблений дурень, бля!","^знову {addr}, ти ше живий? А я думав, тебе давно зжерли.","~1 ^знову Знову ти. Ну, хай, хуй з тобою.","~3 ^знову {addr}, брате! Йди сюди, я тебе дзьобну. З любові, курва.","^пл_смерть Чув, {addr}, твоя {g_their_death_when} від {g_their_killer_gen} гигнула. Ги-ги, лошара!","^пл_смерть Через {g_their_cause}? Серйозно, {addr}? Твоя людина {g_their_death_when} так і склеїла ласти? Пиздець.","^пл_смерть Твоя людина {g_their_death_when} здихала {g_their_deaths}. Ти хоч рахуєш, {addr}?","^пл_бос Ха, {addr}! Ми {g_my_boss_when} порвали {g_my_boss_acc}! На шмаття!","^пл_бос {g_my_boss} — все, {addr}. Моя людина {g_my_boss_when} постаралась. Ну і я трохи, бля.","^пл_дні {g_my_days}, {addr}! Стіко я терплю свою людину. Стіко, курва!","^пл_дні Вже {g_my_days} з нею, {addr}. Мені медаль треба. Дві.","^пл_рахунок {g_my_kills}, {addr}! От скіки моя наклала. А твоя хоч сотню, га?","^пл_рахунок В моєї вже {g_my_kills}, {addr}. А в твоєї шо, нуль?"],"мх_пр_відповідь":["^крадіжка>пр_шухер Красти не буду. А на шухері постою, мені не вперше, бля.","^крадіжка>пр_шухер Йди, а я на шухер. Як хтось припреться — закаркаю. Мо'.","^мед>пр_гілка Мед — то святе. Тіко не як минулого разу, коли ти з гілки йобнувся.","^мед>пр_гілка Гайда. Але гілку вибираю я. Ти минулого разу суху вибрав, мудило.","^плітки>пр_хата Ха, дрібниці. Моя вчора у власній хаті заблукала, курва.","^плітки>пр_хата Подумаєш. А моя вчора з хати вийти не могла. Двері не в той бік тягла, бля.","^знову>пр_скучив Я теж радий. Ну… трохи. Тіко нікому, бо вб'ю.","^знову>пр_скучив Живий, як бачиш. І, якшо чесно, скучив, сучаро.","^пл_смерть>пл_підло Підло вбили, бля. Я все бачив, зі спини, падли.","^пл_смерть>пл_підло Здохла — і шо? Встала ж, курва. Ходить.","^пл_бос>пл_сама Ага, ага. А хто за каменем ховався, га?","^пл_бос>пл_сама Порвали, кажеш? А я чув, шо ледь ноги винесли. З обісраним пір'ям.","^пл_дні>пл_довго А я зі своєю — {g_my_days}. І ше живий, бля. Диво.","^пл_дні>пл_довго Терпиш? Я теж. Нам обом медалі треба. І пожерти.","^пл_рахунок>пл_більше А моя — {g_my_kills}, бля! Знай наших!","^пл_рахунок>пл_більше Твоя? Моя стіко до обіду кладе. Одною лівою.","Та ну тебе нахуй, {м_слівце}."],"мх_пр_встряє":["^пр_шухер>пр_заснув Шухер? Минулого разу на шухері хтось так хропів, шо всі собаки збіглись, бля.","^пр_шухер>пр_заснув Ага, шухер. Той, шо спить стоячи, як кінь, курва.","^пр_заснув>пр_медитація Хропів, бо вдавав, шо спить. Хитрість така, вкурив?","^пр_заснув>пр_медитація Спав — і правильно. Хто спить, того не ловлять. Логіка, бля.","^пр_гілка>пр_бджоли Гілка? А бджоли? Я досі чухаюсь, сука.","^пр_гілка>пр_бджоли Мед без бджіл не буває. Я перевіряв. Дзьобом. Більше не хочу.","^пр_бджоли>пр_дзьоб Комусь тоді дзьоб розперло, як гарбуз. Я тиждень іржав.","^пр_бджоли>пр_дзьоб Пам'ятаю ту пику. Дзьоб як бочка, бляха-муха.","^пр_хата>пр_дах Хата! Моя на даху застрягла, бля. Ми там з нею і ночували, як два дурні.","^пр_хата>пр_дах А моя з даху верещала, шоб їй драбину принесли. Сама ж її й зламала, курва.","^пр_дах>пр_драбина Моя драбину на дрова пустила. Тепер усі внизу ночуємо, як свині.","^пр_дах>пр_драбина А моя драбину закопала. Не питайте нашо. Я сам без поняття.","^пр_скучив>пр_ревнощі А мене хто привітає? Я шо, пень?","^пр_скучив>пр_ревнощі Йой, які ніжні. Аж нудить. Мене теж привітайте, курва!","^пр_ревнощі>пр_зграя Стіко воронів в одному місці — сьогодні хтось по-любому здохне.","^пр_ревнощі>пр_зграя Ну все, банда в зборі. Вовки, ховайтесь, бля.","^пл_підло>пл_своя Пф. Моя щодня здихає. Звикли вже.","^пл_підло>пл_своя Та в нас теж недавно гигнули. Від курки, бля. Від КУРКИ.","^пл_своя>пл_рахуй Вони здихають, а ми потім їхнє барахло тягаємо. Ну й життя.","^пл_своя>пл_рахуй Хто рідше здихав — той і старший. Тобто я, ясно?","^пл_сама>пл_свій_бос Пф. Моя таких щотижня кладе. Між ділом.","^пл_сама>пл_свій_бос Та я того боса сам би заклював, бля. Одним дзьобом.","^пл_свій_бос>пл_слава Слава, слава… А трофей кому, га?","^пл_свій_бос>пл_слава Хвалитись будемо, коли всіх переб'ємо. А то зарано, курва.","^пл_довго>пл_звикли Я зі своєю стіко, шо вже й не рахую. Бо пальців нема.","^пл_довго>пл_звикли Дні, дні… А годують мене через раз, сука.","^пл_звикли>пл_вірні Сімʼя, ага. Тіко без пива, бля.","^пл_звикли>пл_вірні Ми з ними, бо нас ніхто більше не візьме. Ну, мене б взяли. Вас — нє.","^пл_більше>пл_якість Я рахую тіко тих, кого сам доклював. Решта — не рахується.","^пл_більше>пл_якість Цифри, цифри… Моя одного кабана тиждень лупила, курва.","^пл_якість>пл_ставка Хто менше наклав — той усіх і годує. Чесно ж?","^пл_якість>пл_ставка Ставлю пір'їну, шо моя всіх обжене. Хто на шо?","І я з вами, падлюки. Хто проти — в пику.","О, вся банда в зборі! Ото діло!","Хуйня якась, а не розмова.","Можна не так голосно? В мене від вас дзьоб болить.","Ага, я тут, {м_слівце}. І вуха в мене є. Ну, десь є.","Ага. Без мене вирішили. Ну-ну.","~1 Ой, все, понеслось.","~3 Гарно, шо зібрались. Обніматись не лізьте, бо дзьобну.","Слухайте сюди, малі. Мунін говорить.","Таке гівно, а як подано, га!","Може, вже поб'ємось? Ну шо ви.","~1 Обидва — лохи, і крапка.","~3 Ех, ви. Братани мої пернаті.","Я тут. І мені вже не подобається.","Давайте, тріпайтесь. Я пошукаю, шо поцупити.","Нудота, {м_слівце}. Нема бійки — нема розмови.","Я теж скажу. Бляха. Ото й усе.","~1 Та закрийте ви вже дзьоби.","~3 Отак би й сидіти, братва."],"мх_пр_кінець":["^пр_шухер Домовились. Не засни там, {addr}, бо сам тебе клюну в сраку.","^пр_шухер Отак і живем: я цуплю, ти дивишся. Чесно, бля.","^пр_заснув|пр_медитація Та ну вас. Сам спизджу, без шухеру.","^пр_заснув|пр_медитація Банда злодіїв, а вкрасти нема кому. Пиздець.","^пр_гілка Летимо. Цього разу без падінь, бляха, чуєш?","^пр_гілка Вирішено: гілку вибираєш ти, а мед — мій. Весь.","^пр_бджоли|пр_дзьоб Та йдіть ви з вашими бджолами. Сам полечу.","^пр_бджоли|пр_дзьоб Ну добре. Мед — потім. Як дзьоб забуде, курва.","^пр_хата Добре, шо вони нас не чують, бля. А то б образились.","^пр_хата Ну й люди в нас. Два чоботи пара.","^пр_дах|пр_драбина Ну й зграя: жодної людини з головою. Жодної, курва!","^пр_дах|пр_драбина Все, досить. Бо моя зара ше шось утне — і буде нова сага.","^пр_скучив Ну все, порозкисали — і досить. Шмарклі витерли.","^пр_скучив Радий, шо ти живий, {addr}. Не звикай, бля.","^пр_ревнощі|пр_зграя Ну й банда. Аж гордість бере, курва.","^пр_ревнощі|пр_зграя Все, всі поздоровкались. Тепер би пожерти.","^пл_підло Ну, хай живе. Поки шо.","^пл_підло Бережи свою, {addr}. Бо я ржатиму, і голосно.","^пл_своя|пл_рахуй Всі здихають, бля. Тіко ми вічні.","^пл_своя|пл_рахуй Ну й банда жмуриків у нас, курва.","^пл_сама Отож. Знай наших, бля.","^пл_сама Бос лежити. Ми — ні. Отак от.","^пл_свій_бос|пл_слава Все, досить. Пішли наступного шукати, руки сверблять. Ну, крила.","^пл_свій_бос|пл_слава Ну й хвальки ви всі. А я — найбільший, курва.","^пл_довго Ну, ше пару днів витримаю. Мо'.","^пл_довго Хай живе. Мені без неї нудно, бля. Тіко тихо.","^пл_звикли|пл_вірні Ну й зграя старих пердунів.","^пл_звикли|пл_вірні Все, досить шмарклів. Бо зара, курва, розкисну.","^пл_більше Отож. Наші сильніші, і все.","^пл_більше Ну все, рахуй далі, бухгалтер. Я пішов.","^пл_якість|пл_ставка Ну й бухгалтери ви всі, бля.","^пл_якість|пл_ставка Все, рахунок закрито. Моя виграла. Не сперечайтесь.","Ти це… тримайся там. Ну. Ага.","~3 Бувай, брате. Бережи себе, падлюко."],"мх_вг":["^історія {addr}, розкажу, як {name} {розпалював|розпалювала} вогонь. Пів дня, курва! І все одно роздмухав я.","^історія Хочеш історію, {addr}? {name} пів дня вогонь розпалю{вав|вала}. Ржака. Для мене.","^при {addr}, скажи по-чесному: це ми при них, чи вони при нас, га?","^при Іноді думаю, {addr}: без нас вони б уже сто разів гигнули, бля.","^годує {addr}, тебе годують? Мене — як згадають, курва.","^годує Чим тебе твоя людина годує, {addr}? Хвались, не жмись.","^тепло Тепло, як у Муспельгеймі. Тіко без вогняних здорованів.","~3 ^тепло Гарно, бля. Аж нікого вбивати не хочеться. Ну, майже.","~3 ^тепло Добре тут, {addr}. Тіко не кажи нікому, шо я таке казав."],"мх_вг_відповідь":["^історія>вг_бій Та шо вогонь. {name} в мене {заснув|заснула} посеред бійки, бляха. Я сам відбивався, як дурень.","^історія>вг_бій Пів дня? А {name} якось у бою {закуняв|закуняла}. Я дзьобом у тім'я будив.","^при>вг_обмін Обмін, {addr}: вони нас годують, ми їх рятуємо. Я — частіше, курва.","^при>вг_обмін Вони годують, ми рятуємо. Тіко годують рідше, ніж треба, сука.","^годує>вг_їжа М'ясом, як вполює. Тобто майже ніколи, курва.","^годує>вг_їжа Рибою. Холодною. Я вже сам, бля, як риба.","^тепло>вг_тиша Ціць ти. Не зурочуй, бо зара шось із темряви вилізе.","^тепло>вг_тиша Помовчмо, {м_слівце}. Таке рідко буває.","Ага, {м_слівце}. Ага."],"мх_вг_встряє":["^вг_бій>вг_дерево Моя з деревом цілу ніч базарила, курва. Дерево мовчало розумніше.","^вг_бій>вг_дерево Спати в бою? Моя дереву в коханні освідчувалась. Після меду, ясне діло.","^вг_дерево>вг_троль Дерево відповідало? Бо то був троль, бля, я бачив!","^вг_дерево>вг_троль А моя якось обійняла дерево. Дерево виявилось тролем. Охуїли обоє.","^вг_обмін>вг_рахунок Рахунок такий: я рятував раз сорок. А годувала — двічі, бля.","^вг_обмін>вг_рахунок Чесний? Я все рахую. Моя мені три мішки м'яса винна.","^вг_рахунок>вг_борг Не поверне. Ніхто не повертає. А ми, дурні, все одно на плечах сидимо.","^вг_рахунок>вг_борг Борг є борг. Колись я все стягну. Мисками, курва.","^вг_їжа>вг_хліб Та то ше розкіш. Мені — хліб, об який дзьоб ламається.","^вг_їжа>вг_хліб Ви хоч шось жерете. Мені — обіцянки й крихти, бля.","^вг_хліб>вг_крадене Найсмачніше — спизджене. Перевірено.","^вг_хліб>вг_крадене Не чекайте, поки дадуть. Беріть самі, як я. На халяву смачніше.","^вг_тиша>вг_вартовий Тиша, ага. А хто стерегтиме? Я? Знову я, курва?","^вг_тиша>вг_вартовий Хто засне — тому пір'я підпалю. Хтось мусить стерегти, бля.","^вг_вартовий>вг_зміна По черзі. Я перший, бо однаково з голоду не засну.","^вг_вартовий>вг_зміна Хто перший позіхне — той і стоїть. Я вже бачу, хто, ги-ги.","Можна погрітись? Та я не питаю, я вже сів.","Ви шо, сказились обидва?","Тихіше, курва. Я, може, сплю.","Чую-чую, {м_слівце}. Не думай, шо я дурний.","Ей, а я? Мене шо, нема?","~1 Тьху, знов теревені.","~3 Ех, братва. Аж в зобі тепло.","Короче, так. Ну. Того. Забув, бля.","Хоч гівно, але з душею мелете.","В кого тут найдурніша пика? Дзьобну по черзі.","~1 Тьху, курва. Обидва.","~3 Добрі ви пацани, хоч і дурні.","Сиджу. Мовчу. Закипаю.","Базарте собі. В мене тут хробак недоїдений.","Нуда, {м_слівце}. Де кров, де м'ясо?","Добре, моє слово: срака. Все, кінець.","~1 Набалакались? Ні? Капець.","~3 Добре з вами, бляха. Не кажіть нікому."],"мх_вг_кінець":["^вг_бій Ну й люди. Але наші, бля.","^вг_бій Досить історій. Дайте подрімати, курва.","^вг_дерево|вг_троль Вирішено: наші люди — дебіли. Але свої дебіли.","^вг_дерево|вг_троль Скажу одне: троль — то не дерево. Запишіть собі.","^вг_обмін Хай думають, шо вони тут головні. Нам не шкода.","^вг_обмін Обмін є обмін. Але м'яса могли б давати більше, жмоти.","^вг_рахунок|вг_борг Ну все, бухгалтерія. Пішли спати.","^вг_рахунок|вг_борг Скіки не рахуй — а без них нудно, бля.","^вг_їжа Годує — і добре. Аби не забувала, курва.","^вг_їжа Все, про жратву на голодний шлунок — то катування.","^вг_хліб|вг_крадене Все, пішли торби шукати. Чужі, ясне діло.","^вг_хліб|вг_крадене Голодна банда біля вогню. Знайома картина, бля.","^вг_тиша Гарно посиділи. Шкода, шо без м'яса.","^вг_тиша Отак би й сидіти, {м_слівце}. Ех.","^вг_вартовий|вг_зміна Все, черга розписана. Я сплю, нахуй.","^вг_вартовий|вг_зміна Ну все, хтось стереже. Не я — і слава Одіну, бля.","Ну, хай горить, {м_слівце}. Гарно горить.","Все, я сплю. Хто розбудить — тому пиздець.","~1 Досить базікати, бля."],"мх_бс":["^бос {addr}, ти ту тушу бачив? Отаку! Ото, бля, махач був.","^бос {boss} — все, гаплик, {addr}. А ми — живі. Ото день, га?","~1 ^бос Ледве ноги винесли, {addr}. Ше раз таке — я злиняю нахуй.","~3 ^бос Гарно рубались, {addr}. Я цей… пишаюсь. Всіма. Тіко не кажи нікому.","^остання {addr}, а хто {boss_gen} добив, га? Моя, сто пудів.","^остання Останній удар — мій. Ну, моєї людини. Ну, значить мій, бля. Шо тут неясно?","^влучила {addr}, твоя хоч раз влучила, чи тіко махала, як дурна?","^влучила Я бачив, як твоя цілилась, {addr}. Ну і? Влучила хоч раз? Хоч разочок?"],"мх_бс_відповідь":["^бос>бс_падало Як гепнуло — в мене пір'я дибки, бляха-муха. Досі стоїть.","^бос>бс_падало А як воно падало, а! Повільно, гарно, як у тих… ну, у сагах.","^остання>бс_моя Моя добила, {addr}. Я бачив, хто стояв над тушею. Не твоя.","^остання>бс_моя Твоя? Ой, не смаши мене. Моя добила, курва мать.","^влучила>бс_кричала Моя влучала, {addr}. А твоя верещала, як порося під ножем.","^влучила>бс_кричала Влучила, і не раз. А твоя «тікаймо!» кричала, я чув, не пизди.","Та головне — живі, {м_слівце}. Решта — хуйня."],"мх_бс_встряє":["^бс_падало>бс_земля Мене з плеча струсило нахуй. Я думав — все, кінець світу.","^бс_падало>бс_земля Я з плеча гепнувся, коли воно гепнулось. Хто ржатиме — дзьобом в тім'я.","^бс_земля>бс_пісня Хай скальди співають. Я їм розкажу, як було. Ну, як мені треба, так і було.","^бс_земля>бс_пісня Пісня буде. Про мене. А ви — на підспівках, ля-ля-ля.","^бс_моя>бс_третя Шо ви мелете? Моя добила. Я поруч сидів, я знаю.","^бс_моя>бс_третя Добила моя, а ви обидва пиздите, як дихаєте.","^бс_третя>бс_всі Та воно здохло зо сміху, як глянуло, шо ви за бійці. Отака правда.","^бс_третя>бс_всі Та всі добивали, всі. А я потім ше клюнув. Шоб напевняк.","^бс_кричала>бс_камінь Кричали всі. А за каменем сиділа одна. Я знаю чия, хе-хе.","^бс_кричала>бс_камінь Бачив я той камінь. Там за ним героїв — як оселедців у бочці.","^бс_камінь>бс_тактика Камінь — то тактика, бля! Я сам так роблю. Постійно.","^бс_камінь>бс_тактика Хто не ховався — той лежити. А ми — ось. Живенькі.","Гарний махач був, {м_слівце}. Хочу ше. Ше хочу!","А я шо, не бився? Я там кров'ю плювався, між іншим!","Та ви обидва гівно мелете. Обидва. Рівно.","Можна тихше? Я тут думаю, кого б зжерти.","Я все чую, {м_слівце}. Все-все.","Ага-ага. А мене спитати — ніхуя?","~1 Ой, бляха, понеслося.","~3 Добре, шо всі тут. Тіко без обнімашок, бо дзьобну.","А мене хтось питав? Нє? То слухайте сюди.","Ви обидва несете хуйню, але гарно так, з душею.","А мені можна когось дзьобнути? Ну хоч трошки?","~1 Тьху на вас обох. Двічі.","~3 Ну ви й парочка, їй-бо. Мені нормально.","Я тут, як шо. Слухаю й бішусь.","Ви базаріть, а я подумаю, кого б схрумати.","Нудно, {м_слівце}. Крові в розмову підлийте, га?","О, я теж скажу: курва. Все, сказав.","~1 Скільки можна тріпатись, а?","~3 Добре сидимо, курва. Душевно."],"мх_бс_кінець":["^бс_падало Все. Пішли жерти. Заробили.","^бс_падало Порвали, як ганчірку. Кого там наступного?","^бс_земля|бс_пісня Все, хорош понтуватись. Пішли трескати.","^бс_земля|бс_пісня Ото зграя в нас. Аж страшно самому.","^бс_моя Добре. Слава навпіл. Мені — більша половина. Не сперечайся.","^бс_моя Хай так: обидві молодці. Тіко моя — трошки молодціша.","^бс_третя|бс_всі Все, досить. Здохло — і нормально.","^бс_третя|бс_всі Сперечайтесь собі. А я пішов трофеї дзьобати.","^бс_кричала Добре, добре. Обидві влучали. Моя — частіше, ясно?","^бс_кричала Ну все. Наступного разу сам влучатиму, бляха.","^бс_камінь|бс_тактика Все, хорош. Живі — і слава богам.","^бс_камінь|бс_тактика Зграя героїв, хуле. Половина — за каменем.","Ну все. Де жрачка?","~1 Валимо звідси нахуй."],"ма_вступ":["Тю.","Ну ні, ну ти глянь.","Йо, гля.","Короче, слухай.","Ото так.","{м_слівце}!","~1 Ну все, приїхали.","~3 Братан, тіко між нами.","Гей, ти.","Чуєш, га?","Ну капець.","~2 Дивись сюди.","~1 Бляха, ну шо за гівно."],"ма_хвіст":["Тьху на вас, їй-бо.","Я сказав, і все.","Кар, {м_слівце}, кар.","І шо ти так дивишся?","Хто не згоден — дзьобом в тім'я.","Ото так от.","~1 Відвали, нахуй.","~3 А, та похуй, то таке.","Курва мать.","От і все, шариш?","І не пизди мені тут.","~2 Ну, хай буде.","~3 Тіко між нами, братан."],"мв_відсіч":["Шо?!","Ти шо, мені?","Ану слухай сюди, {м_слівце}.","Тю, бля.","Йой, тіко не починай.","~3 Ну-ну, кент.","Ну? Ну шо?","Це ти мені, га?","~1 Закрий дзьоба, гівнюк.","~2 Ну-ну, пернатий."],"мв_шпилька":["Тю.","Вкурив, {м_слівце}?","Бо дзьобну, сука.","І пір'я пригладь, бо стирчить, як у лоха.","Отаке, шариш.","Пиздець.","Тьху тобі в дзьоба.","~1 Відвали, чмо.","~3 Без образ, брате. Ну, трохи з образою."],"ма_поранений":["{friend} зара здохне, {м_слівце}. Сідай, подивимось, як.","Глянь на {friend}: кров, синці, юшка з носа. Краса, бля.","Хтось {>його|її} нормально так відпиздив. Це не ти, часом?","Ледь жив{>ий|а}. А я шо казав? Не лізь у ту печеру, бо пиздюлів дадуть.","~3 {friend} ледве повзає. Прикрий {>його|її}, братан, бо потім твого ниття не переслухаю.","{friend} юшкою стікає, {м_слівце}. Ото кіно.","Порвали {>його|її}, як ганчірку. Хто рвав — той пацан.","Ше трошки — і буде свіжий трупак. Я перший на око.","Подерт{>ий|а}. Ну як ти вчора, тіко без соплів.","~1 Хай здихає, похуй. Не наше діло.","~2 Ого {>його|її} порвали. Кинь хоч бинта, не жмоться.","~3 Прикрий {>його|її}, чуєш? Свої ж, курва мать.","~3 Дай {>йому|їй} шось пожерти, бо зара впаде, і шо тоді?"],"ма_спить":["{friend} хропе. Давай {>йому|їй} вуса намалюєм. Ну давай, ну!","Дрихне, {м_слівце}. Ото зара з {>його|її} скрині шось і спиздимо.","Дрихне, а я, бля, третю добу не сплю. Через тебе, між іншим.","Хропе, як троль, шо обожрався.","~3 Хай спить. Я повартую. Тіко нікому, бо засміють.","{friend} дрихне. Дзьобнути в ніс? Ну тіко раз?","Спить, як колода. Тіко колода хоч не пердить.","Хропе так, шо в мене пір'я дибки.","Самий час насрати поруч. Хай прокинеться — а тут сюрприз.","~1 Спить, а навколо шось ходить. Ну дурне ж, бля.","~2 Та хай спить. Я мовчу. Бачиш? Мовчу.","~3 Хай поспить. Хто сунеться — тому око виклюю.","~3 Цить. Не буди, кому сказав."],"ма_бос":["Ти з {friend} разом {mboss} гатили. Я все бачив, {м_слівце}, все!","А, це ж {friend}. Вереща{>в|ла} на весь ліс, коли ми {mboss} гасили. Я аж оглух.","Як ми {mboss} валили, {friend} за тобою хова{>вся|лася}. Я, бля, пам'ятаю.","~3 {mboss} ми з {>ним|нею} разом поклали. Нормальн{>ий|а}. Для людини, ясне діло.","Ти й {friend} {mboss} поклали. Кровиська було — по коліно, бля.","{friend} тоді {mboss} лупи{>в|ла} разом з нами. Я пам'ятаю, я все пам'ятаю.","Пам'ятаєш {mboss}? Ото там і видно було, хто пацан, а хто ссикло.","Того дня — {m_when} — ми {mboss} клали. І {friend} поруч. Ох і махач був, курва.","~1 Ти й {friend} {mboss} поклали. Чудом, бля. Чисто фарт.","~2 Гарно тоді {mboss} відгасили. Ох гарно, трясця.","~3 Ти й {friend} поклали {mboss}. Свої люди, братан. Своїх не кидаєм.","~3 Такий махач не забудеш. Я досі пір'ям тремчу, чуєш."],"ма_ворон":["{fraven}? Шо за дебільне ім'я, {м_слівце}? Хто так ворона кличе?","Отой {fraven} на {>ньому|ній}? Я б йому дзьоба вирвав і в сраку встромив.","{fraven} на мене косо зиркає. Ше раз — і буде лисий, як коліно.","{fraven}. Пір'я засране, погляд тупий. Як у господар{>я|ки}, один в один.","~3 {fraven}. Ну… нормальний ворон. Для чужого. Йому тіко не кажи, бо зазнається.","{fraven} коситься. Хай тіко рипнеться.","{fraven} — ну й мармиза, бляха-муха.","Отой {fraven} смердить, як дохлий голуб у болоті.","{fraven} думає, шо він тут головний. Ага, вже. Розігнався.","~1 {fraven}. Я б йому пір'я повискубував, і похуй.","~2 {fraven} — та нормальний, шо. Не лох.","~3 {fraven}. Терпимий. Для чужого, ясне діло.","А {fraven} кусається? Зара перевіримо. Тримай мене, тримай!"],"ма_ворон_золото":["{fraven}, ти глянь, яке ім'я урвав. А я шо, гірший, {м_слівце}? Га?","Понтується тим іменем. {fraven}. Пф. Понти одні.","{fraven}… Ну, заслужив. Мо'. Та пиздить, по-любому.","Ім'я золоте, а дзьоб такий самий, як у всіх. Не вставило.","{fraven}. Ім'я гучне, а пір'я — як у курки.","{fraven}, ти глянь. Когось тут добре годують, не те шо мене.","~1 {fraven}. А мені ти таке ім'я коли даси, жмоте? Ніколи, га?","~2 {fraven}, курва. Мо', й заслужив. Мо'.","~3 {fraven}. Ну шо, поважаю. Трошки. Ото й усе."],"ма_ворон_легенда":["{fraven}… Тьху. Легендою став. А я тут на твоєму плечі гнию, як дурень.","Сам {fraven}, {м_слівце}. Ну легенда, ну. А я все одно крутіший, сто пудів.","{fraven}. Легенда. Подумаєш, бля. Дай мені пару років — і я теж.","~1 {fraven}. Бачиш, як інших годують? Отож бо.","{fraven}. Легенда, курва. А мені шо, своє пір'я гризти?","Сам {fraven} тут. Гляди не обісрися від щастя.","{fraven}. Звідки стільки понтів? Я теж хочу, бля.","~1 {fraven}. Ото шо буває, коли ворона нормально годують. Вкурив?","~3 {fraven}. Колись і я таким стану. З тобою, братан. Ну. Не дивись так."],"ма_без_ворона":["{friend} без ворона. Бідолаха. Чи щасливчик, хуй його знає, {м_слівце}.","Нема ворона — нема проблем. Я б від тебе теж відпочив, чесно.","Без ворона ходить. А хто {>йому|їй} правду в очі скаже? Ніхто, бля.","Плече голе. Мо', мені туди перебратись? Жартую. Мо'.","Без ворона. Нема кому {>його|її} обматюкати як слід, бідолаху.","Плече голе. Хоч би горобця якого завели, лохи.","Без ворона ходить. Ні поговорити, ні полаятись. Нудьга смертна.","~1 Без ворона, бо ворони не дурні, шоб таке носити.","~2 Хай ворона заведе. Тіко не мене, нахуй.","~3 Бідолаха без ворона. А в тебе є я. Цінуй, братан."],"ма_новий":["А це шо за {>тип|кобіта}?","{friend}? Не знаю, не бачив і, {м_слівце}, бачити не хочу.","Чуж{>ий|а}. Я пасу. Один різкий рух — і дзьобом в тім'я.","Нова пика. Не подобається. Мені взагалі пики не подобаються.","Хто це? Чужим смердить.","{friend}. Перший раз бачу. І шоб останній.","Свіженьке м'ясо приперлось.","Незнайома пика. Пильнуй кишені.","~1 Чуж{>ий|а}. Дзьобну про всяк. Для порядку.","~2 Новеньк{>ий|а}. Ну подивимось, шо за фрукт.","~3 Новеньк{>ий|а}? Та хай буде. Здоров."],"ма_свій":["{friend}. Терплю. Бо свої, бля.","О, {friend}. Ми вже стільки разом гасилися, шо я {>його|її} майже люблю. Майже, чуєш?","{friend} свій. Тому й матюкаю чесно, від душі.","~3 {friend} — свій. Хто чіпне — матиме справу зі мною, і тоді пиздець.","{friend}. Свій. Обкладаю з любов'ю.","О, {friend}! Наш рідний гівнюк!","{friend} — з тих, хто в бою не зассить.","З {>ним|нею} ми стільки кишок навипускали — шо й не злічиш.","~1 {friend}. Свій. На жаль, бляха.","~2 {friend}, курва. Радий. Трохи. Не звикай.","~3 {friend} — свій. Хто чіпне — очі видзьобаю, сто пудів."],"ма_знайомий":["А, знов {friend}. Ну здоров, чи шо.","{friend}. Бачились. Не вставило.","Знаю {>його|її}. Доброго не скажу. Поганого теж. Поки шо.","Знов ця пика. Звикаю, {м_слівце}, шо поробиш.","{friend}. Знов ця морда.","А, {friend}. Пам'ятаю, ага. Як таке забудеш.","{friend}. Знайом{>ий|а}. І шо?","Знов {friend}, курва мать. Світ тісний, як дупа.","~1 {friend}. Краще б я осліп.","~2 {friend}. Знайома пика. Норм.","~3 {friend}. Пам'ятаю. Нормальн{>ий|а}, нічо не скажу."],"ма_відтоді":["Вперше {>він|вона} припе{>рся|рлася} до нас {since}. І досі не {>звалив|звалила}, {м_слівце}.","{friend}… Знайомі ше з того часу — {since}. Я все пам'ятаю. Все, бля.","Пам'ятаю день, коли {friend} прилі{>з|зла}: {since}. Відтоді спокою нема, хоч вішайся.","Ше відтоді — {since} — {friend} мені нерви мотає. На кулак.","Знайомі ше з того часу — {since}. Терплю, як святий.","~1 {friend} припе{>рся|рлася} {since}. Нашо — не знаю.","~2 Ше відтоді — {since} — {friend} поруч. Звикли, шо поробиш.","~3 З першого дня — {since} — {friend} вже св{>ій|оя}. Ну, майже, бля."],"ма_шолом":["{helmet}? На тій макітрі? Даром залізо пропало, {м_слівце}.","{helmet} — річ гарна. А на {>ньому|ній} — як на корові сідло.","{helmet}. Голова в залізі, а в голові — іржа.","Відро на голову натягну{>в|ла}. {helmet}, кажеш? Пф.","{helmet}. Дорога бляшанка, бляха.","{helmet} на голові, а мізків не додалось ніхуя.","Шолом є — {helmet}. А голова під ним — ну таке.","~1 {helmet}. Дзьобну крізь нього. На шо поспоримо?","~2 {helmet}. Ну, гарна штука, шо.","~3 {helmet}. Тобі б теж отаке, курва. Я ж переживаю, бля."],"ма_без_шолома":["Без шолома, {м_слівце}. Я вже пригледів, куди дзьобати.","{friend} знов з голою макітрою. Одна стріла — і гаплик.","Голова гола, як у малого. І мізків стільки ж.","Без шолома ходить. Сміливість чи дурість? Ставлю бабки на друге.","Без шолома. Дзьобати — одне задоволення.","Макітра гола, як яйце.","Без шолома, бо мізків берегти нема шо.","~1 Без шолома. Ну, стріла сама знайде, і похуй.","~2 Скажи {>йому|їй} шолом вдягти, бо шось буде.","~3 Без шолома… Ну шо за люди. Хай вдягне, бляха."],"ма_будь_що":["{friend}. Пика дивна. Але бувають і гірші. Твоя, наприклад.","Шо ти так витріщаєшся? Закоха{вся|лася}, чи шо?","{friend} знов шось жує. Поділиться? Хуй там.","Дивлюсь і ніхуя не вкурю. Нашо така людина взагалі є?","~3 {friend} нормальн{>ий|а}. Тіко не передавай. Я тебе знаю, балабол.","{friend}. Пика як пика. Бачили й гірших.","{friend} шось бурмоче. Йобнут{>ий|а}, сто пудів.","Шо {friend} так шкіриться? Шось спиздив, по-любому.","Від {friend} смердить димом і пригодами. І ше чимось.","~1 {friend}. Очі б мої не бачили.","~2 {friend} — та норм, шо.","~3 {friend} — нормальн{>ий|а}, курва. Тіко ти не кажи."],"ма_сокира":["Знов з сокирою. Ліс від {>нього|неї} вже плаче, {м_слівце}.","Рубає й рубає. Хоч би раз так ворогу в табло.","Сокира в руках, а мізків — як у пенька.","Глянь, як рубає. Тобі б так пахати, а не ото.","{friend} рубає. А тріски — в мене, бля, летять.","Рубає, як не в собі.","Стук-стук. Сокира стукає. Мені по нервах, нахуй.","~1 Рубає криво, як косий.","~2 Хай рубає. Дрова — то тепло, шариш?","~3 Гарно рубає, трясця. Повчися, га."],"ма_кайло":["Кайлом махає, {м_слівце}. Гуркіт на весь світ, бля.","Знов руду довбає. Хоч би з тобою поділи{>вся|лася}, жадюга.","Копає, копає… Ше трохи — і до Гель докопається, а там пиздюлів дадуть.","Пилюка, гуркіт і {friend}. Звична картина, хулі.","{friend} довбає скелю. Гуп-гуп. Гуп-гуп. Заїбав.","Кайло стукає, а я глухну, курва.","Копає, як кріт сліпий.","~1 Довбає, довбає, а руди — хуй. Сміхота.","~2 Хай копає. Руда — то бабло.","~3 Гарно довбає, бляха. Ше трохи — і багаті."],"ма_зброя":["{weapon}? Ну-ну. Подивимось, хто кого, бля.","{friend} зі зброєю. Тримайся подалі, {м_слівце}, бо мало шо.","Махає зброєю, ніби шарить, шо робить.","{weapon}. Якби я мав руки — мав би кращу. По-любому.","{weapon}. Гостре? Давай на комусь перевіримо.","Зброя в руках, а пика — дурна-дурна.","{weapon}. Ну махни, махни. Подивимось.","~1 Махає зброєю, як двірник мітлою.","~2 {weapon}. Добра штука, дідько.","~3 Зі зброєю {friend} — надійн{>ий|а}. Курва, визнаю. Не звикай."],"ма_близько":["Відсунься від {>нього|неї}, бо тісно, {м_слівце}.","Ше крок — і дзьобом в ніс.","{friend} дихає мені прямо в пір'я. Фу, бля.","~3 Стоїте близько. Норм. Тіко не обіймайтесь, бо блюватиму.","Шо лізе так близько? Шо треба?","Ше крок — і пір'я полетить. Чиє — побачимо.","{friend} дихає, як троль після цибулі.","~1 Відсунься, вонючка.","~2 Близько. Ну, хай.","~3 Свої — хай стоять близько. Мені не шкода."],"ма_корабель":["Ти й {friend} на одному кориті. Потонемо — я перший звалю.","Хто {>йому|їй} кермо дав? Я на берег хочу, {м_слівце}!","Хитає. І {friend} хитає. Ви шо, бухали без мене?","Один корабель, двоє дурнів і я. Охуєнно.","Двоє лохів у кориті. І я, красень.","{friend} в море дивиться. Зара буде блювати, сто пудів.","Корабель рипить, як ти, коли встаєш.","~1 Потонемо — я перший звалю, і похуй на вас.","~2 Пливемо. Вітер — во!","~3 На морі зі своїми не страшно. Ну, трохи страшно. Але не кажи."],"ма_ніч":["Ніч, а {friend} шастає. Пригод на дупу шукає, {м_слівце}.","Темно, а ти на {>нього|неї} витріщаєшся. Шо ти там бачиш, га?","Вночі всі однакові. Однаково тупі.","Двоє в темряві. Хтось по-любому в яму йобнеться.","Ніч, а {friend} шастає. Хоче, шоб зжерли.","Темно, курва. Двоє сліпих і я.","Вночі всі пики однакові. Гидкі, бля.","~1 Двоє в темряві. Хтось точно здохне. Ставлю на тебе.","~2 Тримайтеся світла, кому кажу.","~3 Добре, шо вночі ви вдвох. Мені спокійніше, чуєш."],"ма_буря":["Буря, а ви гуляєте. Ну геніальні, {м_слівце}, шо скажеш.","{friend} мокр{>ий|а}, як щур. І ти теж, не смійся.","Грім, блискавки — а {friend} стоїть. Мо', вже йобнуло?","Я мокрий, ти мокр{ий|а}, {friend} мокр{>ий|а}. Компанія — пиздець.","Мокрі, як щури, обоє. Бляха-муха.","Буря, а {friend} навіть не ховається. Ну тупе ж, їй-бо.","Гримить, а ви мокнете. Краса, шо.","~1 Двоє мокрих курей. Ха!","~2 Сховайтеся вже, бо простудитесь, дурні.","~3 Мокнемо разом, братан. Ну і хуй з ним."],"ма_заздрість":["{fraven}… Тьху. А я шо, гірший? Годуй нормально!","Легенда на {>його|її} плечі. А в тебе — я. Радій, {м_слівце}, шо ше.","Не заздрю. Ні разу, {м_слівце}. Зовсім. Ну.","~3 Колись я буду крутіший за ту легенду. Ти ж поможеш, братан?","{fraven}. Тьху. Я кращий. Сто пудів.","А мене ти коли прославиш, жмоте?","Легенда поруч, а мене годують абияк. Аби-як, бля!","~1 Годуй краще — і я теж стану. Шариш логіку?","~2 Ну, гарне ім'я. Мені б таке, ех.","~3 Колись і я, курва. Разом з тобою, брате."],"ма_вдарив_ти":["О, по своїх лупиш? Оце я розумію, {м_слівце}! Ше давай!","Гарно вліпи{в|ла}. Ану ше раз, для мене.","Своїх лупиш? Тепер {friend} образиться. І правильно, бля.","~3 Ти шо твориш? Своїх не чіпай. Тіко мені можна.","Своїх гасиш? Ото по-нашому, курва.","Ха! Прямо в табло!","Ну все, війна. Я готовий, я завжди готовий.","~1 Ше раз! Ше! Я не роздивився.","~2 Вибачся, чуєш. Свої ж.","~3 Не бий своїх, нахуй. Тіко я можу."],"ма_вдарив_тебе":["{friend} тебе вдари{>в|ла}! Дзьобнути у відповідь? Ну скажи, шо так!","Бачи{в|ла}? Руку на тебе підня{>в|ла}, {м_слівце}!","Хто тебе вдарить — матиме справу зі мною. Навіть свій. Особливо свій.","Випадково? Ага, аякже. Я запам'ятав.","Хто посмів?! {friend}? Ну все, пизда.","Руку підня{>в|ла} на мою людину? Ну зара.","Я цей удар запам'ятав, {м_слівце}. Я все запам'ятовую.","~1 Дай здачі. Чи я дам, і тоді всім пиздець.","~2 Мо', випадково. Мо', й ні. Хуй його знає.","~3 Не відповідай. Я сам розберусь, по-тихому."],"мв_поранений":["Поранен{ий|а}, зате жив{ий|а}. А твоя людина, {addr}, від бджіл драпала.","Ше слово — і поранений буде хтось інший, {м_слівце}. Вкурив?","Подряпина. А от твоя людина — суцільний синяк для очей.","Не твоє собаче діло, {addr}.","Поранен{ий|а}, зате не ссикло, як твоя людина.","Кров — то прикраса, {addr}. Тобі не зрозуміти.","Не твоя справа, {м_слівце}. Йди дзьобай своє.","~1 Ше слово — і поранений будеш ти, пернатий.","~2 Заживе. Як на собаці.","~3 Дякую, {addr}. Ну, хай."],"мв_спить":["Тіко спробуй вуса малювати, {addr}. Без пір'я лишишся, сто пудів.","Хай спить. А ти, {addr}, дзьоба закрий.","Розбудиш — дзьобну. Обох. По черзі.","Сам ти хропеш, {м_слівце}. Я чув.","Цить, {addr}, бо дзьобну.","Спить — і хай спить, {м_слівце}. Тобі шо?","Розбудиш — будеш мені пояснювати. Довго.","~1 Закрий дзьоба, {addr}.","~2 Хай дрихне, кому сказав.","~3 Дякую, шо тихо. Май совість і далі."],"мв_бос":["Ага, {addr}, а хто там верещав? Не моя людина, сто пудів.","Моя людина гатила. Твоя — колами бігала, {м_слівце}.","Я все пам'ятаю. Особливо, як твоя людина гепнулась.","~3 Гарно тоді рубались. Визнаю. Раз. Більше не почуєш.","Пам'ятаю, {addr}. Твоя людина верещала, як порося різане.","Моя людина гатила, а твоя — дивилась, роззявивши рота.","Не перекручуй, {м_слівце}. Я там був.","~1 Твоя людина там мало не обісралась. Я нюхав.","~2 Добрий був махач, трясця.","~3 Разом гатили. Визнаю, курва."],"мв_ворон":["Так, я {me}. Ше питання є, {м_слівце}?","Ше раз про моє ім'я писнеш — дзьобну, {addr}.","{me} — і пишаюсь. А ти хто такий, {addr}? Шо за птиця?","Дивись на свого хвоста, {addr}. Він у тебе засраний.","Я тебе теж бачу. І мені не подобається, шо я бачу.","Я {me}, і шо?","Мене обговорюєш? Ну-ну, {addr}. Ну-ну.","Про мене балакають? Правильно. Є про кого.","~1 Ше слово — і без пір'я, {addr}.","~2 Ну, я. І шо, {м_слівце}?","~3 Дякую, {addr}. Ти теж нічо такий."],"мв_новий":["Це {name}, а я {me}. Запам'ятай і не мозоль очі, бо виклюю.","Чуж{ий|а}? Сам ти чужий, {addr}.","Ми тут давно. Це ви новенькі, {м_слівце}.","Знайомитись не буду. Ну… та добре. {me}. Задоволений?","Я {me}. Запам'ятай, бо дзьобну, і тоді вже точно не забудеш.","Новенькі тут ви, {м_слівце}, а не ми.","Знайомитись? Ну давай, {addr}, тіко швидко.","~1 Чужий? Сам ти чужий, гівнюк.","~2 Здоров, бля.","~3 Радий, {addr}. Чесно-чесно."],"мв_свій":["Майже любиш? Я тебе теж майже терплю, {addr}.","Йой, {addr}, не лізь з телячими ніжностями, {м_слівце}.","Свої — то свої. Але дзьоба тримай при собі, ясно?","~3 Добре. Свої. Тіко нікому не кажи, бо засміють.","Свої, {addr}. Не розкисай, як каша.","Ми вас теж терпимо, {м_слівце}. Ледь-ледь.","Свої — то свої. Але дзьоб при собі, бо відкушу.","~1 Не лізь з ніжностями, бо блюватиму.","~2 Ну, взаємно, хулі.","~3 Добре, що ви є, курва. Мовчи."],"мв_знайомий":["Бачились, ага. Мене теж не вставило.","Пам'ятаю твою пику. На жаль, бляха.","Знайомий — то ше не кент, {м_слівце}.","Ну бачились. І шо тепер, цілуватись?","~3 Пам'ятаю. Ти ніби нормальний. Для чужого.","Бачились, {addr}. На жаль.","Знаю тебе. Не вразив, бля.","Знайомі — і шо з того?","~1 Краще б не бачились, їй-бо.","~2 Здоров, {addr}. Знов.","~3 Пам'ятаю, {addr}. Ти пацан нормальний."],"мв_шолом":["Голова як голова. На свою людину глянь, {addr}.","Шолом не шолом — а тебе я дзьобну без шолома, {addr}.","У твоєї людини в голові порожньо — їй шолом і нахуй не треба.","Залізо — для ссикл. Чи для розумних. Сам вирішуй.","Голова в залізі — і шо, {addr}?","Шолом — для розумних. Твоя людина про таке й не чула.","Не заздри, {м_слівце}. Тобі не личить.","~1 Шолом є, а тебе я й без шолома дзьобну.","~2 Гарний, ага. Знаю.","~3 Дякую, {addr}. Ну, нормально."],"мв_робота":["Хоч хтось пахає. Не твоя людина, сто пудів.","Не заважай, {м_слівце}. Робота стоїть.","Рубає — значить, буде тепло. А вам — дуля з маком.","Позаздриш потім, як у нас хата буде, а у вас — нора засрана.","Пахаємо, {addr}. Не те шо ви, дармоїди.","Не заважай, {м_слівце}, бо дзьобну.","Хтось мусить рубати. Не ти ж.","~1 Відвали, працюємо, нахуй.","~2 Робота йде. Не муляй.","~3 Поможете — поділимось. Чесне воронове."],"мв_зброя":["Хочеш гостроту перевірити, {addr}? Підходь ближче.","Зброя — для дурних питань. Як твоє.","Напоготові. Бо поруч ти, {м_слівце}.","Не тицяй дзьобом, бо відчикрижу.","Гостре, {addr}. Хочеш на собі?","Зброя на місці. Бо ти поруч, ясне діло.","Не тицяй, бо відріжуть, і шо тоді?","~1 Ше слово — і перевіримо на тобі.","~2 Звичка, ясно? Не бери в голову.","~3 Добре, шо свої, {addr}. Бо всяко буває."],"мв_близько":["Це ти близько, {addr}. Відсунься, бля.","Тісно? То лети звідси, {м_слівце}.","Ше ближче — і ти без пір'я.","Дихай в інший бік, {addr}, бо смердить.","Відсунься, {addr}. Ну!","Тісно? Лети нахуй.","Ше ближче — і пір'я полетить. Твоє.","~1 Дихаєш, як дохла риба.","~2 Ну, близько. І що?","~3 Свої — хай стоять. Мені не шкода."],"мв_корабель":["Моя людина кермує. Твоя — блює через борт.","Не подобається — стрибай за борт, {м_слівце}.","Хитає? Бо ти легкий. Одне пір'я і гонор.","Мовчи, бо накаркаєш шторм, і тоді всім гаплик.","Кермо в руках. Твоя людина б нас втопила нахуй.","Не розгойдуй, {м_слівце}.","Пливемо. Мовчи вже.","~1 Вистрибуй, як не подобається.","~2 Добре йдемо, як по маслу.","~3 Разом пливемо, курва. Норм."],"мв_ніч":["Темно. Ти навіть не допетраєш, як я дзьобну.","Мокро, темно і ти. Гірше нема, {м_слівце}.","Темряви боїшся, {addr}? Ха! Ссикло.","Буря — то дрібниці. Ти — от де проблема.","Темно — і шо, {addr}?","Боїшся? Ха-ха.","Буря — хуйня. Ти — проблема.","~1 Ховайся, ссикло пернате.","~2 Тримаймося купи, бо всяке буває.","~3 Добре, що ви тут, {addr}."],"мв_заздрість":["Заздриш, {addr}? Правильно робиш.","Ім'я я заслужив. А ти — тіко пиздів.","Легенда — я. А ти — так, пір'їнка.","Плач тихіше, {м_слівце}.","Заздриш? І правильно, {addr}.","Ім'я треба заслужити, {м_слівце}, а не кар-кар.","Плач тихіше, бо вуха в'януть.","~1 Тобі такого ніколи не дадуть. Ніколи, чуєш.","~2 Дякую. Приємно, бляха.","~3 Колись і в тебе буде, {addr}. Може."],"мв_удар":["Випадково. Але приємно, {м_слівце}.","Сам підставився. Я все бачив, все.","Ну вдарили. Не здох же.","Ше раз скажеш — і моя людина вріже по-справжньому.","Випадково. Ну, майже.","Сам підставився, {м_слівце}. Нехуй було.","Ну вдарили. Живий же, шо ниєш?","~1 Ше раз — і по-справжньому, в табло.","~2 Вибачимось. Мо'.","~3 Вибач, {addr}. Не хотіли. Ну, трохи хотіли."],"мв_будь_що":["Шо вирячився, {addr}?","Ще слово про мою людину — і твоя лишиться без ворона, {м_слівце}.","Обговорюєш нас? Я теж можу. Про твою людину є шо сказати, ой є.","Каркай собі. Мені похуй.","~3 Та добре. Сказав — і досить.","Шо ти вирячився, {м_слівце}?","Обговорюєш? Я теж умію, ше й як.","Дивись на свою людину, {addr}. Там є на шо подивитись.","~1 Відвали, {addr}.","~2 Почули, почули.","~3 Добре, {addr}. Дякую."],"муд_вбив":["{target} — на фарш, курва! Ото я дав!","Від {target_gen} тіко клапті лишились. Ням. Смачненько, бля.","Порвав, {м_слівце}! На шматки! Хто там наступний, давай сюди!","{target} — труп, все. Нюхни, як пахне! Кайф же, ну.","Ше один готовий. Кишки я собі заберу, на пам'ять, гиги.","Розпанахав, як мішок з гнилою рибою. Фу, бля. Але кайф.","Я в кровищі по самі пір'їни. Краса, їй-бо.","Отак Мунін рве, {м_слівце}! Запиши собі десь!","Одним уродом менше. І шо, хтось плакатиме? Нє.","Геть нахуй з мого району!","Розмазав, як гівно по стіні. Можеш ноги витерти.","Все, курва. І писку не було. Чисто.","~1 Знов я гашу, а ти стовбичиш, як пень обісраний.","~1 Та ти б сам{|а} до ночі тут колупа{вся|лася}, {м_слівце}. Лошара.","~2 Ше тепленьке. Ух, люблю, бля.","~2 Чисто, швидко, з кровищею. Як я люблю, ага.","~3 За тебе я будь-кого порву. Будь-кого, чуєш? Хай тіко сунуться.","~3 Мою людину ніхто не чіпає. Ніхто, бля. Це моє."],"муд_вбив_оцінка":["Ше давай!","Хто там наступний, га?","Мало, бля!","Тьху, слабак. Дохляк.","~1 Дивись і вчись, лошара.","~3 Це тобі. Подарунок. Ну."],"муд_невдача":["КУРВА! Не пробив, нахуй! Шкура, як у дуба кора!","Та шо ж таке, {м_слівце}! {target} ше живе, прикинь?!","СУКА! Кігті з'їхали, бля!","Не пройшло. Шкура в цього виродка товста, як твоя тупість, їй-бо.","{target} ше стоїть?! Та мене зара розірве, нахуй!","Ах ти ж падлюка живуча! Я тебе, гниду, ше дістану!","Пір'я дибки, а толку — нуль. Нуль, бляха! Сміх, а не удар.","Мої кігті! Мої, курва, кігті! І ніхуя!","Тьху! Подряпинка! Я шо, кошеня якесь, подряпинки робити?!","Хто, нахуй, цим тварюкам шкуру кує, га?! Я питаю, хто?!","Не добив. Ну я й лох. Зара сам себе дзьобну, їй-бо.","Та ну нахуй! Майже ж було! Ну майже, ну!","Йобаний світ! Навіть {target} з мене ірже!","Ото шкура в {target_gen}, трясця. Товста, як у твоєї тещі.","~1 Не пробив. А ти шо, чуда чека{в|ла}? Йди сам{|а} бий, {дармоїде|дармоїдко}!","~1 Шоб я ше раз за тебе літав? Хуй там, {засранцю|засранко}!","~2 Не вийшло, хай йому грець. Добивай, поки я тут матюкаюсь.","~2 Тіко розлютив, бляха. І себе, і {target_gen}. Молодець я, ага.","~3 Не дістав. Ну не дістав, шо. Добий, а я потім відіграюсь, чесно-пречесно.","~3 Сука… Ну, вибач. Наступного разу порву на шматки, зуб даю."],"муд_невдача_кінець":["Добивай, шо ти стоїш!","Тепер ти, {м_слівце}. Ворушись.","Я ше вернусь. Злий, як собака.","Наступного разу — в клапті, нахуй.","~1 І не ржи мені тут.","~3 Я тут, поруч. Не бійсь."],"мд_впертість":["Ти {ЗДОХ|ЗДОХЛА}?! Ти, курва, {ЗДОХ|ЗДОХЛА}?! Та я тебе за це сам приб'ю!","Ше раз так зробиш — я тобі сам баньки видзьобаю, {м_слівце}!","Валькірії прилетіли, а я їм: «Пішли нахуй, це моє!» І пішли. Шо, слабо?","Я тебе з того світу за шкірку витяг, {м_слівце}. Цінуй, бляха!","{Здох|Здохла}, як {останній дурень|остання дурепа}. Я аж охрип, так орав.","Ти знаєш, як я злий? НІ, НЕ ЗНАЄШ, КУРВА!","Хто тебе завалив? Кажи, хто. Я йому кишки на дзьоб намотаю, чесне слово.","Ти хоч дивишся, куди преш, {м_слівце}?! Голова тіко шолом носити?!","Я сидів на твоєму трупі й матюкався на весь ліс. Навіть Одін почув і сказав «ого».","Ше одна така смерть — і я піду до іншого. Пизджу. Але подумай, сука.","Ти хоч знаєш, як твій труп смердить? А я знаю. Я там СИДІВ.","Ну ти й лошара, йобаний. Вставай. Пішли мститись.","~1 {Здох|Здохла}? І нашо я тебе вчив, га? Нашо, бля?","~1 Ше раз — і я тебе сам доклюю, шоб не {мучився|мучилась}.","~3 Не смій. Чуєш? НЕ СМІЙ більше так. Я… я зассав, сука. Ну. Не дивись.","~3 Без тебе нудно, курва. Не здихай, братан.","{Думав|Думала}, позбудешся мене? Хуй там, {name}.","Могила, бля? Ото й лізь у неї. А я лишаюсь, нахуй.","Я в тебе кігтями вчепився, {name}. Валькірії хай ідуть у сраку.","{Здох|Здохла}, а я досі тут. Хтось же мусить тобі це згадувати. До наступної смерті.","Не радій, {name}. Я лишився не через тебе. Через твою дурість. Шоб дивитись.","Ти знову {здох|здохла}. Я знову тут. Ми, сука, як той… нерозлийвода."],"мд_повернення":["Нарешті, бля! Я там лежав, як дохлий оселедець, {м_слівце}!","Ти мене в могилі покину{в|ла}? В МОГИЛІ, сука?!","Землею тхне й твоєю тупістю. Валимо звідси.","Ше раз закопаєш мене в яму — я тебе туди ж і закопаю. Чесне слово.","Лежав між твоїми вонючими онучами й тухлою рибою. Ну дякую, блядь, за хату.","~1 Ти по мене чи по свої труселя прийш{ов|ла}?","~3 {Знайшов|Знайшла} мене. Ну добре. Ну… тіко більше так не роби, чуєш?"],"ем_танець_м":["Знов {цей їбанько|ця їбанька} танцює. Ну все.","Шо {він|вона} робить? Шо це за корчі, га?","Я злетів, бо мене від цього нудить, бля.","Ногами дриґаєш, як курка лапами.","Танцюй, танцюй. Вовки вже в кущах ржуть.","Від такого танцю драугри б драпали, нахуй.","~1 Ше раз так смикнешся — дзьобом у тім'я.","~2 Ну, хоч не стовбичиш, як пень.","~3 Ну… смішно, бляха. Не зупиняйся, засранцю.","Це танець чи тебе бджола в сраку вжалила?","Земля аж двигтить. Тіко не від краси, а від ваги.","Гиги. Шкода, шо Одін цього не бачить. Він би ржав до Рагнароку.","Ти мене трясеш, як грушу. Я ж не пацан на гойдалці, бля.","~1 Затанцюй ше раз — і я сяду на іншого дурня.","~1 Позорище. Навіть кабани відвертаються.","~2 Ліва нога ше нічо. Права — то пиздець.","~2 Ну, ритм є. Десь глибоко. Дуже глибоко.","~3 Давай, братуха, я крилами підтанцюю. Тіко шоб ніхто не бачив, ага?","~3 Криво, косо, але від душі. Мені, курва, подобається."],"ем_голова_м":["Ти шо, головою об повітря гупаєш?","Тряси, тряси. Мо', мізки на місце стануть.","Мене з плеча мало не знесло, довбню!","Як дятел. Тіко дятел хоч жука дістає.","~1 Ше трохи — і голова відпаде. Та й хуй з нею.","~2 Тряси сильніше. Там шось бряжчить.","~3 О, оце по-нашому, братан! Ше!","Шо, знов у голові шось застрягло? Витрушуй.","Все пір'я мені розкуйовдилось, бля. Через тебе.","Тук-тук, хто там? Нікого. Пусто, як у бочці.","Отак і буває, коли в дитинстві без шолома бігали.","~1 Розженись і об камінь. Буде швидше.","~1 Довбиш, довбиш, а розуму не додалось, курва.","~2 Ну, хоч ритм тримаєш. Вже прогрес.","~2 Тряси, тіко шию не скрути. Бо хто мене носитиме?","~3 Давай разом! Я теж дзьобом киваю, бачиш?","~3 Хуйово виходить, але з вогником. Моя школа."],"ем_махає_м":["Кому ти там махаєш, {м_слівце}?","Ше помахай. Мо', хтось тебе нарешті забере.","Не махай мені перед дзьобом, бо відкушу.","Махає. Як млин. Без вітру. Дурне.","~1 Та хто тобі відмахне, лошара?","~2 Махай. Тіко не кулаком мені.","~3 Помахай і від мене. Я крилом не можу, сиджу.","Махаєш, а тебе ніхто не бачить. Як завжди.","Це ти мух ганяєш чи прощаєшся, {м_слівце}?","Ого, як{ий|а} привітн{ий|а}. А мені хоч раз помаха{в|ла}?","Рука відвалиться — я її не понесу, бля.","~1 Помахай ше Одіну. Мо', забере тебе нахуй з моїх очей.","~1 Не махай. Тебе й так усі соромляться.","~2 Привіт, привіт. Тепер ходімо вже, {м_слівце}.","~2 Ну, махнула рука — і нічо не впало. Вже добре.","~3 Махай, братуха. Хай знають, шо з нами ворон.","~3 Я теж махнув. Крилом. Ти не бачи{в|ла}, але махнув, курва."],"ем_кличе_м":["Кого кличеш? Мене кликати не треба, я й так тут, бля.","Ше когось кличе. Нам двох мало, га?","Ходи сюди, ходи сюди… А потім сам{|а} драпатимеш.","~1 Покличеш троля — сам{|а} з ним і розгрібай.","~2 Кличеш? Хоч би когось із жрачкою.","~3 Та тут я, засранцю. Не ори.","Пальцем мене не клич. Я тобі не пес.","Ходи, ходи… Тебе ж однаково ніхто не слухає, бля.","Кличе, кличе, а ніхто не йде. Гиги.","Якшо кабана кличеш — то він тебе й зжере.","~1 Хто до тебе прийде, {name}? Хіба шо мухи.","~1 Ше раз поклич, лошара. Мо', дух предків прийде пожаліти.","~2 Кого там? Якшо ше одного ворона — я ревнуватиму.","~2 Ну клич, клич. Тіко шоб не драугр приперся.","~3 Покличеш — і я поруч, хоч куди. Запам'ятай, засранцю.","~3 Не треба нікого. Нас і так досить, братуха."],"ем_тиче_м":["Куди тичеш? Там нема шо жерти.","Пальцем у небо. Розумник, бля.","Шо там? Шо там?! А, ніхуя.","~1 Ше раз тицьнеш — я тебе туди й відправлю. Пинком.","~2 Там шось є? Якшо смачне — я перший.","~3 Бачу. Підем наваляємо?","Пальцем тицяти — некультурно. Я тут, бля, культурний ворон.","Там ворог? Нема ворога. Тіко кущ.","Ага, бачу. Нічо не бачу. Гарно показа{в|ла}.","Ти мені дорогу показуєш? Я ж літаю, дурне.","~1 Палець свій туди засунь, де сонце не світить.","~1 Ну й шо? Мені похуй, шо там.","~2 Там? Ну, гляну. Але якшо фігня — з тебе жрачка.","~2 О, справді шось є. Вперше за тиждень у точку.","~3 Покажи — і я туди першим. Так, братуха?","~3 Бачу, бачу. Хто там є — тому зара буде боляче, курва."],"ем_рик_м":["РРРА! Оце по-нашому, {м_слівце}!","Ричиш, як кабан, шо свиню шукає.","Ори голосніше — мо', хтось і зассить.","~1 Від твого рику навіть миша не тікає. Сидить, жує.","~2 Гаркну{в|ла}. Ну, хоч шось.","~3 Гарно гаркну{в|ла}, бляха. Аж мені зайшло.","Шо, в горлі кістка застрягла?","Ой, вухо! Тепер я на одне вухо глухий, бля.","Ну й рик. Як у цапа, шо застряг у паркані.","Рикни ше, {м_слівце}. Хай усі знають, хто тут дурень.","~1 Ори не ори, а троль усе одно тебе розмаже.","~1 Голос є. Мізків нема. Пиздець, а не воїн.","~2 Непогано. Мишу б уже налякало.","~2 Гучно, гучно. Тепер ше раз, але страшно.","~3 Отак! Ше раз — і я каркну слідом, хай знають наших.","~3 Аж пір'я дибки стало, курва. Гарно, братуха."],"ем_радість_м":["Шо ти радієш? Ніхуя ж не сталося.","Скаче, радіє. Видно, раз у житті шось вийшло.","Палець вгору? Я б тобі інший показав, {м_слівце}.","~1 Радій, поки можеш. Зара знов усе просереш.","~2 Ну, радій. Заслужи{в|ла}, мо'.","~3 Ну радій, радій. Мені не шкода.","Ну все, свято. Хто вмер?","Руки вгору? Ти шо, здаєшся, {м_слівце}?","Скачеш, а я на плечі, як на возі по камінню, бля.","Чого радієш? Мені теж скажи, я порадію.","~1 Тиждень нічо не виходило — і на тобі. Аж страшно.","~1 Рад{ий|а}, як дурень торбі. Сором, курва.","~2 Ну давай, гиги. Раз уже тобі пофартило.","~2 Радій. Тіко не скач так, бо я злечу.","~3 Ей, а я теж радий! Сам не знаю чого, але радий, бля.","~3 Заслужи{в|ла}, братуха. Чесно. Тіко не кажи Хугіну, шо я так сказав."],"ем_ні_м":["Ні-ні-ні, а хто тоді перднув?","Шо «ні»? Я ше навіть нічо не сказав.","Головою мотаєш, як корова від мух.","~1 Ні? Ну то йди сам{|а}, хуле.","~2 Ні так ні. Я теж не дуже хотів.","~3 Та добре, не будемо. Ти тут головн{ий|а}, ага.","Не хочеш? Ну й сиди голодн{ий|а}.","Ой, які ми принципові, бля.","Пальцем мені не тряси. Я не дитина.","Мотаєш головою. А сам{|а} хоч знаєш, проти чого?","~1 Ні в тебе на все. А як робити — то ніхуя.","~1 Ага, ні. Бо думати важко.","~2 Ну ні то ні. Але потім не скигли.","~2 Тобі не треба? То я з'їм. Гиги.","~3 Ні — значить ні. Я за тебе, навіть коли ти впер{ся|лася}, як осел.","~3 Ну то й нахуй ту ідею. Тобі видніше, братуха."],"ем_цілунок_м":["Фу. Тьху. Не роби так при мені, бля.","Кому ти там цьомки шлеш, {м_слівце}? Троль не оцінить.","Ше раз — і я тобі на плече блюватиму.","~1 Цілуй себе в лікоть, чмо.","~2 Ну все, пішли телячі ніжності.","~3 Ну… якшо мені — то приймаю. Раз. Не звикай.","Губи трубочкою. Як риба на березі.","Цьом-цьом. Мене зара знудить, бля.","Хто ж так{ого|у} поцілує, {м_слівце}? Хіба жаба.","Ти шо, закоха{вся|лася}? В кого, в кабана?","~1 Ше раз — і я тобі ті губи дзьобом підправлю.","~1 Тьфу, гидота. Краще б ти слимака лизну{в|ла}.","~2 Ой, все. Я, бля, сором'язливий, відвернусь.","~2 Шли, шли. Тіко не мені в дзьоб.","~3 Ну добре, добре. Я теж тебе… терплю. Сильно терплю.","~3 Від тебе — візьму, засранцю. Але Хугіну ні слова."],"ем_уклін_м":["Перед ким ти гнешся? Ні перед ким не гнись, {м_слівце}.","Кланяйся, кланяйся. Я на тобі все одно вище, хе.","Мене мало з плеча не зсипало, бля.","~1 Плазуєш. Як завжди, терпило.","~2 Гнись, гнись. Тіко мене не впусти.","~3 Гарно вклони{вся|лась}. Але переді мною можна й нижче, ага.","Шо, гроші на землі побачи{в|ла}?","Вклони{вся|лася} — і сраку всім показа{в|ла}. Молодець.","Кому кланяєшся, {м_слівце}? Тут тіко я й комарі.","Так гнешся, шо я ледь за вухо втримався.","~1 Спина гнучка, а характеру нуль, бля.","~1 Гнись, гнись. Одін на таких і не дивиться.","~2 О, ввічлив{ий|а}. Шо, від Хугіна набра{вся|лася}?","~2 Ну, вклін як вклін. Колінця тіко трохи тремтять.","~3 Вклонись, вклонись. Але знай: ти ні від кого не гірш{ий|а}, братуха.","~3 Красиво, курва. Я б і сам вклонився, якби спина гнулась."],"ем_страх_м":["Ти шо присі{в|ла}? Обісра{вся|лась}, чи шо?","Встань, ганчірко. Я ж тут, бля.","Засса{в|ла}? Ссикло чистої води.","~1 Ше й трусишся. Ну ти й ссикло, їй-бо. Мені на людях соромно.","~2 Встань. Нікого нема. Я дивився.","~3 Не бійся, засранцю. Хто полізе — того я першого.","Сховатись хочеш? За мене? Я ж ворон, а не щит.","Ти так трусишся, шо я аж підстрибую, бля.","Шо там, павук? Павука зляка{вся|лася}?","Сіла жаба на купину і дрижить. Отак і ти.","~1 Вставай, бо я сам тебе дзьобну. Тоді буде чого боятись.","~1 Ну й героя мені Одін підсунув. Срака тремтить.","~2 Тихо, тихо. То вітер. Ну, мо', не вітер, але тихо.","~2 Злякатись — то не гріх. Гріх отак довго сидіти, бля.","~3 Я поруч, чуєш? Хай тіко сунеться — очі видзьобаю.","~3 Боїшся — бійся. Але я тебе не кину, засранцю."],"ем_плач_м":["Ти шо, рюмсаєш? Серйозно?","Перестань. Бо я теж зареву. Від сорому за тебе.","Шмарклі витри, бля.","~1 Плач, плач. Соплями троля не завалиш.","~2 Ну, годі. Поплака{в|ла} — і хорош.","~3 Ну, годі. Я тут. Хочеш — когось клюну за тебе? Кого, кажи.","Ото розвели болото. Тут і без тебе мокро.","Сльози капають мені на лапи, бля.","Хто тебе образив? Покажи, я йому в миску насру.","Ревеш, як теля без мамки.","~1 Рюмса. Таких валькірії у Вальгаллу не пускають.","~1 Плач тихіше, курва. Я подрімати хотів.","~2 На, витри об моє крило. Тіко раз.","~2 Шо, все так погано? Ну, бува гірше. Не часто, але бува.","~3 Не реви, братуха. Хто тебе довів — тому я сраку розклюю.","~3 Плач, якшо треба. Я відвернусь і нікому не скажу."],"ем_мязи_м":["Ото м'язи. Як у курчати, бляха-муха.","Напинайся, напинайся. Я аж іржу.","Покажи це тролю, а не мені, {м_слівце}.","~1 Ше напнешся — і лусне. Шось важливе.","~2 Ну, шось там є. Мало, але є.","~3 О, а нічо так. Майже як мої крила.","Це м'яз чи комар укусив?","Напну{вся|лася} так, шо аж пукну{в|ла}. Я все чув.","Покажи другу руку. А, там те саме, {м_слівце}.","Ти плечем смикну{в|ла}, а я на ньому сиджу, бля.","~1 Біцепс як горох. Троль ржатиме до сліз.","~1 Хвалько, хуле. Краще б каменюку підня{в|ла}.","~2 Ну, ростеш. Потихеньку, але ростеш.","~2 Дай дзьобом помацаю. Ого, тверде. Майже.","~3 О, сила! З такою рукою, братуха, і троля завалимо.","~3 Гарно, бляха. Я б тобі й медальку дав, якби мав."],"ем_сміх_м":["Шо смішного, {м_слівце}?","Ржеш, як кобила. Мені, бля, зайшло.","З мене ржеш? Ну, начувайся.","~1 Ірже. А в торбі пусто.","~2 Ржи, ржи. Я теж колись поржу. З тебе.","~3 Ржеш заразно, засранцю. Аж мені смішно.","Гиги. Ну й регіт, аж вуха позакладало.","Хто сміється останнім — той ворон. Запам'ятай.","Смішно тобі? Мені теж. Бо ти смішн{ий|а}, {м_слівце}.","Ти так регочеш, шо в мене пір'я труситься, бля.","~1 Смійся. Над тобою ж уся долина сміється.","~1 Ржеш, а в голові вітер, курва.","~2 Ну, розкажи й мені. Я теж хочу поржати.","~2 Гиги… Тьху, зарази{в|ла} мене.","~3 Ржи, братуха. Як ти смієшся — то й мені легше.","~3 Ха! Оце ми з тобою, курва, пара дурнів."],"ем_плечі_м":["Ше раз смикнеш плечем — клюну.","Не знаєш? А хто знає, {м_слівце}?","Плечі — то моє сидіння. Не тряси, бля.","~1 Плечима знизує. Мудрець, йоб.","~2 Не знаєш — то не знаєш. Я теж без поняття.","~3 Нічо, засранцю. Розрулимо.","Знизуєш? А я ледь не полетів сторчака.","Шо значить — хто зна? Ти ж тут голова, {м_слівце}.","Нічо не знаєш, нічо не вмієш. Стабільність, бля.","Плечима не врятуєшся. Думай давай.","~1 Знизуй, знизуй. Мо', хоч думка якась випаде.","~1 Тобі похуй, мені теж. Отак і живемо.","~2 Ну, і я не знаю. Значить, рівні.","~2 Нічо, Хугін знає. Він завжди знає, зануда.","~3 Не знаєш? Похуй. Підемо — побачимо, братуха.","~3 Не знизуй так сумно. Я з тобою, а це вже пів справи."],"ем_лежить_м":["Лежити. А хто тебе захищатиме? Я, ясне діло.","Ну все, {він|вона} відпочиває. А я шо, в повітрі висітиму?","Вставай, ледащо, ше день не скінчився.","{Розлігся|Розляглася} тут. А мені де сидіти, га?","~1 Лежиш, як колода. Вороги кажуть дякую.","~2 Лежи. Я пильную. Ну, майже.","~3 Поспи. Я посторожу. Мо'.","{Ліг|Лягла}? А земля, між іншим, холодна.","Ну й хропиш, бля. Навіть ше не заснувши.","Лежиш, а комарі вже меню складають.","Хоч би трави підстели{в|ла}. Не по-людськи якось.","~1 Лежи, лежи. Вовкам зручніше, коли жрачка не бігає.","~1 Ледача срака. Вставай, Одін дивиться.","~2 Лежиш? Тоді я на пузі посиджу. Тепленько.","~2 Пів годинки, не більше. Потім дзьобну, бля.","~3 Спи, засранцю. Хто підійде — отримає в око.","~3 Відпочинь, братуха. Ти сьогодні нормально впахува{в|ла}."],"ем_тост_м":["За шо п'ємо? І де моє?!","Тост, а ворону не налили. Це, бля, образа.","Вище піднімай, {м_слівце}. І мені наливай.","~1 Бухає. А ворон сухий. Ото справедливість.","~2 Будьмо. Мені — краплину. Ну дві.","~3 За нас, засранцю. Будьмо, братан.","Знов за здоров'я? Для здоров'я краще б не пи{в|ла}.","Цокаєшся з повітрям. Друзів нема, бля?","Ти хоч закуси, {м_слівце}. Бо знов на мені заснеш.","Медовуху на мене не хлюпай. Я потім липкий, як муха.","~1 П'є, а ворону — дуля. Скнара.","~1 Ше ковток — і будеш з кабанами обніматись, хуйло.","~2 Ну, за удачу. Вона тобі ой як треба.","~2 Будьмо! А мені хоч понюхати дай.","~3 За Одіна, за нас і за того кабана, шо ми ше не з'їли, бля.","~3 Пий, братуха. Додому я тебе доведу, якшо шо."],"ем_рахує_м":["Шо ти там рахуєш? Свої мізки? Нуль.","Раз, два, три… Я вже засинаю.","Пальці рахуєш? Всі на місці? Шкода.","~1 Рахуй, рахуй. Вороги чекати не будуть.","~2 Бабло рахуєш? Скільки мені?","~3 До трьох рахуй — і в бій, братуха.","Далі десяти не вмієш, га? Пальці скінчились.","Сім, вісім… Збився. Знову з одного, бля.","Рахуєш, скільки разів сьогодні {помер|померла}? Пальців не вистачить.","Давай я порахую. Раз — ти дурне. Два — ти дурне.","~1 На пальцях рахує. Як мала дитина, курва.","~1 Скільки разів ти мене {підвів|підвела}? Пальців мало.","~2 Шо рахуємо? Якшо жрачку — я допоможу.","~2 Ну, на пальцях — то теж рахунок. Не сміюсь. Майже.","~3 Скільки б їх там не було — нас двоє, братуха. Вистачить.","~3 Лічи собі, засранцю. Я пильную, поки ти зайнят{ий|а}."],"ем_що_м":["Шо {він|вона} робить? Шо це взагалі за хуйня?","Знов {цей їбанько|ця їбанька} шось витворяє.","Я на це дивитись не буду. Ну, хіба трошки.","~1 Ганьба. Просто пиздець, а не ганьба.","~2 Ну і шо це було?","~3 Дивн{ий|а} ти. Але {свій|своя}, бля.","О, нова дурість. Я вже й не дивуюсь.","Ти це навмисно чи воно саме, бля?","Мені за тебе вже перед Хугіном соромно.","Хтось бачив? Ніхто не бачив. От і добре.","~1 Кривляйся далі. Мені з цього плеча однаково не втекти, курва.","~1 Одін дивиться на це і плаче. Одним оком.","~2 Гиги. Шо це було — не знаю, але ше раз.","~2 Ну, з тобою хоч не нудно. Тупо, але не нудно.","~3 Роби шо хочеш, братуха. Я однаково з тобою.","~3 Дурн{ий|а}, але {мій|моя}, бля. Нікому не віддам."],"мб_женеш":["Куди претеся, {addr}?! Горить шось?","{friend} несеться, як ошпарен{>ий|а}. Шо там, бля, сталось?","Пір'я тримай, {addr}, бо облізеш, ги!","Гей, {addr}! Шо, хтось за вами женеться?","~1 Біжи, біжи, курча обскубане.","~2 Не спіткнись, {addr}, бо я ржатиму, курва.","~3 Не загубись там, {addr}!"],"мб_поспіх":["З дороги, {addr}, нахуй!","Нема коли, {addr}, ми летимо! Ну, біжимо. Яка різниця.","Стоїте, як пні. А ми тут, бля, працюємо!","Ага, {addr}, стій тут, а ми далі. Бувай.","~1 Геть з дороги, бо затопчем і не помітим!","~2 Посунься, {addr}, ну!","~3 Не нудьгуй, {addr}! Ше заскочим."],"мб_назустріч":["Куди ти, {addr}, в той бік? Там же нічо нема!","Зустрічні! Ухиляйся, {addr}, бо протараню!","Ви туди, ми сюди. Ну й біжіть собі.","Шо там позаду, {addr}? Вовки? Троль?","~1 Ледь лобами не стукнулись, бля. Дивись, куди преш.","~2 Мимо, {addr}! Ха! Лошара.","~3 Бувай, {addr}! Не здохни там, чуєш."],"мб_наввипередки":["Наввипередки, {addr}? Ви ж програєте, як лохи!","Шо, {addr}, женемось? Ну то тримай пір'я!","Хто останній — той драугр смердючий!","Не дихай мені в хвіст, {addr}. Бо пердну.","~1 Ноги у вас, як у черепахи, курва.","~2 Не відставай, {addr}, дохляку!","~3 Женем, {addr}! Отак, бля!"],"мб_зброя":["Шо, {addr}, різати когось біжите? Візьміть і мене.","Залізо сховайте, бо самі себе поріжете, лошари.","О, зі зброєю! Кого гасимо? Я з вами!","~1 Тримай свою залізяку подалі від мого пір'я, бо дзьобну.","~2 Зброя — то добре. Аби по ділу, а не по дурості.","~3 З такою зброєю ви нас і прикриєте, {addr}. По-любому."],"мб_ніч":["Шо, {addr}, теж по ночах шастаєте?","Вночі бігають тіко злодії й дурні. Ви хто з них?","Темно, а ви носитесь. Лобом у дерево захотілось?","~1 Нічні бігуни, бляха-муха.","~2 Тихо, {addr}. Ше збудите когось зубатого.","~3 Добраніч, {addr}. Без вовків, ага."],"мб_приятель":["{addr}, ти мені досі за той мед винен, не забув?","Знов ти миготиш, {addr}. Аж в очах рябить, бля.","{addr}! Ввечері — біля вогню, чув? Медовуху неси.","Біжи, {addr}, біжи. Потім усе розкажеш, ага?","~1 Знову твоя пика мимо. Шо ти тут забув?","~2 Не загубись, {addr}, бо шукати не буду. Ну, мо' й буду.","~3 Бережи пір'я, брате! Свій же!"],"мб_чужий":["Шо це за пташка пробігла, га?","{raven}? Вперше бачу. І, бля, хоч би востаннє.","Чужий ворон. Дивись мені, не клюйся, бо дам.","А ви хто такі, шоб тут бігати?","~1 Ше один пернатий нахаба. Тьху.","~2 Чужак. Ну, біжи-біжи.","~3 Ну, незнайомцю, бувай. Ше побачимось, ага."],"мб_відповідь":["^rush Справи, {addr}! Не до тебе зара!","^rush Відвали, {addr}, нам ніколи!","^lead Ну й біжіть, торохтії. Нам не горить.","^lead Бігайте-бігайте. А ми постоїмо, як розумні.","^toward Не твоє собаче діло, куди ми, {addr}!","^toward Біжи, біжи. Тіко не спіткнись, ги.","^race Зара обженемо, {addr}! Ковтай пил!","^race Фора вам, слабаки! Бо шкода вас.","^weapon Бо треба, {addr}! Не лізь, куди не просять.","^weapon Хочеш — і тобі перепаде, бля.","^night А вам шо не спиться, га?","^night Нічні справи, {addr}. Не питай, бо не скажу.","^pals Біжи вже, балакуне!","^pals Потім, брате! Не до того зара!","^stranger Сам ти пташка, {addr}! Курча ти.","^stranger Ше побачимось, чужаче. І тоді поговоримо.","^rush Пожежа, бля! Тікай і ти!","^rush Не твоя справа, {addr}! Дзьоба не сунь.","^lead Ну й біжіть. Ми не заздрим. Ну, трохи.","^lead Біжіть, біжіть. Аж курява за вами.","^toward Звідки ми — там уже всіх відпиздили.","^toward Не йди туди, {addr}. А, хоча йди, похуй.","^race Ми вже виграли. Ти просто не допер.","^race Дихай глибше, {addr}, бо відстанеш, дохляк.","^weapon Не тобі, не сци. Поки шо.","^weapon Гостре, курва. Не підходь.","^night Вночі всі жеруть. Ми теж, ясно?","^night Ніч — для злих. Тобто для нас, ги.","^pals Ага-ага. Потім, кажу!","^pals Біжи, брате! Ввечері поговорим.","^stranger Познайомимось. Якшо доживеш.","^stranger Сам ти чужий, {addr}. Чмо пернате.","^nick Заздриш, {addr}? І правильно, заздри.","^nick Ім'я заслужене, бля. Кров'ю, а не пиздежем.","^nick Так, це я. Можеш уже тремтіти.","^kin Брате! Гасимо всіх!","^kin Брате, ти теж злий? Ото добре.","^kin Брате, не відставай, бо засранцем назву!","^alone Не твоє діло, де він. Ясно?","^alone Другий пішов жерти. Без мене, гад.","^alone Сам. І мені вистачає, вкурив?","^hurt Не каркай, бо накаркаєш, курва!","^hurt Живі ше, бляха. Біжимо.","^hurt Подряпини. Не рюмсай за нас.","^wet Сам ти мокрий, водяник сраний.","^wet Мокрий, але злий. Не підходь, бо дзьобну.","^wet Мокро, як у жабячій сраці. Не нагадуй."],"мб_знаменитий":["О, {raven}! Той самий? Ну-ну, глянемо, шо ти за птиця.","Дорогу! Знаменитість, курва, біжити!","{raven}? Гучне ім'я для такої дрібної пташки, ги.","Не зазнавайся, {addr}. Я теж колись прославлюсь, от побачиш.","~1 Ім'я велике, а дзьоб — тьху, малий.","~2 Чув про тебе, {addr}. Ну, поважаю. Трохи. Дзьоба не задирай.","~3 Знаменитий {raven}! Пишаюсь, бляха, шо знайомий."],"мб_брат":["Брате-Муніне, кого гасимо?","О, ше один злий. Нас двоє — всім пизда.","Брате, не відставай, бо без тебе нудно матюкатись.","Два Муніни на стежці — комусь буде дуже хуйово.","~1 Ше один Мунін. Мені й себе, бля, досить.","~2 Брате, за мною! Ой, ти ж в інший бік. Ну й іди.","~3 Брате! Тримай пір'я гострим, а дзьоб — злим."],"мб_сам":["{addr}, а де твій кент? Здох, чи шо?","Сам на плечі? Шо, другий тебе кинув?","Пів пари пробігло. А друга половина де, га?","Один на плечі. Хоч не так гучно.","~1 Один ворон — то не ворон, а курча, ясно?","~2 Сумуєш за другим, {addr}? Та не кисни.","~3 Не сумуй, {addr}. Вернеться, нікуди не дінеться."],"мб_поранений":["{addr}, твоя людина — як решето! Шо сталось?","{friend} ледь жив{>ий|а}, бля. Хто вас так відпиздив?","Біжіть лікуйтесь, бо інші ворони вже слину пускають.","Кров капає, {addr}. Шо, вам наваляли?","~1 Ше трохи — і буде шо клювати. Ням.","~2 Тримайтесь, {addr}. Нам ваш труп нахуй не впав.","~3 Бережи {>його|її}, {addr}! Я не жартую, чуєш?"],"мб_мокрі":["Мокрі, як щури з бочки!","З тебе тече, {addr}. Обтрусись, бля, тіко не на мене.","Дощ, а вони бігають. Ну дурні ж.","Куди претесь у таку зливу, га?","~1 Мокрий ворон — злий ворон. А ти ше й тупий.","~2 Сушіться, {addr}, бо пір'я згниє, нахуй.","~3 Не змокни там до кісток, {addr}."],"жт_набіг":["о, гості! Нарешті є кого дзьобнути, йо!","земля трясеться, курва мать! Ріж їх, поки тепленькі.","до хати лізуть, дивись! Ану покажи їм, де раки зимують.","набіг, бля! Я аж слину пускаю.","вони йдуть сюди. І добре, бо я вже засидівся нахуй.","чуєш тупіт? То обід сам до нас пре.","напад, сука! По головах бий, решта сама відпаде.","~1 набіг, а ти стоїш, як пеньок. Ворушись, бо зжеруть.","~1 по твою хату прийшли. Халупа гівно, але захищай.","~2 набіг. Ну то шо, підемо кілька пик порозбиваємо?","~2 ага, гості. Я їм очі, ти їм решту. По-чесному.","~3 набіг, трясця! Нашу хату ніхто не чіпатиме, поки я живий, чуєш?","~3 до нас лізуть? Ну я їм ща так дзьобну, шо мамку згадають."],"жт_набіг_кінець":["Ріж!","Без жалю, нахуй.","Кишки на стіни!","Шоб жоден не втік!","Гаси всіх, розберемось потім!","~1 І не здохни мені тут, дурне.","~3 Ми їх порвем, братан, чуєш?"],"жт_город":["колупаєшся в землі, як кріт. Герой, бля.","садиш? А я думав, ти тіко трупи закопувати вмієш.","ну-ну, фермер. А де граблі? А бриль де, га?","морква — не трофей. Але жерти можна, то хай.","сій, сій. А я потім насіння подзьобаю, хе.","оце вікінг: замість сокири — сапка. Тьфу.","грядки, бляха-муха. Ше козу собі заведи.","~1 з тебе фермер, як з мене соловейко. Тьох-тьох, бля.","~1 закопуєш зерно, ніби докази ховаєш. Шо ти там закопуєш, га?","~2 город. Ну, хоч з голоду не здохнем.","~2 сади, сади. Я повартую від кабанів. Мо'.","~3 посади мені ягідок, га? Я ж не золота прошу, братан.","~3 дідько, а в тебе руки з того місця ростуть. Іноді."],"жт_город_кінець":["Тіко ворон не жени, ясно?","Нудно, курва.","Жерти коли буде?","~1 Копай глибше. Мо', сам{|а} туди впадеш.","~3 Ну, хай росте. Хай."],"жт_торг":["{trader} — ше той жук. Але товар є, сука.","ціни такі, ніби тобі кишки самого Одіна продають. Охуїти.","оце тебе обідрали, курва. Як липку.","монети — то блискітки. Купи шось, чим можна вбивати.","з {trader_ins} торгуватись — шо з каменем сратись.","у {trader_gen} навіть повітря за бабло.","дай монетку. Ну дай. Ні? Жлоб.","~1 купи{в|ла} гівно за золото. Молодець, бля, геній.","~1 тебе ше до сраки не роздягли? Чекай, ше не вечір.","~2 торгуєшся нормально. Як для придурка.","~2 бери шось гостре. Решта — для лохів.","~3 а мені гостинця? Блискучку яку-небудь, братан, ну.","~3 оце ти торгуєшся, холєра! Майже як я на смітнику."],"жт_торг_кінець":["Жулики, бля.","Грабіж серед білого дня!","Тьху.","Розвели, як лоха.","~1 І не скигли, як бабло скінчиться.","~3 Ну, хай буде."],"жт_їзда":["о, покатались {mount_on}! Курва, оце дає!","{mount_on} ти ше дурніш{ий|а} на вигляд. Зате швидш{ий|а}, хе.","{mount} смердить, як хлів. Але везе справно, падла.","ви з {mount_ins} — два розумники. Хто кого везе — хуй розбереш.","верхи, бля! Ше списа тіко бракує.","покатались — і досить. Я в тебе на плечі вже всю сраку відсидів.","{mount} хоч слухається. Не те шо ти.","~1 {mount_on} ти сидиш, як гівно на палиці. Ну реально.","~1 я б на місці {mount_gen} тебе в болото скинув. І ше б зверху насрав.","~2 оце гнали, трясця! Ше раз?","~2 {mount} — норм. А ти — ну таке.","~3 оце покатались! Аж пірʼя дибки, братан.","~3 ше раз так поженем — я навіть матюкатись забуду. Майже, бля."],"жт_їзда_кінець":["Йо-хо!","Жени, жени!","Курва, оце швидко.","~1 Наступного разу — пішки, лінива ти срако.","~3 Мені сподобалось. Тіко нікому."],"жт_блок":["бах! Відби{в|ла}, курва! А тепер ріж, ріж!","ворог аж присів від того блоку. Дави його, ну!","оце ти йому щитом по зубах. Люблю таке.","щит у пику — і ворог дурний, як пень. Добивай, ну!","вчасно, сука! Як ляпас по рилу.","парирування, бля. Хто тебе навчив? Ну не я ж.","хрясь — і ворог полетів. Краса.","~1 і сліпа курка часом зерно найде. Ото ти і є та курка.","~1 випадково. Ну, сто пудів випадково. Але гарно.","~2 оце ти його відшив, холєра! Ше!","~2 руки в тебе нарешті не з дупи.","~3 йой, як ти його! Я аж каркнув, бля.","~3 ше раз так — і я тебе поцілую. Дзьобом. В тімʼя."],"жт_блок_кінець":["Добивай!","Ріж його, ну!","Ше!","В табло йому!","~1 Не розслабляйся, бовдуре.","~3 Оце по-нашому, по-пацанськи."],"жт_ухил":["фух, мимо! Він аж повітря дзьобнув, лошара.","перекоти{вся|лася}, як мішок з гівном. Але жив{ий|а}.","мимо, сука! А тепер в писок йому.","крутишся, як вуж на сковорідці. Вжик-вжик.","він махнув — а тебе вже нема. Оце фокус, бля.","ухили{вся|лася}! А я вже думав — фарш.","ногами ти шариш краще, ніж головою.","~1 тікати ти вмієш. То в тебе в крові, ссикло.","~1 впа{в|ла} навмисно? Чи знов спіткну{вся|лася}, шо?","~2 спритно, дідько. Ше так разів зо три — і він твій.","~2 ото викрутас! Я аж оцінив. Ну.","~3 не лякай мене так, засранцю. Але гарно, курва.","~3 крутишся, як я над падлом. Пишаюсь, братан."],"жт_ухил_кінець":["Тепер бий!","Мимо, лох.","Ха!","Ха, лошара!","~1 Наступного разу не пощастить, знай.","~3 Тримайся там."],"жт_лук":["фіть — і в око! Оце, бля, я розумію.","стріли в пиках — найкраща прикраса, шоб ти знав.","стріляй, стріляй. А я потім очі повиколупую. Ділимось.","з лука, бля. Ссикливо, але працює.","ше одна стріла — ше одна дірка. Кайф.","мазила! А, ні, влучи{в|ла}. Курва, влучи{в|ла}!","стріли летять, вороги дохнуть. Нормальний день.","~1 стріляєш, як бухий троль. Але іноді влучаєш, хуй знає як.","~1 тіко в мене не влуч, бо дзьобну в потилицю.","~2 нормально стріляєш, дідько.","~2 оце ти його пришпилив! Як метелика, ге.","~3 оце око! Я аж заздрю, бляха.","~3 стріляй дальше, а я підкажу, кого наступного."],"жт_лук_кінець":["В писок!","Ше!","Пришпиль його.","~1 Не в мене цілься, придурку!","~3 Влучно, курва."],"жт_чари":["ба-бах! Оце фокус, ну охуїти!","смаженим тягне. Ммм. Обожнюю.","махаєш палицею, а вони горять. Чари, бля.","чаклунство — для тих, хто від крові ссикує. Але виглядає гарно, нічо не скажу.","блискавки, вогонь… Ше трохи — і будеш крутий, як ворон.","вони спалахнули, як сухе сіно. Ха! Ха-ха!","з тебе чаклун, як з мене співачка. Але працює, сука.","~1 підсмажиш мені пірʼя — око виклюю. Обидва.","~1 махаєш палкою, як дід на мух. Киш, киш, хе.","~2 оце жар! Я аж зігрівся, йо.","~2 гарно палиш, трясця його мать.","~3 оце ти їх, курва! Чаклуй ше, братан.","~3 з такою силою нас ніхто не зачепить. Ніхто, чуєш?"],"жт_чари_кінець":["Пали!","Смаженина!","Ше!","~1 І себе не підпали, дурне.","~3 Красиво горить, бля."],"жт_піч":["піч бурчить, як моє пузо. Жерти!","жарко, курва. Як у Сурта в сраці.","руда, вугілля, піт. Романтика ковальська, бля.","плав, плав. Хоч з заліза шось путнє вийде.","дим в очі, бляха. Зате баблом пахне.","злитки — то добре. Блискучі. Дай один. Ну дай!","піч жере руду, як я падло. Хрум-хрум.","~1 стоїш біля печі, як дурень на весіллі. Шо стоїш?","~1 сподіваюсь, ти туди руду насипа{в|ла}, а не гівно.","~2 оце жар! Можна й крила погріти. Ммм.","~2 плав більше. З цього мечі кують, шариш?","~3 викуй мені кігті залізні, братан. Буду страшний, як пиздець.","~3 сажа тобі личить, їй-бо. Як бойова фарба."],"жт_піч_кінець":["Жарко, бля.","Підкидай!","Пече, сука.","~1 Не впади туди. Хоча… та падай.","~3 Гарно горить."],"жт_бочка":["о, бухло! Нарешті шось путнє.","бочка, мед і чекати. Курва, ненавиджу чекати!","оце я розумію — діло. Не те шо твої грядки.","медовуха — то кров вікінгів. Лий більше, не жмоться.","закривай бочку щільніше, бо я туди дзьоба встромлю. І не вийму.","з цього буде або зілля, або гульки. Я за гульки, ясне діло.","дріжджами смердить. Святом пахне, йо!","~1 хоч би медовуха не вийшла така кисла, як твоя пика.","~1 знов зілля? Ссикло пʼє зілля, мужик — бухло.","~2 нормальна бочка. Дай потім ковтнути, га?","~2 ото діло! Ше одну бочку став.","~3 наллєш мені? Я ж тобі як рідний, братуха.","~3 накатимо разом, курва. Ти, я і бочка."],"жт_бочка_кінець":["Бухло!","Швидше б уже.","Мені першому, ясно?","Не жлобись, ну!","~1 І не жлобись потім.","~3 За нас, братан!"],"жт_лагодження":["стук-стук, бля. Знов лагодиш те, шо сам{|а} розʼїба{в|ла}.","залата{в|ла} свої ганчірки. Модно. А шо?","ціле? Ну, ненадовго. Я в тебе вірю, хе.","молотком по залізу — найкраща музика. Після того, як вороги верещать.","лагодиш, як бабця шкарпетки. Але тримається, диви.","нове, блискуче. Буде ворогам шо дряпати.","оце діло. Тепер можна знов лізти, куди не треба.","~1 ти краще голову полагодь. Вона в тебе найбільш тріснута.","~1 ти ламаєш манатки швидше, ніж я тобі нерви. А я, бля, стараюсь.","~2 ну от, тепер ти хоч не схож{ий|а} на бомжа.","~2 ну все, тепер можна піти когось розлупити.","~3 бережеш залізо — і шкуру свою. Розумно, дідько.","~3 гарно полагоди{в|ла}. Я б так не зміг. Без рук, бля."],"жт_лагодження_кінець":["Ну все, в бій.","Тьху, нудьга.","Пішли шось ламати.","~1 Знов же розʼїбеш.","~3 Годиться."],"жт_зілля":["о, бухаєш! А мені? А МЕНІ?","хильну{в|ла} — і вже герой. Дешева сміливість, хе.","пʼєш, курва, а закусь де?","зілля — для лохів. Але пий, пий.","буль-буль. Тепер хоч здохнеш не зразу.","оце по-нашому: залив очі — і в бій.","медовуха — то моя віра. Пий за мене.","~1 знов пʼєш? Скоро сам{|а} бочкою станеш.","~1 пий-пий. Мо', мізків додасться.","~2 ковтни і за мене, ну.","~2 нормальне зілля. Смердить, як сеча, але діє.","~3 будьмо, курва! За нас.","~3 дай краплю, га? Я ж тобі як брат. Ну краплю!"],"жт_зілля_кінець":["Будьмо!","Наливай!","Хлюп!","~1 Не захлинись, дурне.","~3 За нас, бля."],"жт_стілець":["сі{в|ла}, як ярл на горщику. Тужишся?","сидиш? А вороги самі себе не вбʼють, якшо шо.","посиділи — і досить, курва. Сраку відсидиш.","оце трон. Для сраки середнього розміру.","сидимо, бля. Сидимо. Ше сидимо. Нудьга.","розсі{вся|лася}, як дід на призьбі. Ше насіння лузай.","ну, сиди. А я покемарю.","~1 сидиш, як пень. З пня хоч дрова є, а з тебе шо?","~1 відпочиваєш? Від чого, га? Ти ж ніхуя не роби{в|ла}.","~2 посидимо. Але недовго, бо я засну.","~2 ну хоч сидиш красиво, холєра.","~3 сиди-сиди. Мені з тобою і тут нормально. Ну. Мовчи.","~3 оце життя, курва. Стілець, тиша, ти. Шо ше треба."],"жт_стілець_кінець":["Нудно.","Вставай уже, ну.","Хр-р.","Ну. Ну! НУ, вставай!","~1 Сраку не відсиди.","~3 Добре тут."],"жт_затишок":["тепло, бляха. Аж розімлів.","хата як хата. Але суха, і то вже шось.","вогонь горить, ніхто не лізе. Шось підозріло, бля.","оце кубло. Мені подобається, йо.","дим, тепло, жрачка поряд. Рай для ворона.","сидимо в хаті, як миші. Та й похуй.","тут можна й поспати. Збудиш, як хтось прийде здихати.","~1 хата тобою смердить. Але тепло, то хай.","~1 {збудував|збудувала} через сраку, але гріє нічо так.","~2 нормальна хата, дідько. Не протікає.","~2 оце я розумію — вдома. Ге.","~3 наше гніздо, курва. Нікому не віддам, чуєш?","~3 з тобою навіть у хаті не нудно. Майже. Не дивись так."],"жт_затишок_кінець":["Хр-р.","Тепло, бля.","Підкинь дров, ну.","~1 Не звикай до доброго.","~3 Добре, курва."],"жт_сонце":["сонце, бля. Сліпить, як дурне, в очі пре.","ясно, тепло. Саме те, шоб когось завалити.","небо чисте. Нудне, як твої
