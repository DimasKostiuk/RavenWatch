const WOOD = '<linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6a3c"/><stop offset="0.45" stop-color="#6e4624"/><stop offset="1" stop-color="#3e2512"/></linearGradient>';
// thin wood: a ring of 3.5 units, its grain a few faint arcs, a thin gold line just inside
function medallion(fillA, fillB) {
  const fill = '<radialGradient id="f" cx="0.45" cy="0.38" r="0.72"><stop offset="0" stop-color="' + fillA + '"/><stop offset="1" stop-color="' + fillB + '"/></radialGradient>'
    + '<radialGradient id="sh" cx="0.5" cy="0.42" r="0.6"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>';
  const grain = '<g fill="none" stroke="#c89a62" stroke-opacity="0.35" stroke-width="0.35">'
    + '<path d="M50 3.2a46.8 46.8 0 0 1 33 13.7"/><path d="M96.6 52a46.6 46.6 0 0 1-14 31.5"/><path d="M40 96a46.6 46.6 0 0 1-30-17"/><path d="M4.2 44a46.4 46.4 0 0 1 12-26"/>'
    + '<path d="M62 4.6a45.6 45.6 0 0 1 20 10"/><path d="M95 40a45.4 45.4 0 0 1 0.6 14"/><path d="M24 90.5a45.5 45.5 0 0 1-12-12"/></g>';
  return '<defs>' + WOOD + fill + '</defs>'
    + '<circle cx="50" cy="50" r="48.5" fill="#20140a"/>'
    + '<circle cx="50" cy="50" r="47.6" fill="url(#w)"/>' + grain
    + '<circle cx="50" cy="50" r="44.1" fill="#1a110a"/>'
    + '<circle cx="50" cy="50" r="43.4" fill="url(#f)"/><circle cx="50" cy="50" r="43.4" fill="url(#sh)"/>'
    + '<circle cx="50" cy="50" r="43.4" fill="none" stroke="#c9a35e" stroke-opacity="0.75" stroke-width="0.7"/>';
}
const FILLS = { dark: ['#302a22', '#14110c'], green: ['#3f6230', '#1b2b14'], grey: ['#3d3f43', '#1c1d20'] };
const jobs = [];
for (const [name, d] of Object.entries(SIGNS))
  jobs.push([name, 128, '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>']);
for (const [c, f] of Object.entries(FILLS))
  jobs.push(['n-frame-' + c, 256, '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100">' + medallion(f[0], f[1]) + '</svg>']);

jobs.push(['n-pin', 128, '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100">' + medallion('#302a22', '#14110c')

// a guard (its job, or a fighter): a steel-blue medallion, a shield with a sword down it — told from a person at a glance
jobs.push(['n-pin-guard', 128, '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100">' + medallion('#2c3c52', '#0f1620')

jobs.push(['n-rescue', 128, '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100">' + medallion('#1f4a48', '#0c2221')
  + '<g transform="translate(22 22) scale(2.35)" fill="none" stroke="#7fe3d6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 1 0 0-6.6M5 20.5c0-3.9 3.1-7 7-7s7 3.1 7 7M18 11.5l1.5-6"/></g></svg>']);
const out = [];
let left = jobs.length;
for (const [name, n, svg] of jobs) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = n;
    c.getContext('2d').drawImage(img, 0, 0, n, n);
    out.push(name + ' ' + c.toDataURL('image/png'));
    if (--left === 0) document.getElementById('out').textContent = out.join('\n');
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(svg);
}
