<!doctype html>
<html>
<head><meta charset="utf-8"><title>menu icons</title></head>
<body>
<pre id="out"></pre>
<script>
// The orders circle's pictures, after the user's reference «Меню наказів — готове, з рунним кільцем» (2026-10-20):
//  o-*      the icons: white strokes on nothing, 128 px (the game tints them gold, or grey when off)
//  f-ring-* a button's frame with the rune ring (the orders, «Усіх назад»), 256 px, in full colour
//  f-plain-* the plain gold frame (the food, «Трюки», the tricks), 256 px
// Run: node tools/menu_icons.js (headless Chrome dumps the PNGs as data URLs, the script writes assets/menu/).
const ICONS = {
  'o-perch': 'M5 6h14M8 6v3M16 6v3M12 6v12M7 18h10',
  'o-scout': 'M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12zM9.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0',
  'o-here': 'M12 3v4M12 17v4M3 12h4M17 12h4M7 12a5 5 0 1 0 10 0a5 5 0 1 0-10 0M11 12a1 1 0 1 0 2 0a1 1 0 1 0-2 0',
  'o-near': 'M9 5a3 3 0 1 0 0 6a3 3 0 1 0 0-6M3.5 20c0-3.5 2.4-6 5.5-6s5.5 2.5 5.5 6M15.5 8.5l4-2.5v5z',
  'o-circle': 'M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5M8 21l4-6.5 4 6.5M4.5 9c2-3 5-4.5 7.5-4.5s5.5 1.5 7.5 4.5M19.5 9l.5-3.5M19.5 9l-3.5-.5',
  'o-bag': 'M9 4h6l-1.5 3c3.5 1 5.5 4.5 5.5 8a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5c0-3.5 2-7 5.5-8zM10 15.5c1.2 1 2.8 1 4 0',
  'o-meat': 'M14.5 4a5.5 5.5 0 0 1 3.9 9.4c-1.6 1.6-3.8 1.6-5.4 1.3l-2.6 2.6.3 1.7a1.7 1.7 0 1 1-2.6 1.4 1.7 1.7 0 1 1-1.4-2.6l1.7.3 2.6-2.6c-.3-1.6-.3-3.8 1.3-5.4A5.5 5.5 0 0 1 14.5 4z',
  'o-berries': 'M6.2 15a2.8 2.8 0 1 0 5.6 0a2.8 2.8 0 1 0-5.6 0M12.2 15a2.8 2.8 0 1 0 5.6 0a2.8 2.8 0 1 0-5.6 0M9.2 10a2.8 2.8 0 1 0 5.6 0a2.8 2.8 0 1 0-5.6 0M12 7.2V4.5l3-1.5',
  'o-recall': 'M12 2v8M8.5 6.5L12 10l3.5-3.5M5.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5',
  'o-chase': 'M13 6.5c1.5-1.3 3.2-1.3 4.2.6 1-1.9 2.7-1.9 4.3-.6 M2.5 13.5c1.5-1.3 3.2-1.3 4.2.6 1-1.9 2.7-1.9 4.3-.6 M6 19c4.5 2.5 10 1 12.5-8.5 M15.8 11.4l2.7-.9.9 2.8',
  'o-down': 'M8 10l4 4 4-4',
  'o-up': 'M8 14l4-4 4 4'
};
const FILLS = { red: ['#5e2a1f', '#3a1610'], blue: ['#24426a', '#14263d'], green: ['#3a4f2a', '#1f2c17'], grey: ['#3a3d42', '#202226'], dark: ['#2e2a24', '#17140f'] };
const DEFS = '<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb27a"/><stop offset="0.5" stop-color="#8e7442"/><stop offset="1" stop-color="#55411f"/></linearGradient>'
  + '<radialGradient id="sh" cx="0.5" cy="0.4" r="0.6"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>';
const RUNES = '<g fill="none" stroke="#d2ab62" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M-1 0v4.6M-1 1l2.2-1M-1 2.4l2.2-1" transform="rotate(0 50 50) translate(50 4.4) scale(1.3)"/>'
  + '<path d="M-1 4.6V0l1.8 1.1-1.8 1.1 2 2.4" transform="rotate(60 50 50) translate(50 4.4) scale(1.3)"/>'
  + '<path d="M0 4.6V0M-1.6 0.2l1.6 1.8 1.6-1.8" transform="rotate(120 50 50) translate(50 4.4) scale(1.3)"/>'
  + '<path d="M-1.6 0l3.2 4.6M1.6 0l-3.2 4.6" transform="rotate(180 50 50) translate(50 4.4) scale(1.3)"/>'
  + '<path d="M0 4.6V0M-1.6 1.6L0 0l1.6 1.6" transform="rotate(240 50 50) translate(50 4.4) scale(1.3)"/>'
  + '<path d="M-1.4 0v4.6M1.4 0v4.6M-1.4 1.5l2.8 1.6" transform="rotate(300 50 50) translate(50 4.4) scale(1.3)"/></g>';
function frame(kind, f) {
  const fill = '<radialGradient id="f" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="' + f[0] + '"/><stop offset="1" stop-color="' + f[1] + '"/></radialGradient>';
  const body = kind === 'ring'
    ? '<circle cx="50" cy="50" r="48" fill="url(#g)"/><circle cx="50" cy="50" r="46.2" fill="#1d1710"/>' + RUNES
      + '<circle cx="50" cy="50" r="39" fill="url(#f)" stroke="#8e7442" stroke-width="0.8"/><circle cx="50" cy="50" r="39" fill="url(#sh)" opacity="0.6"/>'
    : '<circle cx="50" cy="50" r="48" fill="url(#g)"/><circle cx="50" cy="50" r="45.5" fill="#1d1710"/><circle cx="50" cy="50" r="42" fill="url(#f)"/>';
  return '<defs>' + DEFS + fill + '</defs>' + body;
}
const jobs = [];
for (const [name, d] of Object.entries(ICONS))
  jobs.push([name, 128, '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>']);
for (const kind of ['ring', 'plain'])
  for (const [c, f] of Object.entries(FILLS))
    jobs.push(['f-' + kind + '-' + c, 256, '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100">' + frame(kind, f) + '</svg>']);
const out = [];
let left = jobs.length;
for (const [name, n, svg] of jobs) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = n;
    c.getContext('2d').drawImage(img, 0, 0, n, n);
    out.push(name + ' ' + c.toDataURL('image/png'));
    if (--left === 0) document.getElementById('out').textContent = out.join('\n');
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(svg);
}
</script>
</body>
</html>
